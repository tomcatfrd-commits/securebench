control:
  id: CIS-1.1.1.1
  benchmark_id: cis-ubuntu-24.04
  title: Ensure cramfs kernel module is not available
  description: >
    The cramfs filesystem type is a compressed read-only Linux filesystem.
    If it is not required, support for it should be disabled to reduce
    unnecessary attack surface.
  platform: ubuntu-24.04

  severity: low

  audit: cis.ubuntu.24.04.1.1.1.1.audit
  remediation: cis.ubuntu.24.04.1.1.1.1.remediate
  rollback: cis.ubuntu.24.04.1.1.1.1.rollback
  verification: cis.ubuntu.24.04.1.1.1.1.verify

  rollback_capability: guaranteed

  metadata:
    level:
      - L1
      - Server
      - Workstation

    automated: true

    rationale: >
      Removing support for unneeded filesystem types reduces the local
      attack surface of the system.

    references:
      - NIST SP 800-53 CM-7a
      - CCI-000381

  requirements:
    module: cramfs
    expected:
      module_loaded: false
      module_loadable: false

  safety:
    default_classification: safe_with_precheck
    prechecks:
      - verify_filesystem_not_in_use
      - verify_module_not_required
      - verify_modprobe_configuration_can_be_changed

  dependencies: []
  conflicts: []