      - TA0001
      mitre_mitigations:
      - M1022
    parent: CIS _6_Configure Integrity Checking Main | 2.2.1-Ensure AIDE is installed
    rationale: By monitoring the filesystem state compromised files can be detected to prevent or limit
      the exposure of accidental or malicious misconfigurations or modified binaries.
    impact: ''
    audit_guidance: "Run the following command to verify `aide` is installed:\r\n\r\n```\r\n# dpkg-query\
      \ -s aide &>/dev/null && echo \"aide is installed\"\r\n\r\naide is installed\r\n```\r\n\r\nRun the\
      \ following command to verify `aide-common` is installed:\r\n\r\n```\r\n# dpkg-query -s aide-common\
      \ &>/dev/null && echo \"aide-common is installed\"\r\n\r\naide-common is installed\r\n```"
    remediation_guidance: "Install AIDE using the appropriate package manager or manual installation:\r\
      \n```\r\n# apt install aide aide-common\r\n```\r\nConfigure AIDE as appropriate for your environment.\
      \ Consult the AIDE documentation for options.\r\n\r\nRun the following commands to initialize AIDE:\r\
      \n```\r\n# aideinit\r\n# mv /var/lib/aide/aide.db.new /var/lib/aide/aide.db\r\n```"
    additional_information: The prelinking feature can interfere with AIDE because it alters binaries
      to speed up their start up times. Run `prelink -ua` to restore the binaries to their prelinked state,
      thus avoiding false positives from AIDE.
    default_value: ''
    artifacts_count: 2
    requirements: {}
    safety:
      default: investigate
      implementation_status: guidance_only
      reason: Imported CIS guidance has not yet been promoted to a reviewed SecureBench implementation.
