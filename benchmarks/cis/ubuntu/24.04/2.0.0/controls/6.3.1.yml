control:
  id: CIS-6.3.1
  benchmark_id: cis-ubuntu-24.04
  title: Ensure AIDE is installed
  description: AIDE takes a snapshot of filesystem state including modification times, permissions, and
    file hashes which can then be used to compare against the current state of the filesystem to detect
    modifications to the system.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.6_3_1.audit
  remediation: cis.ubuntu.24.04.v2_0_0.6_3_1.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.6_3_1.rollback
  verification: cis.ubuntu.24.04.v2_0_0.6_3_1.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 6.3.1
      url: https://workbench.cisecurity.org/sections/4177296/recommendations/7047785
    assessment_status: automated
    profiles:
    - Level 1 - Server
    - Level 1 - Workstation
    mappings:
      nist:
      - AU-2
      cis_v8:
      - '3.14'
      cis_v7:
      - '14.9'
      mitre_techniques:
      - T1565
      - T1565.001
