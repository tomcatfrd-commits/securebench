control:
  id: CIS-1.1.1.1
  benchmark_id: cis-ubuntu-24.04
  title: Ensure cramfs kernel module is not available
  description: The `cramfs` filesystem type is a compressed read-only Linux filesystem embedded in small
    footprint systems. A `cramfs` image can be used without having to first decompress the image.
  platform: ubuntu-24.04
  severity: low
  audit: cis.ubuntu.24.04.v2_0_0.1_1_1_1.audit
  remediation: cis.ubuntu.24.04.v2_0_0.1_1_1_1.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.1_1_1_1.rollback
  verification: cis.ubuntu.24.04.v2_0_0.1_1_1_1.verify
  rollback_capability: guaranteed
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 1.1.1.1
      url: https://workbench.cisecurity.org/sections/4177239/recommendations/7047474
    assessment_status: automated
    profiles:
    - Level 1 - Server
    - Level 1 - Workstation
    mappings:
      nist:
      - CM-7
      cis_v8:
      - '4.8'
      cis_v7:
      - '9.2'
      mitre_techniques:
      - T1005
      - T1005.000
      mitre_tactics:
      - TA0005
      mitre_mitigations:
