    rationale: Removing support for unneeded filesystem types reduces the local attack surface of the
      system. If this filesystem type is not needed, disable it.
    impact: ''
    audit_guidance: "Verify the `hfsplus` kernel module is not available on the system or has been disabled.\r\
      \n\r\n1. Run the following script to determine if the `hfsplus` kernel module is available on the\
      \ system:\r\n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n   l_mod_name=\"hfsplus\" l_mod_type=\"\
      fs\"\r\n   while IFS= read -r l_mod_path; do\r\n      if [ -d \"$l_mod_path/${l_mod_name//-/\\/}\"\
      \ ] &&  \\\r\n      [ -n \"$(ls -A \"$l_mod_path/${l_mod_name//-/\\/}\")\" ]; then\r\n         printf\
      \ '%s\\n' \"$l_mod_name exists in $l_mod_path\"\r\n      fi\r\n   done < <(readlink -e /usr/lib/modules/**/kernel/$l_mod_type\
      \ \\\r\n   || readlink -e /lib/modules/**/kernel/$l_mod_type)\r\n}\r\n```\r\n\r\nIf nothing is returned,\
      \ the `hfsplus` kernel module is not available on the system and no further audit steps are required.\r\
      \n\r\n**Note:** Some systems may include the `hfsplus` filesystem as part of the kernel opposed\
      \ to being available as a kernel module. In this case, the above audit will not return anything.\
      \ This is also considered a passing state.\r\n\r\n**If anything is returned by the above script:**\r\
      \n\r\n2. Verify the `hfsplus` kernel module is not loaded and not loadable by performing the following:\r\
      \n\r\nRun the following command to verify the `hfsplus` kernel module is not loaded:\r\n\r\n```\r\
      \n# lsmod | grep 'hfsplus'\r\n```\r\n\r\nNothing should be returned.\r\n\r\nRun the following command\
      \ to verify the `hfsplus` kernel module is not loadable:\r\n\r\n```\r\n# modprobe --showconfig |\
      \ grep -P -- '\\b(install|blacklist)\\h+hfsplus\\b'\r\n```\r\n\r\nVerify the output includes:\r\n\
      \r\n```\r\nblacklist hfsplus\r\n -AND-\r\ninstall hfsplus /bin/false\r\n -OR-\r\ninstall hfsplus\
      \ /bin/true\r\n```\r\n\r\n_Example output:_\r\n\r\n```\r\nblacklist hfsplus\r\ninstall hfsplus /bin/false\r\
      \n```"
    remediation_guidance: "Unload and disable the `hfsplus` kernel module.\r\n\r\n1. Run the following\
      \ commands to unload the `hfsplus` kernel module:\r\n\r\n```\r\n# modprobe -r hfsplus 2>/dev/null\r\
      \n# rmmod hfsplus 2>/dev/null\r\n```\r\n\r\n2. Perform the following to disable the `hfsplus` kernel\
      \ module:\r\n\r\nCreate a file ending in `.conf` with `install hfsplus /bin/false` in the `/etc/modprobe.d/`\
      \ directory.\r\n\r\n_Example:_\r\n\r\n```\r\n# printf '%s\\n' \"\" \"install hfsplus /bin/false\"\
      \ >> /etc/modprobe.d/60-hfsplus.conf\r\n```\r\n\r\nCreate a file ending in `.conf` with `blacklist\
      \ hfsplus` in the `/etc/modprobe.d/` directory.\r\n\r\n_Example:_\r\n\r\n```\r\n# printf '%s\\n'\
      \ \"\" \"blacklist hfsplus\" >> /etc/modprobe.d/60-hfsplus.conf\r\n```"
