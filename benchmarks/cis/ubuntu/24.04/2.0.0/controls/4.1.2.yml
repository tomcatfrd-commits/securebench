    rationale: The ufw service must be enabled and running in order for ufw to protect the system
    impact: Changing firewall settings while connected over network can result in being locked out of
      the system.
    audit_guidance: "Run the following command to verify `ufw.service` is enabled:\r\n\r\n```\r\n# systemctl\
      \ is-enabled ufw.service\r\n\r\nenabled\r\n```\r\n\r\nRun the following command to verify `ufw.service`\
      \ is active:\r\n\r\n```\r\n# systemctl is-active ufw.service\r\n\r\nactive\r\n```\r\n\r\nRun the\
      \ following command to verify ufw is active\r\n\r\n```\r\n# ufw status\r\n\r\nStatus: active\r\n\
      ```"
    remediation_guidance: "Run the following command to unmask the `ufw.service`:\r\n\r\n```\r\n# systemctl\
      \ unmask ufw.service\r\n```\r\n\r\nRun the following command to enable and start the `ufw.service`:\r\
      \n\r\n```\r\n# systemctl --now enable ufw.service\r\n\r\nactive\r\n```\r\n\r\nRun the following\
      \ command to enable `ufw`:\r\n\r\n```\r\n# ufw enable\r\n```"
