control:
  id: CIS-4.1.2
  benchmark_id: cis-ubuntu-24.04
  title: Ensure ufw service is configured
  description: "The service, `ufw.service`, manages UFW. This service is responsible for applying and\
    \ maintaining firewall rules, controlling which network traffic is allowed in and out of the system.\r\
    \n\r\n**Note:** \r\n- When running ufw enable or starting `ufw.service`, ufw will flush its chains.\
    \ This is required so ufw can maintain a consistent state, but it may drop existing connections, eg\
    \ ssh. ufw does support adding rules before enabling the firewall.\r\n- Once ufw is 'enabled', ufw\
    \ will not flush the chains when adding or removing rules (but will when modifying a rule or changing\
    \ the default policy)\r\n- By default ufw will prompt when enabling the firewall while running under\
    \ ssh. This can be disabled by using `ufw --force enable`\r\n\r\n**Warning:** If a rule for openSSH\
    \ server does not exist, and openSSH is used to administer the host, the ability to administer and/or\
    \ connect to the host may be lost.\r\n\r\nExample command to create a rule to allow ssh:\r\n\r\n```\r\
    \n# ufw allow proto tcp from any to any port 22\r\n```\r\n\r\nThis rule will allow connection to the\
    \ ssh server from any location. It is highly recommended that this rule be modified to restrict ssh\
    \ access to only required hosts and to follow local site policy.\r\n- The rules will still be flushed,\
    \ but the ssh port will be open after enabling the firewall. Please note that once ufw is 'enabled',\
    \ ufw will not flush the chains when adding or removing rules (but will when modifying a rule or changing\
    \ the default policy)\r\n- By default, ufw will prompt when enabling the firewall while running under\
    \ ssh. This can be disabled by using `ufw --force enable`"
  platform: ubuntu-24.04
