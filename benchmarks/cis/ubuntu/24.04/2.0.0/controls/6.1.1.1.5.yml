control:
  id: CIS-6.1.1.1.5
  benchmark_id: cis-ubuntu-24.04
  title: Ensure journald log file rotation is configured
  description: Journald includes the capability of rotating log files regularly to avoid filling up the
    system with logs or making the logs unmanageably large. The file `/etc/systemd/journald.conf` is the
    configuration file used to specify how logs generated by Journald should be rotated.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.6_1_1_1_5.audit
  remediation: cis.ubuntu.24.04.v2_0_0.6_1_1_1_5.remediate
