    parent: CIS _6_System Logging Main | 2.2.1.1.5-Ensure journald log file rotation is configured
    rationale: By keeping the log files smaller and more manageable, a system administrator can easily
      archive these files to another system and spend less time looking through inordinately large log
      files.
    impact: ''
    audit_guidance: "Review `/etc/systemd/journald.conf` and files in the `/etc/systemd/journald.conf.d/`\
      \ directory ending in `.conf`. Verify logs are rotated according to site policy. \r\n\r\nRun the\
      \ following command and ensure logs are rotated according to site policy:\r\n```\r\n# systemd-analyze\
      \ cat-config systemd/journald.conf | tac | \\\r\ngrep -Psi -- '\\b(SystemMaxUse|SystemKeepFree|RuntimeMaxUse|RuntimeKeepFree|MaxFileSec)='\r\
      \n```\r\n\r\n```\r\nSystemMaxUse=\r\nSystemKeepFree=\r\nRuntimeMaxUse=\r\nRuntimeKeepFree=\r\nMaxFileSec=\r\
      \n```"
    remediation_guidance: "Edit `/etc/systemd/journald.conf` or a file ending in `.conf` the `/etc/systemd/journald.conf.d/`\
      \ directory. Set the following parameters in the `[Journal]` section to ensure logs are rotated\
      \ according to site policy. The settings should be carefully understood as there are specific edge\
      \ cases and prioritization of parameters.\r\n\r\n_Example Configuration_\r\n```\r\n[Journal]\r\n\
      SystemMaxUse=1G\r\nSystemKeepFree=500M\r\nRuntimeMaxUse=200M\r\nRuntimeKeepFree=50M\r\nMaxFileSec=1month\r\
      \n```\r\n\r\n**Note:** If these settings appear in a canonically later file, or later in the same\
      \ file, the setting will be overwritten"
    additional_information: See `man 5 journald.conf` for detailed information regarding the parameters
      in use.
    default_value: ''
