    parent: CIS _6_System Auditing Main | 2.2.3.29-Ensure the audit configuration is immutable
    rationale: In immutable mode, unauthorized users cannot execute changes to the audit system to potentially
      hide malicious activity and then put the audit rules back. Users would most likely notice a system
      reboot and that could alert administrators of an attempt to make unauthorized audit changes.
    impact: ''
    audit_guidance: "Run the following command and verify output matches:\r\n\r\n```\r\n# grep -Ph --\
      \ '^\\h*-e\\h+2\\b' /etc/audit/rules.d/*.rules | tail -1\r\n\r\n-e 2\r\n```"
    remediation_guidance: "Edit or create the file `/etc/audit/rules.d/99-finalize.rules` and add the\
      \ line `-e 2` at the end of the file:\r\n\r\n_Example:_ \r\n\r\n```\r\n# printf '\\n%s' \"-e 2\"\
      \ >> /etc/audit/rules.d/99-finalize.rules\r\n```\r\n\r\n**Load audit rules**\r\n\r\nMerge and load\
      \ the rules into active configuration:\r\n\r\n```\r\n# augenrules --load\r\n```\r\n\r\nCheck if\
      \ reboot is required.\r\n\r\n```\r\n# if [[ $(auditctl -s | grep \"enabled\") =~ \"2\" ]]; then\
      \ printf \"Reboot required to load rules\\n\"; fi\r\n```"
    additional_information: ''
    default_value: ''
    artifacts_count: 1
    requirements: {}
