control:
  id: CIS-6.2.3.29
  benchmark_id: cis-ubuntu-24.04
  title: Ensure the audit configuration is immutable
  description: "Set system audit so that audit rules cannot be modified with `auditctl` . Setting the\
    \ flag `-e 2` forces audit to be put in immutable mode. Audit changes can only be made on system reboot.\r\
    \n\r\n**Note:** This setting will require the system to be rebooted to update the active `auditd`\
    \ configuration settings."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.6_2_3_29.audit
  remediation: cis.ubuntu.24.04.v2_0_0.6_2_3_29.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.6_2_3_29.rollback
  verification: cis.ubuntu.24.04.v2_0_0.6_2_3_29.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 6.2.3.29
      url: https://workbench.cisecurity.org/sections/4203192/recommendations/7091576
    assessment_status: automated
