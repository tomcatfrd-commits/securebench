control:
  id: CIS-6.2.2.1
  benchmark_id: cis-ubuntu-24.04
  title: Ensure audit log storage size is configured
  description: Configure the maximum size of the audit log file. Once the log reaches the maximum size,
    it will be rotated and a new log file will be started.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.6_2_2_1.audit
  remediation: cis.ubuntu.24.04.v2_0_0.6_2_2_1.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.6_2_2_1.rollback
  verification: cis.ubuntu.24.04.v2_0_0.6_2_2_1.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 6.2.2.1
      url: https://workbench.cisecurity.org/sections/4177265/recommendations/7047620
    assessment_status: automated
    profiles:
    - Level 2 - Server
    - Level 2 - Workstation
    mappings:
      nist:
      - AU-8
      cis_v8:
      - '8.3'
      cis_v7:
      - '6.4'
      mitre_techniques:
      - T1562
      - T1562.006
      mitre_tactics:
      - TA0040
      mitre_mitigations:
      - M1053
    parent: CIS _6_System Auditing Main | 2.2.2.1-Ensure audit log storage size is configured
    rationale: It is important that an appropriate size is determined for log files so that they do not
      impact the system and audit data is not lost.
    impact: ''
    audit_guidance: "Run the following command and ensure output is in compliance with site policy:\r\n\
      \r\n```\r\n# grep -Po -- '^\\h*max_log_file\\h*=\\h*\\d+\\b' /etc/audit/auditd.conf\r\n\r\nmax_log_file\
      \ = ```"
    remediation_guidance: "Set the following parameter in `/etc/audit/auditd.conf`  in accordance with\
      \ site policy:\r\n\r\n```\r\nmax_log_file = ```"
    additional_information: "The `max_log_file` parameter is measured in megabytes.\r\n\r\nOther methods\
      \ of log rotation may be appropriate based on site policy.  One example is time-based rotation strategies\
      \ which don't have native support in auditd configurations.  Manual audit of custom configurations\
      \ should be evaluated for effectiveness and completeness."
    default_value: '`max_log_file = 8`'
    artifacts_count: 1
    requirements: {}
    safety:
      default: investigate
      implementation_status: guidance_only
      reason: Imported CIS guidance has not yet been promoted to a reviewed SecureBench implementation.
  dependencies: []
  conflicts: []
