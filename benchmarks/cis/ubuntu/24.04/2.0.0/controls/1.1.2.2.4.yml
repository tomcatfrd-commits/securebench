  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 1.1.2.2.4
      url: https://workbench.cisecurity.org/sections/4177254/recommendations/7047544
    assessment_status: automated
