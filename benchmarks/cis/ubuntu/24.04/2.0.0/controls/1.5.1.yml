control:
  id: CIS-1.5.1
  benchmark_id: cis-ubuntu-24.04
  title: Ensure fs.protected_hardlinks is configured
  description: "`fs.protected_hardlinks` Controls the creation of hard links to files.\r\n\r\nMore information\
    \ about the kernel parameter configuration files, their location, and load preference is available\
    \ in the section overview."
  platform: ubuntu-24.04
  severity: unspecified
