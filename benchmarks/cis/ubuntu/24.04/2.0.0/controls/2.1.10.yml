control:
  id: CIS-2.1.10
  benchmark_id: cis-ubuntu-24.04
  title: Ensure ldap server services are not in use
  description: The Lightweight Directory Access Protocol (LDAP) was introduced as a replacement for NIS/YP.
    It is a service that provides a method for looking up information from a central database.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.2_1_10.audit
  remediation: cis.ubuntu.24.04.v2_0_0.2_1_10.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.2_1_10.rollback
