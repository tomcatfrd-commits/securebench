control:
  id: CIS-5.3.3.3.2
  benchmark_id: cis-ubuntu-24.04
  title: Ensure password history is enforced for the root user
  description: If the `pwhistory` `enforce_for_root` option is enabled, the module will enforce password
    history for the root user as well
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_3_3_3_2.audit
  remediation: cis.ubuntu.24.04.v2_0_0.5_3_3_3_2.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.5_3_3_3_2.rollback
  verification: cis.ubuntu.24.04.v2_0_0.5_3_3_3_2.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 5.3.3.3.2
      url: https://workbench.cisecurity.org/sections/4177291/recommendations/7047770
    assessment_status: automated
    profiles:
    - Level 1 - Server
    - Level 1 - Workstation
    mappings:
      nist:
      - IA-5
      cis_v8:
      - '5.2'
      cis_v7:
      - '4.4'
      mitre_techniques:
      - T1110
      - T1110.001
      - T1110.002
      - T1110.003
      - T1178.001
      - T1178.002
      - T1178.003
