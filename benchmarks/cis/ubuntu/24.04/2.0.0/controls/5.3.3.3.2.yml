    parent: CIS _5_Pluggable Authentication Modules Main | 2.1.4.3.2-Ensure password history is enforced
      for the root user
    rationale: "Requiring users not to reuse their passwords make it less likely that an attacker will\
      \ be able to guess the password or use a compromised password\r\n\r\n**Note:** These change only\
      \ apply to accounts configured on the local system."
    impact: ''
    audit_guidance: "Run the following command to verify that the `enforce_for_root` argument is exists\
      \ on the `pwhistory` line in `/etc/pam.d/common-password`:\r\n\r\n```\r\n# grep -Psi -- '^\\h*password\\\
      h+[^#\\n\\r]+\\h+pam_pwhistory\\.so\\h+([^#\\n\\r]+\\h+)?enforce_for_root\\b' /etc/pam.d/common-password\r\
      \n```\r\n\r\nOutput should be similar to:\r\n\r\n```\r\npassword   requisite   pam_pwhistory.so\
      \ remember=24 enforce_for_root use_authtok\r\n```\r\n\r\n**- OR/IF -** `pwhistory.conf` exists:\r\
      \n\r\nRun the following command to verify that the `enforce_for_root` option is enabled in `/etc/security/pwhistory.conf`:\r\
      \n\r\n```\r\n# grep -Pi -- '^\\h*enforce_for_root\\b' /etc/security/pwhistory.conf\r\n\r\nenforce_for_root\r\
      \n```"
    remediation_guidance: "Run the following command:\r\n\r\n```\r\n# awk '/Password-Type:/{ f = 1;next\
      \ } /-Type:/{ f = 0 } f {if (/pam_pwhistory\\.so/) print FILENAME}' /usr/share/pam-configs/*\r\n\
      ```\r\n\r\nEdit any returned files and add the `enforce_for_root` argument to the `pam_pwhistory`\
      \ line in the `Password` section:\r\n\r\n_Example File:_\r\n\r\n```\r\nName: pwhistory password\
      \ history checking\r\nDefault: yes\r\nPriority: 1024\r\nPassword-Type: Primary\r\nPassword:\r\n\
      \   requisite   pam_pwhistory.so remember=24 enforce_for_root use_authtok # <- **ensure line includes\
      \ enforce_for_root**\r\n```\r\n\r\nRun the following command to update the files in the `/etc/pam.d/`\
      \ directory:\r\n\r\n```\r\n# pam-auth-update --enable ```\r\n\r\n_Example:_\r\n\r\n```\r\n# pam-auth-update\
      \ --enable pwhistory\r\n```\r\n\r\n**- OR/IF -** `pwhistory.conf` exists:\r\n\r\nEdit or add the\
      \ following line in `/etc/security/pwhistory.conf`:\r\n\r\n```\r\nenforce_for_root\r\n```"
    additional_information: ''
    default_value: disabled
    artifacts_count: 2
    requirements: {}
