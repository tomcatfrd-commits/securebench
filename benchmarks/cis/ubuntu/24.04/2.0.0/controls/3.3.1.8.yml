control:
  id: CIS-3.3.1.8
  benchmark_id: cis-ubuntu-24.04
  title: Ensure net.ipv4.conf.all.accept_redirects is configured
  description: "ICMP redirect messages are packets that convey routing information and tell your host\
    \ (acting as a router) to send packets via an alternate path. It is a way of allowing an outside routing\
    \ device to update your system routing tables.\r\n\r\n`net.ipv4.conf.all.accept_redirects` controls\
    \ accepting of all IPv4 ICMP redirected packets on all interfaces.\r\n\r\nMore information about the\
    \ kernel parameter configuration files, their location, and load preference is available in the \"\
    Configure Network Kernel Parameters\" section overview."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.3_3_1_8.audit
  remediation: cis.ubuntu.24.04.v2_0_0.3_3_1_8.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.3_3_1_8.rollback
  verification: cis.ubuntu.24.04.v2_0_0.3_3_1_8.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 3.3.1.8
      url: https://workbench.cisecurity.org/sections/4177253/recommendations/7047556
    assessment_status: automated
    profiles:
    - Level 1 - Server
    - Level 1 - Workstation
    mappings:
      nist:
      - CM-6
      cis_v8:
      - '4.8'
      cis_v7:
      - '9.2'
      mitre_techniques:
      - T1557
