    parent: CIS _3_Configure Network Kernel Parameters Main | 1.1.1.8-Ensure net.ipv4.conf.all.accept_redirects
      is configured
    rationale: "ICMP redirect messages are packets that convey routing information and tell your host\
      \ (acting as a router) to send packets via an alternate path. It is a way of allowing an outside\
      \ routing device to update your system routing tables. \r\n\r\nBy setting `net.ipv4.conf.all.accept_redirects`\
      \ to `0`, the system will not accept any IPv4 ICMP redirect messages, and therefore, won't allow\
      \ outsiders to update the system's routing tables."
    impact: ''
    audit_guidance: "Verify `net.ipv4.conf.all.accept_redirects` is set to `0`.\r\n\r\n1. Run the following\
      \ command to verify `net.ipv4.conf.all.accept_redirects` is set to `0` in the running configuration:\r\
      \n\r\n```\r\n# sysctl net.ipv4.conf.all.accept_redirects\r\n```\r\n\r\nVerify output is:\r\n\r\n\
      ```\r\nnet.ipv4.conf.all.accept_redirects = 0\r\n```\r\n\r\n2. Run the following script to verify\
      \ ` net.ipv4.conf.all.send_redirects = 0` is set in a file being used by systemd sysctl to configure\
      \ `net.ipv4.conf.all.send_redirects`:\r\n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n   l_parameter_name=\"\
      net.ipv4.conf.all.accept_redirects\" \r\n   l_grep=\"${l_parameter_name//./(\\\\.|\\\\/)}\" a_output=()\
      \ a_files=()\r\n   l_systemdsysctl=\"$(readlink -e /lib/systemd/systemd-sysctl \\\r\n   || readlink\
      \ -e /usr/lib/systemd/systemd-sysctl)\"\r\n   l_ufw_file=\"$([ -f /etc/default/ufw ] && \\\r\n \
      \  awk -F= '/^\\s*IPT_SYSCTL=/ {print $2}' /etc/default/ufw)\"\r\n   [ -f \"$(readlink -e \"$l_ufw_file\"\
      )\" ] && \\\r\n   a_files+=(\"$l_ufw_file\"); a_files+=(\"/etc/sysctl.conf\")\r\n   while IFS= read\
      \ -r l_fname; do\r\n      l_file=\"$(readlink -e \"${l_fname//# /}\")\"\r\n      [ -n \"$l_file\"\
      \ ] && ! grep -Psiq -- '(^|\\h+)'\"$l_file\"'\\b' \\\r\n      <<< \"${a_files[*]}\" && a_files+=(\"\
      $l_file\")\r\n   done < <(\"$l_systemdsysctl\" --cat-config | tac | \\\r\n   grep -Psio -- '^\\\
      h*#\\h*\\/[^#\\n\\r\\h]+\\.conf\\b')\r\n   for l_file in \"${a_files[@]}\"; do\r\n      l_opt=\"\
      $(grep -Psio '^\\h*'\"$l_grep\"'\\h*=\\h*\\H+\\b' \"$l_file\" | tail -n 1)\"\r\n      l_option_value=\"\
      $(cut -d= -f2 <<< \"$l_opt\" | xargs)\"\r\n      [ -n \"$l_option_value\" ] && \\\r\n      a_output+=(\"\
      \ - \\\"$l_parameter_name = $l_option_value\\\" is set in: \\\"$l_file\\\"\")\r\n   done\r\n   [\
      \ \"${#a_output[@]}\" -gt \"0\" ] && printf '%s\\n' \"\" \"${a_output[@]}\" \"\"\r\n}\r\n```\r\n\
      \r\nVerify output includes `net.ipv4.conf.all.accept_redirects = 0`.\r\n\r\n_Example output:_\r\n\
      \r\n```\r\n - \"net.ipv4.conf.all.accept_redirects = 0\" is set in: \"/etc/sysctl.d/60-ipv4_sysctl.conf\"\
      \r\n```\r\n\r\n>**Note:** If multiple lines with `net.ipv4.conf.all.accept_redirects =` are returned.\r\
      \n>- The first line includes the value being used by `systemd sysctl`. If this is a correct value,\
      \ this is considered a passing state. If the file listed is not in the `/etc/sysctl.d/` directory,\
      \ it is highly recommended to follow the remediation procedure to create a `.conf` file in the `/etc/sysctl.d/`\
      \ directory with the correct setting to prevent a potential change due to an update to the system.\r\
      \n>- Any files in the `/etc/sysctl.d/` directory that include an incorrect value should be modified\
      \ to comment out or change the incorrect value to minimize the potential of the incorrect value\
      \ being used by `systemd sysctl` due to system configuration changes."
    remediation_guidance: "1. Review all files being used by systemd sysctl and comment out or remove\
      \ all `net.ipv4.conf.all.accept_redirects` lines that are not `net.ipv4.conf.all.accept_redirects=0`.\r\
      \n\r\n_Example script:_\r\n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n   l_option=\"net.ipv4.conf.all.accept_redirects\"\
      \ l_value=\"0\"\r\n   l_grep=\"${l_option//./(\\\\.|\\\\/)}\" a_files=()\r\n   l_systemdsysctl=\"\
      $(readlink -e /lib/systemd/systemd-sysctl \\\r\n   || readlink -e /usr/lib/systemd/systemd-sysctl)\"\
      \r\n   l_ufw_file=\"$([ -f /etc/default/ufw ] && \\\r\n   awk -F= '/^\\s*IPT_SYSCTL=/ {print $2}'\
      \ /etc/default/ufw)\"\r\n   [ -f \"$(readlink -e \"$l_ufw_file\")\" ] && \\\r\n   a_files+=(\"$l_ufw_file\"\
      ); a_files+=(\"/etc/sysctl.conf\")\r\n   while IFS= read -r l_fname; do\r\n      l_file=\"$(readlink\
      \ -e \"${l_fname//# /}\")\"\r\n      [ -n \"$l_file\" ] && ! grep -Psiq -- '(^|\\h+)'\"$l_file\"\
      '\\b' \\\r\n      <<< \"${a_files[*]}\" && a_files+=(\"$l_file\")\r\n   done < <(\"$l_systemdsysctl\"\
      \ --cat-config | tac | \\\r\n   grep -Psio -- '^\\h*#\\h*\\/[^#\\n\\r\\h]+\\.conf\\b')\r\n   for\
      \ l_file in \"${a_files[@]}\"; do\r\n      grep -Psio -- '\\h*'\"$l_grep\"'\\h*=\\h*\\H+\\b' \"\
      $l_file\" \\\r\n      | grep -Psivq -- '^\\h*'\"$l_grep\"'\\h*=\\h*'\"$l_value\"'\\b' && \\\r\n\
      \      sed -ri '/^\\s*'\"$l_grep\"'\\s*=\\s*(1[0-9]*)/s/^/# /' \"$l_file\"\r\n   done\r\n}\r\n```\r\
      \n\r\n2. Create or edit a file in the `/etc/sysctl.d/` directory ending in `.conf`and edit or add\
      \ the following line:\r\n\r\n```\r\nnet.ipv4.conf.all.accept_redirects = 0\r\n```\r\n\r\n_Example:_\r\
      \n\r\n```\r\n# [ ! -d \"/etc/sysctl.d/\" ] && mkdir -p /etc/sysctl.d/\r\n# printf '%s\\n' \"\" \"\
      net.ipv4.conf.all.accept_redirects = 0\" \\\r\n>> /etc/sysctl.d/60-ipv4_sysctl.conf\r\n```\r\n\r\
      \n>**Note:** If the UFW file was the first file listed in the audit, the entry will be commented\
      \ out as part of the first step, however updating Uncomplicated Firewall (UFW) may update this change.\
      \ In this case the updated entry will supersede the entry being created as part of this step.\r\n\
      \r\n3. Run the following command to load all sysctl configuration filles:\r\n\r\n```\r\n# sysctl\
      \ --system\r\n```"
    additional_information: ''
    default_value: net.ipv4.conf.all.accept_redirects = 1
    artifacts_count: 1
    requirements: {}
