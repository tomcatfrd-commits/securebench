    parent: CIS _1_ Configure Bootloader Main | 2.1.1-Ensure bootloader password is set
    rationale: Requiring a boot password upon execution of the boot loader will prevent an unauthorized
      user from entering boot parameters or changing the boot partition. This prevents users from weakening
      security (e.g. turning off AppArmor at boot time).
    impact: "If password protection is enabled, only the designated superuser can edit a GRUB 2 menu item\
      \ by pressing \"e\" or access the GRUB 2 command line by pressing \"c\"\r\n\r\nIf GRUB 2 is set\
      \ up to boot automatically to a password-protected menu entry the user has no option to back out\
      \ of the password prompt to select another menu entry. Holding the SHIFT key will not display the\
      \ menu in this case. The user must enter the correct username and password. If unable to do so,\
      \ the configuration files will have to be edited via a LiveCD or other means to fix the problem\r\
      \n\r\nYou can add `--unrestricted` to the menu entries to allow the system to boot without entering\
      \ a password.  A password will still be required to edit menu items.\r\n\r\nMore Information:  [https://help.ubuntu.com/community/Grub2/Passwords](https://help.ubuntu.com/community/Grub2/Passwords)"
    audit_guidance: "Run the following commands and verify output matches:\r\n```\r\n# grep \"^set superusers\"\
      \ /boot/grub/grub.cfg\r\n\r\nset superusers=\" \"\r\n```\r\n\r\n```\r\n# awk -F. '/^\\s*password/\
      \ {print $1\".\"$2\".\"$3}' /boot/grub/grub.cfg\r\n\r\npassword_pbkdf2 grub.pbkdf2.sha512\r\n```"
    remediation_guidance: "Create an encrypted password with `grub-mkpasswd-pbkdf2`:\r\n```\r\n# grub-mkpasswd-pbkdf2\
      \ --iteration-count=600000 --salt=64\r\n\r\nEnter password: Reenter password: PBKDF2 hash of your\
      \ password is ```\r\n\r\nAdd the following into a custom `/etc/grub.d` configuration file:\r\n```\r\
      \nset superusers=\" \"\r\npassword_pbkdf2 ```\r\n\r\nThe superuser/user information and password\
      \ should not be contained in the `/etc/grub.d/00_header` file as this file could be overwritten\
      \ in a package update.\r\n\r\nIf there is a requirement to be able to boot/reboot without entering\
      \ the password, edit `/etc/grub.d/10_linux` and add `--unrestricted` to the line `CLASS=`\r\n\r\n\
      _Example:_\r\n```\r\nCLASS=\"--class gnu-linux --class gnu --class os --unrestricted\"\r\n```\r\n\
      \r\nRun the following command to update the `grub2` configuration:\r\n```\r\n# update-grub\r\n```"
    additional_information: Changes to `/etc/grub.d/10_linux` may be overwritten during updates to the
      `grub-common` package. You should review any changes to this file before rebooting otherwise the
      system may unexpectedly prompt for a password on the next boot.
    default_value: "This recommendation is designed around the grub bootloader, if LILO or another bootloader\
      \ is in use in your environment enact equivalent settings.\r\n\r\nReplace `/boot/grub/grub.cfg`\
      \ with the appropriate grub configuration file for your environment."
