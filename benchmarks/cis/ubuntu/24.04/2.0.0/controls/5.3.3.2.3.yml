control:
  id: CIS-5.3.3.2.3
  benchmark_id: cis-ubuntu-24.04
  title: Ensure password complexity is configured
  description: "Password complexity can be set through:\r\n- `minclass` - The minimum number of classes\
    \ of characters required in a new password. (digits, uppercase, lowercase, others). e.g. `minclass\
    \ = 4` requires digits, uppercase, lower case, and special characters. \r\n- `dcredit` - The maximum\
    \ credit for having digits in the new password. If less than `0` it is the minimum number of digits\
    \ in the new password. e.g. `dcredit = -1` requires at least one digit\r\n- `ucredit` - The maximum\
    \ credit for having uppercase characters in the new password. If less than `0` it is the minimum number\
    \ of uppercase characters in the new password. e.g. `ucredit = -1` requires at least one uppercase\
    \ character\r\n- `ocredit` - The maximum credit for having other characters in the new password. If\
    \ less than `0` it is the minimum number of other characters in the new password. e.g. `ocredit =\
    \ -1` requires at least one special character\r\n- `lcredit` - The maximum credit for having lowercase\
    \ characters in the new password.  If less than `0` it is the minimum number of lowercase characters\
    \ in the new password. e.g. `lcredit = -1` requires at least one lowercase character"
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_3_3_2_3.audit
  remediation: cis.ubuntu.24.04.v2_0_0.5_3_3_2_3.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.5_3_3_2_3.rollback
