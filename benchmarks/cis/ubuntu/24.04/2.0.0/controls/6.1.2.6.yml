    parent: CIS _6_System Logging Main | 2.2.2.6-Ensure rsyslog is not configured to receive logs from
      a remote client
    rationale: If a client is configured to also receive data, thus turning it into a server, the client
      system is acting outside its operational boundary.
    impact: ''
    audit_guidance: "Review the `/etc/rsyslog.conf` and `/etc/rsyslog.d/*.conf` files and verify that\
      \ the system is not configured to accept incoming logs.\r\n\r\n**advanced format**\r\n\r\n```\r\n\
      # grep -Psi -- '^\\h*module\\(load=\\\"?imtcp\\\"?\\)' /etc/rsyslog.conf /etc/rsyslog.d/*.conf\r\
      \n# grep -Psi -- '^\\h*input\\(type=\\\"?imtcp\\\"?\\b' /etc/rsyslog.conf /etc/rsyslog.d/*.conf\r\
      \n```\r\n\r\nNothing should be returned\r\n\r\n\r\n**obsolete legacy format**\r\n\r\n```\r\n# grep\
      \ -Psi -- '^\\h*\\$ModLoad\\h+imtcp\\b' /etc/rsyslog.conf /etc/rsyslog.d/*.conf\r\n# grep -Psi --\
      \ '^\\h*\\$InputTCPServerRun\\b' /etc/rsyslog.conf /etc/rsyslog.d/*.conf\r\n```\r\n\r\nNothing should\
      \ be returned"
    remediation_guidance: "Should there be any active log server configuration found in the auditing section,\
      \ modify those files and remove the specific lines highlighted by the audit. Verify none of the\
      \ following entries are present in any of `/etc/rsyslog.conf` or `/etc/rsyslog.d/*.conf`.\r\n\r\n\
      **advanced format**\r\n\r\n```\r\nmodule(load=\"imtcp\")\r\ninput(type=\"imtcp\" port=\"514\")\r\
      \n```\r\n\r\n**deprecated legacy format**\r\n\r\n```\r\n$ModLoad imtcp\r\n$InputTCPServerRun\r\n\
      ```\r\n\r\nRestart the service:\r\n\r\n```\r\n# systemctl restart rsyslog\r\n```"
    additional_information: ''
