control:
  id: CIS-6.1.2.6
  benchmark_id: cis-ubuntu-24.04
  title: Ensure rsyslog is not configured to receive logs from a remote client
  description: '`rsyslog` supports the ability to receive messages from remote hosts, thus acting as a
    log server. Clients should not receive data from other hosts.'
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.6_1_2_6.audit
  remediation: cis.ubuntu.24.04.v2_0_0.6_1_2_6.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.6_1_2_6.rollback
