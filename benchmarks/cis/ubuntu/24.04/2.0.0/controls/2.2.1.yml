control:
  id: CIS-2.2.1
  benchmark_id: cis-ubuntu-24.04
  title: Ensure nis client is not installed
  description: The Network Information Service (NIS), formerly known as Yellow Pages, is a client-server
    directory service protocol used to distribute system configuration files. The NIS client was used
    to bind a machine to an NIS server and receive the distributed configuration files.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.2_2_1.audit
  remediation: cis.ubuntu.24.04.v2_0_0.2_2_1.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.2_2_1.rollback
  verification: cis.ubuntu.24.04.v2_0_0.2_2_1.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 2.2.1
      url: https://workbench.cisecurity.org/sections/4177275/recommendations/7047670
    assessment_status: automated
    profiles:
    - Level 1 - Server
    - Level 1 - Workstation
    mappings:
      nist:
      - CM-11
      - CM-7
      cis_v8:
      - '4.8'
      cis_v7:
      - '2.6'
      mitre_techniques:
      - T1203
      - T1203.000
      - T1543
      - T1543.002
      mitre_tactics:
      - TA0008
      mitre_mitigations:
      - M1042
    parent: CIS _2_Configure Client Services Main | 2.1.1-Ensure nis client is not installed
    rationale: The NIS service is inherently an insecure system that has been vulnerable to DOS attacks,
      buffer overflows and has poor authentication for querying NIS maps. NIS generally has been replaced
      by such protocols as Lightweight Directory Access Protocol (LDAP). It is recommended that the service
      be removed.
    impact: Many insecure service clients are used as troubleshooting tools and in testing environments.
      Uninstalling them can inhibit capability to test and troubleshoot. If they are required it is advisable
      to remove the clients after use to prevent accidental or intentional misuse.
    audit_guidance: "Verify `nis`  is not installed. Use the following command to provide the needed information:\r\
      \n\r\n```\r\n# dpkg-query -s nis &>/dev/null && echo \"nis is installed\"\r\n```\r\n\r\nNothing\
      \ should be returned."
    remediation_guidance: "Uninstall `nis`:\r\n```\r\n# apt purge nis\r\n```"
    additional_information: ''
    default_value: ''
    artifacts_count: 1
    requirements: {}
