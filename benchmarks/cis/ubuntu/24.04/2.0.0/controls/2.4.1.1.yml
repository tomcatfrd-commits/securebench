    parent: CIS _2_Configure cron Main | 1.1.2.1-Ensure cron daemon is enabled and active
    rationale: While there may not be user jobs that need to be run on the system, the system does have
      maintenance jobs that may include security monitoring that have to run, and `cron` is used to execute
      them.
    impact: ''
    audit_guidance: "**- IF -** cron is installed on the system:\r\n\r\nRun the following command to verify\
      \ `cron` is enabled:\r\n\r\n```\r\n# systemctl list-unit-files | awk '$1~/^crond?\\.service/{print\
      \ $2}'\r\n\r\nenabled\r\n```\r\n\r\nRun the following command to verify that `cron` is active:\r\
      \n\r\n```\r\n# systemctl list-units | awk '$1~/^crond?\\.service/{print $3}'\r\n\r\nactive\r\n```"
    remediation_guidance: "**- IF -** cron is installed on the system:\r\n\r\nRun the following commands\
      \ to unmask, enable, and start `cron`:\r\n\r\n```\r\n# systemctl unmask \"$(systemctl list-unit-files\
      \ | awk '$1~/^crond?\\.service/{print $1}')\"\r\n# systemctl --now enable \"$(systemctl list-unit-files\
      \ | awk '$1~/^crond?\\.service/{print $1}')\"\r\n```"
    additional_information: ''
    default_value: ''
    artifacts_count: 6
    requirements: {}
    safety:
      default: investigate
