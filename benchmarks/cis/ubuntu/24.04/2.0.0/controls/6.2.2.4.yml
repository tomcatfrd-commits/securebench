    parent: CIS _6_System Auditing Main | 2.2.2.4-Ensure system warns when audit logs are low on space
    rationale: In high security contexts, the risk of detecting unauthorized access or nonrepudiation
      exceeds the benefit of the system's availability.
    impact: If the `admin_space_left_action` is set to `single` the audit daemon will put the computer
      system in single user mode.
    audit_guidance: "Run the following command and verify the `space_left_action` is set to `email`, `exec`,\
      \ `single`, or `halt`:\r\n\r\n```\r\ngrep -Pi -- '^\\h*space_left_action\\h*=\\h*(email|exec|single|halt)\\\
      b' /etc/audit/auditd.conf\r\n```\r\n\r\nVerify the output is `email`, `exec`, `single`, or `halt`\r\
      \n\r\n_Example output_\r\n\r\n```\r\nspace_left_action = email\r\n```\r\n\r\nRun the following command\
      \ and verify the `admin_space_left_action` is set to `single` **- OR -** `halt`:\r\n\r\n```\r\n\
      grep -Pi -- '^\\h*admin_space_left_action\\h*=\\h*(single|halt)\\b' /etc/audit/auditd.conf\r\n```\r\
      \n\r\nVerify the output is `single` or `halt`\r\n\r\n_Example output:_\r\n\r\n```\r\nadmin_space_left_action\
      \ = single\r\n```\r\n\r\n**Note:** A Mail Transfer Agent (MTA) must be installed and configured\
      \ properly to set `space_left_action = email`"
    remediation_guidance: "Set the `space_left_action` parameter in `/etc/audit/auditd.conf` to `email`,\
      \ `exec`, `single`, or `halt`:\r\n\r\n_Example:_\r\n\r\n```\r\nspace_left_action = email\r\n```\r\
      \n\r\nSet the `admin_space_left_action` parameter in `/etc/audit/auditd.conf` to `single` or `halt`:\r\
      \n\r\n_Example:_\r\n\r\n```\r\nadmin_space_left_action = single\r\n```\r\n\r\n**Note:** A Mail Transfer\
      \ Agent (MTA) must be installed and configured properly to set `space_left_action = email`"
