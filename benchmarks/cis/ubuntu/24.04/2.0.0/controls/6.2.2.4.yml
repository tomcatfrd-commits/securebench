control:
  id: CIS-6.2.2.4
  benchmark_id: cis-ubuntu-24.04
  title: Ensure system warns when audit logs are low on space
  description: "The `auditd` daemon can be configured to halt the system, put the system in single user\
    \ mode or send a warning message, if the partition that holds the audit log files is low on space.\r\
    \n\r\nThe `space_left_action` parameter tells the system what action to take when the system has detected\
    \ that it is starting to get low on disk space. Valid values are `ignore`, `syslog`, `rotate`, `email`,\
    \ `exec`, `suspend`, `single`, and `halt`.\r\n- `ignore`, the audit daemon does nothing\r\n- `syslog`,\
    \ the audit daemon will issue a warning to syslog\r\n- `rotate`, the audit daemon will rotate logs,\
    \ losing the oldest to free up space\r\n- `email`, the audit daemon will send a warning to the email\
    \ account specified in `action_mail_acct` as well as sending the message to syslog\r\n- `exec`,  \
    \ /path-to-script will execute the script. You cannot pass parameters to the script. The script is\
    \ also responsible for telling the auditd daemon to resume logging once its completed its action\r\
    \n- `suspend`, the audit daemon will stop writing records to the disk\r\n- `single`, the audit daemon\
    \ will put the computer system in single user mode\r\n- `halt`, the audit daemon will shut down the\
    \ system\r\n\r\nThe `admin_space_left_action` parameter tells the system what action to take when\
    \ the system has detected that it is  low on disk space. Valid values are `ignore`, `syslog`, `rotate`,\
    \ `email`, `exec`, `suspend`, `single`, and `halt`.\r\n- `ignore`, the audit daemon does nothing\r\
    \n- `syslog`, the audit daemon will issue a warning to syslog\r\n- `rotate`, the audit daemon will\
    \ rotate logs, losing the oldest to free up space\r\n- `email`, the audit daemon will send a warning\
    \ to the email account specified in `action_mail_acct` as well as sending the message to syslog\r\n\
    - `exec`,   /path-to-script will execute the script. You cannot pass parameters to the script. The\
    \ script is also responsible for telling the auditd daemon to resume logging once its completed its\
    \ action\r\n- `suspend`, the audit daemon will stop writing records to the disk\r\n- `single`, the\
    \ audit daemon will put the computer system in single user mode\r\n- `halt`, the audit daemon will\
    \ shut down the system"
  platform: ubuntu-24.04
  severity: unspecified
