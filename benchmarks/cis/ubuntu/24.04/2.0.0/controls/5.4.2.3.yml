control:
  id: CIS-5.4.2.3
  benchmark_id: cis-ubuntu-24.04
  title: Ensure group root is the only GID 0 group
  description: The `groupmod` command can be used to specify which group the `root` group belongs to.
    This affects permissions of files that are group owned by the `root` group.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_4_2_3.audit
