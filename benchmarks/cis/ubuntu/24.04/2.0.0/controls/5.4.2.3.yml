    parent: CIS _5_Configure root and system accounts and environment Main | 1.1.2.3-Ensure group root
      is the only GID 0 group
    rationale: Using GID 0 for the `root` group helps prevent `root` group owned files from accidentally
      becoming accessible to non-privileged users.
    impact: ''
    audit_guidance: "Run the following command to verify no group other than `root` is assigned GID `0`:\r\
      \n\r\n```\r\n# awk -F: '$3==\"0\"{print $1\":\"$3}' /etc/group\r\n\r\nroot:0\r\n```"
    remediation_guidance: "Run the following command to set the `root` group's GID to `0`:\r\n\r\n```\r\
      \n# groupmod -g 0 root\r\n```\r\n\r\nRemove any groups other than the `root` group with GID 0 or\
      \ assign them a new GID if appropriate."
