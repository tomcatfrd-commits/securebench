control:
  id: CIS-2.3.3.1
  benchmark_id: cis-ubuntu-24.04
  title: Ensure chrony is configured
  description: "- server\r\n  - The server directive specifies an NTP server which can be used as a time\
    \ source. The client-server relationship is strictly hierarchical: a client might synchronize its\
    \ system time to that of the server, but the server’s system time will never be influenced by that\
    \ of a client.\r\n  - This directive can be used multiple times to specify multiple servers.\r\n \
    \ - The directive is immediately followed by either the name of the server, or its IP address.\r\n\
    \r\n- pool\r\n  - The syntax of this directive is similar to that for the server directive, except\
    \ that it is used to specify a pool of NTP servers rather than a single NTP server. The pool name\
    \ is expected to resolve to multiple addresses which might change over time.\r\n  - This directive\
    \ can be used multiple times to specify multiple pools.\r\n  - All options valid in the server directive\
    \ can be used in this directive too."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.2_3_3_1.audit
  remediation: cis.ubuntu.24.04.v2_0_0.2_3_3_1.remediate
