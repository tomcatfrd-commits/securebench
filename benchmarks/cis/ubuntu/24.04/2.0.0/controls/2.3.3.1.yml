    parent: CIS _2_Time Synchronization Main | 2.1.3.1-Ensure chrony is configured
    rationale: Time synchronization is important to support time sensitive security mechanisms and to
      ensure log files have consistent time records across the enterprise to aid in forensic investigations
    impact: ''
    audit_guidance: "**- IF -** `chrony` is in use on the system, run the following script to ensure `chrony`\
      \ is configured with an authorized timeserver:\r\n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n  \
      \ a_output=() a_output2=() a_config_files=(\"/etc/chrony/chrony.conf\") \r\n   l_include='(confdir|sourcedir)'\
      \ l_parameter_name='(server|pool)' l_parameter_value='.+'\r\n   while IFS= read -r l_conf_loc; do\r\
      \n      l_dir=\"\" l_ext=\"\"\r\n      if [ -d \"$l_conf_loc\" ]; then\r\n         l_dir=\"$l_conf_loc\"\
      \ l_ext=\"*\"\r\n      elif  grep -Psq '\\/\\*\\.([^#/\\n\\r]+)?\\h*$' <<< \"$l_conf_loc\" || [\
      \ -f \"$(readlink -f \"$l_conf_loc\")\" ]; then\r\n         l_dir=\"$(dirname \"$l_conf_loc\")\"\
      \ l_ext=\"$(basename \"$l_conf_loc\")\"\r\n      fi\r\n      if [[ -n \"$l_dir\" && -n \"$l_ext\"\
      \ ]]; then\r\n         while IFS= read -r -d $'\\0' l_file_name; do\r\n            [ -f \"$(readlink\
      \ -f \"$l_file_name\")\" ] && a_config_files+=(\"$(readlink -f \"$l_file_name\")\")\r\n        \
      \ done < <(find -L \"$l_dir\" -type f -name \"$l_ext\" -print0 2>/dev/null)\r\n      fi\r\n   done\
      \ < <(awk '$1~/^\\s*'\"$l_include\"'$/{print $2}' \"${a_config_files[*]}\" 2>/dev/null)\r\n   for\
      \ l_file in \"${a_config_files[@]}\"; do\r\n      l_parameter_line=\"$(grep -Psi '^\\h*'\"$l_parameter_name\"\
      '(\\h+|\\h*:\\h*)'\"$l_parameter_value\"'\\b' \"$l_file\")\"\r\n      [ -n \"$l_parameter_line\"\
      \ ] && a_output+=(\"  - Parameter: \\\"$(tr -d '()' <<< ${l_parameter_name//|/ or })\\\"\" \\\r\n\
      \      \"    Exists in the file: \\\"$l_file\\\" as:\" \"$l_parameter_line\")\r\n   done\r\n   [\
      \ \"${#a_output[@]}\" -le \"0\" ] && a_output2+=(\"  - Parameter: \\\"$(tr -d '()' <<< ${l_parameter_name//|/\
      \ or })\\\"\" \\\r\n   \"    Does not exist in the chrony configuration\")\r\n   if [ \"${#a_output2[@]}\"\
      \ -le 0 ]; then\r\n      printf '%s\\n' \"\" \"- Audit Result:\" \"  ** PASS **\" \"${a_output[@]}\"\
      \ \"\"\r\n   else\r\n      printf '%s\\n' \"\" \"- Audit Result:\" \"  ** FAIL **\" \" - Reason(s)\
      \ for audit failure:\" \"${a_output2[@]}\"\r\n   fi\r\n}\r\n```"
    remediation_guidance: "Edit `/etc/chrony/chrony.conf` or a file ending in `.sources` in `/etc/chrony/sources.d/`\
      \ and add or edit server or pool lines as appropriate according to local site policy:\r\n\r\nEdit\
      \ the `Chrony` configuration and add or edit the server and/or pool lines returned by the Audit\
      \ Procedure as appropriate according to local site policy \r\n\r\n```\r\n<[server|pool]> <[remote-server|remote-pool]>\r\
      \n```\r\n\r\n_Example script to add a drop-in configuration for the `pool` directive:_\r\n\r\n```\r\
      \n#!/usr/bin/env bash\r\n\r\n{\r\n   [ ! -d \"/etc/chrony/sources.d/\" ] && mkdir /etc/chrony/sources.d/\r\
      \n   printf '%s\\n' \"\" \"#The maxsources option is unique to the pool directive\" \\\r\n   \"\
      pool time.nist.gov iburst maxsources 4\" >> /etc/chrony/sources.d/60-sources.sources\r\n   chronyc\
      \ reload sources &>/dev/null\r\n}\r\n```\r\n\r\n_Example script to add a drop-in configuration for\
      \ the `server` directive:_\r\n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n   [ ! -d \"/etc/chrony/sources.d/\"\
      \ ] && mkdir /etc/chrony/sources.d/\r\n   printf '%s\\n' \"\" \"server time-a-g.nist.gov iburst\"\
      \ \"server 132.163.97.3 iburst\" \\\r\n   \"server time-d-b.nist.gov iburst\" >> /etc/chrony/sources.d/60-sources.sources\r\
      \n   chronyc reload sources &>/dev/null\r\n}\r\n```\r\n\r\nRun the following command to reload the\
      \ `chronyd` config:\r\n\r\n```\r\n# systemctl reload-or-restart chronyd\r\n```"
    additional_information: "If pool and/or server directive(s) are set in a sources file in `/etc/chrony/sources.d`,\
      \ the line:\r\n\r\n```\r\nsourcedir /etc/chrony/sources.d\r\n```\r\n\r\nmust be present in `/etc/chrony/chrony.conf`"
