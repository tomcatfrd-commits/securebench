control:
  id: CIS-1.1.1.8
  benchmark_id: cis-ubuntu-24.04
  title: Ensure udf kernel module is not available
  description: The `udf` filesystem type is the universal disk format used to implement ISO/IEC 13346
    and ECMA-167 specifications. This is an open vendor filesystem type for data storage on a broad range
    of media. This filesystem type is necessary to support writing DVDs and newer optical disc formats.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.1_1_1_8.audit
