control:
  id: CIS-5.1.10
  benchmark_id: cis-ubuntu-24.04
  title: Ensure sshd HostbasedAuthentication is disabled
  description: "The `HostbasedAuthentication` parameter specifies if authentication is allowed through\
    \ trusted hosts via the user of `.rhosts`, or `/etc/hosts.equiv`, along with successful public key\
    \ client host authentication.\r\n\r\nMore information about the openSSH server configuration is available\
    \ in the \"Configure SSH Server\" section overview."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_1_10.audit
  remediation: cis.ubuntu.24.04.v2_0_0.5_1_10.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.5_1_10.rollback
  verification: cis.ubuntu.24.04.v2_0_0.5_1_10.verify
  rollback_capability: unsupported
  metadata:
