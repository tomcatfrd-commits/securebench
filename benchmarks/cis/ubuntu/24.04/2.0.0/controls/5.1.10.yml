    parent: CIS _5_Configure SSH Server Main | 2.2.11-Ensure sshd HostbasedAuthentication is disabled
    rationale: Even though the `.rhosts` files are ineffective if support is disabled in `/etc/pam.conf`,
      disabling the ability to use `.rhosts` files in SSH provides an additional layer of protection.
    impact: ''
    audit_guidance: "Run the following command to verify `HostbasedAuthentication` is set to `no`:\r\n\
      \r\n```\r\n# sshd -T | grep hostbasedauthentication\r\n\r\nhostbasedauthentication no\r\n```\r\n\
      \r\n**- IF -** `Match` set statements are used in your environment, specify the connection parameters\
      \ to use for the `-T` extended test mode and run the audit to verify the setting is not incorrectly\
      \ configured in a match block\r\n\r\n_Example additional audit needed for a match block for the\
      \ user `sshuser`:_\r\n\r\n```\r\n# sshd -T -C user=sshuser | grep hostbasedauthentication\r\n```"
    remediation_guidance: "Create or edit a `*.conf` file in the `/etc/ssh/sshd_config.d/` and set the\
      \ `HostbasedAuthentication` parameter to `no` above any `Include` and `Match` entries as follows:\r\
      \n\r\n```\r\nHostbasedAuthentication no\r\n```"
    additional_information: ''
    default_value: HostbasedAuthentication no
    artifacts_count: 3
    requirements: {}
    safety:
      default: investigate
      implementation_status: guidance_only
      reason: Imported CIS guidance has not yet been promoted to a reviewed SecureBench implementation.
