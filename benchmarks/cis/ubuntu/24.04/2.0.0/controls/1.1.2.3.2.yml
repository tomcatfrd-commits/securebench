    parent: CIS _1_Configure Filesystem Partitions Main | 1.1.3.2-Ensure nodev option set on /home partition
    rationale: Since the `/home` filesystem is not intended to support devices, set this option to ensure
      that users cannot create a block or character special devices in `/home`.
    impact: ''
    audit_guidance: "**- IF -** a separate partition exists for `/home`, verify that the `nodev` option\
      \ is set.\r\n\r\nRun the following command to verify that the `nodev` mount option is set.\r\n\r\
      \n_Example:_\r\n\r\n```\r\n# findmnt -kn /home | grep -v nodev\r\n```\r\nNothing should be returned"
    remediation_guidance: "**- IF -** a separate partition exists for `/home`.\r\n\r\nEdit the `/etc/fstab`\
      \ file and add `nodev` to the fourth field (mounting options) for the `/home` partition.\r\n\r\n\
      _Example:_\r\n\r\n``` /home defaults,rw,nosuid,nodev,relatime  0 0\r\n```\r\n\r\nRun the following\
      \ command to remount `/home` with the configured options:\r\n\r\n```\r\n# mount -o remount /home\r\
      \n```"
    additional_information: ''
    default_value: ''
    artifacts_count: 1
    requirements: {}
