    parent: CIS _5_Configure privilege escalation Main | 2.1.7-Ensure access to the su command is restricted
    rationale: Restricting the use of `su` , and using `sudo` in its place, provides system administrators
      better control of the escalation of user privileges to execute privileged commands. The sudo utility
      also provides a better logging and audit mechanism, as it can log each command executed via `sudo`
      , whereas `su` can only record that a user executed the `su` program.
    impact: ''
    audit_guidance: "Run the following command:\r\n\r\n```\r\n# grep -Pi '^\\h*auth\\h+(?:required|requisite)\\\
      h+pam_wheel\\.so\\h+(?:[^#\\n\\r]+\\h+)?((?!\\2)(use_uid\\b|group=\\H+\\b))\\h+(?:[^#\\n\\r]+\\\
      h+)?((?!\\1)(use_uid\\b|group=\\H+\\b))(\\h+.*)?$' /etc/pam.d/su\r\n```\r\n\r\nVerify the output\
      \ matches:\r\n\r\n```\r\nauth required pam_wheel.so use_uid group= ```\r\n\r\nRun the following\
      \ command and verify that the group specified in ` ` contains no users:\r\n\r\n```\r\n# grep /etc/group\r\
      \n```\r\n\r\nVerify the output does not contain any users in the relevant group:\r\n\r\n``` :x:\
      \ :\r\n```"
    remediation_guidance: "Create an empty group that will be specified for use of the `su` command. \
      \ The group should be named according to site policy.\r\n\r\n_Example:_\r\n\r\n```\r\n# groupadd\
      \ sugroup\r\n```\r\n\r\nAdd the following line to the `/etc/pam.d/su` file, specifying the empty\
      \ group:\r\n\r\n```\r\nauth required pam_wheel.so use_uid group=sugroup\r\n```"
    additional_information: ''
