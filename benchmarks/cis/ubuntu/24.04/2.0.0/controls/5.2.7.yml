control:
  id: CIS-5.2.7
  benchmark_id: cis-ubuntu-24.04
  title: Ensure access to the su command is restricted
  description: The `su` command allows a user to run a command or shell as another user. The program has
    been superseded by `sudo`, which allows for more granular control over privileged access. Normally,
    the `su` command can be executed by any user. By uncommenting the `pam_wheel.so` statement in `/etc/pam.d/su`,
    the `su` command will only allow users in a specific groups to execute `su`. This group should be
    empty to reinforce the use of `sudo` for privileged access.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_2_7.audit
  remediation: cis.ubuntu.24.04.v2_0_0.5_2_7.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.5_2_7.rollback
  verification: cis.ubuntu.24.04.v2_0_0.5_2_7.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 5.2.7
      url: https://workbench.cisecurity.org/sections/4177269/recommendations/7047665
    assessment_status: automated
    profiles:
    - Level 1 - Server
    - Level 1 - Workstation
    mappings:
      nist:
      - AC-3
