    parent: CIS _6_System Auditing Main | 2.2.3.25-Ensure successful and unsuccessful attempts to use
      the setfacl command are collected
    rationale: "This  utility  sets  Access  Control Lists (ACLs) of files and directories. Without generating\
      \ audit records that are specific to the security and mission needs of the organization, it would\
      \ be difficult to establish, correlate, and investigate the events relating to an incident or identify\
      \ those responsible for one. \r\n\r\nAudit records can be generated from various components within\
      \ the information system (e.g., module or policy filter)."
    impact: ''
    audit_guidance: "**On disk configuration**\r\n\r\nRun the following command to check the on disk rules:\r\
      \n\r\n```\r\n# {\r\n UID_MIN=$(awk '/^\\s*UID_MIN/{print $2}' /etc/login.defs)\r\n [ -n \"${UID_MIN}\"\
      \ ] && awk \"/^ *-a *always,exit/ \\\r\n &&(/ -F *auid!=unset/||/ -F *auid!=-1/||/ -F *auid!=4294967295/)\
      \ \\\r\n &&/ -F *auid>=${UID_MIN}/ \\\r\n &&/ -F *perm=x/ \\\r\n &&/ -F *path=\\/usr\\/bin\\/setfacl/\
      \ \\\r\n &&(/ key= *[!-~]* *$/||/ -k *[!-~]* *$/)\" /etc/audit/rules.d/*.rules || printf \"ERROR:\
      \ Variable 'UID_MIN' is unset.\\n\"\r\n}\r\n```\r\n\r\nVerify the output matches:\r\n\r\n```\r\n\
      -a always,exit -F path=/usr/bin/setfacl -F perm=x -F auid>=1000 -F auid!=unset -k perm_chng\r\n\
      ```\r\n\r\n**Running configuration**\r\n\r\nRun the following command to check loaded rules:\r\n\
      \r\n```\r\n# {\r\n UID_MIN=$(awk '/^\\s*UID_MIN/{print $2}' /etc/login.defs)\r\n [ -n \"${UID_MIN}\"\
      \ ] && auditctl -l | awk \"/^ *-a *always,exit/ \\\r\n &&(/ -F *auid!=unset/||/ -F *auid!=-1/||/\
      \ -F *auid!=4294967295/) \\\r\n &&/ -F *auid>=${UID_MIN}/ \\\r\n &&/ -F *perm=x/ \\\r\n &&/ -F *path=\\\
      /usr\\/bin\\/setfacl/ \\\r\n &&(/ key= *[!-~]* *$/||/ -k *[!-~]* *$/)\" \\\r\n || printf \"ERROR:\
      \ Variable 'UID_MIN' is unset.\\n\"\r\n}\r\n```\r\n\r\nVerify the output matches:\r\n\r\n```\r\n\
      -a always,exit -S all -F path=/usr/bin/setfacl -F perm=x -F auid>=1000 -F auid!=-1 -F key=perm_chng\r\
      \n```"
    remediation_guidance: "**Create audit rules**\r\n\r\nEdit or create a file in the `/etc/audit/rules.d/`\
      \ directory, ending in `.rules` extension, with the relevant rules to monitor successful and unsuccessful\
      \ attempts to use the `setfacl` command.\r\n\r\n_Example:_\r\n\r\n```\r\n# {\r\n UID_MIN=$(awk '/^\\\
      s*UID_MIN/{print $2}' /etc/login.defs)\r\n [ -n \"${UID_MIN}\" ] && printf \"\r\n-a always,exit\
      \ -F path=/usr/bin/setfacl -F perm=x -F auid>=${UID_MIN} -F auid!=unset -k perm_chng\r\n\" >> /etc/audit/rules.d/50-perm_chng.rules\
      \ || printf \"ERROR: Variable 'UID_MIN' is unset.\\n\"\r\n}\r\n```\r\n\r\n**Load audit rules**\r\
      \n\r\nMerge and load the rules into active configuration:\r\n\r\n```\r\n# augenrules --load\r\n\
      ```\r\n\r\nCheck if reboot is required.\r\n\r\n```\r\n# if [[ $(auditctl -s | grep \"enabled\")\
      \ =~ \"2\" ]]; then printf \"Reboot required to load rules\\n\"; fi\r\n```"
