control:
  id: CIS-6.2.3.25
  benchmark_id: cis-ubuntu-24.04
  title: Ensure successful and unsuccessful attempts to use the setfacl command are collected
  description: The operating system must generate audit records for successful/unsuccessful uses of the
    `setfacl` command
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.6_2_3_25.audit
  remediation: cis.ubuntu.24.04.v2_0_0.6_2_3_25.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.6_2_3_25.rollback
