  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 6.2.3.25
      url: https://workbench.cisecurity.org/sections/4203192/recommendations/7091572
    assessment_status: automated
