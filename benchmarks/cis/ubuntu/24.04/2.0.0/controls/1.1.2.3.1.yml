      mitre_mitigations:
      - M1038
    parent: CIS _1_Configure Filesystem Partitions Main | 1.1.3.1-Ensure separate partition exists for
      /home
    rationale: "The default installation only creates a single `/` partition. Since the `/home` directory\
      \ contains user generated data, there is a risk of resource exhaustion. It will essentially have\
      \ the whole disk available to fill up and impact the system as a whole. In addition, other operations\
      \ on the system could fill up the disk unrelated to `/home` and impact all local users.\r\n\r\n\
      Configuring `/home` as its own file system allows an administrator to set additional mount options\
      \ such as `noexec/nosuid/nodev`. These options limit an attacker's ability to create exploits on\
      \ the system. In the case of `/home` options such as `usrquota/grpquota` may be considered to limit\
      \ the impact that users can have on each other with regards to disk resource exhaustion. Other options\
      \ allow for specific behavior. See `man mount` for exact details regarding filesystem-independent\
      \ and filesystem-specific options.\r\n\r\nAs `/home` contains user data, care should be taken to\
      \ ensure the security and integrity of the data and mount point."
    impact: Resizing filesystems is a common activity in cloud-hosted servers. Separate filesystem partitions
      may prevent successful resizing or may require the installation of additional tools solely for the
      purpose of resizing operations. The use of these additional tools may introduce their own security
      considerations.
    audit_guidance: "Run the following command and verify output shows `/home` is mounted:\r\n\r\n```\r\
      \n# findmnt -kn /home\r\n\r\n/home   /dev/sdb  ext4  rw,nosuid,nodev,relatime,seclabel\r\n```"
    remediation_guidance: "For new installations, during installation create a custom partition setup\
      \ and specify a separate partition for `/home`.\r\n\r\nFor systems that were previously installed,\
      \ create a new partition and configure `/etc/fstab` as appropriate.\r\n\r\n**Note:** Using Btrfs\
      \ subvolumes instead of traditional disk partitions changes how disk space is allocated and enforced,\
      \ quotas may need to be configured to enforce storage limits and prevent resource exhaustion."
    additional_information: When modifying `/home` it is advisable to bring the system to emergency mode
      (so auditd is not running), rename the existing directory, mount the new file system, and migrate
      the data over before returning to multi-user mode.
    default_value: ''
    artifacts_count: 1
    requirements: {}
    safety:
