control:
  id: CIS-1.1.2.3.1
  benchmark_id: cis-ubuntu-24.04
  title: Ensure separate partition exists for /home
  description: "The `/home` directory is used to support disk storage needs of local users.\r\n\r\n**Note:**\
    \ Using Btrfs subvolumes instead of traditional disk partitions changes how disk space is allocated\
    \ and enforced, quotas may need to be configured to enforce storage limits and prevent resource exhaustion."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.1_1_2_3_1.audit
  remediation: cis.ubuntu.24.04.v2_0_0.1_1_2_3_1.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.1_1_2_3_1.rollback
  verification: cis.ubuntu.24.04.v2_0_0.1_1_2_3_1.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 1.1.2.3.1
      url: https://workbench.cisecurity.org/sections/4177255/recommendations/7047546
    assessment_status: automated
    profiles:
    - Level 2 - Server
    - Level 2 - Workstation
    mappings:
      nist:
      - CM-7
      cis_v8:
      - '3.3'
      cis_v7:
