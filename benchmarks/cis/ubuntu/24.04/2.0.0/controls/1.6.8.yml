  title: Ensure access to /etc/issue.net is configured
  description: The contents of the `/etc/issue.net`  file are displayed to users prior to login for remote
    connections from configured services.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.1_6_8.audit
  remediation: cis.ubuntu.24.04.v2_0_0.1_6_8.remediate
