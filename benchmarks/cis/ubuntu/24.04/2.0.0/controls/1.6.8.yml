      - M1022
    parent: CIS _1_Configure Command Line Warning Banners Main | 1.2.8-Ensure access to /etc/issue.net
      is configured
    rationale: '**- IF -** the `/etc/issue.net`  file does not have the correct access configured, it
      could be modified by unauthorized users with incorrect or misleading information.'
    impact: ''
    audit_guidance: "Run the following command and verify `Access` is `644` or more restrictive and `Uid`\
      \  and `Gid`  are both `0/root`:\r\n\r\n```\r\n# stat -Lc 'Access: (%#a/%A)  Uid: ( %u/ %U) Gid:\
      \ { %g/ %G)' /etc/issue.net\r\n```\r\nVerify output includes:\r\n```\r\nAccess: (0644/-rw-r--r--)\
      \  Uid: ( 0/ root)   Gid: ( 0/ root)\r\n```\r\n\r\n**Note:** `/etc/issue.net` may not exist by default,\
      \ best practice is to create an `/etc/issue.net` file with the appropriate contents according to\
      \ your site policy and remove any instances of `\\m` , `\\r` , `\\s` , `\\v` or references to the\
      \ `OS platform`"
    remediation_guidance: "Run the following commands to set mode, owner, and group on `/etc/issue.net`:\r\
      \n\r\n```\r\n# chown root:root $(readlink -e /etc/issue.net)\r\n# chmod u-x,go-wx $(readlink -e\
      \ /etc/issue.net)\r\n```"
    additional_information: ''
    default_value: 'Access: (0644/-rw-r--r--)  Uid: (    0/    root)   Gid: (    0/    root)'
    artifacts_count: 3
    requirements: {}
    safety:
      default: investigate
