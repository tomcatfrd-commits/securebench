control:
  id: CIS-1.7.3
  benchmark_id: cis-ubuntu-24.04
  title: Ensure GDM screen lock is configured
  description: "GNOME Desktop Manager can make the screen lock automatically whenever the user is idle\
    \ for some amount of time.\r\n- `idle-delay=uint32 {n}` - Number of seconds of inactivity before the\
    \ screen goes blank\r\n- `lock-delay=uint32 {n}` - Number of seconds after the screen is blank before\
    \ locking the screen\r\n\r\nBy using the lockdown mode in dconf, you can prevent users from changing\
    \ specific settings."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.1_7_3.audit
  remediation: cis.ubuntu.24.04.v2_0_0.1_7_3.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.1_7_3.rollback
  verification: cis.ubuntu.24.04.v2_0_0.1_7_3.verify
  rollback_capability: unsupported
