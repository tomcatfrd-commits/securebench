    parent: CIS _1_Configure GNOME Display Manager Main | 1.1.3-Ensure GDM screen lock is configured
    rationale: "Setting a lock-out value reduces the window of opportunity for unauthorized user access\
      \ to another user's session that has been left unattended.\r\n\r\nWithout locking down the system\
      \ settings, user settings take precedence over the system settings.\r\n\r\nSatisfies: SRG-OS-000029-GPOS-00010,\
      \ SRG-OS-000031-GPOS-00012, SRG-OS-000480-GPOS-00227"
    impact: ''
    audit_guidance: "1. Run the following commands to verify the screen lock settings are locked:\r\n\r\
      \nRun the following command to verify `idle-delay` is locked:\r\n\r\n```\r\n# gsettings writable\
      \ org.gnome.desktop.session idle-delay\r\n\r\nfalse\r\n```\r\n\r\nRun the following command to verify\
      \ `lock-delay` is locked:\r\n\r\n```\r\n# gsettings writable org.gnome.desktop.screensaver lock-delay\r\
      \n\r\nfalse\r\n```\r\n\r\n**Note:** If the setting is not locked, the value generated by the gsettings\
      \ get command below may be user level opposed to system-wide settings. This setting will need to\
      \ be validated and potentially remediated after it is locked in accordance with the Remediation\
      \ procedure.\r\n\r\n2. Run the following commands to verify the screen lock settings are configured:\r\
      \n\r\nRun the following commands to verify that `lock-delay` is set to `5` or less:\r\n\r\n```\r\
      \n# gsettings get org.gnome.desktop.screensaver lock-delay\r\n```\r\n\r\n_Example output:_\r\n\r\
      \n```\r\nuint32 5\r\n```\r\n\r\nRun the following command to verify `idle-delay` is set to `900`\
      \ (15 minutes) or less and not `0`:\r\n\r\n```\r\n# gsettings get org.gnome.desktop.session idle-delay\r\
      \n```\r\n\r\n_Example output:_\r\n\r\n```\r\nuint32 900\r\n```"
    remediation_guidance: "1. Create or edit the file `/etc/dconf/profile/user` and add the following\
      \ lines if they do not exist:\r\n\r\n```\r\nuser-db:user\r\nsystem-db:local\r\n```\r\n\r\n_Example:_\r\
      \n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n   l_dir=\"/etc/dconf/profile/\"\r\n   [ ! -d \"$l_dir\"\
      \ ] && mkdir /etc/dconf/profile/\r\n   ! grep -Psq '^\\h*user-db:user\\b' \"$l_dir/user\" && \\\r\
      \n   printf '%s\\n' \"\" \"user-db:user\" >> \"$l_dir/user\"\r\n   ! grep -Psq '^\\h*system-db:local\\\
      b' \"$l_dir/user\" && \\\r\n   sed -ri '/^\\s*user-db:user/a system-db:local' \"$l_dir/user\"\r\n\
      }\r\n```\r\n\r\n2. Run the following command to create the `/etc/dconf/db/local.d/` and `/etc/dconf/db/local.d/locks/`\
      \ directories if either does not exist:\r\n\r\n```\r\n# [ ! -d \"/etc/dconf/db/local.d/locks/\"\
      \ ] && mkdir -p /etc/dconf/db/local.d/locks/\r\n```\r\n\r\n3. Create or edit a file in `/etc/dconf/db/local.d/locks/`\
      \ and add the following lines to lock the login banner configuration:\r\n\r\n```\r\n/org/gnome/desktop/session/idle-delay\r\
      \n/org/gnome/desktop/screensaver/lock-delay\r\n```\r\n\r\n_Example:_\r\n\r\n```\r\n# printf '%s\\\
      n' \"\" \"/org/gnome/desktop/session/idle-delay\" \\\r\n\"/org/gnome/desktop/screensaver/lock-delay\"\
      \ >> /etc/dconf/db/local.d/locks/60-screensaver\r\n```\r\n\r\n4. Run the following script to comment\
      \ out any incorrect settings in a local system-wide database keyfile:\r\n\r\n```\r\n#!/usr/bin/env\
      \ bash\r\n\r\n{\r\n   f_key_file_fix()\r\n   {\r\n      while IFS= read -r -d $'\\0' l_file; do\r\
      \n         grep -Psiq -- \"^\\h*$l_parameter\\h+$l_value(\\b|\\h*$)\" \"$l_file\" && \\\r\n    \
      \     sed -ri '/^\\s*'\"$l_parameter\"'/s/^/# /g' \"$l_file\"\r\n      done < <(find /etc/dconf/db\
      \ -mindepth 2 -maxdepth 2 -type f -print0)\r\n   }\r\n   l_parameter=\"idle-delay=uint32\" l_value=\"\
      (0|90[1-9]|9[1-9][0-9]|1[0-9]{3,})\"; f_key_file_fix\r\n   l_parameter=\"lock-delay=uint32\" l_value=\"\
      ([6-9]|[1-9][0-9]+)\"; f_key_file_fix\r\n}\r\n```\r\n\r\n5. Create or edit a local keyfile for machine-wide\
      \ settings in '/etc/dconf/db/local.d/` with the following lines:\r\n\r\n```\r\n[org/gnome/desktop/session]\r\
      \nidle-delay=uint32 900\r\n\r\n[org/gnome/desktop/screensaver]\r\nlock-delay=uint32 5\r\n```\r\n\
      \r\n- idle-delay=uint32 {n} - Number of seconds of inactivity before the screen goes blank. Should\
      \ be '900' (15 minutes) or less, and not `0` (disabled)\r\n- lock-delay=uint32 {n} - Number of seconds\
      \ after the screen is blank before locking the screen. Should be `5` or less\r\n\r\n_Example script:_\r\
      \n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n   l_file=\"/etc/dconf/db/local.d/60-screensaver\"\r\
      \n   a_keyfile1=(\"[org/gnome/desktop/session]\" \"idle-delay=uint32 900\")\r\n   a_keyfile2=(\"\
      [org/gnome/desktop/screensaver]\" \"lock-delay=uint32 5\")\r\n   if grep -Psq -- '^\\h*\\[org\\\
      /gnome\\/desktop\\/session\\]' \"$l_file\"; then\r\n      ! grep -Psiq -- '^\\h*idle-delay=' \"\
      $l_file\" && \\\r\n      sed -ri '/^\\s*\\[org\\/gnome\\/desktop\\/session\\]/a idle-delay=uint32\
      \ 900' \"$l_file\"\r\n      grep -Psiq -- '^\\h*idle-delay=uint32\\h+(0|90[1-9]|9[1-9][0-9]|[1-9][0-9]{3,})\\\
      b' \\\r\n      \"$l_file\" && sed -ri 's/^\\s*(idle-delay=uint32)\\s+([0-9]|[1-9][0-9]+).*$/\\1\
      \ 900/' \"$l_file\"\r\n   else\r\n      printf '%s\\n' \"\" \"${a_keyfile1[@]}\" >> \"$l_file\"\r\
      \n   fi\r\n   if grep -Psq -- '^\\h*\\[org\\/gnome\\/desktop\\/screensaver\\]' \"$l_file\"; then\r\
      \n      ! grep -Psiq -- '^\\h*lock-delay=' \"$l_file\" && \\\r\n      sed -ri '/^\\s*\\[org\\/gnome\\\
      /desktop\\/screensaver\\]/a lock-delay=uint32 5' \"$l_file\"\r\n      grep -Psiq -- '^\\h*lock-delay=uint32\\\
      h+([6-9]|[1-9][0-9]+)\\b' \"$l_file\" && \\\r\n      sed -ri 's/^\\s*(lock-delay=uint32)\\s+([6-9]|[1-9][0-9]+).*$/\\\
      1 5/' \"$l_file\"\r\n   else\r\n      printf '%s\\n' \"\" \"${a_keyfile2[@]}\" >> \"$l_file\"\r\n\
      \   fi\r\n}\r\n```\r\n\r\n6. Run the following command to update the dconf database:\r\n\r\n```\r\
      \n# dconf update\r\n```\r\n\r\n**Note:** Users must log out and back in again before the system-wide\
      \ settings take effect."
