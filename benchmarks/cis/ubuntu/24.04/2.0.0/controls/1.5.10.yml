  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 1.5.10
      url: https://workbench.cisecurity.org/sections/4177281/recommendations/7047721
    assessment_status: automated
