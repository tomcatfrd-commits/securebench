control:
  id: CIS-1.5.10
  benchmark_id: cis-ubuntu-24.04
  title: Ensure systemd-coredump ProcessSizeMax is configured
  description: A core dump is the memory of an executable program. It is generally used to determine why
    a program aborted. It can also be used to glean confidential information from a core file.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.1_5_10.audit
  remediation: cis.ubuntu.24.04.v2_0_0.1_5_10.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.1_5_10.rollback
