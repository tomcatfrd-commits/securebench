control:
  id: CIS-5.4.3.2
  benchmark_id: cis-ubuntu-24.04
  title: Ensure default user shell timeout is configured
  description: "`TMOUT` is an environmental setting that determines the timeout of a shell in seconds.\r\
    \n- TMOUT=_n_ - Sets the shell timeout to _n_ seconds.  A setting of `TMOUT=0` disables timeout.\r\
    \n- readonly TMOUT- Sets the TMOUT environmental variable as readonly, preventing unwanted modification\
    \ during run-time.\r\n- export TMOUT - exports the TMOUT variable \r\n\r\n**System Wide Shell Configuration\
    \ Files:**\r\n- `/etc/profile` - used to set system wide environmental variables on users shells.\
    \ The variables are sometimes the same ones that are in the `.bash_profile`, however this file is\
    \ used to set an initial PATH or PS1 for all shell users of the system. **is only executed for interactive\
    \ *login* shells, or shells executed with the --login parameter.** \r\n- `/etc/profile.d` - `/etc/profile`\
    \ will execute the scripts within `/etc/profile.d/*.sh`. It is recommended to place your configuration\
    \ in a shell script within `/etc/profile.d` to set your own system wide environmental variables.\r\
    \n- `/etc/bash.bashrc` - System wide version of `.bashrc`.  In Fedora derived distributions, `/etc/bashrc`\
    \ also invokes /etc/profile.d/*.sh if *non-login* shell, but redirects output to `/dev/null` if *non-interactive.*\
    \ **Is only executed for *interactive* shells or if `BASH_ENV` is set to `/etc/bash.bashrc`.**"
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_4_3_2.audit
