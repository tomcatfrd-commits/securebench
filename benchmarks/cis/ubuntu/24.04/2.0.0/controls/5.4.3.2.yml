    parent: CIS _5_ User Accounts and Environment Main | 1.1.1.2-Ensure default user shell timeout is
      configured
    rationale: Setting a timeout value reduces the window of opportunity for unauthorized user access
      to another user's shell session that has been left unattended. It also ends the inactive session
      and releases the resources associated with that session.
    impact: ''
    audit_guidance: "Run the following script to verify that `TMOUT` is configured to: include a timeout\
      \ of no more than `900` seconds, to be `readonly`, to be `exported`, and is not being changed to\
      \ a longer timeout.\r\n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n   a_output=(); a_output2=();\
      \ l_tmout_set=\"900\"\r\n   f_tmout_read_chk()\r\n   {\r\n      a_out=(); a_out2=()\r\n      l_tmout_readonly=\"\
      $(grep -P -- '^\\h*(typeset\\h\\-xr\\hTMOUT=\\d+|([^#\\n\\r]+)?\\breadonly\\h+TMOUT\\b)' \"$l_file\"\
      )\"\r\n      l_tmout_export=\"$(grep -P -- '^\\h*(typeset\\h\\-xr\\hTMOUT=\\d+|([^#\\n\\r]+)?\\\
      bexport\\b([^#\\n\\r]+\\b)?TMOUT\\b)' \"$l_file\")\"\r\n      if [ -n \"$l_tmout_readonly\" ]; then\r\
      \n         a_out+=(\"  - Readonly is set as: \\\"$l_tmout_readonly\\\" in: \\\"$l_file\\\"\")\r\n\
      \      else\r\n         a_out2+=(\"  - Readonly is not set in: \\\"$l_file\\\"\")\r\n      fi\r\n\
      \      if [ -n \"$l_tmout_export\" ]; then\r\n         a_out+=(\"  - Export is set as: \\\"$l_tmout_export\\\
      \" in: \\\"$l_file\\\"\")\r\n      else\r\n         a_out2+=(\"  - Export is not set in: \\\"$l_file\\\
      \"\")\r\n      fi   \r\n   }\r\n   while IFS= read -r l_file; do\r\n      l_tmout_value=\"$(grep\
      \ -Po -- '^([^#\\n\\r]+)?\\bTMOUT=\\d+\\b' \"$l_file\" | awk -F= '{print $2}')\"\r\n      f_tmout_read_chk\r\
      \n      if [ -n \"$l_tmout_value\" ]; then\r\n         if [[ \"$l_tmout_value\" -le \"$l_tmout_set\"\
      \ && \"$l_tmout_value\" -gt \"0\" ]]; then\r\n            a_output+=(\" - TMOUT is set to: \\\"\
      $l_tmout_value\\\" in: \\\"$l_file\\\"\")\r\n            [ \"${#a_out[@]}\" -gt 0 ] && a_output+=(\"\
      ${a_out[@]}\")\r\n            [ \"${#a_out2[@]}\" -gt 0 ] && a_output2+=(\"${a_out[@]}\")\r\n  \
      \       fi\r\n         if [[ \"$l_tmout_value\" -gt \"$l_tmout_set\" || \"$l_tmout_value\" -le \"\
      0\" ]]; then\r\n            a_output2+=(\" - TMOUT is incorrectly set to: \\\"$l_tmout_value\\\"\
      \ in: \\\"$l_file\\\"\")\r\n            [ \"${#a_out[@]}\" -gt 0 ] && a_output2+=(\"  ** Incorrect\
      \ TMOUT value **\" \"${a_out[@]}\")\r\n            [ \"${#a_out2[@]}\" -gt 0 ] && a_output2+=(\"\
      ${a_out2[@]}\")\r\n         fi\r\n      else\r\n         [ \"${#a_out[@]}\" -gt 0 ] &&  a_output2+=(\"\
      \ - TMOUT is not set\" \"${a_out[@]}\")\r\n         [ \"${#a_out2[@]}\" -gt 0 ] &&  a_output2+=(\"\
      \ - TMOUT is not set\" \"${a_out2[@]}\")\r\n      fi\r\n   done < <(grep -Pls -- '^([^#\\n\\r]+)?\\\
      bTMOUT\\b' /etc/*bashrc /etc/profile /etc/profile.d/*.sh)\r\n   [[ \"${#a_output[@]}\" -le 0 &&\
      \ \"${#a_output2[@]}\" -le 0 ]] && a_output2+=(\" - TMOUT is not configured\")\r\n   if [ \"${#a_output2[@]}\"\
      \ -le 0 ]; then\r\n      printf '%s\\n' \"\" \"- Audit Result:\" \"  ** PASS **\" \"${a_output[@]}\"\
      \r\n   else\r\n      printf '%s\\n' \"\" \"- Audit Result:\" \"  ** FAIL **\" \"  * Reasons for\
      \ audit failure *\" \"${a_output2[@]}\" \"\"\r\n      [ \"${#a_output[@]}\" -gt 0 ] && printf '%s\\\
      n' \"- Correctly set:\" \"${a_output[@]}\"\r\n   fi\r\n}\r\n```\r\n\r\n**Note:** If `TMOUT` is set\
      \ as `readonly` through `readonly TMOUT` and/or `typeset -xr` in more than once, you will receive\
      \ an error message when logging into a terminal session or connecting with openSSH. It is recommended\
      \ that `TMOUT` be set only once in **only one** file."
    remediation_guidance: "Review `/etc/bashrc`, `/etc/profile`, and all files ending in `*.sh` in the\
      \ `/etc/profile.d/` directory and remove or edit all `TMOUT=_n_` entries to follow local site policy.\
      \  `TMOUT` should not exceed 900 or be equal to `0`.\r\n\r\nConfigure `TMOUT` in **one** of the\
      \ following files:\r\n- A file in the `/etc/profile.d/` directory ending in `.sh`\r\n- `/etc/profile`\r\
      \n- `/etc/bashrc`\r\n\r\n_Example command to set TMOUT to `900` seconds in a file in `/etc/profile.d/`:_\r\
      \n\r\n```\r\n# printf '%s\\n' \"# Set TMOUT to 900 seconds\" \"typeset -xr TMOUT=900\" > /etc/profile.d/50-tmout.sh\r\
      \n```\r\n\r\n_`TMOUT` configuration examples:_\r\n\r\n```\r\ntypeset -xr TMOUT=900\r\n```\r\n\r\n\
      Deprecated methods: \r\n\r\n- As multiple lines:\r\n```\r\nTMOUT=900\r\nreadonly TMOUT\r\nexport\
      \ TMOUT\r\n```\r\n- As a single line:\r\n```\r\nreadonly TMOUT=900 ; export TMOUT\r\n```"
    additional_information: "The audit and remediation in this recommendation apply to bash and shell.\
      \ If other shells are supported on the system, it is recommended that their configuration files\
      \ also are checked.  Other methods of setting a timeout exist for other shells not covered here.\r\
      \n\r\nEnsure that the timeout conforms to your local policy."
