control:
  id: CIS-5.3.3.1.3
  benchmark_id: cis-ubuntu-24.04
  title: Ensure password failed attempts lockout includes root account
  description: "`even_deny_root` - Enables locking of the root account, as well as regular accounts, after\
    \ failed attempts. By default, root is exempt to prevent denial-of-service risks.\r\n\r\n`root_unlock_time=n`\
    \ - This option implies even_deny_root option. Allow access after n seconds to root account after\
    \ the account is locked. In case the option is not specified the value is the same as of the unlock_time\
    \ option."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_3_3_1_3.audit
  remediation: cis.ubuntu.24.04.v2_0_0.5_3_3_1_3.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.5_3_3_1_3.rollback
  verification: cis.ubuntu.24.04.v2_0_0.5_3_3_1_3.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 5.3.3.1.3
      url: https://workbench.cisecurity.org/sections/4177284/recommendations/7047712
    assessment_status: automated
    profiles:
    - Level 2 - Server
    - Level 2 - Workstation
    mappings:
      nist: []
      cis_v8:
      - '6.2'
      cis_v7:
      - '16.7'
      mitre_techniques:
      - T1110
      - T1110.001
      - T1110.003
      mitre_tactics:
      - TA0006
      mitre_mitigations:
      - M1027
    parent: CIS _5_Pluggable Authentication Modules Main | 2.1.4.1.3-Ensure password failed attempts lockout
      includes root account
    rationale: Locking out user IDs after `n` unsuccessful consecutive login attempts mitigate brute force
      password attacks against your systems.
    impact: Use of `unlock_time=0` or `root_unlock_time=0` may allow an attacker to cause denial of service
      to legitimate users.
    audit_guidance: "Run the following command to verify that `even_deny_root` and/or `root_unlock_time`\
      \ is enabled:\r\n\r\n```\r\n# grep -Pi -- '^\\h*(even_deny_root|root_unlock_time\\h*=\\h*\\d+)\\\
      b' /etc/security/faillock.conf\r\n```\r\n\r\n_Example output:_\r\n\r\n```\r\neven_deny_root\r\n\r\
      \n--AND/OR--\r\n\r\nroot_unlock_time = 60\r\n```\r\n\r\nRun the following command to verify that\
      \ **- IF -** `root_unlock_time` is set, it is set to `60` (One minute) or more:\r\n\r\n```\r\n#\
      \ grep -Pi -- '^\\h*root_unlock_time\\h*=\\h*([1-9]|[1-5][0-9])\\b' /etc/security/faillock.conf\r\
      \n```\r\n\r\nNothing should be returned\r\n\r\nRun the following command to check the `pam_faillock.so`\
      \ module for the `root_unlock_time` argument. Verify **-IF-** `root_unlock_time` is set, it is set\
      \ to `60` (One minute) or more:\r\n\r\n```\r\n# grep -Pi -- '^\\h*auth\\h+([^#\\n\\r]+\\h+)pam_faillock\\\
      .so\\h+([^#\\n\\r]+\\h+)?root_unlock_time\\h*=\\h*([1-9]|[1-5][0-9])\\b' /etc/pam.d/common-auth\r\
      \n```\r\n\r\nNothing should be returned"
    remediation_guidance: "Edit `/etc/security/faillock.conf`:\r\n- Remove or update any line containing\
      \ `root_unlock_time`, **- OR -** set it to a value of `60` or more\r\n- Update or add the following\
      \ line\r\n\r\n```\r\neven_deny_root\r\n```\r\n\r\nRun the following command:\r\n\r\n```\r\n# grep\
      \ -Pl -- '\\bpam_faillock\\.so\\h+([^#\\n\\r]+\\h+)?(even_deny_root|root_unlock_time)' /usr/share/pam-configs/*\r\
      \n```\r\n\r\nEdit any returned files and remove the `even_deny_root` and `root_unlock_time` arguments\
      \ from the `pam_faillock.so` line(s).\r\n\r\n**Note**: It is recommended to remove any duplicate\
      \ or contradictory entries of `even_deny_root` and `root_unlock_time` found in `/usr/share/pam-configs/`\
      \ files and only use the centralized `/etc/security/fallock.conf` to set `even_deny_root`."
    additional_information: If a user has been locked out because they have reached the maximum consecutive
      failure count defined by `deny=` in the `pam_faillock.so` module, the user can be unlocked by issuing
      the command `faillock --user --reset`. This command sets the failed count to 0, effectively unlocking
      the user.
    default_value: disabled
    artifacts_count: 3
    requirements: {}
    safety:
