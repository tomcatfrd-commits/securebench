control:
  id: CIS-5.4.2.4
  benchmark_id: cis-ubuntu-24.04
  title: Ensure root account access is controlled
  description: There are a number of methods to access the root account directly. Without a password set
    any user would be able to gain access and thus control over the entire system.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_4_2_4.audit
  remediation: cis.ubuntu.24.04.v2_0_0.5_4_2_4.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.5_4_2_4.rollback
  verification: cis.ubuntu.24.04.v2_0_0.5_4_2_4.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 5.4.2.4
      url: https://workbench.cisecurity.org/sections/4177297/recommendations/7047795
    assessment_status: automated
    profiles:
    - Level 1 - Server
    - Level 1 - Workstation
    mappings:
      nist: []
      cis_v8:
      - '3.3'
      cis_v7:
      - '14.6'
      mitre_techniques:
      - T1078
      mitre_tactics:
      - TA0005
      mitre_mitigations:
      - M1026
    parent: CIS _5_Configure root and system accounts and environment Main | 1.1.2.4-Ensure root account
      access is controlled
    rationale: Access to `root` should be secured at all times.
    impact: If there are any automated processes that relies on access to the root account without authentication,
      they will fail after remediation.
    audit_guidance: "Run the following command to verify that either the root user's password is set or\
      \ the root user's account is locked:\r\n\r\n```\r\n# passwd -S root | awk '$2 ~ /^(P|L)/ {print\
      \ \"User: \\\"\" $1 \"\\\" Password is status: \" $2}'\r\n```\r\n\r\nVerify the output is either:\r\
      \n\r\n```\r\nUser: \"root\" Password is status: P \r\n- OR -\r\nUser: \"root\" Password is status:\
      \ L\r\n```\r\n\r\n**Note:**\r\n- `P` - Password is set\r\n- `L` - Password is locked"
    remediation_guidance: "Run the following command to set a password for the `root` user:\r\n\r\n```\r\
      \n# passwd root\r\n```\r\n\r\n**- OR -**\r\n\r\nRun the following command to lock the `root` user\
      \ account:\r\n\r\n```\r\n# usermod -L root\r\n```"
    additional_information: ''
    default_value: ''
    artifacts_count: 1
    requirements: {}
    safety:
      default: investigate
      implementation_status: guidance_only
      reason: Imported CIS guidance has not yet been promoted to a reviewed SecureBench implementation.
  dependencies: []
  conflicts: []
