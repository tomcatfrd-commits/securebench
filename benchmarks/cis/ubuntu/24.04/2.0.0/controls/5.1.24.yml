    parent: CIS _5_Configure SSH Server Main | 2.2.25-Ensure sshd ListenAddress is configured
    rationale: Restricting sshd to specific IP address(es) reduces unnecessary network exposure and limits
      access to approved interfaces only, minimizing the system's attack surface.
    impact: If the `ListenAddress` is set incorrectly (wrong IP, missing interface IP, or binding only
      to an address not reachable by intended clients), remote SSH access may be disrupted. Ensure out-of-band/console
      access exists before making changes.
    audit_guidance: "Run the following command to verify `ListenAddress` is set:\r\n```\r\n# sshd -T |\
      \ grep listenaddress\r\n```\r\nVerify output includes a private network interface\r\n\r\n_Example\
      \ Output_\r\n```\r\nlistenaddress 192.168.1.14:22\r\n```"
    remediation_guidance: "Create or edit a `*.conf` file in the `/etc/ssh/sshd_config.d/` directory to\
      \ set the `ListenAddress` parameter to a private network interface above any Include entry as follows:\r\
      \n_Example:_\r\n\r\n```\r\nListenAddress 192.168.1.14:22\r\n```"
