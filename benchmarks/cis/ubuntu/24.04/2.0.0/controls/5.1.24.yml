control:
  id: CIS-5.1.24
  benchmark_id: cis-ubuntu-24.04
  title: Ensure sshd ListenAddress is configured
  description: "The `ListenAddress` parameter specifies the local addresses sshd(8) should listen on.\
    \  The following forms may be used:\r\n\r\n```\r\nListenAddress hostname|address [rdomain domain]\r\
    \nListenAddress hostname:port [rdomain domain]\r\nListenAddress IPv4_address:port [rdomain domain]\r\
    \nListenAddress [hostname|address]:port [rdomain domain]\r\n```\r\nThe optional rdomain qualifier\
    \ requests sshd(8) listen in an explicit routing domain.  If port is not specified, sshd will listen\
    \ on the address and all Port options specified.  The default is to listen on all local addresses\
    \ on the current default routing domain. Multiple `ListenAddress` options are permitted.  For more\
    \ information on routing domains, see rdomain(4)."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_1_24.audit
  remediation: cis.ubuntu.24.04.v2_0_0.5_1_24.remediate
