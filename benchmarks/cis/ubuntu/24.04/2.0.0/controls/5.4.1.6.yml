    parent: CIS _5_Configure shadow password suite parameters Main | 1.1.1.6-Ensure all users last password
      change date is in the past
    rationale: If a user's recorded password change date is in the future, then they could bypass any
      set password expiration.
    impact: ''
    audit_guidance: "Run the following script and verify nothing is returned:\r\n\r\n```\r\n#!/usr/bin/env\
      \ bash\r\n\r\n{\r\n   while IFS= read -r l_user; do\r\n      l_change=$(date -u -d \"$(chage --list\
      \ $l_user | grep '^Last password change' | cut -d: -f2 | grep -v 'never$')\" +%s)\r\n      if [[\
      \ \"$l_change\" -gt \"$(date +%s)\" ]]; then\r\n         echo \"User: \\\"$l_user\\\" last password\
      \ change was \\\"$(chage --list $l_user | grep '^Last password change' | cut -d: -f2)\\\"\"\r\n\
      \      fi\r\n   done < <(awk -F: '$2~/^\\$.+\\$/{print $1}' /etc/shadow)\r\n}\r\n```"
    remediation_guidance: Investigate any users with a password change date in the future and correct
      them.  Locking the account, expiring the password, or resetting the password manually may be appropriate.
    additional_information: ''
    default_value: ''
    artifacts_count: 1
    requirements: {}
    safety:
