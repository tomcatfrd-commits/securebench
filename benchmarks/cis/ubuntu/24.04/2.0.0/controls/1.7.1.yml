    parent: CIS _1_Configure GNOME Display Manager Main | 1.1.1-Ensure GDM login banner is configured
    rationale: "Warning messages inform users who are attempting to login to the system of their legal\
      \ status regarding the system and must include the name of the organization that owns the system\
      \ and any monitoring policies that are in place.\r\n\r\nWithout locking down the system settings,\
      \ user settings take precedence over the system settings."
    impact: ''
    audit_guidance: "1. Run the following commands to verify the login banner configuration is locked:\r\
      \n\r\nRun the following command to verify the text banner on the login screen can not be disabled\
      \ by users:\r\n\r\n```\r\n# gsettings writable org.gnome.login-screen banner-message-enable\r\n\r\
      \nfalse\r\n```\r\n\r\nRun the following command to verify the text banner on the login screen can\
      \ not be modified by local users:\r\n\r\n```\r\n# gsettings writable org.gnome.login-screen banner-message-text\r\
      \n\r\nfalse\r\n```\r\n\r\n**Note:** If the settings are not locked, the values generated by the\
      \ `gsettings get` commands below may be user level opposed to system-wide settings. These setting\
      \ will need to be validated and potentially remediated after they are locked in accordance with\
      \ the Remediation procedure.\r\n\r\n2. Run the following commands to verify the login banner is\
      \ enabled and meets local site policy.\r\n\r\nRun the following command to verify that the system-wide\
      \ text banner on the login screen is enabled:\r\n\r\n```\r\n# gsettings get org.gnome.login-screen\
      \ banner-message-enable\r\n\r\ntrue\r\n```\r\n\r\nRun the following command to verify the system-wide\
      \ text banner on the login screen meets local site policy:\r\n\r\n```\r\n# gsettings get org.gnome.login-screen\
      \ banner-message-text\r\n```\r\n\r\n_Example output:_\r\n\r\n```\r\n'Authorized uses only. All activity\
      \ may be monitored and reported'\r\n```"
    remediation_guidance: "1. Create or edit the file `/etc/dconf/profile/user` and add the following\
      \ lines if they do not exist:\r\n\r\n```\r\nuser-db:user\r\nsystem-db:local\r\n```\r\n\r\n_Example:_\r\
      \n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n   l_dir=\"/etc/dconf/profile/\"\r\n   [ ! -d \"$l_dir\"\
      \ ] && mkdir /etc/dconf/profile/\r\n   ! grep -Psq '^\\h*user-db:user\\b' \"$l_dir/user\" && \\\r\
      \n   printf '%s\\n' \"\" \"user-db:user\" >> \"$l_dir/user\"\r\n   ! grep -Psq '^\\h*system-db:local\\\
      b' \"$l_dir/user\" && \\\r\n   sed -ri '/^\\s*user-db:user/a system-db:local' \"$l_dir/user\"\r\n\
      }\r\n```\r\n\r\n2. Run the following command to create the `/etc/dconf/db/local.d/` and `/etc/dconf/db/local.d/locks/`\
      \ directories if either does not exist:\r\n\r\n```\r\n# [ ! -d \"/etc/dconf/db/local.d/locks/\"\
      \ ] && mkdir -p /etc/dconf/db/local.d/locks/\r\n```\r\n\r\n3. Create or edit a file in `/etc/dconf/db/local.d/locks/`\
      \ and add the following lines to lock the login banner configuration:\r\n\r\n```\r\n/org/gnome/login-screen/banner-message-enable\r\
      \n/org/gnome/login-screen/banner-message-text\r\n```\r\n\r\n_Example:_\r\n\r\n```\r\n# printf '%s\\\
      n' \"\" \"/org/gnome/login-screen/banner-message-enable\" \\\r\n\"/org/gnome/login-screen/banner-message-text\"\
      \ >> /etc/dconf/db/local.d/locks/60-banner-message\r\n```\r\n\r\n4. Run the following script to\
      \ comment out any incorrect settings in a local system-wide database keyfile:\r\n\r\n```\r\n#!/usr/bin/env\
      \ bash\r\n\r\n{\r\n   f_key_file_fix()\r\n   {\r\n      while IFS= read -r -d $'\\0' l_file; do\r\
      \n         grep -Psiq -- \"^\\h*$l_parameter$l_value(\\b|\\h*$)\" \"$l_file\" && \\\r\n        \
      \ sed -ri '/^\\s*'\"$l_parameter\"'/s/^/# /g' \"$l_file\"\r\n      done < <(find /etc/dconf/db -mindepth\
      \ 2 -maxdepth 2 -type f -print0)\r\n   }\r\n   l_parameter=\"banner-message-enable=\" l_value=\"\
      false\"; f_key_file_fix\r\n   l_parameter=\"banner-message-text=\" l_value=\"(['\\\"]{2})?\"; f_key_file_fix\r\
      \n}\r\n```\r\n\r\n5. Create or edit a local keyfile for machine-wide settings in '/etc/dconf/db/local.d/`\
      \ with the following lines to set the login banner configuration:\r\n\r\n```\r\n[org/gnome/login-screen]\r\
      \nbanner-message-enable=true\r\nbanner-message-text='Type the banner message here.'\r\n```\r\n\r\
      \n_Example script:_\r\n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n   l_file=\"/etc/dconf/db/local.d/60-banner-message\"\
      \r\n   l_banner=\"'Authorized uses only. All activity may be monitored and reported'\"\r\n   a_keyfile=(\"\
      [org/gnome/login-screen]\" \"banner-message-enable=true\" \\\r\n   \"banner-message-text=$l_banner\"\
      )\r\n   if grep -Psq -- '^\\h*\\[org\\/gnome\\/login-screen\\]' \"$l_file\"; then\r\n      ! grep\
      \ -Psiq -- '^\\h*banner-message-enable=true\\b' \"$l_file\" && \\\r\n      sed -ri '/^\\s*\\[org\\\
      /gnome\\/login-screen\\]/a banner-message-enable=true' \"$l_file\"\r\n      ! grep -Psiq -- '^\\\
      h*banner-message-text=[^#\\n\\r]+' \"$l_file\" && \\\r\n      sed -ri '/^\\s*\\[org\\/gnome\\/login-screen\\\
      ]/a banner-message-text='\"$l_banner\"'' \"$l_file\"\r\n   else\r\n      printf '%s\\n' \"\" \"\
      ${a_keyfile[@]}\" >> \"$l_file\"\r\n   fi\r\n}\r\n```\r\n\r\n6. Run the following command to update\
      \ the dconf database:\r\n\r\n```\r\n# dconf update\r\n```\r\n\r\n**Note:** \r\n- `banner-message-text`\
      \ should be set in accordance with local site policy\r\n- Users must log out and back in again before\
      \ the system-wide settings take effect.\r\n- There is no character limit for the banner message.\
      \ gnome-shell autodetects longer stretches of text and enters two column mode.\r\n- The banner message\
      \ cannot be read from an external file"
    additional_information: "Additional options and sections may appear in the `/etc/dconf/db/gdm.d/01-banner-message`\
      \ file.\r\n\r\nIf a different GUI login service is in use, consult your documentation and apply\
      \ an equivalent banner."
    default_value: disabled
