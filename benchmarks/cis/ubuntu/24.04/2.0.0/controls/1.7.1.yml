control:
  id: CIS-1.7.1
  benchmark_id: cis-ubuntu-24.04
  title: Ensure GDM login banner is configured
  description: "GDM is the GNOME Display Manager which handles graphical login for GNOME based systems.\r\
    \n\r\nBy using the lockdown mode in dconf, you can prevent users from changing specific settings."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.1_7_1.audit
  remediation: cis.ubuntu.24.04.v2_0_0.1_7_1.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.1_7_1.rollback
  verification: cis.ubuntu.24.04.v2_0_0.1_7_1.verify
  rollback_capability: unsupported
  metadata:
