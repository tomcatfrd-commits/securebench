    parent: CIS _2_Time Synchronization Main | 2.1.2.2-Ensure systemd-timesyncd is enabled and running
    rationale: "systemd-timesyncd needs to be enabled and running in order to synchronize the system to\
      \ a timeserver.\r\n\r\nTime synchronization is important to support time sensitive security mechanisms\
      \ and to ensure log files have consistent time records across the enterprise to aid in forensic\
      \ investigations"
    impact: ''
    audit_guidance: "**- IF -** systemd-timesyncd is in use on the system, run the following commands:\r\
      \n\r\nRun the following command to verify that the `systemd-timesyncd` service is enabled:\r\n\r\
      \n```\r\n# systemctl is-enabled systemd-timesyncd.service\r\n\r\nenabled\r\n```\r\n\r\nRun the following\
      \ command to verify that the `systemd-timesyncd` service is active:\r\n\r\n```\r\n# systemctl is-active\
      \ systemd-timesyncd.service\r\n\r\nactive\r\n```"
    remediation_guidance: "**- IF -** `systemd-timesyncd` is in use on the system, run the following commands:\r\
      \n\r\nRun the following command to unmask `systemd-timesyncd.service`:\r\n\r\n```\r\n# systemctl\
      \ unmask systemd-timesyncd.service\r\n```\r\n\r\nRun the following command to enable and start `systemd-timesyncd.service`:\r\
      \n\r\n```\r\n# systemctl --now enable systemd-timesyncd.service\r\n```\r\n\r\n**- OR -** \r\n\r\n\
      If another time synchronization service is in use on the system, run the following command to stop\
      \ and mask `systemd-timesyncd`:\r\n\r\n```\r\n# systemctl --now mask systemd-timesyncd.service\r\
      \n```"
    additional_information: ''
