      - M1042
    parent: CIS _2_Configure Server Services Main | 2.1.7-Ensure dns server services are not in use
    rationale: Unless a system is specifically designated to act as a DNS server, it is recommended that
      the package be deleted to reduce the potential attack surface.
    impact: "There may be packages that are dependent on the `bind9` package.  If the `bind9` package\
      \ is removed, these dependent packages will be removed as well. Before removing the `bind9` package,\
      \ review any dependent packages to determine if they are required on the system.\r\n\r\n**- IF -**\
      \ a dependent package is required: stop and mask `named.service` leaving the `bind9` package installed."
    audit_guidance: "Run the following command to verify `bind9` is not installed:\r\n\r\n```\r\n# dpkg-query\
      \ -s bind9 &>/dev/null && echo \"bind9 is installed\"\r\n```\r\n\r\nNothing should be returned.\r\
      \n\r\n**- OR -** \r\n\r\n**- IF -** the package is required for dependencies:\r\n\r\nRun the following\
      \ command to verify `named.service` is not enabled:\r\n\r\n```\r\n# systemctl is-enabled named.service\
      \ 2>/dev/null | grep 'enabled'\r\n\r\nNothing should be returned\r\n```\r\n\r\nRun the following\
      \ command to verify the `named.service` is not active:\r\n\r\n```\r\n# systemctl is-active named.service\
      \ 2>/dev/null | grep '^active'\r\n\r\nNothing should be returned\r\n```\r\n\r\n**Note:** If the\
      \ package is required for a dependency\r\n - Ensure the dependent package is approved by local site\
      \ policy\r\n - Ensure stopping and masking the service and/or socket meets local site policy"
    remediation_guidance: "Run the following commands to stop `named.service` and remove the `bind9` package:\r\
      \n\r\n```\r\n# systemctl stop named.service\r\n# apt purge bind9\r\n```\r\n\r\n**- OR -**\r\n\r\n\
      **- IF -** the `bind9` package is required as a dependency:\r\n\r\nRun the following commands to\
      \ stop and mask `bind9.service`:\r\n\r\n```\r\n# systemctl stop named.service\r\n# systemctl mask\
      \ named.service\r\n```"
    additional_information: ''
    default_value: ''
    artifacts_count: 3
