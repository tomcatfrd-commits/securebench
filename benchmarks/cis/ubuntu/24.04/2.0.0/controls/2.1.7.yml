control:
  id: CIS-2.1.7
  benchmark_id: cis-ubuntu-24.04
  title: Ensure dns server services are not in use
  description: "The Domain Name System (DNS) is a hierarchical naming system that maps names to IP addresses\
    \ for computers, services and other resources connected to a network.\r\n\r\n**Note:** `bind9` is\
    \ the package and `bind.service` is the alias for `named.service`."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.2_1_7.audit
  remediation: cis.ubuntu.24.04.v2_0_0.2_1_7.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.2_1_7.rollback
  verification: cis.ubuntu.24.04.v2_0_0.2_1_7.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 2.1.7
      url: https://workbench.cisecurity.org/sections/4177245/recommendations/7047541
    assessment_status: automated
    profiles:
    - Level 1 - Server
    - Level 1 - Workstation
    mappings:
      nist:
      - CM-7
      cis_v8:
      - '4.8'
      cis_v7:
      - '9.2'
      mitre_techniques:
      - T1203
      - T1203.000
      - T1210
      - T1210.000
      - T1543
      - T1543.002
      mitre_tactics:
