control:
  id: CIS-6.2.3.10
  benchmark_id: cis-ubuntu-24.04
  title: Ensure use of privileged commands are collected
  description: Monitor privileged programs, those that have the `setuid` and/or `setgid` bit set on execution,
    to determine if unprivileged users are running these commands.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.6_2_3_10.audit
  remediation: cis.ubuntu.24.04.v2_0_0.6_2_3_10.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.6_2_3_10.rollback
  verification: cis.ubuntu.24.04.v2_0_0.6_2_3_10.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 6.2.3.10
      url: https://workbench.cisecurity.org/sections/4203192/recommendations/7091557
    assessment_status: automated
    profiles:
    - Level 2 - Server
    - Level 2 - Workstation
    mappings:
      nist:
      - AU-3
      - AU-3(1)
      cis_v8:
      - '8.5'
      cis_v7:
      - '6.2'
      mitre_techniques:
      - T1562
