      mitre_mitigations:
      - M1026
    parent: CIS _6_System Auditing Main | 2.2.3.10-Ensure use of privileged commands are collected
    rationale: Execution of privileged commands by non-privileged users could be an indication of someone
      trying to gain unauthorized access to the system.
    impact: "Both the audit and remediation section of this recommendation will traverse all mounted file\
      \ systems that is not mounted with either `noexec` or `nosuid` mount options. If there are large\
      \ file systems without these mount options, **such traversal will be significantly detrimental to\
      \ the performance of the system.**\r\n\r\nBefore running either the audit or remediation section,\
      \ inspect the output of the following command to determine exactly which file systems will be traversed:\r\
      \n\r\n```\r\n# findmnt -n -l -k -it $(awk '/nodev/ { print $2 }' /proc/filesystems | paste -sd,)\
      \ | grep -Pv \"noexec|nosuid\"\r\n```\r\n\r\nTo exclude a particular file system due to adverse\
      \ performance impacts, update the audit and remediation sections by adding a sufficiently unique\
      \ string to the `grep` statement. The above command can be used to test the modified exclusions."
    audit_guidance: "**On disk configuration**\r\n\r\nRun the following script to check on disk rules:\r\
      \n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n   for PARTITION in $(findmnt -n -l -k -it $(awk '/nodev/\
      \ { print $2 }' /proc/filesystems | paste -sd,) | grep -Pv \"noexec|nosuid\" | awk '{print $1}');\
      \ do\r\n      for PRIVILEGED in $(find \"${PARTITION}\" -xdev -perm /6000 -type f); do\r\n     \
      \    grep -qr \"${PRIVILEGED}\" /etc/audit/rules.d && printf \"OK: '${PRIVILEGED}' found in auditing\
      \ rules.\\n\" || printf \"Warning: '${PRIVILEGED}' not found in on disk configuration.\\n\"\r\n\
      \      done\r\n   done\r\n}\r\n```\r\n\r\nVerify that all output is `OK`.\r\n\r\n**Running configuration**\r\
      \n\r\nRun the following script to check loaded rules:\r\n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n\
      {\r\n   RUNNING=$(auditctl -l)\r\n   [ -n \"${RUNNING}\" ] && for PARTITION in $(findmnt -n -l -k\
      \ -it $(awk '/nodev/ { print $2 }' /proc/filesystems | paste -sd,) | grep -Pv \"noexec|nosuid\"\
      \ | awk '{print $1}'); do\r\n      for PRIVILEGED in $(find \"${PARTITION}\" -xdev -perm /6000 -type\
      \ f); do\r\n         printf -- \"${RUNNING}\" | grep -q \"${PRIVILEGED}\" && printf \"OK: '${PRIVILEGED}'\
      \ found in auditing rules.\\n\" || printf \"Warning: '${PRIVILEGED}' not found in running configuration.\\\
      n\"\r\n      done\r\n   done \\\r\n   || printf \"ERROR: Variable 'RUNNING' is unset.\\n\"\r\n}\r\
      \n```\r\n\r\nVerify that all output is `OK`.\r\n\r\n**Special mount points**\r\n\r\nIf there are\
      \ any special mount points that are not visible by default from `findmnt` as per the above audit,\
      \ said file systems would have to be manually audited."
    remediation_guidance: "Edit or create a file in the `/etc/audit/rules.d/` directory, ending in `.rules`\
      \ extension, with the relevant rules to monitor the use of privileged commands.\r\n\r\n_Example\
      \ script:_\r\n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n  UID_MIN=$(awk '/^\\s*UID_MIN/{print $2}'\
      \ /etc/login.defs)\r\n  AUDIT_RULE_FILE=\"/etc/audit/rules.d/50-privileged.rules\"\r\n  NEW_DATA=()\r\
      \n  for PARTITION in $(findmnt -n -l -k -it $(awk '/nodev/ { print $2 }' /proc/filesystems | paste\
      \ -sd,) | grep -Pv \"noexec|nosuid\" | awk '{print $1}'); do\r\n    readarray -t DATA < <(find \"\
      ${PARTITION}\" -xdev -perm /6000 -type f | awk -v UID_MIN=${UID_MIN} '{print \"-a always,exit -F\
      \ path=\" $1 \" -F perm=x -F auid>=\"UID_MIN\" -F auid!=unset -k privileged\" }')\r\n      for ENTRY\
      \ in \"${DATA[@]}\"; do\r\n        NEW_DATA+=(\"${ENTRY}\")\r\n      done\r\n  done\r\n  readarray\
      \ &> /dev/null -t OLD_DATA < \"${AUDIT_RULE_FILE}\"\r\n  COMBINED_DATA=( \"${OLD_DATA[@]}\" \"${NEW_DATA[@]}\"\
      \ )\r\n  printf '%s\\n' \"${COMBINED_DATA[@]}\" | sort -u > \"${AUDIT_RULE_FILE}\"\r\n}\r\n```\r\
      \n\r\nMerge and load the rules into active configuration:\r\n\r\n```\r\n# augenrules --load\r\n\
      ```\r\n\r\nCheck if reboot is required.\r\n\r\n```\r\n# if [[ $(auditctl -s | grep \"enabled\")\
      \ =~ \"2\" ]]; then printf \"Reboot required to load rules\\n\"; fi\r\n```\r\n\r\n**Special mount\
      \ points**\r\n\r\nIf there are any special mount points that are not visible by default from just\
      \ scanning `/`, change the `PARTITION` variable to the appropriate partition and re-run the remediation."
