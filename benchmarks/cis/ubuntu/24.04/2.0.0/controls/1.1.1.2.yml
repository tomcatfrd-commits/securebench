  benchmark_id: cis-ubuntu-24.04
  title: Ensure freevxfs kernel module is not available
  description: The `freevxfs` filesystem type is a free version of the Veritas type filesystem. This is
    the primary filesystem type for HP-UX operating systems.
  platform: ubuntu-24.04
  severity: unspecified
