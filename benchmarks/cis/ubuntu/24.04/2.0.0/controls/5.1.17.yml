control:
  id: CIS-5.1.17
  benchmark_id: cis-ubuntu-24.04
  title: Ensure sshd MaxStartups is configured
  description: "The `MaxStartups` parameter specifies the maximum number of concurrent unauthenticated\
    \ connections to the SSH daemon.\r\n\r\nMore information about the openSSH server configuration is\
    \ available in the \"Configure SSH Server\" section overview."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_1_17.audit
  remediation: cis.ubuntu.24.04.v2_0_0.5_1_17.remediate
