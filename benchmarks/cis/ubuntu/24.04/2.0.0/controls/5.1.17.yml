    parent: CIS _5_Configure SSH Server Main | 2.2.18-Ensure sshd MaxStartups is configured
    rationale: To protect a system from denial of service due to a large number of pending authentication
      connection attempts, use the rate limiting function of MaxStartups to protect availability of sshd
      logins and prevent overwhelming the daemon.
    impact: ''
    audit_guidance: "Run the following command to verify `MaxStartups` is `10:30:60` or more restrictive:\r\
      \n\r\n```\r\n# sshd -T | awk '$1 ~ /^\\s*maxstartups/{split($2, a, \":\");{if(a[1] > 10 || a[2]\
      \ > 30 || a[3] > 60) print $0}}'\r\n```\r\n\r\nNothing should be returned"
    remediation_guidance: "Create or edit a `*.conf` file in the `/etc/ssh/sshd_config.d/` and set the\
      \ `MaxStartups` parameter to `10:30:60` or more restrictive above any `Include` entries as follows:\r\
      \n\r\n```\r\nMaxStartups 10:30:60\r\n```"
    additional_information: ''
    default_value: MaxStartups 10:30:100
    artifacts_count: 2
    requirements: {}
    safety:
      default: investigate
      implementation_status: guidance_only
