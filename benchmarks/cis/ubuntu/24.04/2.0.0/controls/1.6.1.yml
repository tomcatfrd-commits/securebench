control:
  id: CIS-1.6.1
  benchmark_id: cis-ubuntu-24.04
  title: Ensure /etc/motd is configured
  description: "The contents of the `MOTD` file are displayed to users after login and function as a message\
    \ of the day for authenticated users.\r\n\r\nUnix-based systems have typically displayed information\
    \ about the OS release and patch level upon logging in to the system. This information can be useful\
    \ to developers who are developing software for a particular OS platform. If `mingetty(8)` supports\
    \ the following options, they display operating system information: `\\m`  - machine architecture\
    \ `\\r`  - operating system release `\\s`  - operating system name `\\v`  - operating system version"
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.1_6_1.audit
  remediation: cis.ubuntu.24.04.v2_0_0.1_6_1.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.1_6_1.rollback
  verification: cis.ubuntu.24.04.v2_0_0.1_6_1.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 1.6.1
      url: https://workbench.cisecurity.org/sections/4177288/recommendations/7047726
    assessment_status: automated
    profiles:
    - Level 1 - Server
    - Level 1 - Workstation
    mappings:
      nist:
      - CM-1
      - CM-3
      - CM-6
      cis_v8:
      - '0'
      cis_v7:
