      mitre_mitigations: []
    parent: CIS _1_Configure Command Line Warning Banners Main | 1.2.1-Ensure /etc/motd is configured
    rationale: Warning messages inform users who are attempting to login to the system of their legal
      status regarding the system and must include the name of the organization that owns the system and
      any monitoring policies that are in place. Displaying OS and patch level information in login banners
      also has the side effect of providing detailed system information to attackers attempting to target
      specific exploits of a system. Authorized users can easily get this information by running the "
      `uname -a` " command once they have logged in.
    impact: ''
    audit_guidance: "Run the following command to verify `MOTD` files do not contain system information:\r\
      \n \r\n```\r\n#  grep -Psi -- \"(\\\\\\v|\\\\\\r|\\\\\\m|\\\\\\s|\\b$(grep ^ID= /etc/os-release\
      \ | cut -d= -f2 | sed -e 's/\"//g')\\b)\" /etc/motd /run/motd /usr/lib/motd /etc/motd.d/* /run/motd.d/*\
      \ /usr/lib/motd.d/* /etc/update-motd.d/*\r\n```\r\n\r\nNothing should be returned"
    remediation_guidance: "Edit the `MOTD` file with the appropriate contents according to your site policy,\
      \ remove any instances of `\\m` , `\\r` , `\\s` , `\\v` or references to the `OS platform`\r\n\r\
      \n**- OR -**\r\n\r\n**- IF -** the `MOTD` file is not used, this file can be removed.\r\n\r\nRun\
      \ the following command to remove the `motd` file:\r\n\r\n```\r\n# rm ```\r\n\r\n_Example_\r\n\r\
      \n```\r\n# rm /usr/lib/motd.d/welcome\r\n```"
    additional_information: ''
    default_value: ''
    artifacts_count: 1
    requirements: {}
    safety:
