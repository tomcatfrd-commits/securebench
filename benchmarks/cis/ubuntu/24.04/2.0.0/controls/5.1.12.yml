control:
  id: CIS-5.1.12
  benchmark_id: cis-ubuntu-24.04
  title: Ensure sshd KexAlgorithms is configured
  description: "Key exchange is any method in cryptography by which cryptographic keys are exchanged between\
    \ two parties, allowing use of a cryptographic algorithm. If the sender and receiver wish to exchange\
    \ encrypted messages, each must be equipped to encrypt messages to be sent and decrypt messages received\r\
    \n\r\nMore information about the openSSH server configuration is available in the \"Configure SSH\
    \ Server\" section overview."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_1_12.audit
