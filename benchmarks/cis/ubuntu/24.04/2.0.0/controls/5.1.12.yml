    parent: CIS _5_Configure SSH Server Main | 2.2.13-Ensure sshd KexAlgorithms is configured
    rationale: Key exchange methods that are considered weak should be removed. A key exchange method
      may be weak because too few bits are used, or the hashing algorithm is considered too weak.  Using
      weak algorithms could expose connections to man-in-the-middle attacks
    impact: ''
    audit_guidance: "Run the following command to verify none of the \"weak\" Key Exchange algorithms\
      \ are being used:\r\n\r\n```\r\n# sshd -T | grep -Pi -- 'kexalgorithms\\h+([^#\\n\\r]+,)?(diffie-hellman-group1-sha1|diffie-hellman-group14-sha1|diffie-hellman-group-exchange-sha1)\\\
      b'\r\n```\r\n\r\nNothing should be returned.\r\n\r\n>**Note:** If anything is returned, review the\
      \ list of Key Exchange Algorithms. The following are considered \"weak\" Key Exchange Algorithms,\
      \ and should not be used:\r\n\r\n```\r\ndiffie-hellman-group1-sha1\r\ndiffie-hellman-group14-sha1\r\
      \ndiffie-hellman-group-exchange-sha1\r\n```"
    remediation_guidance: "Create or edit a `*.conf` file in the `/etc/ssh/sshd_config.d/` and add/modify\
      \ the `KexAlgorithms` line to contain a comma separated list of the site unapproved (weak) KexAlgorithms\
      \ preceded with a `-` above any `Include` entries:\r\n\r\n_Example:_\r\n\r\n```\r\nKexAlgorithms\
      \ -diffie-hellman-group1-sha1,diffie-hellman-group14-sha1,diffie-hellman-group-exchange-sha1\r\n\
      ```\r\n\r\n>**Note:** First occurrence of an option takes precedence. If Include locations are enabled,\
      \ used, and order of precedence is understood in your environment, the entry may be created in a\
      \ file in Include location."
    additional_information: "The supported algorithms are:\r\n\r\n```\r\ndiffie-hellman-group1-sha1\r\n\
      diffie-hellman-group14-sha1\r\ndiffie-hellman-group14-sha256\r\ndiffie-hellman-group16-sha512\r\n\
      diffie-hellman-group18-sha512\r\ndiffie-hellman-group-exchange-sha1\r\ndiffie-hellman-group-exchange-sha256\r\
      \necdh-sha2-nistp256\r\necdh-sha2-nistp384\r\necdh-sha2-nistp521\r\ncurve25519-sha256\r\ncurve25519-sha256@libssh.org\r\
      \nsntrup761x25519-sha512\r\nsntrup761x25519-sha512@openssh.com\r\nmlkem768x25519-sha256 # Only supported\
      \ by version 9.9 and greater\r\n```"
    default_value: "Version 9.0 - 9.8: KexAlgorithms sntrup761x25519-sha512,sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org,ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521\r\
      \n\r\nVersion 9.9 and greater: KexAlgorithms mlkem768x25519-sha256,sntrup761x25519-sha512,sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org,ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521"
