control:
  id: CIS-6.2.3.23
  benchmark_id: cis-ubuntu-24.04
  title: Ensure events that modify the system's Mandatory Access Controls are collected
  description: "Monitor AppArmor, an implementation of mandatory access controls. The parameters below\
    \ monitor any write access (potential additional, deletion or modification of files in the directory)\
    \ or attribute changes to the `/etc/apparmor/` and `/etc/apparmor.d/` directories.\r\n\r\n**Note:**\
    \ If a different Mandatory Access Control method is used, changes to the corresponding directories\
    \ should be audited."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.6_2_3_23.audit
  remediation: cis.ubuntu.24.04.v2_0_0.6_2_3_23.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.6_2_3_23.rollback
  verification: cis.ubuntu.24.04.v2_0_0.6_2_3_23.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 6.2.3.23
      url: https://workbench.cisecurity.org/sections/4203192/recommendations/7091570
    assessment_status: automated
    profiles:
    - Level 2 - Server
    - Level 2 - Workstation
    mappings:
      nist:
      - AU-3
      - CM-6
      cis_v8:
      - '8.5'
      cis_v7:
      - '5.5'
      mitre_techniques:
      - T1562
      - T1562.006
      mitre_tactics:
      - TA0004
      mitre_mitigations:
      - M1022
    parent: CIS _6_System Auditing Main | 2.2.3.23-Ensure events that modify the system's Mandatory Access
      Controls are collected
    rationale: Changes to files in the `/etc/apparmor/` and `/etc/apparmor.d/` directories could indicate
      that an unauthorized user is attempting to modify access controls and change security contexts,
      leading to a compromise of the system.
    impact: ''
    audit_guidance: "1. Run the following command to verify a rule exists in the running configuration:\r\
      \n```\r\n# auditctl -l | grep -Ps -- 'apparmor'\r\n```\r\n\r\nVerify the output matches:\r\n\r\n\
      ```\r\n-w /etc/apparmor/ -p wa -k MAC-policy\r\n-w /etc/apparmor.d/ -p wa -k MAC-policy\r\n```\r\
      \n\r\n2. Run the following command to verify a rule exists in a rules file:\r\n\r\n```\r\n# grep\
      \ -Ps -- 'apparmor' /etc/audit/rules.d/*.rules\r\n```\r\n\r\n_Example output_:\r\n\r\n```\r\n/etc/audit/rules.d/50-MAC-policy.rules:-w\
      \ /etc/apparmor/ -p wa -k MAC-policy\r\n/etc/audit/rules.d/50-MAC-policy.rules:-w /etc/apparmor.d/\
      \ -p wa -k MAC-policy\r\n```"
    remediation_guidance: "1. Edit or create a file in the `/etc/audit/rules.d/` directory, ending in\
      \ `.rules` extension, with the relevant rules to monitor events that modify the system's Mandatory\
      \ Access Controls.\r\n\r\n_Example:_\r\n\r\n```\r\n# printf \"\r\n-w /etc/apparmor/ -p wa -k MAC-policy\r\
      \n-w /etc/apparmor.d/ -p wa -k MAC-policy\r\n\" >> /etc/audit/rules.d/50-MAC-policy.rules\r\n```\r\
      \n\r\n2. Merge and load the rules into active configuration:\r\n\r\n```\r\n# augenrules --load\r\
      \n```\r\n\r\n3. Check if reboot is required:\r\n\r\n```\r\n# if [[ $(auditctl -s | grep \"enabled\"\
      ) =~ \"2\" ]]; then printf \"Reboot required to load rules\\n\"; fi\r\n```"
    additional_information: ''
    default_value: ''
    artifacts_count: 4
    requirements: {}
    safety:
      default: investigate
      implementation_status: guidance_only
      reason: Imported CIS guidance has not yet been promoted to a reviewed SecureBench implementation.
  dependencies: []
  conflicts: []
