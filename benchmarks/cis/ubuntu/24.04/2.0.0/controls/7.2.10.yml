control:
  id: CIS-7.2.10
  benchmark_id: cis-ubuntu-24.04
  title: Ensure local interactive user dot files access is configured
  description: "While the system administrator can establish secure permissions for users' \"dot\" files,\
    \ the users can easily override these.\r\n- `.forward` file specifies an email address to forward\
    \ the user's mail to.\r\n- `.rhost` file provides the \"remote authentication\" database for the rcp,\
    \ rlogin, and rsh commands and the rcmd() function. These files bypass the standard password-based\
    \ user authentication mechanism. They specify remote hosts and users that are considered trusted (i.e.\
    \ are allowed to access the local system without supplying a password)\r\n- `.netrc` file contains\
    \ data for logging into a remote host or passing authentication to an API.\r\n- `.bash_history` file\
    \ keeps track of the user’s commands."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.7_2_10.audit
  remediation: cis.ubuntu.24.04.v2_0_0.7_2_10.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.7_2_10.rollback
  verification: cis.ubuntu.24.04.v2_0_0.7_2_10.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 7.2.10
      url: https://workbench.cisecurity.org/sections/4177259/recommendations/7047632
    assessment_status: automated
    profiles:
    - Level 1 - Server
    - Level 1 - Workstation
    mappings:
      nist:
      - CM-1
      - CM-2
      - CM-6
