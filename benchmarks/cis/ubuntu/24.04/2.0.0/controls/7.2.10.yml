      - IA-5
      cis_v8:
      - '3.3'
      cis_v7:
      - '14.6'
      mitre_techniques:
      - T1222
      - T1222.001
      - T1222.002
      - T1552
      - T1552.003
      - T1552.004
      mitre_tactics:
      - TA0005
      mitre_mitigations:
      - M1022
    parent: CIS _7_Local User and Group Settings Main | 2.1.9-Ensure local interactive user dot files
      access is configured
    rationale: User configuration files with excessive or incorrect access may enable malicious users
      to steal or modify other users' data or to gain another user's system privileges.
    impact: ''
    audit_guidance: "Run the following script to verify local interactive user dot files:\r\n- Don't include\
      \ `.forward`, `.rhost`, or `.netrc` files\r\n- Are mode 0644 or more restrictive\r\n- Are owned\
      \ by the local interactive user\r\n- Are group owned by the user's primary group\r\n- `.bash_history`\
      \ is mode 0600 or more restrictive\r\n\r\n**Note:** If a `.netrc` file is required, and follows\
      \ local site policy, it should be mode `0600` or more restrictive.\r\n\r\n```\r\n#!/usr/bin/env\
      \ bash\r\n\r\n{\r\n   a_output2=(); a_output3=()\r\n   l_maxsize=\"1000\" # Maximum number of local\
      \ interactive users before warning (Default 1,000)\r\n   l_valid_shells=\"^($( awk -F\\/ '$NF !=\
      \ \"nologin\" {print}' /etc/shells | sed -rn '/^\\//{s,/,\\\\\\\\/,g;p}' | paste -s -d '|' - ))$\"\
      \r\n   a_user_and_home=() # Create array with local users and their home directories\r\n   while\
      \ read -r l_local_user l_local_user_home; do # Populate array with users and user home location\r\
      \n      [[ -n \"$l_local_user\" && -n \"$l_local_user_home\" ]] && a_user_and_home+=(\"$l_local_user:$l_local_user_home\"\
      )\r\n   done <<< \"$(awk -v pat=\"$l_valid_shells\" -F: '$(NF) ~ pat { print $1 \" \" $(NF-1) }'\
      \ /etc/passwd)\"\r\n   l_asize=\"${#a_user_and_home[@]}\" # Here if we want to look at number of\
      \ users before proceeding \r\n   [ \"${#a_user_and_home[@]}\" -gt \"$l_maxsize\" ] && printf '%s\\\
      n' \"\" \"  ** INFO **\" \\\r\n   \"  - \\\"$l_asize\\\" Local interactive users found on the system\"\
      \ \\\r\n   \"  - This may be a long running check\" \"\"\r\n   file_access_chk()\r\n   {\r\n   \
      \   a_access_out=()\r\n      l_max=\"$( printf '%o' $(( 0777 & ~$l_mask)) )\"\r\n      if [ $((\
      \ $l_mode & $l_mask )) -gt 0 ]; then\r\n         a_access_out+=(\"  - File: \\\"$l_hdfile\\\" is\
      \ mode: \\\"$l_mode\\\" and should be mode: \\\"$l_max\\\" or more restrictive\")\r\n      fi\r\n\
      \      if [[ ! \"$l_owner\" =~ ($l_user) ]]; then\r\n         a_access_out+=(\"  - File: \\\"$l_hdfile\\\
      \" owned by: \\\"$l_owner\\\" and should be owned by \\\"${l_user//|/ or }\\\"\")\r\n      fi\r\n\
      \      if [[ ! \"$l_gowner\" =~ ($l_group) ]]; then\r\n         a_access_out+=(\"  - File: \\\"\
      $l_hdfile\\\" group owned by: \\\"$l_gowner\\\" and should be group owned by \\\"${l_group//|/ or\
      \ }\\\"\")\r\n      fi\r\n   }\r\n   while IFS=: read -r l_user l_home; do\r\n      a_dot_file=();\
      \ a_netrc=(); a_netrc_warn=(); a_bhout=(); a_hdirout=()\r\n      if [ -d \"$l_home\" ]; then\r\n\
      \         l_group=\"$(id -gn \"$l_user\" | xargs)\";l_group=\"${l_group// /|}\"\r\n         while\
      \ IFS= read -r -d $'\\0' l_hdfile; do\r\n            while read -r l_mode l_owner l_gowner; do\r\
      \n               case \"$(basename \"$l_hdfile\")\" in\r\n                  .forward | .rhost )\r\
      \n                     a_dot_file+=(\"  - File: \\\"$l_hdfile\\\" exists\") ;;\r\n             \
      \     .netrc )\r\n                     l_mask='0177'; file_access_chk\r\n                     if\
      \ [ \"${#a_access_out[@]}\" -gt 0 ]; then\r\n                        a_netrc+=(\"${a_access_out[@]}\"\
      )\r\n                     else\r\n                        a_netrc_warn+=(\"   - File: \\\"$l_hdfile\\\
      \" exists\")\r\n                     fi ;;\r\n                  .bash_history )\r\n            \
      \         l_mask='0177'; file_access_chk\r\n                     [ \"${#a_access_out[@]}\" -gt 0\
      \ ] && a_bhout+=(\"${a_access_out[@]}\") ;;\r\n                  * )\r\n                     l_mask='0133';\
      \ file_access_chk\r\n                     [ \"${#a_access_out[@]}\" -gt 0 ] && a_hdirout+=(\"${a_access_out[@]}\"\
      ) ;;\r\n               esac\r\n            done < <(stat -Lc '%#a %U %G' \"$l_hdfile\")\r\n    \
      \     done < <(find \"$l_home\" -xdev -type f -name '.*' -print0)\r\n      fi\r\n      if [[ \"\
      ${#a_dot_file[@]}\" -gt 0 || \"${#a_netrc[@]}\" -gt 0 || \"${#a_bhout[@]}\" -gt 0 || \"${#a_hdirout[@]}\"\
      \ -gt 0 ]]; then\r\n         a_output2+=(\" - User: \\\"$l_user\\\" Home Directory: \\\"$l_home\\\
      \"\" \"${a_dot_file[@]}\" \"${a_netrc[@]}\" \"${a_bhout[@]}\" \"${a_hdirout[@]}\")\r\n      fi\r\
      \n      [ \"${#a_netrc_warn[@]}\" -gt 0 ] && a_output3+=(\" - User: \\\"$l_user\\\" Home Directory:\
      \ \\\"$l_home\\\"\" \"${a_netrc_warn[@]}\")\r\n   done <<< \"$(printf '%s\\n' \"${a_user_and_home[@]}\"\
      )\"\r\n   if [ \"${#a_output2[@]}\" -le 0 ]; then # If l_output2 is empty, we pass\r\n      [ \"\
      ${#a_output3[@]}\" -gt 0 ] && printf '%s\\n' \"  ** WARNING **\" \"${a_output3[@]}\"\r\n      printf\
      \ '%s\\n' \"- Audit Result:\" \"  ** PASS **\"\r\n   else\r\n      printf '%s\\n' \"- Audit Result:\"\
      \ \"  ** FAIL **\" \" - * Reasons for audit failure * :\" \"${a_output2[@]}\" \"\"\r\n      [ \"\
      ${#a_output3[@]}\" -gt 0 ] && printf '%s\\n' \"  ** WARNING **\" \"${a_output3[@]}\"\r\n   fi\r\n\
      }\r\n```"
    remediation_guidance: "Making global modifications to users' files without alerting the user community\
      \ can result in unexpected outages and unhappy users. Therefore, it is recommended that a monitoring\
      \ policy be established to report user dot file permissions and determine the action to be taken\
      \ in accordance with site policy.\r\n\r\nThe following script will:\r\n- remove excessive permissions\
      \ on `dot` files within interactive users' home directories\r\n- change ownership of `dot` files\
      \ within interactive users' home directories to the user\r\n- change group ownership of `dot` files\
      \ within interactive users' home directories to the user's primary group\r\n- list `.forward` and\
      \ `.rhost` files to be investigated and manually deleted\r\n\r\n```\r\n#!/usr/bin/env bash\r\n\r\
      \n{\r\n   a_output2=(); a_output3=()\r\n   l_maxsize=\"1000\" # Maximum number of local interactive\
      \ users before warning (Default 1,000)\r\n   l_valid_shells=\"^($( awk -F\\/ '$NF != \"nologin\"\
      \ {print}' /etc/shells | sed -rn '/^\\//{s,/,\\\\\\\\/,g;p}' | paste -s -d '|' - ))$\"\r\n   a_user_and_home=()\
      \ # Create array with local users and their home directories\r\n   while read -r l_local_user l_local_user_home;\
      \ do # Populate array with users and user home location\r\n      [[ -n \"$l_local_user\" && -n \"\
      $l_local_user_home\" ]] && a_user_and_home+=(\"$l_local_user:$l_local_user_home\")\r\n   done <<<\
      \ \"$(awk -v pat=\"$l_valid_shells\" -F: '$(NF) ~ pat { print $1 \" \" $(NF-1) }' /etc/passwd)\"\
      \r\n   l_asize=\"${#a_user_and_home[@]}\" # Here if we want to look at number of users before proceeding\
      \ \r\n   [ \"${#a_user_and_home[@]}\" -gt \"$l_maxsize\" ] && printf '%s\\n' \"\" \"  ** INFO **\"\
      \ \\\r\n   \"  - \\\"$l_asize\\\" Local interactive users found on the system\" \\\r\n   \"  - This\
      \ may be a long running check\" \"\"\r\n   file_access_fix()\r\n   {\r\n      a_access_out=()\r\n\
      \      l_max=\"$( printf '%o' $(( 0777 & ~$l_mask)) )\"\r\n      if [ $(( $l_mode & $l_mask )) -gt\
      \ 0 ]; then\r\n         printf '%s\\n' \"\" \"  - File: \\\"$l_hdfile\\\" is mode: \\\"$l_mode\\\
      \" and should be mode: \\\"$l_max\\\" or more restrictive\" \\\r\n         \"     Updating file:\
      \ \\\"$l_hdfile\\\" to be mode: \\\"$l_max\\\" or more restrictive\"\r\n         chmod \"$l_change\"\
      \ \"$l_hdfile\"\r\n      fi\r\n      if [[ ! \"$l_owner\" =~ ($l_user) ]]; then\r\n         printf\
      \ '%s\\n' \"\" \"  - File: \\\"$l_hdfile\\\" owned by: \\\"$l_owner\\\" and should be owned by \\\
      \"${l_user//|/ or }\\\"\" \\\r\n         \"     Updating file: \\\"$l_hdfile\\\" to be owned by\
      \ \\\"${l_user//|/ or }\\\"\"\r\n         chown \"$l_user\" \"$l_hdfile\"\r\n      fi\r\n      if\
      \ [[ ! \"$l_gowner\" =~ ($l_group) ]]; then\r\n         printf '%s\\n' \"\" \"  - File: \\\"$l_hdfile\\\
      \" group owned by: \\\"$l_gowner\\\" and should be group owned by \\\"${l_group//|/ or }\\\"\" \\\
      \r\n         \"     Updating file: \\\"$l_hdfile\\\" to be group owned by \\\"${l_group//|/ or }\\\
      \"\"\r\n         chgrp \"$l_group\" \"$l_hdfile\"\r\n      fi\r\n   }\r\n   while IFS=: read -r\
      \ l_user l_home; do\r\n      a_dot_file=(); a_netrc=(); a_netrc_warn=(); a_bhout=(); a_hdirout=()\r\
      \n      if [ -d \"$l_home\" ]; then\r\n         l_group=\"$(id -gn \"$l_user\" | xargs)\";l_group=\"\
      ${l_group// /|}\"\r\n         while IFS= read -r -d $'\\0' l_hdfile; do\r\n            while read\
      \ -r l_mode l_owner l_gowner; do\r\n               case \"$(basename \"$l_hdfile\")\" in\r\n   \
      \               .forward | .rhost )\r\n                     a_dot_file+=(\"  - File: \\\"$l_hdfile\\\
      \" exists\" \"    Please review and manually delete this file\") ;;\r\n                  .netrc\
      \ )\r\n                     l_mask='0177'; l_change=\"u-x,go-rwx\"; file_access_fix\r\n        \
      \             a_netrc_warn+=(\"   - File: \\\"$l_hdfile\\\" exists\") ;;\r\n                  .bash_history\
      \ )\r\n                     l_mask='0177'; l_change=\"u-x,go-rwx\"; file_access_fix ;;\r\n     \
      \             * )\r\n                     l_mask='0133'; l_change=\"u-x,go-wx\"; file_access_fix\
      \ ;;\r\n               esac\r\n            done < <(stat -Lc '%#a %U %G' \"$l_hdfile\")\r\n    \
      \     done < <(find \"$l_home\" -xdev -type f -name '.*' -print0)\r\n      fi\r\n      [ \"${#a_dot_file[@]}\"\
      \ -gt 0 ] && a_output2+=(\" - User: \\\"$l_user\\\" Home Directory: \\\"$l_home\\\"\" \"${a_dot_file[@]}\"\
      )\r\n      [ \"${#a_netrc_warn[@]}\" -gt 0 ] && a_output3+=(\" - User: \\\"$l_user\\\" Home Directory:\
      \ \\\"$l_home\\\"\" \"${a_netrc_warn[@]}\")\r\n   done <<< \"$(printf '%s\\n' \"${a_user_and_home[@]}\"\
      )\"\r\n   [ \"${#a_output3[@]}\" -gt 0 ] && printf '%s\\n' \"\" \"  ** WARNING **\" \"${a_output3[@]}\"\
      \ \"\"\r\n   [ \"${#a_output2[@]}\" -gt 0 ] && printf '%s\\n' \"\" \"${a_output2[@]}\"\r\n}\r\n\
      ```"
