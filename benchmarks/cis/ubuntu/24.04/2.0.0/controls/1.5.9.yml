control:
  id: CIS-1.5.9
  benchmark_id: cis-ubuntu-24.04
  title: Ensure kernel.randomize_va_space is configured
  description: "Address space layout randomization (ASLR) is an exploit mitigation technique which randomly\
    \ arranges the address space of key data areas of a process.\r\n\r\nMore information about the kernel\
    \ parameter configuration files, their location, and load preference is available in the section overview."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.1_5_9.audit
  remediation: cis.ubuntu.24.04.v2_0_0.1_5_9.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.1_5_9.rollback
  verification: cis.ubuntu.24.04.v2_0_0.1_5_9.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 1.5.9
      url: https://workbench.cisecurity.org/sections/4177281/recommendations/7047713
    assessment_status: automated
    profiles:
    - Level 1 - Server
    - Level 1 - Workstation
    mappings:
      nist:
      - SI-16
      cis_v8:
      - '10.5'
      cis_v7:
      - '8.3'
      mitre_techniques:
      - T1068
      - T1068.000
      mitre_tactics:
      - TA0002
