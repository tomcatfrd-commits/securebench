control:
  id: CIS-5.4.1.3
  benchmark_id: cis-ubuntu-24.04
  title: Ensure password expiration warning days is configured
  description: "The `PASS_WARN_AGE` parameter in `/etc/login.defs`  allows an administrator to notify\
    \ users that their password will expire in a defined number of days.\r\n\r\n`PASS_WARN_AGE` _ _ -\
    \ The number of days warning given before a password expires. A zero means warning is given only upon\
    \ the day of expiration, a negative value means no warning is given. If not specified, no warning\
    \ will be provided."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_4_1_3.audit
  remediation: cis.ubuntu.24.04.v2_0_0.5_4_1_3.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.5_4_1_3.rollback
  verification: cis.ubuntu.24.04.v2_0_0.5_4_1_3.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 5.4.1.3
      url: https://workbench.cisecurity.org/sections/4177295/recommendations/7047786
    assessment_status: automated
    profiles:
    - Level 1 - Server
    - Level 1 - Workstation
    mappings:
      nist: []
      cis_v8:
      - '5.2'
      cis_v7:
      - '4.4'
      mitre_techniques:
      - T1078
      mitre_tactics:
      - TA0006
      mitre_mitigations:
      - M1027
    parent: CIS _5_Configure shadow password suite parameters Main | 1.1.1.3-Ensure password expiration
      warning days is configured
    rationale: Providing an advance warning that a password will be expiring gives users time to think
      of a secure password. Users caught unaware may choose a simple password or write it down where it
      may be discovered.
    impact: ''
    audit_guidance: "Run the following command and verify `PASS_WARN_AGE` is `7` or more and follows local\
      \ site policy:\r\n\r\n```\r\n# grep -Pi -- '^\\h*PASS_WARN_AGE\\h+\\d+\\b' /etc/login.defs\r\n```\r\
      \n\r\n_Example output:_\r\n\r\n```\r\nPASS_WARN_AGE 7\r\n```\r\n\r\nRun the following command to\
      \ verify all passwords have a `PASS_WARN_AGE` of `7` or more:\r\n\r\n```\r\n# awk -F: '($2~/^\\\
      $.+\\$/) {if($6 < 7)print \"User: \" $1 \" PASS_WARN_AGE: \" $6}' /etc/shadow\r\n```\r\n\r\nNothing\
      \ should be returned"
    remediation_guidance: "Edit `/etc/login.defs` and set `PASS_WARN_AGE` to a value of `7` or more that\
      \ follows local site policy:\r\n\r\n_Example:_\r\n\r\n```\r\nPASS_WARN_AGE 7\r\n```\r\n\r\nRun the\
      \ following command to modify user parameters for all users with a password set to a minimum warning\
      \ to `7` or more days that follows local site policy:\r\n\r\n```\r\n# chage --warndays ```\r\n\r\
      \n_Example:_\r\n\r\n```\r\n# awk -F: '($2~/^\\$.+\\$/) {if($6 < 7)system (\"chage --warndays 7 \"\
      \ $1)}' /etc/shadow\r\n```"
    additional_information: ''
    default_value: PASS_WARN_AGE   7
    artifacts_count: 2
    requirements: {}
    safety:
      default: investigate
      implementation_status: guidance_only
      reason: Imported CIS guidance has not yet been promoted to a reviewed SecureBench implementation.
  dependencies: []
  conflicts: []
