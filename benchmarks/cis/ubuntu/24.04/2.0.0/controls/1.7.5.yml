    parent: CIS _1_Configure GNOME Display Manager Main | 1.1.5-Ensure GDM autorun-never is configured
    rationale: "Malware on removable media may take advantage of Autorun features when the media is inserted\
      \ into a system and execute.\r\n\r\nWithout locking down the system settings, user settings take\
      \ precedence over the system settings.\r\n\r\nSatisfies: SRG-OS-000114-GPOS-00059, SRG-OS-000378-GPOS-00163,\
      \ SRG-OS-000480-GPOS-00227"
    impact: ''
    audit_guidance: "1. Run the following command to verify the `autorun-never` option is locked:\r\n\r\
      \n```\r\n# gsettings writable org.gnome.desktop.media-handling autorun-never\r\n\r\nfalse\r\n```\r\
      \n\r\n**Note:** If the setting is not locked, the value generated by the `gsettings get` command\
      \ below may be user level opposed to system-wide settings. This setting will need to be validated\
      \ and potentially remediated after it is locked in accordance with the Remediation procedure.\r\n\
      \r\n2. Run the following command and to verify that the `autorun-never` option is enabled:\r\n\r\
      \n```\r\n# gsettings get org.gnome.desktop.media-handling autorun-never\r\n\r\ntrue\r\n```"
    remediation_guidance: "1. Create or edit the file `/etc/dconf/profile/user` and add the following\
      \ lines if they do not exist:\r\n\r\n```\r\nuser-db:user\r\nsystem-db:local\r\n```\r\n\r\n_Example:_\r\
      \n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n   l_dir=\"/etc/dconf/profile/\"\r\n   [ ! -d \"$l_dir\"\
      \ ] && mkdir /etc/dconf/profile/\r\n   ! grep -Psq '^\\h*user-db:user\\b' \"$l_dir/user\" && \\\r\
      \n   printf '%s\\n' \"\" \"user-db:user\" >> \"$l_dir/user\"\r\n   ! grep -Psq '^\\h*system-db:local\\\
      b' \"$l_dir/user\" && \\\r\n   sed -ri '/^\\s*user-db:user/a system-db:local' \"$l_dir/user\"\r\n\
      }\r\n```\r\n\r\n2. Run the following command to create the `/etc/dconf/db/local.d/` and `/etc/dconf/db/local.d/locks/`\
      \ directories if either does not exist:\r\n\r\n```\r\n# [ ! -d \"/etc/dconf/db/local.d/locks/\"\
      \ ] && mkdir -p /etc/dconf/db/local.d/locks/\r\n```\r\n\r\n3. Create or edit a file in `/etc/dconf/db/local.d/locks/`\
      \ and add the following lines:\r\n\r\n```\r\n/org/gnome/desktop/media-handling/autorun-never\r\n\
      ```\r\n\r\n_Example:_\r\n\r\n```\r\n# printf '%s\\n' \"\" \"/org/gnome/desktop/media-handling/autorun-never\"\
      \ >> \\\r\n/etc/dconf/db/local.d/locks/60-media-autorun\r\n```\r\n\r\n4. Run the following script\
      \ to comment out any incorrect settings in a local system-wide database keyfile:\r\n\r\n```\r\n\
      #!/usr/bin/env bash\r\n\r\n{\r\n   l_parameter=\"autorun-never=\" l_value=\"false\"\r\n   while\
      \ IFS= read -r -d $'\\0' l_file; do\r\n      grep -Psiq -- \"^\\h*$l_parameter$l_value(\\b|\\h*$)\"\
      \ \"$l_file\" && \\\r\n      sed -ri '/^\\s*'\"$l_parameter\"'/s/^/# /g' \"$l_file\"\r\n   done\
      \ < <(find /etc/dconf/db -mindepth 2 -maxdepth 2 -type f -print0)\r\n}\r\n```\r\n\r\n5. Create or\
      \ edit a local keyfile for machine-wide settings in '/etc/dconf/db/local.d/` with the following\
      \ lines:\r\n\r\n```\r\n[org/gnome/desktop/media-handling]\r\nautorun-never=true\r\n```\r\n\r\n_Example\
      \ script:_\r\n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n   l_file=\"/etc/dconf/db/local.d/60-media-autorun\"\
      \r\n   a_keyfile=(\"[org/gnome/desktop/media-handling]\" \"autorun-never=true\")\r\n   if grep -Psq\
      \ -- '^\\h*\\[org\\/gnome\\/desktop\\/media-handling\\]' \"$l_file\"; then\r\n      ! grep -Psiq\
      \ -- '^\\h*autorun-never=true\\b' \"$l_file\" && \\\r\n      sed -ri '/^\\s*\\[org\\/gnome\\/desktop\\\
      /media-handling\\]/a autorun-never=true' \"$l_file\"\r\n      grep -Psiq -- '^\\h*autorun-never=false\\\
      b' \"$l_file\" && \\\r\n      sed -ri 's/^\\s*(autorun-never=)(false).*$/\\1true/' \"$l_file\"\r\
      \n   else\r\n      printf '%s\\n' \"\" \"${a_keyfile[@]}\" >> \"$l_file\"\r\n   fi\r\n}\r\n```\r\
      \n\r\n6. Run the following command to update the dconf databases:\r\n\r\n```\r\n# dconf update\r\
      \n```\r\n\r\n**Note:** Users must log out and back in again before the system-wide settings take\
      \ effect."
