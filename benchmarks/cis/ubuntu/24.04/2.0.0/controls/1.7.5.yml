control:
  id: CIS-1.7.5
  benchmark_id: cis-ubuntu-24.04
  title: Ensure GDM autorun-never is configured
  description: "The `autorun-never` setting allows the GNOME Desktop Display Manager to disable autorun\
    \ through GDM.\r\n\r\nBy using the lockdown mode in dconf, you can prevent users from changing specific\
    \ settings."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.1_7_5.audit
  remediation: cis.ubuntu.24.04.v2_0_0.1_7_5.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.1_7_5.rollback
  verification: cis.ubuntu.24.04.v2_0_0.1_7_5.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 1.7.5
      url: https://workbench.cisecurity.org/sections/4177290/recommendations/7047777
    assessment_status: automated
    profiles:
    - Level 1 - Server
    - Level 1 - Workstation
    mappings:
      nist:
      - CM-7 (2)
      cis_v8:
