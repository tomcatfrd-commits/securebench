control:
  id: CIS-6.1.1.1.4
  benchmark_id: cis-ubuntu-24.04
  title: Ensure journald log file access is configured
  description: Journald will create logfiles that do not already exist on the system. This setting controls
    what permissions will be applied to these newly created files.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.6_1_1_1_4.audit
