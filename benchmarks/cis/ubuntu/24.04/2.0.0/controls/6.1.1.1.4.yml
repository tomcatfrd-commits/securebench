    parent: CIS _6_System Logging Main | 2.2.1.1.4-Ensure journald log file access is configured
    rationale: It is important to ensure that log files have the correct permissions to ensure that sensitive
      data is archived and protected.
    impact: ''
    audit_guidance: "First determine if there is an override file `/etc/tmpfiles.d/systemd.conf`. If so,\
      \ this file will override all default settings as defined in `/usr/lib/tmpfiles.d/systemd.conf`\
      \ and should be inspected.\r\n\r\nIf no override file exists, inspect the default `/usr/lib/tmpfiles.d/systemd.conf`\
      \ against the site specific requirements.\r\n\r\nEnsure that file permissions are mode `0640` or\
      \ more restrictive.\r\n\r\nRun the following script to verify if an override file exists or not\
      \ and if the files permissions are mode `0640` or more restrictive:\r\n```\r\n#!/usr/bin/env bash\r\
      \n\r\n{\r\nconfig_files=(/etc/tmpfiles.d/systemd.conf /usr/lib/tmpfiles.d/systemd.conf)  \r\nwarn=()\r\
      \nfor file in \"${config_files[@]}\"; do\r\n  [ -f \"$file\" ] || continue\r\n  while read -r type\
      \ path perm _; do\r\n    if [[ \"$type\" == \"f\" && \"$perm\" =~ ^0?[0-7]{3,4}$ ]]; then\r\n  \
      \    perm=\"${perm#0}\"\r\n      if [ -f \"$path\" ]; then\r\n        actual=$(stat -c \"%a\" \"\
      $path\" 2>/dev/null)\r\n        if [[ -n \"$actual\" && \"$actual\" -gt 640 ]]; then\r\n       \
      \   warn+=(\"File: $path | Perm: $actual (expected max: 640) | Defined in: $file\")\r\n        fi\r\
      \n      fi\r\n    fi\r\n  done < \"$file\"\r\ndone\r\nif [ \"${#warn[@]}\" -eq 0 ]; then\r\n  echo\
      \ \"No files with permissions more permissive than 0640.\"\r\nelse\r\n  echo -e \" *** REVIEW ***\"\
      \r\n  printf \"%s\\n\" \"${warn[@]}\"\r\nfi\r\n}\r\n```"
    remediation_guidance: If the default configuration is not appropriate for the site specific requirements,
      copy `/usr/lib/tmpfiles.d/systemd.conf` to `/etc/tmpfiles.d/systemd.conf` and modify as required.
      Requirements is either `0640` or site policy if that is less restrictive.
    additional_information: "See `man 5 tmpfiles.d` for detailed information on the permission sets for\
      \ the relevant log files.\r\nFurther information with examples can be found at https://www.freedesktop.org/software/systemd/man/tmpfiles.d.html"
