control:
  id: CIS-7.2.1
  benchmark_id: cis-ubuntu-24.04
  title: Ensure accounts in /etc/passwd use shadowed passwords
  description: Local accounts can uses shadowed passwords.  With shadowed passwords, The passwords are
    saved in shadow password file, `/etc/shadow`, encrypted by a salted one-way hash. Accounts with a
    shadowed password have an `x` in the second field in `/etc/passwd`.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.7_2_1.audit
  remediation: cis.ubuntu.24.04.v2_0_0.7_2_1.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.7_2_1.rollback
  verification: cis.ubuntu.24.04.v2_0_0.7_2_1.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 7.2.1
