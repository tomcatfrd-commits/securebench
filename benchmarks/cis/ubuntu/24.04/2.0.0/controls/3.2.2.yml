control:
  id: CIS-3.2.2
  benchmark_id: cis-ubuntu-24.04
  title: Ensure can kernel module is not available
  description: The Controller Area Network (CAN) is a serial communications protocol, which was initially
    developed for automotive and is now also used in marine, industrial, and medical applications. Disabling
    CAN protects the system against exploitation of any flaws in its implementation.
  platform: ubuntu-24.04
