    parent: CIS _3_Configure Network Kernel Modules Main | 1.1.2-Ensure can kernel module is not available
    rationale: Removing support for unneeded protocols reduces the local attack surface of the system.
      If this protocol is not needed, disable it.
    impact: ''
    audit_guidance: "Verify the `can` kernel module is not available on the system or has been disabled.\r\
      \n\r\n1. Run the following script to determine if the `can` kernel module is available on the system:\r\
      \n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n   l_mod_name=\"can\" l_mod_type=\"net\"\r\n   while\
      \ IFS= read -r l_mod_path; do\r\n      if [ -d \"$l_mod_path/${l_mod_name//-/\\/}\" ] &&  \\\r\n\
      \      [ -n \"$(ls -A \"$l_mod_path/${l_mod_name//-/\\/}\")\" ]; then\r\n         printf '%s\\n'\
      \ \"$l_mod_name exists in $l_mod_path\"\r\n      fi\r\n   done < <(readlink -e /usr/lib/modules/**/kernel/$l_mod_type\
      \ \\\r\n   || readlink -e /lib/modules/**/kernel/$l_mod_type)\r\n}\r\n```\r\n\r\nIf nothing is returned,\
      \ the `can` kernel module is not available on the system and no further audit steps are required.\r\
      \n\r\n**Note:** Some systems may include the `can` filesystem as part of the kernel opposed to being\
      \ available as a kernel module. In this case, the above audit will not return anything. This is\
      \ also considered a passing state.\r\n\r\n**If anything is returned by the above script:**\r\n\r\
      \n2. verify the `can` kernel module is not loaded and not loadable by performing the following:\r\
      \n\r\nRun the following command to verify the `can` kernel module is not loaded:\r\n\r\n```\r\n\
      # lsmod | grep 'can'\r\n```\r\n\r\nNothing should be returned\r\n\r\nRun the following command to\
      \ verify the `can` kernel module is not loadable:\r\n\r\n```\r\n# modprobe --showconfig | grep -P\
      \ -- '\\b(install|blacklist)\\h+can\\b'\r\n```\r\n\r\nVerify the output includes:\r\n\r\n```\r\n\
      blacklist can\r\n -AND-\r\ninstall can /bin/false\r\n -OR-\r\ninstall can /bin/true\r\n```\r\n\r\
      \n_Example output:_\r\n\r\n```\r\nblacklist can\r\ninstall can /bin/false\r\n```"
    remediation_guidance: "Unload and disable the `can` kernel module.\r\n\r\n1. Run the following commands\
      \ to unload the `can` kernel module:\r\n\r\n```\r\n# modprobe -r can 2>/dev/null\r\n# rmmod can\
      \ 2>/dev/null\r\n```\r\n\r\n2. Perform the following to disable the `can` kernel module:\r\n\r\n\
      Create a file ending in `.conf` with `install can /bin/false` in the `/etc/modprobe.d/` directory\r\
      \n\r\n_Example:_\r\n\r\n```\r\n# printf '\\n%s\\n' \"install can /bin/false\" >> /etc/modprobe.d/60-can.conf\r\
      \n```\r\n\r\nCreate a file ending in `.conf` with `blacklist can` in the `/etc/modprobe.d/` directory\r\
      \n\r\n_Example:_\r\n\r\n```\r\n# printf '\\n%s\\n' \"blacklist can\" >> /etc/modprobe.d/60-can.conf\r\
      \n```"
