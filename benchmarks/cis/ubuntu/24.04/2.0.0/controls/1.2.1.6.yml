    parent: CIS _1_Package Management Main | 2.2.6-Ensure access to files in the /etc/apt/auth.conf.d/
      directory is configured
    rationale: Access to the `.conf` files in the `/etc/apt/auth.conf.d` directory should be restricted
      to prevent secrets leakage of Login information needed to connect to a proxy or to download data
      from a repository.
    impact: ''
    audit_guidance: "Run the following command and verify all `.conf` files in the `/etc/apt/auth.conf.d/`\
      \ directory `Uid` and `Gid` are both `0/root` and mode `0640` or more restrictive:\r\n\r\nRun the\
      \ following command:\r\n\r\n```\r\n# stat -Lc 'Access: (%a/%A) Uid: ( %u/ %U) Gid: ( %g/ %G)' /etc/apt/auth.conf.d/*\
      \ 2>/dev/null\r\n```\r\n\r\nNo output should be returned."
    remediation_guidance: "Run the following commands to set all `.conf` files in the `/etc/apt/auth.conf.d/`\
      \ directory `Uid` and `Gid` both to`0/root` and mode `0640`:\r\n\r\n```\r\n# chown root:root /etc/apt/auth.conf.d/*\r\
      \n# chmod u-x,g-wx,o-rwx /etc/apt/auth.conf.d/*\r\n```"
    additional_information: ''
    default_value: The `/etc/apt/auth.conf.d/` directory is empty
    artifacts_count: 3
    requirements: {}
    safety:
      default: investigate
      implementation_status: guidance_only
