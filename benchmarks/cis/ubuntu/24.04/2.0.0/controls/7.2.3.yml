    rationale: Groups defined in the `/etc/passwd` file but not in the `/etc/group` file pose a threat
      to system security since group permissions are not properly managed.
    impact: ''
    audit_guidance: "Run the following script to verify all GIDs in `/etc/passwd` exist in `/etc/group`:\r\
      \n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n   a_passwd_group_gid=(\"$(awk -F: '{print $4}' /etc/passwd\
      \ | sort -u)\")\r\n   a_group_gid=(\"$(awk -F: '{print $3}' /etc/group | sort -u)\")\r\n   a_passwd_group_diff=(\"\
      $(printf '%s\\n' \"${a_group_gid[@]}\" \"${a_passwd_group_gid[@]}\" | sort | uniq -u)\")\r\n   while\
      \ IFS= read -r l_gid; do\r\n      awk -F: '($4 == '\"$l_gid\"') {print \"  - User: \\\"\" $1 \"\\\
      \" has GID: \\\"\" $4 \"\\\" which does not exist in /etc/group\" }' /etc/passwd\r\n   done < <(printf\
      \ '%s\\n' \"${a_passwd_group_gid[@]}\" \"${a_passwd_group_diff[@]}\" | sort | uniq -D | uniq)\r\n\
      \   unset a_passwd_group_gid; unset a_group_gid; unset a_passwd_group_diff\r\n}\r\n```\r\n\r\nNothing\
      \ should be returned"
    remediation_guidance: Analyze the output of the Audit step above and perform the appropriate action
      to correct any discrepancies found.
