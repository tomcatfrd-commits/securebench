control:
  id: CIS-5.2.1
  benchmark_id: cis-ubuntu-24.04
  title: Ensure sudo is installed
  description: '`sudo` allows a permitted user to execute a command as the superuser or another user,
    as specified by the security policy.  The invoking user''s real (not effective) user ID is used to
    determine the user name with which to query the security policy.'
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_2_1.audit
  remediation: cis.ubuntu.24.04.v2_0_0.5_2_1.remediate
