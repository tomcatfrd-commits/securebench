    parent: CIS _5_Configure privilege escalation Main | 2.1.1-Ensure sudo is installed
    rationale: "`sudo` supports a plug-in architecture for security policies and input/output logging.\
      \  Third parties can develop and distribute their own policy and I/O logging plug-ins to work seamlessly\
      \ with the `sudo` front end. The default security policy is `sudoers`, which is configured via the\
      \ file `/etc/sudoers` and any entries in `/etc/sudoers.d`.\r\n\r\nThe security policy determines\
      \ what privileges, if any, a user has to run `sudo`. The policy may require that users authenticate\
      \ themselves with a password or another authentication mechanism. If authentication is required,\
      \ `sudo` will exit if the user's password is not entered within a configurable time limit. This\
      \ limit is policy-specific."
    impact: ''
    audit_guidance: "Run the following command to verify that either `sudo` is installed:\r\n\r\n```\r\
      \n# dpkg-query -s sudo &>/dev/null && echo \"sudo is installed\"\r\n\r\nsudo is installed\r\n```\r\
      \n\r\n**- OR -**\r\n\r\nRun the following command to verify that either `sudo-ldap` is installed:\r\
      \n\r\n```\r\n# dpkg-query -s sudo-ldap &>/dev/null && echo \"sudo-ldap is installed\"\r\n\r\nsudo-ldap\
      \ is installed\r\n```"
    remediation_guidance: "First determine is LDAP functionality is required. If so, then install `sudo-ldap`,\
      \ else install `sudo`.\r\n\r\n_Example:_\r\n\r\n```\r\n# apt install sudo\r\n```"
    additional_information: ''
    default_value: ''
