control:
  id: CIS-6.1.2.9
  benchmark_id: cis-ubuntu-24.04
  title: Ensure rsyslog forwarding uses gtls
  description: Network stream drivers are a layer between various parts of `rsyslogd` (e.g. the imtcp
    module) and the transport layer. They provide sequenced delivery, authentication and confidentiality
    to the upper layers. Drivers implement different capabilities.
  platform: ubuntu-24.04
  severity: unspecified
