    parent: CIS _6_System Logging Main | 2.2.2.9-Ensure rsyslog forwarding uses gtls
    rationale: '`StreamDriver` must be set to `gtls` to enable TLS for encrypting syslog traffic.'
    impact: Users need to know about netstream drivers because they need to configure the proper driver,
      and proper driver properties, to achieve desired results.
    audit_guidance: "Run the following command and verify \r\n```\r\n#  grep -Psi -- '^\\h*StreamDriver=\\\
      \"gtls\\\"' /etc/rsyslog.conf /etc/rsyslog.d/*.conf\r\n```\r\n_Example Output_\r\n```\r\n/etc/rsyslog.d/40-forward.conf:\
      \ StreamDriver=\"gtls\" StreamDriverMode=\"1\" StreamDriverAuthMode=\"anon\")\r\n```"
    remediation_guidance: "Edit `rsyslog.conf` or a `.conf` file in `/etc/rsyslog.d/` to use `gtls`:\r\
      \n\r\n_Example /etc/rsyslog.d/40-forward.conf_\r\n```\r\n# certificate files - just CA for a client\r\
      \nglobal(DefaultNetstreamDriverCAFile=\"/path/to/contrib/gnutls/ca.pem\")\r\n\r\n# set up the action\
      \ for all messages\r\naction(type=\"omfwd\" protocol=\"tcp\" target=\"s.example.net\" port=\"6514\"\
      \r\n       StreamDriver=\"gtls\" StreamDriverMode=\"1\" StreamDriverAuthMode=\"anon\")\r\n```"
