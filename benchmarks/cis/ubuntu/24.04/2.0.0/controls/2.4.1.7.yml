control:
  id: CIS-2.4.1.7
  benchmark_id: cis-ubuntu-24.04
  title: Ensure access to /etc/cron.yearly is configured
  description: The `/etc/cron.yearly` directory contains system cron jobs that run on an annual basis.
    Files in this directory are edited directly by system administrators rather than through the `crontab`
    command. The commands below restrict read, write, and search access to `root` only, preventing regular
    users from accessing this directory.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.2_4_1_7.audit
  remediation: cis.ubuntu.24.04.v2_0_0.2_4_1_7.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.2_4_1_7.rollback
  verification: cis.ubuntu.24.04.v2_0_0.2_4_1_7.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 2.4.1.7
      url: https://workbench.cisecurity.org/sections/4177287/recommendations/7047757
    assessment_status: automated
    profiles:
    - Level 1 - Server
    - Level 1 - Workstation
    mappings:
      nist:
      - AC-3
      cis_v8:
      - '3.3'
      cis_v7:
      - '14.6'
      mitre_techniques: []
      mitre_tactics: []
      mitre_mitigations: []
    parent: CIS _2_Configure cron Main | 1.1.2.7-Ensure access to /etc/cron.yearly is configured
    rationale: Granting write access to `/etc/cron.yearly` for non-privileged users would allow them to
      introduce arbitrary commands that run annually as root, providing a path to unauthorized privilege
      escalation. Granting read access would expose the contents of scheduled jobs, potentially revealing
      sensitive system information or attack opportunities.
    impact: No operational impact. Restricting `/etc/cron.yearly` to `root:root 700` does not affect cron
      job execution; `crond` runs as root and retains access.
    audit_guidance: "**- IF -** cron is installed on the system:\r\n\r\nRun the following command and\
      \ verify `Uid` and `Gid` are both `0/root` and `Access` does not grant permissions to `group` or\
      \ `other`:\r\n\r\n```\r\n# stat -Lc 'Access: (%a/%A) Uid: ( %u/ %U) Gid: ( %g/ %G)' /etc/cron.yearly/\r\
      \n\r\nAccess: (700/drwx------) Uid: ( 0/ root) Gid: ( 0/ root)\r\n```\r\n\r\n**Note:** If the directory\
      \ does not exist, this is considered a passing state."
    remediation_guidance: "**- IF -** cron is installed on the system:\r\n\r\nRun the following commands\
      \ to set ownership and permissions on the `/etc/cron.yearly` directory:\r\n\r\n```\r\n# chown root:root\
      \ /etc/cron.yearly/\r\n# chmod og-rwx /etc/cron.yearly/\r\n```"
    additional_information: ''
    default_value: 'Access: (755/drwxr-xr-x) Uid: ( 0/ root) Gid: ( 0/ root)'
    artifacts_count: 5
    requirements: {}
    safety:
      default: investigate
      implementation_status: guidance_only
      reason: Imported CIS guidance has not yet been promoted to a reviewed SecureBench implementation.
  dependencies: []
  conflicts: []
