control:
  id: CIS-5.4.1.4
  benchmark_id: cis-ubuntu-24.04
  title: Ensure strong password hashing algorithm is configured
  description: "A cryptographic hash function converts an arbitrary-length input into a fixed length output.\
    \ Password hashing performs a one-way transformation of a password, turning the password into another\
    \ string, called the hashed password.\r\n\r\n`ENCRYPT_METHOD` (string) - This defines the system default\
    \ encryption algorithm for encrypting passwords (if no algorithm are specified on the command line).\
    \ It can take one of these values:\r\n- `MD5` - MD5-based algorithm will be used for encrypting password\r\
    \n- `SHA256` - SHA256-based algorithm will be used for encrypting password\r\n- `SHA512` - SHA512-based\
    \ algorithm will be used for encrypting password\r\n- `BCRYPT` - BCRYPT-based algorithm will be used\
    \ for encrypting password\r\n- `YESCRYPT` - YESCRYPT-based algorithm will be used for encrypting password\r\
    \n- `DES` - DES-based algorithm will be used for encrypting password (default)\r\n\r\n**Note:**\r\n\
    - This parameter overrides the deprecated `MD5_CRYPT_ENAB` variable.\r\n- This parameter will only\
    \ affect the generation of group passwords.\r\n- The generation of user passwords is done by PAM and\
    \ subject to the PAM configuration.\r\n- It is recommended to set this variable consistently with\
    \ the PAM configuration."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_4_1_4.audit
  remediation: cis.ubuntu.24.04.v2_0_0.5_4_1_4.remediate
