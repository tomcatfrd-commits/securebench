    parent: CIS _5_Configure shadow password suite parameters Main | 1.1.1.4-Ensure strong password hashing
      algorithm is configured
    rationale: The `SHA-512` and `yescrypt` algorithms provide a stronger hash than other algorithms used
      by Linux for password hash generation. A stronger hash provides additional protection to the system
      by increasing the level of effort needed for an attacker to successfully determine local group passwords.
    impact: ''
    audit_guidance: "Run the following command to verify the hashing algorithm is `sha512` or `yescrypt`\
      \ in `/etc/login.defs`:\r\n\r\n```\r\n# grep -Pi -- '^\\h*ENCRYPT_METHOD\\h+(SHA512|YESCRYPT)\\\
      b' /etc/login.defs\r\n```\r\n\r\n_Example output:_\r\n\r\n```\r\nENCRYPT_METHOD SHA512\r\n - OR\
      \ -\r\nENCRYPT_METHOD YESCRYPT\r\n```"
    remediation_guidance: "Edit `/etc/login.defs` and set the `ENCRYPT_METHOD` to `SHA512` or `YESCRYPT`:\r\
      \n\r\n```\r\nENCRYPT_METHOD ```\r\n\r\n_Example:_\r\n\r\n```\r\nENCRYPT_METHOD YESCRYPT\r\n```\r\
      \n\r\n**Note:** \r\n- This only effects local groups' passwords created after updating the file\
      \ to use `sha512` or `yescrypt`.\r\n- If it is determined that the password algorithm being used\
      \ is not `sha512` or `yescrypt`, once it is changed, it is recommended that all group passwords\
      \ be updated to use the stronger hashing algorithm.\r\n- It is recommended that the chosen hashing\
      \ algorithm is consistent across `/etc/login.defs` and the PAM configuration"
    additional_information: ''
    default_value: ENCRYPT_METHOD SHA512
    artifacts_count: 1
    requirements: {}
    safety:
      default: investigate
