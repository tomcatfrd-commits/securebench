  title: Ensure rsyslog-gnutls is installed
  description: TLS protocol support for rsyslog (GnuTLS). This netstream plugin allows rsyslog to send
    and receive encrypted syslog messages via the syslog-transport-tls IETF standard protocol using GnuTLS.
  platform: ubuntu-24.04
  severity: unspecified
