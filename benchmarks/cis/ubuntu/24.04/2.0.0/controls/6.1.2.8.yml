    parent: CIS _6_System Logging Main | 2.2.2.8-Ensure rsyslog-gnutls is installed
    rationale: Traditional syslog is a clear-text protocol that means anyone with a sniffer can have a
      peek at your data. `rsyslog-gnutls` is a secure communications library implementing the SSL, TLS
      and DTLS protocols and technologies around them, and provides an easy way to encrypt syslog communication.
    impact: Enabling TLS support using `rsyslog-gnutls` requires certificate management to ensure reliable
      encrypted logging. If misconfigured, remote log forwarding may fail until valid certificates and
      trusted CAs are applied.
    audit_guidance: "Run the following command and verify `rsyslog-gnutls` is installed:\r\n```\r\n# dpkg-query\
      \ -s rsyslog-gnutls &>/dev/null && echo \"rsyslog-gnutls is installed\"\r\n\r\nrsyslog-gnutls is\
      \ installed\r\n```"
    remediation_guidance: "Run the following command to install `rsyslog-gnutls`:\r\n```\r\n# apt install\
      \ rsyslog-gnutls\r\n```"
