control:
  id: CIS-2.1.23
  benchmark_id: cis-ubuntu-24.04
  title: Ensure X window server services are not in use
  description: The X Window System provides a Graphical User Interface (GUI) where users can have multiple
    windows in which to run programs and various add on. The X Windows system is typically used on workstations
    where users login, but not on servers where users typically do not login.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.2_1_23.audit
  remediation: cis.ubuntu.24.04.v2_0_0.2_1_23.remediate
