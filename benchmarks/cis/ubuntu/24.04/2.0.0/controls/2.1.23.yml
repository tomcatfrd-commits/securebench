    parent: CIS _2_Configure Server Services Main | 2.1.23-Ensure X window server services are not in
      use
    rationale: Unless your organization specifically requires graphical login access via X Windows, remove
      it to reduce the potential attack surface.
    impact: "If a Graphical Desktop Manager (GDM) is in use on the system, there may be a dependency on\
      \ the `xorg-x11-server-common` package. If the GDM is required and approved by local site policy,\
      \ the package should **not** be removed.\r\n\r\nMany Linux systems run applications which require\
      \ a Java runtime.  Some Linux Java packages have a dependency on specific X Windows xorg-x11-fonts.\
      \  One workaround to avoid this dependency is to use the \"headless\" Java packages for your specific\
      \ Java runtime."
    audit_guidance: "**- IF -** a Graphical Desktop Manager or X-Windows server is not required and approved\
      \ by local site policy:\r\n\r\nRun the following command to Verify X Windows Server is not installed.\r\
      \n\r\n```\r\ndpkg-query -s xserver-common &>/dev/null && echo \"xserver-common is installed\"\r\n\
      ```\r\n\r\nNothing should be returned"
    remediation_guidance: "**- IF -** a Graphical Desktop Manager or X-Windows server is not required\
      \ and approved by local site policy:\r\n\r\nRun the following command to remove the X Windows Server\
      \ package:\r\n\r\n```\r\n# apt purge xserver-common\r\n```"
    additional_information: ''
    default_value: ''
    artifacts_count: 2
    requirements: {}
    safety:
