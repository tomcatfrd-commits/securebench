    parent: CIS _5_Configure root and system accounts and environment Main | 1.1.2.2-Ensure root is the
      only GID 0 account
    rationale: Using GID 0 for the `root` account helps prevent `root` -owned files from accidentally
      becoming accessible to non-privileged users.
    impact: ''
    audit_guidance: "Run the following command to verify the `root` user's primary GID is `0`, and no\
      \ other user's have GID `0` as their primary GID:\r\n\r\n```\r\n# awk -F: '($1 !~ /^(sync|shutdown|halt|operator)/\
      \ && $4==\"0\") {print $1\":\"$4}' /etc/passwd\r\n\r\nroot:0\r\n```\r\n\r\n**Note:** User's: sync,\
      \ shutdown, halt, and operator are excluded from the check for other user's with GID `0`"
    remediation_guidance: "Run the following command to set the `root` user's GID to `0`:\r\n\r\n```\r\
      \n# usermod -g 0 root\r\n``` \r\n\r\nRun the following command to set the `root` group's GID to\
      \ `0`:\r\n\r\n```\r\n# groupmod -g 0 root\r\n```\r\n\r\nRemove any users other than the `root` user\
      \ with GID 0 or assign them a new GID if appropriate."
    additional_information: ''
    default_value: ''
    artifacts_count: 1
    requirements: {}
    safety:
