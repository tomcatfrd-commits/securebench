control:
  id: CIS-5.4.2.2
  benchmark_id: cis-ubuntu-24.04
  title: Ensure root is the only GID 0 account
  description: The `usermod` command can be used to specify which group the `root` account belongs to.
    This affects permissions of files that are created by the `root` account.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_4_2_2.audit
  remediation: cis.ubuntu.24.04.v2_0_0.5_4_2_2.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.5_4_2_2.rollback
  verification: cis.ubuntu.24.04.v2_0_0.5_4_2_2.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 5.4.2.2
