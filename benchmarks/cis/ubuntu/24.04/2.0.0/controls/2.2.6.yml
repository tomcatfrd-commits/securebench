    parent: CIS _2_Configure Client Services Main | 2.1.2-Ensure ftp client is not installed
    rationale: Unless there is a need to run the system using Internet standard File Transfer Protocol
      (for example, to allow anonymous downloads), it is recommended that the package be removed to reduce
      the potential attack surface.
    impact: ''
    audit_guidance: "Run the following command to verify the `tnftp` and `ftp` packages are not installed:\r\
      \n\r\n```\r\n# dpkg-query -l | awk '{print $2}' 2>&1 | grep -Pqs -- '^(ftp|tnftp)' && echo \"ftp\
      \ is installed\"\r\nftp is installed\r\n```\r\n\r\nNothing should be returned."
    remediation_guidance: "Run the following commands to uninstall the `tnftp` and `ftp` packages:\r\n\
      \r\n```\r\n# apt purge ftp\r\n# apt purge tnftp\r\n```"
