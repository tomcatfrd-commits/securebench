control:
  id: CIS-5.3.2.4
  benchmark_id: cis-ubuntu-24.04
  title: Ensure pam_pwhistory module is enabled
  description: "The `pam_pwhistory.so` module saves the last passwords for each user in order to force\
    \ password change history and keep the user from alternating between the same password too frequently.\r\
    \n\r\nThis module does not work together with kerberos. In general, it does not make much sense to\
    \ use this module in conjunction with `NIS` or `LDAP`, since the old passwords are stored on the local\
    \ machine and are not available on another machine for password history checking."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_3_2_4.audit
  remediation: cis.ubuntu.24.04.v2_0_0.5_3_2_4.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.5_3_2_4.rollback
