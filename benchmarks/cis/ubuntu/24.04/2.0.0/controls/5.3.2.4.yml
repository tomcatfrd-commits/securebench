    parent: CIS _5_Pluggable Authentication Modules Main | 2.1.2.4-Ensure pam_pwhistory module is enabled
    rationale: Use of a unique, complex passwords helps to increase the time and resources required to
      compromise the password.
    impact: ''
    audit_guidance: "Run the following command to verify that `pam_pwhistory.so` is enabled:\r\n\r\n```\r\
      \n# grep -P -- '\\bpam_pwhistory\\.so\\b' /etc/pam.d/common-password\r\n```\r\n\r\nOutput should\
      \ be similar to:\r\n\r\n```\r\npassword   requisite   pam_pwhistory.so remember=24 enforce_for_root\
      \ use_authtok\r\n```"
    remediation_guidance: "Run the following script to verify the `pam_pwhistory.so` line exists in a\
      \ `pam-auth-update` profile:\r\n\r\n```\r\n# grep -P -- '\\bpam_pwhistory\\.so\\b' /usr/share/pam-configs/*\r\
      \n```\r\n\r\nOutput should be similar to:\r\n\r\n```\r\n/usr/share/pam-configs/pwhistory:   requisite\
      \   pam_pwhistory.so remember=24 enforce_for_root use_authtok\r\n```\r\n\r\n**- IF -** similar output\
      \ is returned:\r\n\r\nRun the following command to update `/etc/pam.d/common-password` with the\
      \ returned profile:\r\n\r\n```\r\n# pam-auth-update --enable {PROFILE_NAME}\r\n```\r\n\r\n_Example:_\r\
      \n\r\n```\r\n# pam-auth-update --enable pwhistory\r\n```\r\n\r\n**- IF -** similar output is **NOT**\
      \ returned:\r\n\r\nCreate a `pwhistory` profile in `/usr/share/pam-configs/` with the following\
      \ lines:\r\n\r\n```\r\nName: pwhistory password history checking\r\nDefault: yes\r\nPriority: 1024\r\
      \nPassword-Type: Primary\r\nPassword: requisite pam_pwhistory.so remember=24 enforce_for_root use_authtok\r\
      \n```\r\n\r\n_Example Script:_\r\n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n   arr=('Name: pwhistory\
      \ password history checking' 'Default: yes' 'Priority: 1024' 'Password-Type: Primary' 'Password:'\
      \ '        requisite                       pam_pwhistory.so remember=24 enforce_for_root use_authtok')\r\
      \n   printf '%s\\n' \"${arr[@]}\" > /usr/share/pam-configs/pwhistory\r\n}\r\n```\r\n\r\nRun the\
      \ following command to update `/etc/pam.d/common-password` with the `pwhistory` profile:\r\n\r\n\
      ```\r\n# pam-auth-update --enable pwhistory\r\n```\r\n\r\n**Note:**\r\n- The name used for the file\
      \ must be used in the `pam-auth-update --enable` command\r\n- The `Name:` line should be easily\
      \ recognizable and understood\r\n- The `Priority:` Line is important as it effects the order of\
      \ the lines in the `/etc/pam.d/` files\r\n- If a site specific custom profile is being used in your\
      \ environment to configure PAM that includes the configuration for the `pam_pwhistory` module, enable\
      \ that module instead"
