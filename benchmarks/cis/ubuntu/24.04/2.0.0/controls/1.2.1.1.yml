control:
  id: CIS-1.2.1.1
  benchmark_id: cis-ubuntu-24.04
  title: Ensure the source.list and .source files use the Signed-By option
  description: "`sources.list` - List of configured APT data sources\r\n\r\nThe source list `/etc/apt/sources.list`\
    \ and the files contained in `/etc/apt/sources.list.d/` are designed to support any number of active\
    \ sources and a variety of source media.\r\n\r\n**Signed-By** (`signed-by`) is an option to require\
    \ a repository to pass apt-secure(8) verification with a certain set of keys rather than all trusted\
    \ keys apt has configured. It is specified as a list of absolute paths to keyring files (have to be\
    \ accessible and readable for the _apt system user, so ensure everyone has read-permissions on the\
    \ file) and fingerprints of keys to select from these keyrings. The recommended locations for keyrings\
    \ are `/usr/share/keyrings` for keyrings managed by packages, and `/etc/apt/keyrings` for keyrings\
    \ managed by the system operator. If no keyring files are specified, the default is the `trusted.gpg`\
    \ keyring and all keyrings in the `trusted.gpg.d/` directory. If no fingerprint is specified all keys\
    \ in the keyrings are selected. A fingerprint will accept also all signatures by a subkey of this\
    \ key, if this isn't desired an exclamation mark (`!`) can be appended to the fingerprint to disable\
    \ this behaviour. The option defaults to the value of the option with the same name if set in the\
    \ previously acquired Release file of this repository (only fingerprints can be specified there through).\
    \ Otherwise, all keys in the trusted keyrings are considered valid signers for this repository. The\
    \ option may also be set directly to an embedded GPG public key block."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.1_2_1_1.audit
