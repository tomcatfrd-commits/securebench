    parent: CIS _1_Package Management Main | 2.2.1-Ensure the source.list and .source files use the Signed-By
      option
    rationale: Verifying that updates originate from a trusted and authenticated source helps mitigate
      the risk of spoofing attacks, which could otherwise lead to the inadvertent installation of malicious
      or compromised software.
    impact: "`apt-key list` is deprecated. Manage keyring files in `trusted.gpg.d` instead (see apt-key(8)).\r\
      \nWith the deprecation of `apt-key` it is recommended to use the `Signed-By` option in `sources.list`\
      \ to require a repository to pass apt-secure(8) verification with a certain set of keys rather than\
      \ all trusted keys apt has configured.\r\n\r\nIt is important to list sources in order of preference,\
      \ with the most preferred source listed first. Typically, this will result in sorting by speed from\
      \ fastest to slowest (CD-ROM followed by hosts on a local network, followed by distant Internet\
      \ hosts, for example)."
    audit_guidance: "Run the following command and verify that the file `/etc/apt/sources.list` and files\
      \ ending `.list` and `.sources` in the `/etc/apt/sources.list.d/` directory use the `Signed-By`\
      \ option:\r\n\r\n```\r\n# grep -PRiLs -- '^([^#\\n\\r]+)?\\bSigned-By\\b' /etc/apt/sources.list\
      \ /etc/apt/sources.list.d/*.{list,sources}\r\n```\r\nNothing should be returned."
    remediation_guidance: "Update the file `sources.list` and any `.sources` files found in the `/etc/apt/sources.list.d/`\
      \ directory in accordance with site policy.\r\n\r\n**Note:** \r\n- The suggested filename for new\
      \ systems is `/etc/apt/sources.list.d/vendor.sources`, where vendor is the result of `dpkg-vendor\
      \ --query Vendor | tr A-Z a-z`, in deb822-style format. For example, Ubuntu uses `/etc/apt/sources.list.d/ubuntu.sources`.\r\
      \n- It is important to list sources in order of preference, with the most preferred source listed\
      \ first. Typically, this will result in sorting by speed from fastest to slowest (CD-ROM followed\
      \ by hosts on a local network, followed by distant Internet hosts, for example)."
