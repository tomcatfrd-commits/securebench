control:
  id: CIS-1.6.5
  benchmark_id: cis-ubuntu-24.04
  title: Ensure sshd warning Banner is configured
  description: "The sshd `Banner` parameter specifies a file whose contents must be sent to the remote\
    \ user before authentication is permitted. \r\n\r\n**Note:** More information about the openSSH server\
    \ configuration is available in the \"Configure SSH Server\" section overview."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.1_6_5.audit
  remediation: cis.ubuntu.24.04.v2_0_0.1_6_5.remediate
