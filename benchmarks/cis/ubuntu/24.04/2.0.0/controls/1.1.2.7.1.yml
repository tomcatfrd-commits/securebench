control:
  id: CIS-1.1.2.7.1
  benchmark_id: cis-ubuntu-24.04
  title: Ensure separate partition exists for /var/log/audit
  description: The auditing daemon, `auditd`, stores log data in the `/var/log/audit` directory.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.1_1_2_7_1.audit
  remediation: cis.ubuntu.24.04.v2_0_0.1_1_2_7_1.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.1_1_2_7_1.rollback
  verification: cis.ubuntu.24.04.v2_0_0.1_1_2_7_1.verify
  rollback_capability: unsupported
