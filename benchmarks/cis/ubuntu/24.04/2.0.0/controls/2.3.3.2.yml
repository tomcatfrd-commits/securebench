    parent: CIS _2_Time Synchronization Main | 2.1.3.2-Ensure chrony is running as user _chrony
    rationale: The `chronyd` service should run with only the required privlidges
    impact: ''
    audit_guidance: "**- IF -** `chrony` is in use on the system, run the following command to verify\
      \ the `chronyd` service is being run as the `_chrony` user:\r\n\r\n```\r\n# ps -ef | awk '(/[c]hronyd/\
      \ && $1!=\"_chrony\") { print $1 }'\r\n```\r\n\r\nNothing should be returned"
    remediation_guidance: "Add or edit the `user` line to `/etc/chrony/chrony.conf` or a file ending in\
      \ `.conf` in `/etc/chrony/conf.d/`:\r\n\r\n```\r\nuser _chrony\r\n```\r\n\r\n**- OR -**\r\n\r\n\
      If another time synchronization service is in use on the system, run the following command to remove\
      \ `chrony` from the system:\r\n\r\n```\r\n# apt purge chrony\r\n# apt autoremove chrony\r\n```"
    additional_information: ''
    default_value: user _chrony
    artifacts_count: 2
    requirements: {}
    safety:
      default: investigate
      implementation_status: guidance_only
