control:
  id: CIS-2.3.3.2
  benchmark_id: cis-ubuntu-24.04
  title: Ensure chrony is running as user _chrony
  description: The `chrony` package is installed with a dedicated user account `_chrony`.  This account
    is granted the access required by the `chronyd` service
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.2_3_3_2.audit
  remediation: cis.ubuntu.24.04.v2_0_0.2_3_3_2.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.2_3_3_2.rollback
