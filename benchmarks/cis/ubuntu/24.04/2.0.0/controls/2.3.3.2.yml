      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 2.3.3.2
      url: https://workbench.cisecurity.org/sections/4177282/recommendations/7047710
    assessment_status: automated
    profiles:
    - Level 1 - Server
    - Level 1 - Workstation
    mappings:
      nist:
      - AU-8
      cis_v8:
      - '0'
      cis_v7:
