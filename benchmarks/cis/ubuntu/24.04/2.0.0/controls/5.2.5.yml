control:
  id: CIS-5.2.5
  benchmark_id: cis-ubuntu-24.04
  title: Ensure re-authentication for privilege escalation is not disabled globally
  description: The operating system must be configured so that users must re-authenticate for privilege
    escalation.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_2_5.audit
  remediation: cis.ubuntu.24.04.v2_0_0.5_2_5.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.5_2_5.rollback
  verification: cis.ubuntu.24.04.v2_0_0.5_2_5.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 5.2.5
      url: https://workbench.cisecurity.org/sections/4177269/recommendations/7047659
    assessment_status: automated
    profiles:
    - Level 1 - Server
    - Level 1 - Workstation
    mappings:
      nist:
      - AC-6
      cis_v8:
      - '5.4'
      cis_v7:
      - '4.3'
      mitre_techniques:
      - T1548
      mitre_tactics:
      - TA0004
      mitre_mitigations:
      - M1026
    parent: CIS _5_Configure privilege escalation Main | 2.1.5-Ensure re-authentication for privilege
      escalation is not disabled globally
    rationale: "Without re-authentication, users may access resources or perform tasks for which they\
      \ do not have authorization. \r\n\r\nWhen operating systems provide the capability to escalate a\
      \ functional capability, it is critical the user re-authenticate."
    impact: ''
    audit_guidance: "Verify the operating system requires users to re-authenticate for privilege escalation.\r\
      \n\r\nCheck the configuration of the `/etc/sudoers` and `/etc/sudoers.d/*` files with the following\
      \ command:\r\n\r\n```\r\n# grep -r '^[^#].*\\!authenticate' /etc/sudoers*\r\n```\r\n\r\nIf any line\
      \ is found with a `!authenticate` tag, refer to the remediation procedure below."
    remediation_guidance: "Configure the operating system to require users to reauthenticate for privilege\
      \ escalation.\r\n\r\nBased on the outcome of the audit procedure, use `visudo -f ` to edit the relevant\
      \ sudoers file.\r\n\r\nRemove any occurrences of `!authenticate` tags in the file(s)."
    additional_information: ''
    default_value: ''
    artifacts_count: 2
    requirements: {}
    safety:
      default: investigate
      implementation_status: guidance_only
      reason: Imported CIS guidance has not yet been promoted to a reviewed SecureBench implementation.
