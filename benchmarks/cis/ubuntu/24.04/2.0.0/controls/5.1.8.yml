control:
  id: CIS-5.1.8
  benchmark_id: cis-ubuntu-24.04
  title: Ensure sshd DisableForwarding is enabled
  description: "The `DisableForwarding` parameter disables all forwarding features, including X11, ssh-agent(1),\
    \ TCP and StreamLocal. This option overrides all other forwarding-related options and may simplify\
    \ restricted configurations.\r\n- X11Forwarding provides the ability to tunnel X11 traffic through\
    \ the connection to enable remote graphic connections.\r\n- ssh-agent is a program to hold private\
    \ keys used for public key authentication. Through use of environment variables the agent can be located\
    \ and automatically used for authentication when logging in to other machines using ssh.\r\n- SSH\
    \ port forwarding is a mechanism in SSH for tunneling application ports from the client to the server,\
    \ or servers to clients. It can be used for adding encryption to legacy applications, going through\
    \ firewalls, and some system administrators and IT professionals use it for opening backdoors into\
    \ the internal network from their home machines.\r\n\r\nMore information about the openSSH server\
    \ configuration is available in the \"Configure SSH Server\" section overview."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_1_8.audit
  remediation: cis.ubuntu.24.04.v2_0_0.5_1_8.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.5_1_8.rollback
  verification: cis.ubuntu.24.04.v2_0_0.5_1_8.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 5.1.8
      url: https://workbench.cisecurity.org/sections/4177236/recommendations/7047527
    assessment_status: automated
    profiles:
    - Level 1 - Workstation
    - Level 2 - Server
    mappings:
      nist:
      - CM-7
      cis_v8:
      - '4.8'
      cis_v7:
      - '9.2'
      mitre_techniques:
      - T1210
      - T1210.000
      mitre_tactics:
      - TA0008
      mitre_mitigations:
      - M1042
    parent: CIS _5_Configure SSH Server Main | 2.2.9-Ensure sshd DisableForwarding is enabled
    rationale: "Disable X11 forwarding unless there is an operational requirement to use X11 applications\
      \ directly. There is a small risk that the remote X11 servers of users who are logged in via SSH\
      \ with X11 forwarding could be compromised by other users on the X11 server. Note that even if X11\
      \ forwarding is disabled, users can always install their own forwarders.\r\n\r\nanyone with root\
      \ privilege on the the intermediate server can make free use of ssh-agent to authenticate them to\
      \ other servers\r\n\r\nLeaving port forwarding enabled can expose the organization to security risks\
      \ and backdoors. SSH connections are protected with strong encryption. This makes their contents\
      \ invisible to most deployed network monitoring and traffic filtering solutions. This invisibility\
      \ carries considerable risk potential if it is used for malicious purposes such as data exfiltration.\
      \ Cybercriminals or malware could exploit SSH to hide their unauthorized communications, or to exfiltrate\
      \ stolen data from the target network."
    impact: SSH tunnels are widely used in many corporate environments. In some environments the applications
      themselves may have very limited native support for security. By utilizing tunneling, compliance
      with SOX, HIPAA, PCI-DSS, and other standards can be achieved without having to modify the applications.
    audit_guidance: "Run the following command to verify `DisableForwarding` is set to `yes`:\r\n\r\n\
      ```\r\n# sshd -T | grep disableforwarding\r\n\r\ndisableforwarding yes\r\n```"
    remediation_guidance: "Create or edit a `*.conf` file in the `/etc/ssh/sshd_config.d/` and set the\
      \ `DisableForwarding` parameter to `yes` above any `Include` entry as follows:\r\n\r\n```\r\nDisableForwarding\
      \ yes\r\n```"
    additional_information: ''
    default_value: ''
    artifacts_count: 2
    requirements: {}
    safety:
      default: investigate
      implementation_status: guidance_only
      reason: Imported CIS guidance has not yet been promoted to a reviewed SecureBench implementation.
