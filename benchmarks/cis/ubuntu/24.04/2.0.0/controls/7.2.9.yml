control:
  id: CIS-7.2.9
  benchmark_id: cis-ubuntu-24.04
  title: Ensure local interactive user home directories are configured
  description: The user home directory is space defined for the particular user to set local environment
    variables and to store personal files.  While the system administrator can establish secure permissions
    for users' home directories, the users can easily override these. Users can be defined in `/etc/passwd`
    without a home directory or with a home directory that does not actually exist.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.7_2_9.audit
  remediation: cis.ubuntu.24.04.v2_0_0.7_2_9.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.7_2_9.rollback
  verification: cis.ubuntu.24.04.v2_0_0.7_2_9.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 7.2.9
      url: https://workbench.cisecurity.org/sections/4177259/recommendations/7047626
    assessment_status: automated
    profiles:
    - Level 1 - Server
    - Level 1 - Workstation
    mappings:
      nist:
      - CM-6
      cis_v8:
      - '3.3'
      cis_v7:
      - '14.6'
      mitre_techniques:
      - T1222
      - T1222.002
