    parent: CIS _5_Configure SSH Server Main | 2.2.2-Ensure access to SSH private host key files is configured
    rationale: If an threat actor obtains the private SSH host key file, the host could be impersonated.
    impact: If the private keys used by the openSSH server have the incorrect mode, owner, or group owner
      the server service may not start.
    audit_guidance: "Verify SSH private host key files are:\r\n- Mode `0600`.\r\n- Owned by the `root`\
      \ user.\r\n- Group owned by the group `root`.\r\n\r\nRun the following script to generate a list\
      \ of SSH private host key files:\r\n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n   l_sshd_cmd=\"\
      $(readlink -e /usr/sbin/sshd || readlink -e /sbin/sshd)\"\r\n   l_keygen=\"$(readlink -e /usr/bin/ssh-keygen\
      \ || readlink -e /bin/ssh-keygen)\"\r\n   l_sshd_config=\"$(readlink -e /etc/ssh/sshd_config)\"\r\
      \n   l_sshd_args=(-T)\r\n   grep -qiE '^\\s*Match\\s+(User|Group|Host|LocalAddress|LocalPort|Address)'\
      \ \\\r\n      \"$l_sshd_config\" 2>/dev/null && l_sshd_args+=(-C \"user=root,host=localhost,addr=127.0.0.1\"\
      )\r\n   mapfile -t l_hostkeys < <(\"$l_sshd_cmd\" \"${l_sshd_args[@]}\" 2>/dev/null | awk '$1==\"\
      hostkey\"{print $2}')\r\n   for l_file in \"${l_hostkeys[@]}\"; do\r\n      \"$l_keygen\" -lf \"\
      $l_file\" &>/dev/null && \\\r\n         stat -Lc 'File: \"%n\" Mode: \"%#a\" Owner: \"%U\" Group:\
      \ \"%G\"' \"$l_file\"\r\n   done\r\n}\r\n```\r\n\r\n_Example output:_\r\n\r\n```\r\nFile: \"/etc/ssh/ssh_host_rsa_key\"\
      \ Mode: \"0600\"  Owner: \"root\" Group: \"root\"\r\nFile: \"/etc/ssh/ssh_host_ecdsa_key\" Mode:\
      \ \"0600\"  Owner: \"root\" Group: \"root\"\r\nFile: \"/etc/ssh/ssh_host_ed25519_key\" Mode: \"\
      0600\"  Owner: \"root\" Group: \"root\"\r\n```\r\n\r\nVerify all files in the output are:\r\n- Mode\
      \ `0600`.\r\n- Owner by the user `root`.\r\n- Group owned by the group `root`."
    remediation_guidance: "Update the access to the private keys being used by the open SSH server.\r\n\
      - mode to `0600`.\r\n- owner to the user `root`.\r\n- group owner to the group `root`.\r\n\r\nRun\
      \ the following script to update the access on the private keys used by the open SSH server:\r\n\
      \r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n   l_sshd_cmd=\"$(readlink -e /usr/sbin/sshd || readlink\
      \ -e /sbin/sshd)\"\r\n   l_keygen=\"$(readlink -e /usr/bin/ssh-keygen || readlink -e /bin/ssh-keygen)\"\
      \r\n   while IFS= read -r l_file; do \r\n      if \"$l_keygen\" -lf &>/dev/null \"$l_file\"; then\r\
      \n         chown root:root \"$l_file\"\r\n         chmod 0600 \"$l_file\"\r\n      fi \r\n   done\
      \ < <(\"$l_sshd_cmd\" -T | awk '$1==\"hostkey\" {print $2\".pub\"}' 2>/dev/null)\r\n}\r\n```"
