control:
  id: CIS-5.1.2
  benchmark_id: cis-ubuntu-24.04
  title: Ensure access to SSH private host key files is configured
  description: An SSH private key is one of two files used in SSH public key authentication.  In this
    authentication method, the possession of the private key is proof of identity. Only a private key
    that corresponds to a public key will be able to authenticate successfully. The private keys need
    to be stored and handled carefully, and no copies of the private key should be distributed.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_1_2.audit
  remediation: cis.ubuntu.24.04.v2_0_0.5_1_2.remediate
