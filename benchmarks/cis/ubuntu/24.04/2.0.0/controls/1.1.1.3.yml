    parent: CIS _1_Configure Filesystem Kernel Modules Main | 1.1.3-Ensure hfs kernel module is not available
    rationale: Removing support for unneeded filesystem types reduces the local attack surface of the
      system. If this filesystem type is not needed, disable it.
    impact: ''
    audit_guidance: "Verify the `hfs` kernel module is not available on the system or has been disabled.\r\
      \n\r\n1. Run the following script to determine if the `hfs` kernel module is available on the system:\r\
      \n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n   l_mod_name=\"hfs\" l_mod_type=\"fs\"\r\n   while\
      \ IFS= read -r l_mod_path; do\r\n      if [ -d \"$l_mod_path/${l_mod_name//-/\\/}\" ] &&  \\\r\n\
      \      [ -n \"$(ls -A \"$l_mod_path/${l_mod_name//-/\\/}\")\" ]; then\r\n         printf '%s\\n'\
      \ \"$l_mod_name exists in $l_mod_path\"\r\n      fi\r\n   done < <(readlink -e /usr/lib/modules/**/kernel/$l_mod_type\
      \ \\\r\n   || readlink -e /lib/modules/**/kernel/$l_mod_type)\r\n}\r\n```\r\n\r\nIf nothing is returned,\
      \ the `hfs` kernel module is not available on the system and no further audit steps are required.\r\
      \n\r\n**Note:** Some systems may include the `hfs` filesystem as part of the kernel opposed to being\
      \ available as a kernel module. In this case, the above audit will not return anything. This is\
      \ also considered a passing state.\r\n\r\n**If anything is returned by the above script:**\r\n\r\
      \n2. Verify the `hfs` kernel module is not loaded and not loadable by performing the following:\r\
      \n\r\nRun the following command to verify the `hfs` kernel module is not loaded:\r\n\r\n```\r\n\
      # lsmod | grep 'hfs'\r\n```\r\n\r\nNothing should be returned.\r\n\r\nRun the following command\
      \ to verify the `hfs` kernel module is not loadable:\r\n\r\n```\r\n# modprobe --showconfig | grep\
      \ -P -- '\\b(install|blacklist)\\h+hfs\\b'\r\n```\r\n\r\nVerify the output includes:\r\n\r\n```\r\
      \nblacklist hfs\r\n -AND-\r\ninstall hfs /bin/false\r\n -OR-\r\ninstall hfs /bin/true\r\n```\r\n\
      \r\n_Example output:_\r\n\r\n```\r\nblacklist hfs\r\ninstall hfs /bin/false\r\n```"
    remediation_guidance: "Unload and disable the `hfs` kernel module.\r\n\r\n1. Run the following commands\
      \ to unload the `hfs` kernel module:\r\n\r\n```\r\n# modprobe -r hfs 2>/dev/null\r\n# rmmod hfs\
      \ 2>/dev/null\r\n```\r\n\r\n2. Perform the following to disable the `hfs` kernel module:\r\n\r\n\
      Create a file ending in `.conf` with `install hfs /bin/false` in the `/etc/modprobe.d/` directory.\r\
      \n\r\n_Example:_\r\n\r\n```\r\n# printf '%s\\n' \"\" \"install hfs /bin/false\" >> /etc/modprobe.d/60-hfs.conf\r\
      \n```\r\n\r\nCreate a file ending in `.conf` with `blacklist hfs` in the `/etc/modprobe.d/` directory.\r\
      \n\r\n_Example:_\r\n\r\n```\r\n# printf '%s\\n' \"\" \"blacklist hfs\" >> /etc/modprobe.d/60-hfs.conf\r\
      \n```"
