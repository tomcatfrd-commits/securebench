    parent: CIS _6_System Auditing Main | 2.2.4.5-Ensure audit configuration files mode is configured
    rationale: "Access to the audit configuration files could allow unauthorized personnel to prevent\
      \ the auditing of critical events. \r\n\r\nMisconfigured audit configuration files may prevent the\
      \ auditing of critical events or impact the system's performance by overwhelming the audit log.\
      \ Misconfiguration of the audit configuration files may also make it more difficult to establish\
      \ and investigate events relating to an incident."
    impact: ''
    audit_guidance: "Run the following script to verify that the audit configuration files are mode `0640`\
      \ or more restrictive:\r\n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n   l_output=\"\" l_output2=\"\
      \" l_perm_mask=\"0137\"\r\n   l_maxperm=\"$( printf '%o' $(( 0777 & ~$l_perm_mask )) )\"\r\n   while\
      \ IFS= read -r -d $'\\0' l_fname; do\r\n      l_mode=$(stat -Lc '%#a' \"$l_fname\")\r\n      if\
      \ [ $(( \"$l_mode\" & \"$l_perm_mask\" )) -gt 0 ]; then\r\n         l_output2=\"$l_output2\\n -\
      \ file: \\\"$l_fname\\\" is mode: \\\"$l_mode\\\" (should be mode: \\\"$l_maxperm\\\" or more restrictive)\"\
      \r\n      fi\r\n   done < <(find /etc/audit/ -type f \\( -name \"*.conf\" -o -name '*.rules' \\\
      ) -print0)\r\n   if [ -z \"$l_output2\" ]; then\r\n      echo -e \"\\n- Audit Result:\\n  ** PASS\
      \ **\\n - All audit configuration files are mode: \\\"$l_maxperm\\\" or more restrictive\"\r\n \
      \  else\r\n      echo -e \"\\n- Audit Result:\\n  ** FAIL **\\n$l_output2\"\r\n   fi\r\n}\r\n```"
    remediation_guidance: "Run the following command to remove more permissive mode than `0640` from the\
      \ audit configuration files:\r\n\r\n```\r\n# find /etc/audit/ -type f \\( -name '*.conf' -o -name\
      \ '*.rules' \\) -exec chmod u-x,g-wx,o-rwx {} +\r\n```"
    additional_information: ''
