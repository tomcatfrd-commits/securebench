    parent: CIS _2_Configure Server Services Main | 2.1.16-Ensure rsync services are not in use
    rationale: "`rsync.service` presents a security risk as the `rsync` protocol is unencrypted.\r\n\r\
      \nThe `rsync` package should be removed to reduce the attack area of the system."
    impact: "There may be packages that are dependent on the `rsync` package.  If the `rsync` package\
      \ is removed, these dependent packages will be removed as well. Before removing the `rsync` package,\
      \ review any dependent packages to determine if they are required on the system.\r\n\r\n**- IF -**\
      \ a dependent package is required: stop and mask `rsync.service` leaving the `rsync` package installed."
    audit_guidance: "Run the following command to verify `rsync` is not installed:\r\n\r\n```\r\n# dpkg-query\
      \ -s rsync &>/dev/null && echo \"rsync is installed\"\r\n```\r\n\r\nNothing should be returned.\r\
      \n\r\n**- OR -** \r\n\r\n**- IF -** the `rsync` package is required as a dependency:\r\n\r\nRun\
      \ the following command to verify `rsync.service` is not enabled:\r\n\r\n```\r\n# systemctl is-enabled\
      \ rsync.service 2>/dev/null | grep 'enabled'\r\n\r\nNothing should be returned\r\n```\r\n\r\nRun\
      \ the following command to verify `rsync.service` is not active:\r\n\r\n```\r\n# systemctl is-active\
      \ rsync.service 2>/dev/null | grep '^active'\r\n\r\nNothing should be returned\r\n```\r\n\r\n**Note:**\
      \ If the package is required for a dependency\r\n - Ensure the dependent package is approved by\
      \ local site policy\r\n - Ensure stopping and masking the service and/or socket meets local site\
      \ policy"
    remediation_guidance: "Run the following commands to stop `rsync.service`, and remove the `rsync`\
      \ package:\r\n\r\n```\r\n# systemctl stop rsync.service\r\n# apt purge rsync\r\n```\r\n\r\n**- OR\
      \ -**\r\n\r\n**- IF -** the `rsync` package is required as a dependency:\r\n\r\nRun the following\
      \ commands to stop and mask `rsync.service`:\r\n\r\n```\r\n# systemctl stop rsync.service\r\n# systemctl\
      \ mask rsync.service\r\n```"
