    parent: CIS _5_Configure root and system accounts and environment Main | 1.1.2.5-Ensure root path
      integrity
    rationale: Including the current working directory (.) or other writable directory in `root`'s executable
      path makes it likely that an attacker can gain superuser access by forcing an administrator operating
      as `root` to execute a Trojan horse program.
    impact: ''
    audit_guidance: "Run the following script to verify root's path does not include:\r\n- Locations that\
      \ are not directories\r\n- An empty directory (`::`)\r\n- A trailing (`:`)\r\n- Current working\
      \ directory (`.`)\r\n- Non `root` owned directories\r\n- Directories that less restrictive than\
      \ mode `0755`\r\n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n   a_output2=() l_pmask=\"0022\"\r\n\
      \   l_maxperm=\"$( printf '%o' $(( 0777 & ~$l_pmask )) )\"\r\n   l_root_path=\"$(sudo su - root\
      \ -c env | awk -F= '$1==\"PATH\"{print $2}')\"\r\n   IFS=\":\" read -ra a_path_loc <<< \"$l_root_path\"\
      \r\n   grep -q -- \"::\" <<< \"$l_root_path\" && \\\r\n   a_output2+=(\" - root's path contains\
      \ a empty directory (::)\")\r\n   grep -Pq -- \":\\h*$\" <<< \"$l_root_path\" && \\\r\n   a_output2+=(\"\
      \ - root's path contains a trailing (:)\")\r\n   grep -Pq -- '(^\\h*|:)\\.(:|\\h*$)' <<< \"$l_root_path\"\
      \ && \\\r\n   a_output2+=(\" - root's path contains current working directory (.)\")\r\n   for l_path\
      \ in \"${a_path_loc[@]}\"; do\r\n      if [ -d \"$l_path\" ]; then\r\n         while IFS=: read\
      \ -r l_fmode l_fown; do\r\n            [ \"$l_fown\" != \"root\" ] && \\\r\n            a_output2+=(\"\
      \ - Directory: \\\"$l_path\\\" is owned by: \\\"$l_fown\\\"\" \\\r\n            \"    should be\
      \ owned by \\\"root\\\"\")\r\n            [ $(( $l_fmode & $l_pmask )) -gt 0 ] && \\\r\n       \
      \     a_output2+=(\" - Directory: \\\"$l_path\\\" is mode: \\\"$l_fmode\\\"\" \\\r\n           \
      \ \"    and should be mode: \\\"$l_maxperm\\\" or more restrictive\")\r\n         done <<< \"$(stat\
      \ -Lc '%#a:%U' \"$l_path\")\"\r\n      else\r\n         a_output2+=(\" - \\\"$l_path\\\" is not\
      \ a directory\")\r\n      fi\r\n   done\r\n   if [ \"${#a_output2[@]}\" -le 0 ]; then\r\n      printf\
      \ '%s\\n' \"\" \"- Audit Result:\" \"  ** PASS **\" \\\r\n      \" - Root's path is correctly configured\"\
      \r\n   else\r\n      printf '%s\\n' \"\" \"- Audit Result:\" \"  ** FAIL **\" \\\r\n      \"- *\
      \ Reasons for audit failure * :\" \"${a_output2[@]}\"\r\n   fi\r\n}\r\n```"
    remediation_guidance: "Correct or justify any:\r\n- Locations that are not directories\r\n- Empty\
      \ directories (`::`)\r\n- Trailing (`:`)\r\n- Current working directory (`.`)\r\n- Non `root` owned\
      \ directories\r\n- Directories that less restrictive than mode `0755`"
