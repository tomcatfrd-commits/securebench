control:
  id: CIS-5.4.2.5
  benchmark_id: cis-ubuntu-24.04
  title: Ensure root path integrity
  description: The `root` user can execute any command on the system and could be fooled into executing
    programs unintentionally if the `PATH` is not set correctly.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_4_2_5.audit
  remediation: cis.ubuntu.24.04.v2_0_0.5_4_2_5.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.5_4_2_5.rollback
  verification: cis.ubuntu.24.04.v2_0_0.5_4_2_5.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 5.4.2.5
      url: https://workbench.cisecurity.org/sections/4177297/recommendations/7047796
    assessment_status: automated
    profiles:
    - Level 1 - Server
    - Level 1 - Workstation
    mappings:
      nist:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
      cis_v8:
      - '0'
      cis_v7:
      - '0'
