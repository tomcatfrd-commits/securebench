control:
  id: CIS-3.3.2.8
  benchmark_id: cis-ubuntu-24.04
  title: Ensure net.ipv6.conf.default.accept_ra is configured
  description: "Routers periodically Multicast Router Advertisement (RA) messages to announce their availability\
    \ and convey information to neighboring nodes that enable them to be automatically configured on the\
    \ network.\r\n\r\n`net.ipv6.conf.default.accept_ra` controls accepting IPv6 RA messages on newly added\
    \ network devices.\r\n\r\nMore information about the kernel parameter configuration files, their location,\
    \ and load preference is available in the \"Configure Network Kernel Parameters\" section overview.\r\
    \n\r\n>**Note: If IPv6 has been disabled, this recommendation is not applicable.**"
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.3_3_2_8.audit
  remediation: cis.ubuntu.24.04.v2_0_0.3_3_2_8.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.3_3_2_8.rollback
  verification: cis.ubuntu.24.04.v2_0_0.3_3_2_8.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 3.3.2.8
      url: https://workbench.cisecurity.org/sections/4177263/recommendations/7047633
    assessment_status: automated
    profiles:
    - Level 1 - Server
    - Level 1 - Workstation
    mappings:
      nist:
      - CM-6
