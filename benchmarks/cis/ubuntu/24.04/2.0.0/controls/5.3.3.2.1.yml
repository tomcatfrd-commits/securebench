control:
  id: CIS-5.3.3.2.1
  benchmark_id: cis-ubuntu-24.04
  title: Ensure password number of changed characters is configured
  description: The `pwquality` `difok` option sets the number of characters in a password that must not
    be present in the old password.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_3_3_2_1.audit
  remediation: cis.ubuntu.24.04.v2_0_0.5_3_3_2_1.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.5_3_3_2_1.rollback
  verification: cis.ubuntu.24.04.v2_0_0.5_3_3_2_1.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 5.3.3.2.1
      url: https://workbench.cisecurity.org/sections/4177285/recommendations/7047717
    assessment_status: automated
    profiles:
    - Level 1 - Server
    - Level 1 - Workstation
    mappings:
      nist:
      - IA-5
      cis_v8:
      - '5.2'
      cis_v7:
      - '4.4'
      mitre_techniques:
      - T1110
      - T1110.001
      - T1110.002
      - T1110.003
      - T1178.001
      - T1178.002
      - T1178.003
