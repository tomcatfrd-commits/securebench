    parent: CIS _5_Pluggable Authentication Modules Main | 2.1.4.2.1-Ensure password number of changed
      characters is configured
    rationale: "Use of a complex password helps to increase the time and resources required to compromise\
      \ the password. Password complexity, or strength, is a measure of the effectiveness of a password\
      \ in resisting attempts at guessing and brute-force attacks.\r\n\r\nPassword complexity is one factor\
      \ of several that determines how long it takes to crack a password. The more complex the password,\
      \ the greater the number of possible combinations that need to be tested before the password is\
      \ compromised."
    impact: ''
    audit_guidance: "Run the following command to verify that the `difok` option is set to `2` or more\
      \ and follows local site policy:\r\n\r\n```\r\n# grep -Psi -- '^\\h*difok\\h*=\\h*([2-9]|[1-9][0-9]+)\\\
      b' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf\r\n```\r\n\r\n_Example output:_\r\
      \n\r\n```\r\n/etc/security/pwquality.conf.d/50-pwdifok.conf:difok = 2\r\n```\r\n\r\nVerify returned\
      \ value(s) are `2` or more and meet local site policy\r\n\r\nRun the following command to verify\
      \ that `difok` is not set, is `2` or more, and conforms to local site policy:\r\n\r\n```\r\n# grep\
      \ -Psi -- '^\\h*password\\h+(requisite|required|sufficient)\\h+pam_pwquality\\.so\\h+([^#\\n\\r]+\\\
      h+)?difok\\h*=\\h*([0-1])\\b' /etc/pam.d/common-password\r\n```\r\n\r\nNothing should be returned\r\
      \n\r\n**Note:** \r\n- settings should be configured in only **one** location for clarity\r\n- Settings\
      \ observe an order of precedence:\r\n  - module arguments override the settings in the `/etc/security/pwquality.conf`\
      \ configuration file\r\n  - settings in the `/etc/security/pwquality.conf` configuration file override\
      \ settings in a `.conf` file in the `/etc/security/pwquality.conf.d/` directory\r\n  - settings\
      \ in a `.conf` file in the `/etc/security/pwquality.conf.d/` directory are read in canonical order,\
      \ with last read file containing the setting taking precedence\r\n- It is recommended that settings\
      \ be configured in a `.conf` file in the `/etc/security/pwquality.conf.d/` directory for clarity,\
      \ convenience, and durability."
    remediation_guidance: "Create or modify a file ending in `.conf` in the `/etc/security/pwquality.conf.d/`\
      \ directory or the file `/etc/security/pwquality.conf` and add or modify the following line to set\
      \ `difok` to `2` or more. Ensure setting conforms to local site policy:\r\n\r\n_Example:_\r\n\r\n\
      ```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n   sed -ri 's/^\\s*difok\\s*=/# &/' /etc/security/pwquality.conf\r\
      \n   [ ! -d /etc/security/pwquality.conf.d/ ] && mkdir /etc/security/pwquality.conf.d/\r\n   printf\
      \ '\\n%s' \"difok = 2\" > /etc/security/pwquality.conf.d/50-pwdifok.conf\r\n}\r\n```\r\n\r\nRun\
      \ the following command:\r\n\r\n```\r\n# grep -Pl -- '\\bpam_pwquality\\.so\\h+([^#\\n\\r]+\\h+)?difok\\\
      b' /usr/share/pam-configs/*\r\n```\r\n\r\nEdit any returned files and remove the `difok` argument\
      \ from the `pam_pwquality.so` line(s):"
    additional_information: ''
    default_value: difok = 1
    artifacts_count: 5
    requirements: {}
    safety:
