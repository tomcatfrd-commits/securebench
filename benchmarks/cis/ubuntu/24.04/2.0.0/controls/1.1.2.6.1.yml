    parent: CIS _1_Configure Filesystem Partitions Main | 1.1.6.1-Ensure separate partition exists for
      /var/log
    rationale: "The default installation only creates a single `/` partition. Since the `/var/log` directory\
      \ contains log files which can grow quite large, there is a risk of resource exhaustion. It will\
      \ essentially have the whole disk available to fill up and impact the system as a whole.\r\n\r\n\
      Configuring `/var/log` as its own file system allows an administrator to set additional mount options\
      \ such as `noexec/nosuid/nodev`. These options limit an attackers ability to create exploits on\
      \ the system. Other options allow for specific behavior. See `man mount` for exact details regarding\
      \ filesystem-independent and filesystem-specific options.\r\n\r\nAs `/var/log` contains log files,\
      \ care should be taken to ensure the security and integrity of the data and mount point."
    impact: Resizing filesystems is a common activity in cloud-hosted servers. Separate filesystem partitions
      may prevent successful resizing, or may require the installation of additional tools solely for
      the purpose of resizing operations. The use of these additional tools may introduce their own security
      considerations.
    audit_guidance: "Run the following command and verify output shows `/var/log`  is mounted:\r\n\r\n\
      ```\r\n# findmnt -kn /var/log\r\n\r\n/var/log /dev/sdb ext4   rw,nosuid,nodev,noexec,relatime,seclabel\r\
      \n```"
    remediation_guidance: "For new installations, during installation create a custom partition setup\
      \ and specify a separate partition for `/var/log` .\r\n\r\nFor systems that were previously installed,\
      \ create a new partition and configure `/etc/fstab`  as appropriate.\r\n\r\n**Note:** Using Btrfs\
      \ subvolumes instead of traditional disk partitions changes how disk space is allocated and enforced,\
      \ quotas may need to be configured to enforce storage limits and prevent resource exhaustion."
    additional_information: When modifying `/var/log` it is advisable to bring the system to emergency
      mode (so auditd is not running), rename the existing directory, mount the new file system, and migrate
      the data over before returning to multiuser mode.
    default_value: ''
