control:
  id: CIS-5.1.3
  benchmark_id: cis-ubuntu-24.04
  title: Ensure access to SSH public host key files is configured
  description: An SSH public key is one of two files used in SSH public key authentication. In this authentication
    method, a public key is a key that can be used for verifying digital signatures generated using a
    corresponding private key. Only a public key that corresponds to a private key will be able to authenticate
    successfully.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_1_3.audit
