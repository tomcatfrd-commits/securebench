    parent: CIS _2_Configure Server Services Main | 2.1.1-Ensure autofs services are not in use
    rationale: With automounting enabled anyone with physical access could attach a USB drive or disc
      and have its contents available in the filesystem even if they lacked permissions to mount it themselves.
    impact: "The use of portable hard drives is very common for workstation users. If your organization\
      \ allows the use of portable storage or media on workstations and physical access controls to workstations\
      \ is considered adequate there is little value add in turning off automounting.\r\n\r\nThere may\
      \ be packages that are dependent on the `autofs` package.  If the `autofs` package is removed, these\
      \ dependent packages will be removed as well. Before removing the `autofs` package, review any dependent\
      \ packages to determine if they are required on the system.\r\n\r\n**- IF -** a dependent package\
      \ is required: stop and mask the `autofs.service`  leaving the `autofs` package installed."
    audit_guidance: "As a preference `autofs` should not be installed unless other packages depend on\
      \ it.\r\n\r\nRun the following command to verify `autofs` is not installed:\r\n```\r\n# dpkg-query\
      \ -s autofs &>/dev/null && echo \"autofs is installed\"\r\n```\r\n\r\nNothing should be returned.\r\
      \n\r\n**- OR -** \r\n\r\n**- IF -** the package is required for dependencies:\r\n\r\nRun the following\
      \ command to verify `autofs.service` is not enabled:\r\n\r\n```\r\n# systemctl is-enabled autofs.service\
      \ 2>/dev/null | grep 'enabled'\r\n\r\nNothing should be returned\r\n```\r\n\r\nRun the following\
      \ command to verify the `autofs.service` is not active:\r\n\r\n```\r\n# systemctl is-active autofs.service\
      \ 2>/dev/null | grep '^active'\r\n\r\nNothing should be returned\r\n```\r\n\r\n**Note:** If the\
      \ package is required for a dependency\r\n - Ensure the dependent package is approved by local site\
      \ policy\r\n - Ensure stopping and masking the service and/or socket meets local site policy"
    remediation_guidance: "Run the following commands to stop `autofs.service` and remove the `autofs`\
      \ package:\r\n\r\n```\r\n# systemctl stop autofs.service\r\n# apt purge autofs\r\n```\r\n\r\n**-\
      \ OR -**\r\n\r\n**- IF -** the `autofs` package is required as a dependency:\r\n\r\nRun the following\
      \ commands to stop and mask `autofs.service`:\r\n\r\n```\r\n# systemctl stop autofs.service\r\n\
      # systemctl mask autofs.service\r\n```"
    additional_information: This control should align with the tolerance of the use of portable drives
      and optical media in the organization. On a server, requiring an admin to manually mount media can
      be part of defense-in-depth to reduce the risk of unapproved software or information being introduced
      or proprietary software or information being exfiltrated. If admins commonly use flash drives and
      Server access has sufficient physical controls, requiring manual mounting may not increase security.
