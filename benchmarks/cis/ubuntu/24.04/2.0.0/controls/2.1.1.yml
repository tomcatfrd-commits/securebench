control:
  id: CIS-2.1.1
  benchmark_id: cis-ubuntu-24.04
  title: Ensure autofs services are not in use
  description: '`autofs` allows automatic mounting of devices, typically including CD/DVDs and USB drives.'
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.2_1_1.audit
  remediation: cis.ubuntu.24.04.v2_0_0.2_1_1.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.2_1_1.rollback
