    parent: CIS _6_System Auditing Main | 2.2.3.8-Ensure events that modify /etc/network and /etc/networks
      are collected
    rationale: Monitoring the systems network environment is important as it can show if network interfaces
      or scripts are being modified in a way that can lead to the machine becoming unavailable or compromised.
      All audit records should have a relevant tag associated with them.
    impact: ''
    audit_guidance: "1. Run the following command to verify a rule exists in the running configuration:\r\
      \n```\r\n# auditctl -l | grep -Ps -- '\\/etc/net'\r\n```\r\n\r\nVerify the output includes:\r\n\
      ```\r\n-w /etc/networks -p wa -k system-locale\r\n-w /etc/network -p wa -k system-locale\r\n```\r\
      \n\r\n2. Run the following command to verify a rule exists in a rules file:\r\n\r\n```  \r\n# grep\
      \ -Ps -- '\\/etc/net' /etc/audit/rules.d/*.rules\r\n```\r\n\r\n_Example output_:\r\n```\r\n/etc/audit/rules.d/50-etc_sysconfig_system_locale.rules:-w\
      \ /etc/networks -p wa -k system-locale\r\n/etc/audit/rules.d/50-etc_sysconfig_system_locale.rules:-w\
      \ /etc/network -p wa -k system-locale\r\n```"
    remediation_guidance: "1. Edit or create a file in the `/etc/audit/rules.d/` directory, ending in\
      \ `.rules` extension, with the relevant rules to monitor events that modify the system's network\
      \ environment.\r\n\r\n_Example_:\r\n```\r\n# printf \"\r\n-w /etc/networks -p wa -k system-locale\r\
      \n-w /etc/network -p wa -k system-locale\r\n\" >> /etc/audit/rules.d/50-etc_sysconfig_system_locale.rules\r\
      \n```\r\n\r\n2. Merge and load the rules into active configuration:\r\n\r\n```\r\n# augenrules --load\r\
      \n```\r\n\r\n3. Check if reboot is required:\r\n```\r\n# if [[ $(auditctl -s | grep \"enabled\"\
      ) =~ \"2\" ]]; then printf \"Reboot required to load rules\\n\"; fi\r\n```"
    additional_information: ''
