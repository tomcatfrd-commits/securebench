control:
  id: CIS-6.2.3.8
  benchmark_id: cis-ubuntu-24.04
  title: Ensure events that modify /etc/network and /etc/networks are collected
  description: "Record changes to network environment files or system calls. The files being monitored\
    \ are:\r\n- `/etc/networks` - symbolic names for networks\r\n- `/etc/network/` - directory containing\
    \ network interface scripts and configurations files"
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.6_2_3_8.audit
  remediation: cis.ubuntu.24.04.v2_0_0.6_2_3_8.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.6_2_3_8.rollback
