      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 6.2.3.8
      url: https://workbench.cisecurity.org/sections/4203192/recommendations/7091555
    assessment_status: automated
    profiles:
    - Level 2 - Server
    - Level 2 - Workstation
    mappings:
