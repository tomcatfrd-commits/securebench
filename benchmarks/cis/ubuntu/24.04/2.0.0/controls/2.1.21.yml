    parent: CIS _2_Configure Server Services Main | 2.1.21-Ensure web proxy server services are not in
      use
    rationale: "Unless a system is specifically set up to act as a proxy server, it is recommended that\
      \ the squid package be removed to reduce the potential attack surface.\r\n\r\n**Note:** Several\
      \ HTTP proxy servers exist. These should be checked and removed unless required."
    impact: "There may be packages that are dependent on the `squid` package.  If the `squid` package\
      \ is removed, these dependent packages will be removed as well. Before removing the `squid` package,\
      \ review any dependent packages to determine if they are required on the system.\r\n\r\n**- IF -**\
      \ a dependent package is required: stop and mask the `squid.service`  leaving the `squid` package\
      \ installed."
    audit_guidance: "Run the following command to verify `squid` is not installed:\r\n\r\n```\r\n# dpkg-query\
      \ -s squid &>/dev/null && echo \"squid is installed\"\r\n```\r\n\r\nNothing should be returned.\r\
      \n\r\n**- OR -** \r\n\r\n**- IF -** the package is required for dependencies:\r\n\r\nRun the following\
      \ command to verify `squid.service` is not enabled:\r\n\r\n```\r\n# systemctl is-enabled squid.service\
      \ 2>/dev/null | grep 'enabled'\r\n\r\nNothing should be returned\r\n```\r\n\r\nRun the following\
      \ command to verify the `squid.service` is not active:\r\n\r\n```\r\n# systemctl is-active squid.service\
      \ 2>/dev/null | grep '^active'\r\n\r\nNothing should be returned\r\n```\r\n\r\n**Note:** If the\
      \ package is required for a dependency\r\n - Ensure the dependent package is approved by local site\
      \ policy\r\n - Ensure stopping and masking the service and/or socket meets local site policy"
    remediation_guidance: "Run the following commands to stop `squid.service` and remove the `squid` package:\r\
      \n\r\n```\r\n# systemctl stop squid.service\r\n# apt purge squid\r\n```\r\n\r\n**- OR -** If the\
      \ `squid` package is required as a dependency:\r\n\r\nRun the following commands to stop and mask\
      \ the `squid.service`:\r\n\r\n```\r\n# systemctl stop squid.service\r\n# systemctl mask squid.service\r\
      \n```"
    additional_information: Several HTTP proxy servers exist. These and other services should be checked
