    impact: ''
    audit_guidance: "Run the following command to verify `auditd`  is enabled:\r\n\r\n```\r\n# systemctl\
      \ is-enabled auditd | grep '^enabled'\r\n\r\nenabled\r\n```\r\n\r\nVerify result is \"enabled\"\
      .\r\n\r\nRun the following command to verify `auditd` is active:\r\n\r\n```\r\n# systemctl is-active\
      \ auditd | grep '^active'\r\n\r\nactive\r\n```\r\n\r\nVerify result is active"
    remediation_guidance: "Run the following commands to unmask, enable and start `auditd`:\r\n\r\n```\r\
      \n# systemctl unmask auditd\r\n# systemctl enable auditd\r\n# systemctl start auditd\r\n```"
