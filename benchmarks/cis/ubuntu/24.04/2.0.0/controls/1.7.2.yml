control:
  id: CIS-1.7.2
  benchmark_id: cis-ubuntu-24.04
  title: Ensure GDM disable-user-list is configured
  description: "GNOME Display Manager (GDM) handles graphical login for GNOME based systems.\r\n\r\nThe\
    \ `disable-user-list` option controls if a list of users is displayed on the login screen\r\n\r\n\
    By using the lockdown mode in dconf, you can prevent users from changing specific settings."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.1_7_2.audit
  remediation: cis.ubuntu.24.04.v2_0_0.1_7_2.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.1_7_2.rollback
  verification: cis.ubuntu.24.04.v2_0_0.1_7_2.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 1.7.2
      url: https://workbench.cisecurity.org/sections/4177290/recommendations/7047761
    assessment_status: automated
