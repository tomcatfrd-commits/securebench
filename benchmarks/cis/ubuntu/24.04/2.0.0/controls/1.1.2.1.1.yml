    parent: CIS _1_Configure Filesystem Partitions Main | 1.1.1.1-Ensure /tmp is tmpfs or a separate partition
    rationale: "Making `/tmp` its own file system allows an administrator to set additional mount options\
      \ such as the `noexec` option on the mount, making `/tmp` useless for an attacker to install executable\
      \ code. It would also prevent an attacker from establishing a hard link to a system `setuid` program\
      \ and wait for it to be updated. Once the program was updated, the hard link would be broken, and\
      \ the attacker would have his own copy of the program. If the program happened to have a security\
      \ vulnerability, the attacker could continue to exploit the known flaw.\r\n\r\nThis can be accomplished\
      \ by either mounting `tmpfs` to `/tmp`, or creating a separate partition for `/tmp`."
    impact: "By design files saved to `/tmp` should have no expectation of surviving a reboot of the system.\
      \ `tmpfs` is ram based and all files stored to `tmpfs` will be lost when the system is rebooted.\r\
      \n\r\nIf files need to be persistent through a reboot, they should be saved to `/var/tmp` not `/tmp`.\r\
      \n\r\nSince the `/tmp` directory is intended to be world-writable, there is a risk of resource exhaustion\
      \ if it is not bound to `tmpfs` or a separate partition. \r\n\r\nRunning out of `/tmp` space is\
      \ a problem regardless of what kind of filesystem lies under it, but in a configuration where `/tmp`\
      \ is not a separate file system it will essentially have the whole disk available, as the default\
      \ installation only creates a single `/` partition. On the other hand, a RAM-based `/tmp` (as with\
      \ `tmpfs`) will almost certainly be much smaller, which can lead to applications filling up the\
      \ filesystem much more easily. Another alternative is to create a dedicated partition for `/tmp`\
      \ from a separate volume or disk. One of the downsides of a disk-based dedicated partition is that\
      \ it will be slower than `tmpfs` which is RAM-based."
    audit_guidance: "Run the following command and verify the output shows that `/tmp` is mounted. Particular\
      \ requirements pertaining to mount options are covered in ensuing sections.\r\n\r\n```\r\n# findmnt\
      \ -kn /tmp\r\n```\r\n\r\n_Example output:_\r\n\r\n```\r\n/tmp   tmpfs  tmpfs  rw,nosuid,nodev,noexec\r\
      \n```\r\n\r\nEnsure that systemd will mount the `/tmp` partition at boot time.\r\n\r\n```\r\n# systemctl\
      \ is-enabled tmp.mount\r\n```\r\n\r\n_Example output:_\r\n\r\n```\r\ngenerated\r\n```\r\n\r\nVerify\
      \ output is not `masked` or `disabled`.\r\n\r\n**Note:** By default, systemd will output `generated`\
      \ if there is an entry in `/etc/fstab` for `/tmp`. This just means systemd will use the entry in\
      \ `/etc/fstab` instead of its default unit file configuration for `/tmp`."
    remediation_guidance: "First ensure that systemd is correctly configured to ensure that `/tmp` will\
      \ be mounted at boot time.\r\n\r\n```\r\n# systemctl unmask tmp.mount\r\n```\r\n\r\nFor specific\
      \ configuration requirements of the `/tmp` mount for your environment, modify `/etc/fstab`.\r\n\r\
      \nExample of using `tmpfs` with specific mount options:\r\n\r\n```\r\ntmpfs\t/tmp\ttmpfs     defaults,rw,nosuid,nodev,noexec,relatime,size=2G\
      \  0 0\r\n```\r\n\r\n**Note:** the `size=2G` is an example of setting a specific size for `tmpfs`.\r\
      \n\r\nExample of using a volume or disk with specific mount options. The source location of the\
      \ volume or disk will vary depending on your environment:\r\n\r\n``` /tmp defaults,nodev,nosuid,noexec\
      \   0 0\r\n```\r\n\r\n**Note:** Using Btrfs subvolumes instead of traditional disk partitions changes\
      \ how disk space is allocated and enforced, quotas may need to be configured to enforce storage\
      \ limits and prevent resource exhaustion."
    additional_information: "`/tmp` can be configured to use `tmpfs`.\r\n\r\n`tmpfs` puts everything into\
      \ the kernel internal caches and grows and shrinks to accommodate the files it contains and is able\
      \ to swap unneeded pages out to swap space. It has maximum size limits which can be adjusted on\
      \ the fly via `mount -o remount`.\r\n\r\nSince `tmpfs` lives completely in the page cache and on\
      \ swap, all `tmpfs` pages will be shown as \"Shmem\" in `/proc/meminfo` and \"Shared\" in `free`.\
      \ Notice that these counters also include shared memory. The most reliable way to get the count\
      \ is using `df` and `du`.\r\n\r\n`tmpfs` has three mount options for sizing:\r\n - `size`: The limit\
      \ of allocated bytes for this `tmpfs` instance. The default is half of your physical RAM without\
      \ swap. If you oversize your `tmpfs` instances the machine will deadlock since the OOM handler will\
      \ not be able to free that memory.\r\n - `nr_blocks`: The same as size, but in blocks of PAGE_SIZE.\r\
      \n - `nr_inodes`: The maximum number of inodes for this instance. The default is half of the number\
      \ of your physical RAM pages, or (on a machine with highmem) the number of lowmem RAM pages, whichever\
      \ is the lower.\r\n\r\nThese parameters accept a suffix k, m or g and can be changed on remount.\
      \ The size parameter also accepts a suffix % to limit this `tmpfs` instance to that percentage of\
      \ your physical RAM. The default, when neither `size` nor `nr_blocks` is specified, is `size=50%`."
    default_value: ''
