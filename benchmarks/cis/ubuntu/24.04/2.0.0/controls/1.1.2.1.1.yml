control:
  id: CIS-1.1.2.1.1
  benchmark_id: cis-ubuntu-24.04
  title: Ensure /tmp is tmpfs or a separate partition
  description: "The `/tmp` directory is a world-writable directory used for temporary storage by all users\
    \ and some applications.\r\n\r\n**Note:** If an entry for `/tmp` exists in `/etc/fstab` it will take\
    \ precedence over entries in a systemd unit file. There is an exception to this when a system is diskless\
    \ and connected to iSCSI, entries in `/etc/fstab` may not take precedence over a systemd unit file."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.1_1_2_1_1.audit
  remediation: cis.ubuntu.24.04.v2_0_0.1_1_2_1_1.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.1_1_2_1_1.rollback
