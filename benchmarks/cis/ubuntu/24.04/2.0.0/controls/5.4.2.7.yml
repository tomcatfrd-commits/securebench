control:
  id: CIS-5.4.2.7
  benchmark_id: cis-ubuntu-24.04
  title: Ensure system accounts do not have a valid login shell
  description: There are a number of accounts provided with most distributions that are used to manage
    applications and are not intended to provide an interactive shell. Furthermore, a user may add special
    accounts that are not intended to provide an interactive shell.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_4_2_7.audit
  remediation: cis.ubuntu.24.04.v2_0_0.5_4_2_7.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.5_4_2_7.rollback
  verification: cis.ubuntu.24.04.v2_0_0.5_4_2_7.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 5.4.2.7
      url: https://workbench.cisecurity.org/sections/4177297/recommendations/7047798
    assessment_status: automated
    profiles:
    - Level 1 - Server
    - Level 1 - Workstation
    mappings:
      nist:
      - AC-11
      - AC-2(5)
      - AC-3
      - MP-2
      cis_v8:
      - '3.3'
      cis_v7:
      - '14.6'
      mitre_techniques:
      - T1078
