    parent: CIS _5_Configure root and system accounts and environment Main | 1.1.2.7-Ensure system accounts
      do not have a valid login shell
    rationale: It is important to make sure that accounts that are not being used by regular users are
      prevented from being used to provide an interactive shell. By default, most distributions set the
      password field for these accounts to an invalid string, but it is also recommended that the shell
      field in the password file be set to the `nologin` shell. This prevents the account from potentially
      being used to run any commands.
    impact: ''
    audit_guidance: "Run the following command to verify system accounts, except for `root`, `halt`, `sync`,\
      \ `shutdown` or `nfsnobody`, do not have a valid login shell:\r\n\r\n```\r\n#!/usr/bin/env bash\r\
      \n\r\n{\r\n   l_valid_shells=\"^($(awk -F\\/ '$NF != \"nologin\" {print}' /etc/shells | sed -rn\
      \ '/^\\//{s,/,\\\\\\\\/,g;p}' | paste -s -d '|' - ))$\"\r\n   awk -v pat=\"$l_valid_shells\" -F:\
      \ '($1!~/^(root|halt|sync|shutdown|nfsnobody)$/ && ($3<'\"$(awk '/^\\s*UID_MIN/{print $2}' /etc/login.defs)\"\
      ' || $3 == 65534) && $(NF) ~ pat) {print \"Service account: \\\"\" $1 \"\\\" has a valid shell:\
      \ \" $7}' /etc/passwd\r\n}\r\n```\r\n\r\nNothing should be returned"
    remediation_guidance: "Run the following command to set the shell for any service accounts returned\
      \ by the audit to `nologin`:\r\n\r\n```\r\n# usermod -s $(command -v nologin) ```\r\n\r\n_Example\
      \ script:_\r\n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n   l_valid_shells=\"^($( awk -F\\/ '$NF\
      \ != \"nologin\" {print}' /etc/shells | sed -rn '/^\\//{s,/,\\\\\\\\/,g;p}' | paste -s -d '|' -\
      \ ))$\"\r\n   awk -v pat=\"$l_valid_shells\" -F: '($1!~/^(root|halt|sync|shutdown|nfsnobody)$/ &&\
      \ ($3<'\"$(awk '/^\\s*UID_MIN/{print $2}' /etc/login.defs)\"' || $3 == 65534) && $(NF) ~ pat) {system\
      \ (\"usermod -s '\"$(command -v nologin)\"' \" $1)}' /etc/passwd\r\n}\r\n```"
    additional_information: The `root`, `sync`, `shutdown`, and `halt` users are exempted from requiring
      a non-login shell.
    default_value: ''
