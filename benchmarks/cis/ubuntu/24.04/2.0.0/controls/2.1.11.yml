control:
  id: CIS-2.1.11
  benchmark_id: cis-ubuntu-24.04
  title: Ensure message access server services are not in use
  description: '`dovecot-imapd` and `dovecot-pop3d` are an open source IMAP and POP3 server for Linux
    based systems.'
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.2_1_11.audit
  remediation: cis.ubuntu.24.04.v2_0_0.2_1_11.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.2_1_11.rollback
  verification: cis.ubuntu.24.04.v2_0_0.2_1_11.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 2.1.11
      url: https://workbench.cisecurity.org/sections/4177245/recommendations/7047572
    assessment_status: automated
    profiles:
    - Level 1 - Server
    - Level 1 - Workstation
    mappings:
      nist:
      - CM-7
      cis_v8:
      - '4.8'
      cis_v7:
      - '9.2'
      mitre_techniques:
      - T1203
      - T1203.000
      - T1210
      - T1210.000
      - T1543
      - T1543.002
      mitre_tactics:
      - TA0008
      mitre_mitigations:
      - M1042
    parent: CIS _2_Configure Server Services Main | 2.1.11-Ensure message access server services are not
      in use
    rationale: "Unless POP3 and/or IMAP servers are to be provided by this system, it is recommended that\
      \ the package be removed to reduce the potential attack surface.\r\n\r\n**Note:** Several IMAP/POP3\
      \ servers exist and can use other service names. These should also be audited and the packages removed\
      \ if not required."
    impact: "There may be packages that are dependent on `dovecot-imapd` and/or `dovecot-pop3d` packages.\
      \ If `dovecot-imapd` and `dovecot-pop3d` packages are removed, these dependent packages will be\
      \ removed as well. Before removing `dovecot-imapd` and/or `dovecot-pop3d` packages, review any dependent\
      \ packages to determine if they are required on the system.\r\n\r\n**- IF -** a dependent package\
      \ is required: stop and mask `dovecot.socket` and  `dovecot.service` leaving `dovecot-imapd` and/or\
      \ `dovecot-pop3d` packages installed."
    audit_guidance: "Run the following command to verify `dovecot-imapd` and `dovecot-pop3d` are not installed:\r\
      \n\r\n```\r\n# dpkg-query -s dovecot-imapd &>/dev/null && echo \"dovecot-imapd is installed\"\r\n\
      ```\r\n\r\nNothing should be returned.\r\n\r\n```\r\n# dpkg-query -s dovecot-pop3d &>/dev/null &&\
      \ echo \"dovecot-pop3d is installed\"\r\n```\r\n\r\nNothing should be returned.\r\n\r\n**- OR -**\r\
      \n\r\n**- IF -** a package is installed **and** is required for dependencies:\r\n\r\nRun the following\
      \ commands to verify `dovecot.socket` and `dovecot.service` are not enabled:\r\n\r\n```\r\n# systemctl\
      \ is-enabled dovecot.socket dovecot.service 2>/dev/null | grep 'enabled'\r\n\r\nNothing should be\
      \ returned\r\n```\r\n\r\nRun the following command to verify `dovecot.socket` and `dovecot.service`\
      \ are not active:\r\n\r\n```\r\n# systemctl is-active dovecot.socket dovecot.service 2>/dev/null\
      \ | grep '^active'\r\n\r\nNothing should be returned\r\n```\r\n\r\n**Note:** If the package is required\
      \ for a dependency\r\n - Ensure the dependent package is approved by local site policy\r\n - Ensure\
      \ stopping and masking the service and/or socket meets local site policy"
    remediation_guidance: "Run one of the following commands to remove `dovecot-imapd` and `dovecot-pop3d`:\r\
      \n\r\nRun the following commands to stop `dovecot.socket` and `dovecot.service`, and remove the\
      \ `dovecot-imapd` and `dovecot-pop3d` packages:\r\n\r\n```\r\n# systemctl stop dovecot.socket dovecot.service\r\
      \n# apt purge dovecot-imapd dovecot-pop3d\r\n```\r\n\r\n**- OR -**\r\n\r\n**- IF -** a package is\
      \ installed **and** is required for dependencies:\r\n\r\nRun the following commands to stop and\
      \ mask `dovecot.socket` and `dovecot.service`:\r\n\r\n```\r\n# systemctl stop dovecot.socket dovecot.service\r\
      \n# systemctl mask dovecot.socket dovecot.service\r\n```"
    additional_information: Several IMAP/POP3 servers exist and can use other service names. `courier-imap`
      and `cyrus-imap` are example services that provide a mail server. These and other services should
      also be audited.
