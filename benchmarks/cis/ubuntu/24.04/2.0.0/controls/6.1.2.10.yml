control:
  id: CIS-6.1.2.10
  benchmark_id: cis-ubuntu-24.04
  title: Ensure rsyslog CA certificates are configured
  description: When rsyslog forwards log data to a remote host over TLS, it uses a Certificate Authority
    (CA) certificate to verify the authenticity of the remote server's TLS certificate. The CA certificate
    is specified using the `DefaultNetstreamDriverCAFile` global option in rsyslog configuration.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.6_1_2_10.audit
  remediation: cis.ubuntu.24.04.v2_0_0.6_1_2_10.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.6_1_2_10.rollback
  verification: cis.ubuntu.24.04.v2_0_0.6_1_2_10.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 6.1.2.10
      url: https://workbench.cisecurity.org/sections/4177249/recommendations/7047587
    assessment_status: manual
    profiles:
    - Level 2 - Server
    - Level 2 - Workstation
    mappings:
      nist: []
      cis_v8:
      - '3.10'
      - '8.9'
      cis_v7: []
      mitre_techniques: []
      mitre_tactics: []
      mitre_mitigations: []
    parent: CIS _6_System Logging Main | 2.2.2.10-Ensure rsyslog CA certificates are configured
    rationale: Configuring a trusted CA certificate ensures that rsyslog only connects to log servers
      whose TLS certificates are signed by a known, trusted authority. Without a properly configured CA
      certificate, log forwarding may proceed without server identity verification, exposing the system
      to man-in-the-middle attacks that could intercept, tamper with, or silently discard forwarded log
      data. This could result in undetected data leakage or loss of audit trail integrity.
    impact: Proper certificate management is required. If the CA certificate file is missing, expired,
      or points to an incorrect path, TLS-encrypted log forwarding will fail until the trust chain is
      restored. Self-signed certificates should not be used as the CA certificate for production environments.
    audit_guidance: "Run the following command and verify `rsyslog` is configured to use CA certificate:\r\
      \n```\r\n# grep -Psi -- 'DefaultNetstreamDriver' /etc/rsyslog.conf /etc/rsyslog.d/*\r\n```\r\n_Example\
      \ Output_\r\n```\r\n/etc/rsyslog.d/40-forward.conf:DefaultNetstreamDriverCAFile=\"/path/to/contrib/gnutls/ca.pem\"\
      \r\n```\r\n\r\nVerify the path returned points to a valid, readable CA certificate file:\r\n\r\n\
      ```\r\n# openssl verify \"$(grep -Pso '(?<=DefaultNetstreamDriverCAFile=\")[^\"]+' /etc/rsyslog.conf\
      \ /etc/rsyslog.d/* 2>/dev/null | head -1)\"\r\n```\r\n\r\n**Note:** The audit checks only that the\
      \ `DefaultNetstreamDriverCAFile` parameter is configured and points to an existing file. It does\
      \ not validate the certificate chain against the remote server. The CA certificate should come from\
      \ a known trusted source and must not be self-signed for production log forwarding."
    remediation_guidance: "Edit `/etc/rsyslog.conf` or a `.conf` file in `/etc/rsyslog.d/` to configure\
      \ the correct path to the CA certificate file:\r\n\r\n_Example using the system CA bundle:_\r\n\r\
      \n```\r\nglobal(DefaultNetstreamDriverCAFile=\"/etc/ssl/certs/ca-certificates.crt\")\r\n```\r\n\r\
      \n_Example using a dedicated CA certificate:_\r\n\r\n```\r\nglobal(DefaultNetstreamDriverCAFile=\"\
      /etc/rsyslog/tls/ca.pem\")\r\n```\r\n\r\nAfter editing, restart rsyslog to apply the change:\r\n\
      \r\n```\r\n# systemctl restart rsyslog\r\n```"
