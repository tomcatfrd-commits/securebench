control:
  id: CIS-6.2.3.1
  benchmark_id: cis-ubuntu-24.04
  title: Ensure changes to system administration scope (sudoers) is collected
  description: Monitor scope changes for system administrators. If the system has been properly configured
    to force system administrators to log in as themselves first and then use the `sudo` command to execute
    privileged commands, it is possible to monitor changes in scope. The file `/etc/sudoers`, or files
    in `/etc/sudoers.d`, will be written to when the file(s) or related attributes have changed. The audit
    records will be tagged with the identifier "scope".
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.6_2_3_1.audit
  remediation: cis.ubuntu.24.04.v2_0_0.6_2_3_1.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.6_2_3_1.rollback
  verification: cis.ubuntu.24.04.v2_0_0.6_2_3_1.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 6.2.3.1
      url: https://workbench.cisecurity.org/sections/4203192/recommendations/7091548
    assessment_status: automated
    profiles:
    - Level 2 - Server
    - Level 2 - Workstation
    mappings:
      nist:
      - AU-3
      cis_v8:
      - '8.5'
      cis_v7:
      - '4.8'
      mitre_techniques:
      - T1562
      - T1562.006
