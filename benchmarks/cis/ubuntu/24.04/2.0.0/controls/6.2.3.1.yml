      mitre_mitigations:
      - M1047
    parent: CIS _6_System Auditing Main | 2.2.3.1-Ensure changes to system administration scope (sudoers)
      is collected
    rationale: Changes in the `/etc/sudoers` and `/etc/sudoers.d` files can indicate that an unauthorized
      change has been made to the scope of system administrator activity.
    impact: ''
    audit_guidance: "1. Run the following command to verify a rule exists in the running configuration:\r\
      \n```\r\n# auditctl -l | grep -Ps -- '^\\h*[^#\\n\\r]+\\h*\\/etc\\/sudo'\r\n```\r\n\r\nVerify the\
      \ output includes:\r\n```\r\n-w /etc/sudoers -p wa -k scope\r\n-w /etc/sudoers.d -p wa -k scope\r\
      \n```\r\n\r\n2. Run the following command to verify a rule exists in a rules file:\r\n\r\n```  \r\
      \n# grep -Ps -- '^\\h*[^#\\n\\r]+\\h*\\/etc\\/sudo' /etc/audit/rules.d/*.rules\r\n```\r\n\r\n_Example\
      \ output_:\r\n```\r\n/etc/audit/rules.d/50-scope.rules:-w /etc/sudoers -p wa -k scope\r\n/etc/audit/rules.d/50-scope.rules:-w\
      \ /etc/sudoers.d -p wa -k scope\r\n```"
    remediation_guidance: "Edit or create a file in the `/etc/audit/rules.d/` directory, ending in `.rules`\
      \ extension, with the relevant rules to monitor scope changes for system administrators.\r\n\r\n\
      _Example:_\r\n\r\n```\r\n# printf \"\r\n-w /etc/sudoers -p wa -k scope\r\n-w /etc/sudoers.d -p wa\
      \ -k scope\r\n\" >> /etc/audit/rules.d/50-scope.rules\r\n```\r\n\r\nMerge and load the rules into\
      \ active configuration:\r\n\r\n```\r\n# augenrules --load\r\n```\r\n\r\nCheck if reboot is required.\r\
      \n\r\n```\r\n# if [[ $(auditctl -s | grep \"enabled\") =~ \"2\" ]]; then printf \"Reboot required\
      \ to load rules\\n\"; fi\r\n```"
    additional_information: ''
    default_value: ''
    artifacts_count: 4
    requirements: {}
    safety:
