    parent: CIS _6_System Logging Main | 2.2.1.1.1-Ensure journald service is active
    rationale: If the `systemd-journald` service is not enabled to start on boot, the system will not
      capture logging events.
    impact: ''
    audit_guidance: "Run the following command to verify `systemd-journald` is active:\r\n\r\n```\r\n\
      # systemctl is-active systemd-journald.service\r\n\r\nactive\r\n```"
    remediation_guidance: "Run the following commands to unmask, enable, and start `systemd-journald.service`\r\
      \n\r\n```\r\n# systemctl unmask systemd-journald.service\r\n# systemctl --now enable systemd-journald.service\r\
      \n```"
