control:
  id: CIS-2.2.4
  benchmark_id: cis-ubuntu-24.04
  title: Ensure telnet client is not installed
  description: The `telnet` and `inetutils-telnet` packages contain the `telnet` client, which allows
    users to start connections to other systems via the telnet protocol.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.2_2_4.audit
