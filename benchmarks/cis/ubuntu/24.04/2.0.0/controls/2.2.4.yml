    parent: CIS _2_Configure Client Services Main | 2.1.5-Ensure telnet client is not installed
    rationale: The `telnet` protocol is insecure and unencrypted. The use of an unencrypted transmission
      medium could allow an unauthorized user to steal credentials. The `ssh` package provides an encrypted
      session and stronger security and is included in most Linux distributions.
    impact: Many insecure service clients are used as troubleshooting tools and in testing environments.
      Uninstalling them can inhibit capability to test and troubleshoot. If they are required it is advisable
      to remove the clients after use to prevent accidental or intentional misuse.
    audit_guidance: "1. Run the following command to verify the `telnet` package is not installed:\r\n\
      \r\n```\r\n# dpkg-query -s telnet &>/dev/null && echo \"telnet package is installed\"\r\n```\r\n\
      \r\nNothing should be returned\r\n\r\n2. Run the following command to verify the `inetutils-telnet`\
      \ package is not installed:\r\n\r\n```\r\n# dpkg-query -s inetutils-telnet &>/dev/null && echo \"\
      inetutils-telnet package is installed\"\r\n```\r\n\r\nNothing should be returned."
    remediation_guidance: "Run the following command to uninstall and purge the `telnet` and/or `inetutils-telnet`\
      \ package(s):\r\n\r\n```\r\n# apt purge telnet inetutils-telnet\r\n```"
    additional_information: ''
