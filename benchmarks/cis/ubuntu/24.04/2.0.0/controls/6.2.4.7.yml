    parent: CIS _6_System Auditing Main | 2.2.4.7-Ensure audit configuration files group owner is configured
    rationale: "Access to the audit configuration files could allow unauthorized personnel to prevent\
      \ the auditing of critical events. \r\n\r\nMisconfigured audit configuration files may prevent the\
      \ auditing of critical events or impact the system's performance by overwhelming the audit log.\
      \ Misconfiguration of the audit configuration files may also make it more difficult to establish\
      \ and investigate events relating to an incident."
    impact: ''
    audit_guidance: "Run the following command to verify that the audit configuration files are owned\
      \ by the group `root`: \r\n\r\n```\r\n# find /etc/audit/ -type f \\( -name '*.conf' -o -name '*.rules'\
      \ \\) ! -group root\r\n```\r\n\r\nNothing should be returned"
    remediation_guidance: "Run the following command to change group to `root`:\r\n\r\n```\r\n# find /etc/audit/\
      \ -type f \\( -name '*.conf' -o -name '*.rules' \\) ! -group root -exec chgrp root {} +\r\n```"
    additional_information: ''
    default_value: ''
    artifacts_count: 2
    requirements: {}
    safety:
