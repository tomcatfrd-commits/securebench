  title: Ensure access to /etc/group is configured
  description: The `/etc/group` file contains a list of all the valid groups defined in the system. The
    command below allows read/write access for root and read access for everyone else.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.7_1_3.audit
  remediation: cis.ubuntu.24.04.v2_0_0.7_1_3.remediate
