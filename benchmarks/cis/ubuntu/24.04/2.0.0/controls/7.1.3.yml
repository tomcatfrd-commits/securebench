    parent: CIS _7_System File Permissions Main | 2.1.3-Ensure access to /etc/group is configured
    rationale: The `/etc/group` file needs to be protected from unauthorized changes by non-privileged
      users, but needs to be readable as this information is used with many non-privileged programs.
    impact: ''
    audit_guidance: "Run the following command to verify `/etc/group` is mode 644 or more restrictive,\
      \ `Uid` is `0/root` and `Gid` is `0/root`:\r\n\r\n```\r\n# stat -Lc 'Access: (%#a/%A)  Uid: ( %u/\
      \ %U) Gid: ( %g/ %G)' /etc/group\r\n\r\nAccess: (0644/-rw-r--r--)  Uid: ( 0/ root) Gid: ( 0/ root)\r\
      \n```"
    remediation_guidance: "Run the following commands to remove excess permissions, set owner, and set\
      \ group on `/etc/group`:\r\n\r\n```\r\n# chmod u-x,go-wx /etc/group\r\n# chown root:root /etc/group\r\
      \n```"
    additional_information: ''
    default_value: 'Access: (0644/-rw-r--r--)  Uid: ( 0/ root) Gid: ( 0/ root)'
