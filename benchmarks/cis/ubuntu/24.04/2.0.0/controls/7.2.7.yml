control:
  id: CIS-7.2.7
  benchmark_id: cis-ubuntu-24.04
  title: Ensure no duplicate user names exist
  description: Although the `useradd` program will not let you create a duplicate user name, it is possible
    for an administrator to manually edit the `/etc/passwd` file and change the user name.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.7_2_7.audit
  remediation: cis.ubuntu.24.04.v2_0_0.7_2_7.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.7_2_7.rollback
  verification: cis.ubuntu.24.04.v2_0_0.7_2_7.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 7.2.7
      url: https://workbench.cisecurity.org/sections/4177259/recommendations/7047617
    assessment_status: automated
    profiles:
    - Level 1 - Server
    - Level 1 - Workstation
    mappings:
      nist:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
      cis_v8:
      - '0'
      cis_v7:
      - '0'
      mitre_techniques:
      - T1078
      - T1078.001
