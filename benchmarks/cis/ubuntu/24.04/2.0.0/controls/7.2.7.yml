      - M1027
    parent: CIS _7_Local User and Group Settings Main | 2.1.6-Ensure no duplicate user names exist
    rationale: If a user is assigned a duplicate user name, it will create and have access to files with
      the first UID for that username in `/etc/passwd` . For example, if "test4" has a UID of 1000 and
      a subsequent "test4" entry has a UID of 2000, logging in as "test4" will use UID 1000. Effectively,
      the UID is shared, which is a security problem.
    impact: ''
    audit_guidance: "Run the following script and verify no results are returned:\r\n\r\n```\r\n#!/usr/bin/env\
      \ bash\r\n\r\n{\r\n   while read -r l_count l_user; do\r\n      if [ \"$l_count\" -gt 1 ]; then\r\
      \n         echo -e \"Duplicate User: \\\"$l_user\\\" Users: \\\"$(awk -F: '($1 == n) { print $1\
      \ }' n=$l_user /etc/passwd | xargs)\\\"\"\r\n      fi\r\n   done < <(cut -f1 -d\":\" /etc/passwd\
      \ | sort -n | uniq -c)\r\n}\r\n```"
    remediation_guidance: Based on the results of the audit script, establish unique user names for the
      users. File ownerships will automatically reflect the change as long as the users have unique UIDs.
    additional_information: ''
    default_value: ''
    artifacts_count: 1
    requirements: {}
    safety:
      default: investigate
      implementation_status: guidance_only
      reason: Imported CIS guidance has not yet been promoted to a reviewed SecureBench implementation.
