    parent: CIS _1_Configure Additional Process Hardening Main | 2.2.6-Ensure prelink is not installed
    rationale: The prelinking feature can interfere with the operation of AIDE, because it changes binaries.
      Prelinking can also increase the vulnerability of the system if a malicious user is able to compromise
      a common library such as libc.
    impact: ''
    audit_guidance: "Verify `prelink`  is not installed:\r\n```\r\n# dpkg-query -s prelink &>/dev/null\
      \ && echo \"prelink is installed\" \r\n```\r\nNothing should be returned."
    remediation_guidance: "Run the following command to restore binaries to normal:\r\n\r\n```\r\n# prelink\
      \ -ua\r\n```\r\n\r\nUninstall `prelink`  using the appropriate package manager or manual installation:\r\
      \n\r\n```\r\n# apt purge prelink\r\n```"
