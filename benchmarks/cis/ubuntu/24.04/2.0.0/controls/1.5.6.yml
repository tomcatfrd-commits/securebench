control:
  id: CIS-1.5.6
  benchmark_id: cis-ubuntu-24.04
  title: Ensure prelink is not installed
  description: '`prelink` is a program that modifies ELF shared libraries and ELF dynamically linked binaries
    in such a way that the time needed for the dynamic linker to perform relocations at startup significantly
    decreases.'
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.1_5_6.audit
  remediation: cis.ubuntu.24.04.v2_0_0.1_5_6.remediate
