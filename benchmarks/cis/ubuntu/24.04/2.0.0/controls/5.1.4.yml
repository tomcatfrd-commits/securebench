control:
  id: CIS-5.1.4
  benchmark_id: cis-ubuntu-24.04
  title: Ensure sshd access is configured
  description: "There are several options available to limit which users and group can access the system\
    \ via SSH. It is recommended that at least one of the following options be leveraged:\r\n\r\n- `AllowUsers`:\r\
    \n  - The `AllowUsers` variable gives the system administrator the option of allowing specific users\
    \ to `ssh` into the system. The list consists of space separated user names. Numeric user IDs are\
    \ not recognized with this variable. If a system administrator wants to restrict user access further\
    \ by only allowing the allowed users to log in from a particular host, the entry can be specified\
    \ in the form of user@host.\r\n- `AllowGroups`:\r\n  - The `AllowGroups` variable gives the system\
    \ administrator the option of allowing specific groups of users to `ssh` into the system. The list\
    \ consists of space separated group names. Numeric group IDs are not recognized with this variable.\r\
    \n- `DenyUsers`:\r\n  - The `DenyUsers` variable gives the system administrator the option of denying\
    \ specific users to `ssh` into the system. The list consists of space separated user names. Numeric\
    \ user IDs are not recognized with this variable. If a system administrator wants to restrict user\
    \ access further by specifically denying a user's access from a particular host, the entry can be\
    \ specified in the form of user@host.\r\n- `DenyGroups`:\r\n  - The `DenyGroups` variable gives the\
    \ system administrator the option of denying specific groups of users to `ssh` into the system. The\
    \ list consists of space separated group names. Numeric group IDs are not recognized with this variable.\r\
    \n\r\nMore information about the openSSH server configuration is available in the \"Configure SSH\
    \ Server\" section overview."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_1_4.audit
