    parent: CIS _5_Configure SSH Server Main | 2.2.5-Ensure sshd access is configured
    rationale: Restricting which users can remotely access the system via SSH will help ensure that only
      authorized users access the system.
    impact: These options are "ANDed" together. If both `AllowUsers` and `AllowGroups` are set, connections
      will be limited to the list of users that are also a member of an allowed group. It is recommended
      that only one be set for clarity and ease of administration.
    audit_guidance: "Run the following command and verify the output:\r\n\r\n```\r\n# sshd -T | grep -Pi\
      \ -- '^\\h*(allow|deny)(users|groups)\\h+\\H+'\r\n```\r\n\r\nVerify that the output matches at least\
      \ one of the following lines:\r\n\r\n```\r\nallowusers -OR-\r\nallowgroups -OR-\r\ndenyusers -OR-\r\
      \ndenygroups ```\r\n\r\nReview the list(s) to ensure included users and/or groups follow local site\
      \ policy\r\n\r\n**- IF -** `Match` set statements are used in your environment, specify the connection\
      \ parameters to use for the `-T` extended test mode and run the audit to verify the setting is not\
      \ incorrectly configured in a match block\r\n\r\n_Example additional audit needed for a match block\
      \ for the user `sshuser`:_\r\n\r\n```\r\n# sshd -T -C user=sshuser | grep -Pi -- '^\\h*(allow|deny)(users|groups)\\\
      h+\\H+'\r\n```"
    remediation_guidance: "Create or edit a `*.conf` file in the `/etc/ssh/sshd_config.d/` and set one\
      \ or more of the parameters above any `Include` and `Match` set statements as follows:\r\n\r\n```\r\
      \nAllowUsers - AND/OR -\r\nAllowGroups ```\r\n\r\n>**Note:** It is easier to manage an allow list\
      \ than a deny list. In a deny list, you could potentially add a user or group and forget to add\
      \ it to the deny list."
