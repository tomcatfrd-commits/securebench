control:
  id: CIS-2.3.2.1
  benchmark_id: cis-ubuntu-24.04
  title: Ensure systemd-timesyncd configured with authorized timeserver
  description: "`NTP=`\r\n- A space-separated list of NTP server host names or IP addresses. During runtime\
    \ this list is combined with any per-interface NTP servers acquired from systemd-networkd.service(8).\
    \ systemd-timesyncd will contact all configured system or per-interface servers in turn, until one\
    \ responds. When the empty string is assigned, the list of NTP servers is reset, and all prior assignments\
    \ will have no effect. This setting defaults to an empty list.\r\n\r\n`FallbackNTP=`\r\n- A space-separated\
    \ list of NTP server host names or IP addresses to be used as the fallback NTP servers. Any per-interface\
    \ NTP servers obtained from systemd-networkd.service(8) take precedence over this setting, as do any\
    \ servers set via NTP= above. This setting is hence only relevant if no other NTP server information\
    \ is known. When the empty string is assigned, the list of NTP servers is reset, and all prior assignments\
    \ will have no effect. If this option is not given, a compiled-in list of NTP servers is used."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.2_3_2_1.audit
  remediation: cis.ubuntu.24.04.v2_0_0.2_3_2_1.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.2_3_2_1.rollback
  verification: cis.ubuntu.24.04.v2_0_0.2_3_2_1.verify
  rollback_capability: unsupported
