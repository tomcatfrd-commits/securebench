control:
  id: CIS-6.2.4.8
  benchmark_id: cis-ubuntu-24.04
  title: Ensure audit tools mode is configured
  description: Audit tools include, but are not limited to, vendor-provided and open source audit tools
    needed to successfully view and manipulate audit information system activity and records. Audit tools
    include custom queries and report generators.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.6_2_4_8.audit
  remediation: cis.ubuntu.24.04.v2_0_0.6_2_4_8.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.6_2_4_8.rollback
  verification: cis.ubuntu.24.04.v2_0_0.6_2_4_8.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 6.2.4.8
      url: https://workbench.cisecurity.org/sections/4177289/recommendations/7047768
    assessment_status: automated
    profiles:
    - Level 2 - Server
    - Level 2 - Workstation
    mappings:
      nist:
      - AU-3
      cis_v8:
      - '3.3'
      cis_v7:
      - '14.6'
      mitre_techniques:
      - T1070
      - T1070.002
      - T1083
      - T1083.000
