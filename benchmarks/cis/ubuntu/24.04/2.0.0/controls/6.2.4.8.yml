      mitre_mitigations:
      - M1022
    parent: CIS _6_System Auditing Main | 2.2.4.8-Ensure audit tools mode is configured
    rationale: Protecting audit information includes identifying and protecting the tools used to view
      and manipulate log data. Protecting audit tools is necessary to prevent unauthorized operation on
      audit information.
    impact: ''
    audit_guidance: "Run the following script to verify the audit tools  are mode `0755` or more restrictive:\r\
      \n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n   l_output=\"\" l_output2=\"\" l_perm_mask=\"0022\"\
      \r\n   l_maxperm=\"$( printf '%o' $(( 0777 & ~$l_perm_mask )) )\"\r\n   a_audit_tools=(\"/sbin/auditctl\"\
      \ \"/sbin/aureport\" \"/sbin/ausearch\" \"/sbin/autrace\" \"/sbin/auditd\" \"/sbin/augenrules\"\
      )\r\n   for l_audit_tool in \"${a_audit_tools[@]}\"; do\r\n      l_mode=\"$(stat -Lc '%#a' \"$l_audit_tool\"\
      )\"\r\n      if [ $(( \"$l_mode\" & \"$l_perm_mask\" )) -gt 0 ]; then\r\n         l_output2=\"$l_output2\\\
      n - Audit tool \\\"$l_audit_tool\\\" is mode: \\\"$l_mode\\\" and should be mode: \\\"$l_maxperm\\\
      \" or more restrictive\"\r\n      else\r\n         l_output=\"$l_output\\n - Audit tool \\\"$l_audit_tool\\\
      \" is correctly configured to mode: \\\"$l_mode\\\"\"\r\n      fi\r\n   done\r\n   if [ -z \"$l_output2\"\
      \ ]; then\r\n      echo -e \"\\n- Audit Result:\\n  ** PASS **\\n - * Correctly configured * :$l_output\"\
      \r\n   else\r\n      echo -e \"\\n- Audit Result:\\n  ** FAIL **\\n - * Reasons for audit failure\
      \ * :$l_output2\\n\"\r\n      [ -n \"$l_output\" ] && echo -e \"\\n - * Correctly configured * :\\\
      n$l_output\\n\"\r\n   fi\r\n   unset a_audit_tools\r\n}\r\n```"
    remediation_guidance: "Run the following command to remove more permissive mode from the audit tools:\
      \ \r\n\r\n```\r\n# chmod go-w /sbin/auditctl /sbin/aureport /sbin/ausearch /sbin/autrace /sbin/auditd\
      \ /sbin/augenrules\r\n```"
    additional_information: ''
