control:
  id: CIS-2.1.3
  benchmark_id: cis-ubuntu-24.04
  title: Ensure avahi daemon services are not in use
  description: Avahi is a free zeroconf implementation, including a system for multicast DNS/DNS-SD service
    discovery. Avahi allows programs to publish and discover services and hosts running on a local network
    with no specific configuration. For example, a user can plug a computer into a network and Avahi automatically
    finds printers to print to, files to look at and people to talk to, as well as network services running
    on the machine.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.2_1_3.audit
  remediation: cis.ubuntu.24.04.v2_0_0.2_1_3.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.2_1_3.rollback
  verification: cis.ubuntu.24.04.v2_0_0.2_1_3.verify
  rollback_capability: unsupported
