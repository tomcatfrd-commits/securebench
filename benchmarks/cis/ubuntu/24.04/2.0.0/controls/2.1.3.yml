    parent: CIS _2_Configure Server Services Main | 2.1.3-Ensure avahi daemon services are not in use
    rationale: Automatic discovery of network services is not normally required for system functionality.
      It is recommended to remove this package to reduce the potential attack surface.
    impact: "There may be packages that are dependent on the `avahi` package.  If the `avahi` package\
      \ is removed, these dependent packages will be removed as well. Before removing the `avahi` package,\
      \ review any dependent packages to determine if they are required on the system.\r\n\r\n**- IF -**\
      \ a dependent package is required: stop and mask the `avahi-daemon.socket` and `avahi-daemon.service`\
      \ leaving the `avahi` package installed."
    audit_guidance: "Run the following command to verify `avahi-daemon` is not installed:\r\n```\r\n#\
      \ dpkg-query -s avahi-daemon &>/dev/null && echo \"avahi-daemon is installed\"\r\n```\r\n\r\nNothing\
      \ should be returned.\r\n\r\n\r\n**- OR -** \r\n\r\n**- IF -** the `avahi` package is required as\
      \ a dependency:\r\n\r\nRun the following command to verify `avahi-daemon.socket` and `avahi-daemon.service`\
      \ are not enabled:\r\n\r\n```\r\n# systemctl is-enabled avahi-daemon.socket avahi-daemon.service\
      \ 2>/dev/null | grep 'enabled'\r\n\r\nNothing should be returned\r\n```\r\n\r\nRun the following\
      \ command to verify `avahi-daemon.socket` and `avahi-daemon.service` are not active:\r\n\r\n```\r\
      \n# systemctl is-active avahi-daemon.socket avahi-daemon.service 2>/dev/null | grep '^active'\r\n\
      \r\nNothing should be returned\r\n```\r\n\r\n**Note:** If the package is required for a dependency\r\
      \n - Ensure the dependent package is approved by local site policy\r\n - Ensure stopping and masking\
      \ the service and/or socket meets local site policy"
    remediation_guidance: "Run the following commands to stop `avahi-daemon.socket` and `avahi-daemon.service`,\
      \ and remove the `avahi-daemon` package:\r\n\r\n```\r\n# systemctl stop avahi-daemon.socket avahi-daemon.service\r\
      \n# apt purge avahi-daemon\r\n```\r\n\r\n**- OR -**\r\n\r\n**- IF -** the `avahi-daemon` package\
      \ is required as a dependency:\r\n\r\nRun the following commands to stop and mask the `avahi-daemon.socket`\
      \ and `avahi-daemon.service`:\r\n\r\n```\r\n# systemctl stop avahi-daemon.socket avahi-daemon.service\r\
      \n# systemctl mask avahi-daemon.socket avahi-daemon.service\r\n```"
    additional_information: ''
