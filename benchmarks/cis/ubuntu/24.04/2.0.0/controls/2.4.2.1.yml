control:
  id: CIS-2.4.2.1
  benchmark_id: cis-ubuntu-24.04
  title: Ensure access to at is configured
  description: "`at` allows fairly complex time specifications, extending the POSIX.2 standard. It accepts\
    \ times of the form HH:MM to run a job at a specific time of day. (If that time is already past, the\
    \ next day is assumed.) You may also specify midnight, noon, or teatime (4pm) and you can have a time-of-day\
    \ suffixed with AM or PM for running in the morning or the evening. You can also say what day the\
    \ job will be run, by giving a date in the form month-name day with an optional year, or giving a\
    \ date of the form MMDD[CC]YY, MM/DD/[CC]YY,  DD.MM.[CC]YY or [CC]YY-MM-DD. The specification of a\
    \ date must follow the specification of the time of day. You can also give times like now + count\
    \ time-units, where the time-units can be minutes, hours, days, or weeks and you can tell at to run\
    \ the job today by suffixing the time with today and to run the job tomorrow by suffixing the time\
    \ with tomorrow.\r\n\r\nThe `/etc/at.allow` and `/etc/at.deny` files determine which user can submit\
    \ commands for later execution via at or batch. The format of the files is a list of usernames, one\
    \ on each line. Whitespace is not permitted. If the file `/etc/at.allow` exists, only usernames mentioned\
    \ in it are allowed to use at. If `/etc/at.allow` does not exist, `/etc/at.deny` is checked, every\
    \ username not mentioned in it is then allowed to use at. An empty `/etc/at.deny` means that every\
    \ user may use at. If neither file exists, only the superuser is allowed to use at."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.2_4_2_1.audit
  remediation: cis.ubuntu.24.04.v2_0_0.2_4_2_1.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.2_4_2_1.rollback
  verification: cis.ubuntu.24.04.v2_0_0.2_4_2_1.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 2.4.2.1
      url: https://workbench.cisecurity.org/sections/4177292/recommendations/7047772
    assessment_status: automated
    profiles:
    - Level 1 - Server
    - Level 1 - Workstation
    mappings:
      nist:
      - AC-3
      cis_v8:
      - '3.3'
      cis_v7:
      - '14.6'
      mitre_techniques:
      - T1053
      - T1053.003
      mitre_tactics:
      - TA0002
      mitre_mitigations:
      - M1018
    parent: CIS _2_Configure at Main | 1.1.1.1-Ensure access to at is configured
    rationale: On many systems, only the system administrator is authorized to schedule `at` jobs. Using
      the `at.allow` file to control who can run `at` jobs enforces this policy. It is easier to manage
      an allow list than a deny list. In a deny list, you could potentially add a user ID to the system
      and forget to add it to the deny files.
    impact: ''
    audit_guidance: "**- IF -** at is installed on the system:\r\n\r\nRun the following command to verify\
      \ `/etc/at.allow`:\r\n- Exists\r\n- Is mode `0640` or more restrictive\r\n- Is owned by the user\
      \ `root`\r\n- Is group owned by the group `daemon` or group `root`\r\n\r\n```\r\n# stat -Lc 'Access:\
      \ (%a/%A) Owner: (%U) Group: (%G)' /etc/at.allow\r\n\r\nAccess: (640/-rw-r-----) Owner: (root) Group:\
      \ (daemon)\r\n-OR-\r\nAccess: (640/-rw-r-----) Owner: (root) Group: (root)\r\n```\r\n\r\nVerify\
      \ mode is `640` or more restrictive, owner is `root`, and group is `daemon` or `root`\r\n\r\nRun\
      \ the following command to verify `at.deny` doesn't exist, **-OR-** is:\r\n- Mode `0640` or more\
      \ restrictive\r\n- Owned by the user `root`\r\n- Group owned by the group `daemon` or group `root`\r\
      \n\r\n```\r\n# [ -e \"/etc/at.deny\" ] && stat -Lc 'Access: (%a/%A) Owner: (%U) Group: (%G)' /etc/at.deny\r\
      \n\r\nAccess: (640/-rw-r-----) Owner: (root) Group: (daemon)\r\n-OR-\r\nAccess: (640/-rw-r-----)\
      \ Owner: (root) Group: (root)\r\n-OR-\r\nNothing is returned\r\n```\r\n\r\nIf a value is returned,\
      \ verify mode is 640 or more restrictive, owner is `root`, and group is `daemon` or `root`"
    remediation_guidance: "**- IF -** at is installed on the system:\r\n\r\nRun the following script to:\r\
      \n- `/etc/at.allow`:\r\n  - Create the file if it doesn't exist\r\n  - Change owner or user `root`\r\
      \n  - If group `daemon` exists, change to group `daemon`, else change group to `root`\r\n  - Change\
      \ mode to `640` or more restrictive\r\n- **- IF -** `/etc/at.deny` exists:\r\n  - Change owner or\
      \ user `root`\r\n  - If group `daemon` exists, change to group `daemon`, else change group to `root`\r\
      \n  - Change mode to `640` or more restrictive\r\n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n  \
      \ grep -Pq -- '^daemon\\b' /etc/group && l_group=\"daemon\" || l_group=\"root\"\r\n   [ ! -e \"\
      /etc/at.allow\" ] && touch /etc/at.allow\r\n   chown root:\"$l_group\" /etc/at.allow\r\n   chmod\
      \ u-x,g-wx,o-rwx /etc/at.allow\r\n   [ -e \"/etc/at.deny\" ] && chown root:\"$l_group\" /etc/at.deny\r\
      \n   [ -e \"/etc/at.deny\" ] && chmod u-x,g-wx,o-rwx /etc/at.deny\r\n}\r\n```"
