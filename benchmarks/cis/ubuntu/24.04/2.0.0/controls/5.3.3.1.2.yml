control:
  id: CIS-5.3.3.1.2
  benchmark_id: cis-ubuntu-24.04
  title: Ensure password unlock time is configured
  description: "`unlock_time= ` - The access will be re-enabled after _ _ seconds after the lock out.\
    \ The value `0` has the same meaning as value never - the access will not be re-enabled without resetting\
    \ the faillock entries by the faillock(8) command.\r\n\r\n**Note:**\r\n- The default directory that\
    \ pam_faillock uses is usually cleared on system boot so the access will be also re-enabled after\
    \ system reboot. If that is undesirable a different tally directory must be set with the dir option.\r\
    \n- It is usually undesirable to permanently lock out users as they can become easily a target of\
    \ denial of service attack unless the usernames are random and kept secret to potential attackers.\r\
    \n- The maximum configurable value for `unlock_time` is `604800`"
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_3_3_1_2.audit
  remediation: cis.ubuntu.24.04.v2_0_0.5_3_3_1_2.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.5_3_3_1_2.rollback
  verification: cis.ubuntu.24.04.v2_0_0.5_3_3_1_2.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 5.3.3.1.2
      url: https://workbench.cisecurity.org/sections/4177284/recommendations/7047708
    assessment_status: automated
