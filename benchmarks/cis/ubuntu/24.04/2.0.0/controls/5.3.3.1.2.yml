    parent: CIS _5_Pluggable Authentication Modules Main | 2.1.4.1.2-Ensure password unlock time is configured
    rationale: Locking out user IDs after _n_ unsuccessful consecutive login attempts mitigates brute
      force password attacks against your systems.
    impact: Use of `unlock_time=0` may allow an attacker to cause denial of service to legitimate users.
      This will also require a systems administrator with elevated privileges to unlock the account.
    audit_guidance: "Run the following command to verify that the time in seconds before the account is\
      \ unlocked is either `0` (never) or `900` (15 minutes) or more and meets local site policy:\r\n\r\
      \n```\r\n# grep -Pi -- '^\\h*unlock_time\\h*=\\h*(0|9[0-9][0-9]|[1-9][0-9]{3,})\\b' /etc/security/faillock.conf\r\
      \n\r\nunlock_time = 900\r\n```\r\n\r\nRun the following command to verify that the `unlock_time`\
      \ argument has not been set, or is either `0` (never) or `900` (15 minutes) or more and meets local\
      \ site policy:\r\n\r\n```\r\n# grep -Pi -- '^\\h*auth\\h+(requisite|required|sufficient)\\h+pam_faillock\\\
      .so\\h+([^#\\n\\r]+\\h+)?unlock_time\\h*=\\h*([1-9]|[1-9][0-9]|[1-8][0-9][0-9])\\b' /etc/pam.d/common-auth\r\
      \n```\r\n\r\nNothing should be returned"
    remediation_guidance: "Set password unlock time to conform to site policy. `unlock_time` should be\
      \ `0` (never), or `900` seconds or greater.\r\n\r\nEdit `/etc/security/faillock.conf` and update\
      \ or add the following line:\r\n\r\n```\r\nunlock_time = 900\r\n```\r\n\r\nRun the following command:\
      \ remove the `unlock_time` argument from the `pam_faillock.so` module in the PAM files:\r\n\r\n\
      ```\r\n# grep -Pl -- '\\bpam_faillock\\.so\\h+([^#\\n\\r]+\\h+)?unlock_time\\b' /usr/share/pam-configs/*\r\
      \n```\r\n\r\nEdit any returned files and remove the `unlock_time= ` argument from the `pam_faillock.so`\
      \ line(s):"
    additional_information: If a user has been locked out because they have reached the maximum consecutive
      failure count defined by `deny=` in the `pam_faillock.so` module, the user can be unlocked by issuing
      the command `faillock --user --reset`. This command sets the failed count to 0, effectively unlocking
      the user.
    default_value: unlock_time = 600
    artifacts_count: 2
    requirements: {}
