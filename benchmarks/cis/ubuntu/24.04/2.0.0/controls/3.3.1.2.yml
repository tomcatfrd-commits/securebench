control:
  id: CIS-3.3.1.2
  benchmark_id: cis-ubuntu-24.04
  title: Ensure net.ipv4.conf.all.forwarding is configured
  description: "ICMP Redirects are used to send routing information to other hosts. As a host itself does\
    \ not act as a router (in a host only configuration), there is no need to send redirects.\r\n\r\n\
    `net.ipv4.conf.all.forwarding` controls forwarding of IPv4 packet on all interfaces.\r\n\r\nMore information\
    \ about the kernel parameter configuration files, their location, and load preference is available\
    \ in the \"Configure Network Kernel Parameters\" section overview.\r\n\r\n>**Note:**\r\n>- **If this\
    \ system is a router this recommendation is not applicable.**\r\n>- If `net.ipv4.ip_forward=0` is\
    \ configured, this recommendation may be skipped."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.3_3_1_2.audit
  remediation: cis.ubuntu.24.04.v2_0_0.3_3_1_2.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.3_3_1_2.rollback
  verification: cis.ubuntu.24.04.v2_0_0.3_3_1_2.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 3.3.1.2
      url: https://workbench.cisecurity.org/sections/4177253/recommendations/7047532
    assessment_status: automated
    profiles:
    - Level 1 - Server
    - Level 1 - Workstation
    mappings:
      nist:
      - CM-6
      cis_v8:
      - '4.8'
      cis_v7:
      - '9.2'
      mitre_techniques:
      - T1557
      - T1557.000
      mitre_tactics:
      - TA0006
      - TA0009
      mitre_mitigations:
      - M1030
      - M1042
    parent: CIS _3_Configure Network Kernel Parameters Main | 1.1.1.2-Ensure net.ipv4.conf.all.forwarding
      is configured
    rationale: Routing protocol daemons are typically used on routers to exchange network topology information
      with other routers. If this capability is used when not required, system network information may
      be unnecessarily transmitted across the network.
    impact: "IP forwarding is required on systems configured to act as a router. If these parameters are\
      \ disabled, the system will not be able to perform as a router.\r\n\r\nCloud Service Provider (CSP)\
      \ hosted systems may require forwarding to be enabled. If the system is running on a CSP platform,\
      \ this requirement should be reviewed before disabling IPv4 forwarding."
    audit_guidance: "Verify `net.ipv4.conf.all.forwarding` is set to `0`.\r\n\r\n1. Run the following\
      \ command to verify `net.ipv4.conf.all.forwarding` is set to `0` in the running configuration:\r\
      \n\r\n```\r\n# sysctl net.ipv4.conf.all.forwarding\r\n```\r\n\r\nVerify output is:\r\n\r\n```\r\n\
      net.ipv4.conf.all.forwarding = 0\r\n```\r\n\r\n2. Run the following script to verify `net.ipv4.conf.all.forwarding\
      \ = 0` is set in a file being used by systemd-sysctl to configure `net.ipv4.conf.all.forwarding`:\r\
      \n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n   l_parameter_name=\"net.ipv4.conf.all.forwarding\"\
      \ \r\n   l_grep=\"${l_parameter_name//./(\\\\.|\\\\/)}\" a_output=() a_files=()\r\n   l_systemdsysctl=\"\
      $(readlink -e /lib/systemd/systemd-sysctl \\\r\n   || readlink -e /usr/lib/systemd/systemd-sysctl)\"\
      \r\n   l_ufw_file=\"$([ -f /etc/default/ufw ] && \\\r\n   awk -F= '/^\\s*IPT_SYSCTL=/ {print $2}'\
      \ /etc/default/ufw)\"\r\n   [ -f \"$(readlink -e \"$l_ufw_file\")\" ] && \\\r\n   a_files+=(\"$l_ufw_file\"\
      ); a_files+=(\"/etc/sysctl.conf\")\r\n   while IFS= read -r l_fname; do\r\n      l_file=\"$(readlink\
      \ -e \"${l_fname//# /}\")\"\r\n      [ -n \"$l_file\" ] && ! grep -Psiq -- '(^|\\h+)'\"$l_file\"\
      '\\b' \\\r\n      <<< \"${a_files[*]}\" && a_files+=(\"$l_file\")\r\n   done < <(\"$l_systemdsysctl\"\
      \ --cat-config | tac | \\\r\n   grep -Psio -- '^\\h*#\\h*\\/[^#\\n\\r\\h]+\\.conf\\b')\r\n   for\
      \ l_file in \"${a_files[@]}\"; do\r\n      l_opt=\"$(grep -Psio '^\\h*'\"$l_grep\"'\\h*=\\h*\\H+\\\
      b' \"$l_file\" | tail -n 1)\"\r\n      l_option_value=\"$(cut -d= -f2 <<< \"$l_opt\" | xargs)\"\r\
      \n      [ -n \"$l_option_value\" ] && \\\r\n      a_output+=(\" - \\\"$l_parameter_name = $l_option_value\\\
      \" is set in: \\\"$l_file\\\"\")\r\n   done\r\n   [ \"${#a_output[@]}\" -gt \"0\" ] && printf '%s\\\
      n' \"\" \"${a_output[@]}\" \"\"\r\n}\r\n```\r\n\r\nVerify output includes `net.ipv4.conf.all.forwarding\
      \ = 0`.\r\n\r\n_Example output:_\r\n\r\n```\r\n - \"net.ipv4.conf.all.forwarding = 0\" is set in:\
      \ \"/etc/sysctl.d/60-ipv4_sysctl.conf\"\r\n```\r\n\r\n>**Note:**\r\n>- If multiple lines with `net.ipv4.conf.all.forwarding\
      \ =` are returned.\r\n>  - The first line includes the value being used by `systemd-sysctl`. If\
      \ this is a correct value, this is considered a passing state. If the file listed is not in the\
      \ `/etc/sysctl.d/` directory, it is highly recommended to follow the remediation procedure to create\
      \ a `.conf` file in the `/etc/sysctl.d/` directory with the correct setting to prevent a potential\
      \ change due to an update to the system.\r\n>  - Any files in the `/etc/sysctl.d/` directory that\
      \ include an incorrect value should be modified to comment out or change the incorrect value to\
      \ minimize the potential of the incorrect value being used by `systemd-sysctl` due to system configuration\
      \ changes.\r\n>- This script looks at all files used by systemd sysctl.\r\n>- More information about\
      \ these files, their location, and load preference is available in the section overview."
    remediation_guidance: "1. Review all files being used by systemd-sysctl and comment out or remove\
      \ all `net.ipv4.conf.all.forwarding` lines that are not `net.ipv4.conf.all.forwarding=0`.\r\n\r\n\
      _Example script:_\r\n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n   l_option=\"net.ipv4.conf.all.forwarding\"\
      \ l_value=\"0\"\r\n   l_grep=\"${l_option//./(\\\\.|\\\\/)}\" a_files=()\r\n   l_systemdsysctl=\"\
      $(readlink -e /lib/systemd/systemd-sysctl \\\r\n   || readlink -e /usr/lib/systemd/systemd-sysctl)\"\
      \r\n   l_ufw_file=\"$([ -f /etc/default/ufw ] && \\\r\n   awk -F= '/^\\s*IPT_SYSCTL=/ {print $2}'\
      \ /etc/default/ufw)\"\r\n   [ -f \"$(readlink -e \"$l_ufw_file\")\" ] && \\\r\n   a_files+=(\"$l_ufw_file\"\
      ); a_files+=(\"/etc/sysctl.conf\")\r\n   while IFS= read -r l_fname; do\r\n      l_file=\"$(readlink\
      \ -e \"${l_fname//# /}\")\"\r\n      [ -n \"$l_file\" ] && ! grep -Psiq -- '(^|\\h+)'\"$l_file\"\
      '\\b' \\\r\n      <<< \"${a_files[*]}\" && a_files+=(\"$l_file\")\r\n   done < <(\"$l_systemdsysctl\"\
      \ --cat-config | tac | \\\r\n   grep -Psio -- '^\\h*#\\h*\\/[^#\\n\\r\\h]+\\.conf\\b')\r\n   for\
      \ l_file in \"${a_files[@]}\"; do\r\n      grep -Psio -- '\\h*'\"$l_grep\"'\\h*=\\h*\\H+\\b' \"\
      $l_file\" \\\r\n      | grep -Psivq -- '^\\h*'\"$l_grep\"'\\h*=\\h*'\"$l_value\"'\\b' && \\\r\n\
      \      sed -ri '/^\\s*'\"$l_grep\"'\\s*=\\s*(1[0-9]*)/s/^/# /' \"$l_file\"\r\n   done\r\n}\r\n```\r\
      \n\r\n2. Create or edit a file in the `/etc/sysctl.d/` directory ending in `.conf`and edit or add\
      \ the following line:\r\n\r\n```\r\nnet.ipv4.conf.all.forwarding = 0\r\n```\r\n\r\n_Example:_\r\n\
      \r\n```\r\n# [ ! -d \"/etc/sysctl.d/\" ] && mkdir -p /etc/sysctl.d/\r\n# printf '%s\\n' \"\" \"\
      net.ipv4.conf.all.forwarding = 0\" \\\r\n>> /etc/sysctl.d/60-ipv4_sysctl.conf\r\n```\r\n\r\n>**Note:**\
      \ If the UFW file was the first file listed in the audit, the entry will be commented out as part\
      \ of the first step, however updating Uncomplicated Firewall (UFW) may update this change. In this\
      \ case the updated entry will supersede the entry being created as part of this step.\r\n\r\n3.\
      \ Run the following command to load all sysctl configuration files:\r\n\r\n```\r\n# sysctl --system\r\
      \n```"
    additional_information: ''
    default_value: net.ipv4.conf.all.forwarding = 1
    artifacts_count: 2
    requirements: {}
    safety:
      default: investigate
      implementation_status: guidance_only
      reason: Imported CIS guidance has not yet been promoted to a reviewed SecureBench implementation.
  dependencies: []
  conflicts: []
