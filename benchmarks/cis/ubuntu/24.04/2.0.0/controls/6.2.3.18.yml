control:
  id: CIS-6.2.3.18
  benchmark_id: cis-ubuntu-24.04
  title: Ensure discretionary access control permission modification events are collected
  description: "Monitor changes to file permissions, attributes, ownership and group. The parameters in\
    \ this section track changes for system calls that affect file permissions and attributes. The following\
    \ commands and system calls effect the permissions, ownership and various attributes of files.\r\n\
    - `chmod`\r\n- `fchmod`\r\n- `fchmodat`\r\n- `chown`\r\n- `fchown`\r\n- `fchownat`\r\n- `lchown`\r\
    \n- `setxattr`\r\n- `lsetxattr`\r\n- `fsetxattr`\r\n- `removexattr`\r\n- `lremovexattr`\r\n- `fremovexattr`\r\
    \n\r\nIn all cases, an audit record will only be written for non-system user ids and will ignore Daemon\
    \ events. All audit records will be tagged with the identifier \"perm_mod.\""
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.6_2_3_18.audit
  remediation: cis.ubuntu.24.04.v2_0_0.6_2_3_18.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.6_2_3_18.rollback
  verification: cis.ubuntu.24.04.v2_0_0.6_2_3_18.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 6.2.3.18
      url: https://workbench.cisecurity.org/sections/4203192/recommendations/7091565
    assessment_status: automated
    profiles:
    - Level 2 - Server
    - Level 2 - Workstation
    mappings:
      nist:
      - AU-3
      - CM-6
      cis_v8:
      - '8.5'
      cis_v7:
      - '5.5'
