      - M1022
    parent: CIS _6_System Auditing Main | 2.2.3.18-Ensure discretionary access control permission modification
      events are collected
    rationale: Monitoring for changes in file attributes could alert a system administrator to activity
      that could indicate intruder activity or policy violation.
    impact: ''
    audit_guidance: "**Note:** Output showing all audited syscalls, e.g. (-a always,exit -F arch=b64 -S\
      \ chmod,fchmod,fchmodat,setxattr,lsetxattr,fsetxattr,removexattr,lremovexattr,fremovexattr -F auid>=1000\
      \ -F auid!=unset -F key=perm_mod) is also acceptable. These have been separated by function on the\
      \ displayed output for clarity.\r\n\r\n**On disk configuration**\r\n\r\nRun the following command\
      \ to check the on disk rules:\r\n\r\n```\r\n# {\r\n UID_MIN=$(awk '/^\\s*UID_MIN/{print $2}' /etc/login.defs)\r\
      \n [ -n \"${UID_MIN}\" ] && awk \"/^ *-a *always,exit/ \\\r\n &&/ -F *arch=b(32|64)/ \\\r\n &&(/\
      \ -F *auid!=unset/||/ -F *auid!=-1/||/ -F *auid!=4294967295/) \\\r\n &&/ -S/ \\\r\n &&/ -F *auid>=${UID_MIN}/\
      \ \\\r\n &&(/chmod/||/fchmod/||/fchmodat/ \\\r\n   ||/chown/||/fchown/||/fchownat/||/lchown/ \\\r\
      \n   ||/setxattr/||/lsetxattr/||/fsetxattr/ \\\r\n   ||/removexattr/||/lremovexattr/||/fremovexattr/)\
      \ \\\r\n &&(/ key= *[!-~]* *$/||/ -k *[!-~]* *$/)\" /etc/audit/rules.d/*.rules \\\r\n || printf\
      \ \"ERROR: Variable 'UID_MIN' is unset.\\n\"\r\n}\r\n```\r\n\r\nVerify the output matches:\r\n```\r\
      \n-a always,exit -F arch=b64 -S chmod,fchmod,fchmodat -F auid>=1000 -F auid!=unset -F key=perm_mod\r\
      \n-a always,exit -F arch=b64 -S chown,fchown,lchown,fchownat -F auid>=1000 -F auid!=unset -F key=perm_mod\r\
      \n-a always,exit -F arch=b32 -S chmod,fchmod,fchmodat -F auid>=1000 -F auid!=unset -F key=perm_mod\r\
      \n-a always,exit -F arch=b32 -S lchown,fchown,chown,fchownat -F auid>=1000 -F auid!=unset -F key=perm_mod\r\
      \n-a always,exit -F arch=b64 -S setxattr,lsetxattr,fsetxattr,removexattr,lremovexattr,fremovexattr\
      \ -F auid>=1000 -F auid!=unset -F key=perm_mod\r\n-a always,exit -F arch=b32 -S setxattr,lsetxattr,fsetxattr,removexattr,lremovexattr,fremovexattr\
      \ -F auid>=1000 -F auid!=unset -F key=perm_mod\r\n```\r\n\r\n**Running configuration**\r\n\r\nRun\
      \ the following command to check loaded rules:\r\n\r\n```\r\n# {\r\n UID_MIN=$(awk '/^\\s*UID_MIN/{print\
      \ $2}' /etc/login.defs)\r\n [ -n \"${UID_MIN}\" ] && auditctl -l | awk \"/^ *-a *always,exit/ \\\
      \r\n &&/ -F *arch=b(32|64)/ \\\r\n &&(/ -F *auid!=unset/||/ -F *auid!=-1/||/ -F *auid!=4294967295/)\
      \ \\\r\n &&/ -S/ \\\r\n &&/ -F *auid>=${UID_MIN}/ \\\r\n &&(/chmod/||/fchmod/||/fchmodat/ \\\r\n\
      \   ||/chown/||/fchown/||/fchownat/||/lchown/ \\\r\n   ||/setxattr/||/lsetxattr/||/fsetxattr/ \\\
      \r\n   ||/removexattr/||/lremovexattr/||/fremovexattr/) \\\r\n &&(/ key= *[!-~]* *$/||/ -k *[!-~]*\
      \ *$/)\" \\\r\n || printf \"ERROR: Variable 'UID_MIN' is unset.\\n\"\r\n}\r\n```\r\n\r\nVerify the\
      \ output matches:\r\n\r\n```\r\n-a always,exit -F arch=b64 -S chmod,fchmod,fchmodat -F auid>=1000\
      \ -F auid!=-1 -F key=perm_mod\r\n-a always,exit -F arch=b64 -S chown,fchown,lchown,fchownat -F auid>=1000\
      \ -F auid!=-1 -F key=perm_mod\r\n-a always,exit -F arch=b32 -S chmod,fchmod,fchmodat -F auid>=1000\
      \ -F auid!=-1 -F key=perm_mod\r\n-a always,exit -F arch=b32 -S lchown,fchown,chown,fchownat -F auid>=1000\
      \ -F auid!=-1 -F key=perm_mod\r\n-a always,exit -F arch=b64 -S setxattr,lsetxattr,fsetxattr,removexattr,lremovexattr,fremovexattr\
      \ -F auid>=1000 -F auid!=-1 -F key=perm_mod\r\n-a always,exit -F arch=b32 -S setxattr,lsetxattr,fsetxattr,removexattr,lremovexattr,fremovexattr\
      \ -F auid>=1000 -F auid!=-1 -F key=perm_mod\r\n```"
    remediation_guidance: "**Create audit rules**\r\n\r\nEdit or create a file in the `/etc/audit/rules.d/`\
      \ directory, ending in `.rules` extension, with the relevant rules to monitor discretionary access\
      \ control permission modification events.\r\n\r\n_Example:_\r\n\r\n```\r\n# {\r\nUID_MIN=$(awk '/^\\\
      s*UID_MIN/{print $2}' /etc/login.defs)\r\n[ -n \"${UID_MIN}\" ] && printf \"\r\n-a always,exit -F\
      \ arch=b64 -S chmod,fchmod,fchmodat -F auid>=${UID_MIN} -F auid!=unset -F key=perm_mod\r\n-a always,exit\
      \ -F arch=b64 -S chown,fchown,lchown,fchownat -F auid>=${UID_MIN} -F auid!=unset -F key=perm_mod\r\
      \n-a always,exit -F arch=b32 -S chmod,fchmod,fchmodat -F auid>=${UID_MIN} -F auid!=unset -F key=perm_mod\r\
      \n-a always,exit -F arch=b32 -S lchown,fchown,chown,fchownat -F auid>=${UID_MIN} -F auid!=unset\
      \ -F key=perm_mod\r\n-a always,exit -F arch=b64 -S setxattr,lsetxattr,fsetxattr,removexattr,lremovexattr,fremovexattr\
      \ -F auid>=${UID_MIN} -F auid!=unset -F key=perm_mod\r\n-a always,exit -F arch=b32 -S setxattr,lsetxattr,fsetxattr,removexattr,lremovexattr,fremovexattr\
      \ -F auid>=${UID_MIN} -F auid!=unset -F key=perm_mod\r\n\" >> /etc/audit/rules.d/50-perm_mod.rules\
      \ || printf \"ERROR: Variable 'UID_MIN' is unset.\\n\"\r\n}\r\n```\r\n\r\n**Load audit rules**\r\
      \n\r\nMerge and load the rules into active configuration:\r\n\r\n```\r\n# augenrules --load\r\n\
      ```\r\n\r\nCheck if reboot is required.\r\n\r\n```\r\n# if [[ $(auditctl -s | grep \"enabled\")\
      \ =~ \"2\" ]]; then printf \"Reboot required to load rules\\n\"; fi\r\n```"
