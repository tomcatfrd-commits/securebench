    parent: CIS _1_Configure Filesystem Partitions Main | 1.1.7.3-Ensure nosuid option set on /var/log/audit
      partition
    rationale: Since the `/var/log/audit` filesystem is only intended for variable files such as logs,
      set this option to ensure that users cannot create `setuid` files in `/var/log/audit`.
    impact: ''
    audit_guidance: "**- IF -** a separate partition exists for `/var/log/audit`, verify that the `nosuid`\
      \ option is set.\r\n\r\nRun the following command to verify that the `nosuid` mount option is set.\r\
      \n\r\n_Example:_\r\n\r\n```\r\n# findmnt -kn /var/log/audit | grep -v nosuid\r\n\r\nNothing should\
      \ be returned\r\n```"
    remediation_guidance: "**- IF -** a separate partition exists for `/var/log/audit`.\r\n\r\nEdit the\
      \ `/etc/fstab` file and add `nosuid` to the fourth field (mounting options) for the `/var/log/audit`\
      \ partition.\r\n\r\n_Example:_\r\n\r\n``` /var/log/audit defaults,rw,nosuid,nodev,noexec,relatime\
      \  0 0\r\n```\r\n\r\nRun the following command to remount `/var/log/audit` with the configured options:\r\
      \n\r\n```\r\n# mount -o remount /var/log/audit\r\n```"
    additional_information: ''
    default_value: ''
    artifacts_count: 1
    requirements: {}
    safety:
      default: investigate
      implementation_status: guidance_only
