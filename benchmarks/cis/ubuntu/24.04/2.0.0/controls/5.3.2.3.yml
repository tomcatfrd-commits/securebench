control:
  id: CIS-5.3.2.3
  benchmark_id: cis-ubuntu-24.04
  title: Ensure pam_pwquality module is enabled
  description: "The `pam_pwquality.so` module performs password quality checking. This module can be plugged\
    \ into the password stack of a given service to provide strength-checking for passwords. The code\
    \ was originally based on pam_cracklib module and the module is backwards compatible with its options.\
    \ \r\n\r\nThe action of this module is to prompt the user for a password and check its strength against\
    \ a system dictionary and a set of rules for identifying poor choices.\r\n\r\nThe first action is\
    \ to prompt for a single password, check its strength and then, if it is considered strong, prompt\
    \ for the password a second time (to verify that it was typed correctly on the first occasion). All\
    \ being well, the password is passed on to subsequent modules to be installed as the new authentication\
    \ token."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_3_2_3.audit
  remediation: cis.ubuntu.24.04.v2_0_0.5_3_2_3.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.5_3_2_3.rollback
