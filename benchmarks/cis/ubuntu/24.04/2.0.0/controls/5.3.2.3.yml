    rationale: Use of a unique, complex passwords helps to increase the time and resources required to
      compromise the password.
    impact: ''
    audit_guidance: "Run the following command to verify that `pam_pwquality.so` is enabled:\r\n\r\n```\r\
      \n# grep -P -- '\\bpam_pwquality\\.so\\b' /etc/pam.d/common-password\r\n```\r\n\r\nOutput should\
      \ be similar to:\r\n\r\n```\r\npassword   requisite   pam_pwquality.so retry=3\r\n```"
    remediation_guidance: "Run the following script to verify the `pam_pwquality.so` line exists in a\
      \ `pam-auth-update` profile:\r\n\r\n```\r\n# grep -P -- '\\bpam_pwquality\\.so\\b' /usr/share/pam-configs/*\r\
      \n```\r\n\r\nOutput should be similar to:\r\n\r\n```\r\n/usr/share/pam-configs/pwquality:      \
      \ requisite                       pam_pwquality.so retry=3\r\n/usr/share/pam-configs/pwquality:\
      \       requisite                       pam_pwquality.so retry=3\r\n```\r\n\r\n**- IF -** similar\
      \ output is returned:\r\n\r\nRun the following command to update `/etc/pam.d/common-password` with\
      \ the returned profile:\r\n\r\n```\r\n# pam-auth-update --enable {PROFILE_NAME}\r\n```\r\n\r\n_Example:_\r\
      \n\r\n```\r\n# pam-auth-update --enable pwquality\r\n```\r\n\r\n**- IF -** similar output is **NOT**\
      \ returned:\r\n\r\nCreate a pam-auth-update profile in `/usr/share/pam-configs/` with the following\
      \ lines:\r\n\r\n```\r\nName: Pwquality password strength checking\r\nDefault: yes\r\nPriority: 1024\r\
      \nConflicts: cracklib\r\nPassword-Type: Primary\r\nPassword:\r\n        requisite              \
      \         pam_pwquality.so retry=3\r\n```\r\n\r\n_Example:_\r\n\r\n```\r\n#!/usr/bin/env bash\r\n\
      \r\n{\r\n   arr=('Name: Pwquality password strength checking' 'Default: yes' 'Priority: 1024' 'Conflicts:\
      \ cracklib' 'Password-Type: Primary' 'Password:' '        requisite                       pam_pwquality.so\
      \ retry=3')\r\n   printf '%s\\n' \"${arr[@]}\" > /usr/share/pam-configs/pwquality\r\n}\r\n```\r\n\
      \r\nRun the following command to update `/etc/pam.d/common-password` with the `pwquality` profile:\r\
      \n\r\n```\r\n# pam-auth-update --enable pwquality\r\n```\r\n\r\n**Note:**\r\n- The name used for\
      \ the file must be used in the `pam-auth-update --enable` command\r\n- The `Name:` line should be\
      \ easily recognizable and understood\r\n- The `Priority:` Line is important as it effects the order\
      \ of the lines in the `/etc/pam.d/` files\r\n- If a site specific custom profile is being used in\
      \ your environment to configure PAM that includes the configuration for the `pam_pwquality` module,\
      \ enable that module instead"
