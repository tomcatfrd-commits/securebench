    parent: CIS _6_System Logging Main | 2.2.2.7-Ensure logrotate is configured
    rationale: By keeping the log files smaller and more manageable, a system administrator can easily
      archive these files to another system and spend less time looking through inordinately large log
      files.
    impact: ''
    audit_guidance: Review `/etc/logrotate.conf` and `/etc/logrotate.d/*` and verify logs are rotated
      according to site policy.
    remediation_guidance: Edit `/etc/logrotate.conf` and `/etc/logrotate.d/*` to ensure logs are rotated
      according to site policy.
    additional_information: If no `maxage` setting is set for `logrotate` a situation can occur where
      `logrotate` is interrupted and fails to delete rotated log files.  It is recommended to set this
      to a value greater than the longest any log file should exist on your system to ensure that any
      such log file is removed but standard rotation settings are not overridden.
