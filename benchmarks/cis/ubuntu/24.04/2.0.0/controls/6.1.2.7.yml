control:
  id: CIS-6.1.2.7
  benchmark_id: cis-ubuntu-24.04
  title: Ensure logrotate is configured
  description: The system includes the capability of rotating log files regularly to avoid filling up
    the system with logs or making the logs unmanageably large. The file `/etc/logrotate.d/syslog` is
    the configuration file used to rotate log files created by `syslog` or `rsyslog`.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.6_1_2_7.audit
  remediation: cis.ubuntu.24.04.v2_0_0.6_1_2_7.remediate
