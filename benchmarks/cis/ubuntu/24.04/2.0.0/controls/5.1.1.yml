    parent: CIS _5_Configure SSH Server Main | 2.2.1-Ensure access to /etc/ssh/sshd_config is configured
    rationale: Configuration specifications for `sshd` need to be protected from unauthorized changes
      by non-privileged users.
    impact: ''
    audit_guidance: "Run the following command to verify access to `/etc/ssh/sshd_config` is configured:\r\
      \n\r\n```\r\n# stat -Lc 'File: \"%n\" Mode: \"%#a\"  Owner: \"%U\" Group: \"%G\"' /etc/ssh/sshd_config\r\
      \n```\r\n\r\nVerify mode is `0600` or more restrictive, owner is `root`, and group is `root`.\r\n\
      \r\n_Example output:_\r\n\r\n```\r\nFile: \"/etc/ssh/sshd_config\" Mode: \"0600\"  Owner: \"root\"\
      \ Group: \"root\"\r\n```\r\n\r\nRun the following script to verify files in `/etc/ssh/sshd_config.d/`\
      \ ending in `.conf` are configured:\r\n - Mode `0600` or more restrictive\r\n - Owned by the `root`\
      \ user\r\n - Group owned by the group `root`.\r\n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n   while\
      \ IFS= read -r -d $'\\0' l_file; do\r\n      stat -Lc 'File: \"%n\" Mode: \"%#a\"  Owner: \"%U\"\
      \ Group: \"%G\"' \"$l_file\"\r\n   done < <(find /etc/ssh/sshd_config.d/ -xdev -mount -type f -name\
      \ '*.conf' \\\r\n   \\( -perm /077 -o ! -user root -o ! -group root \\) -print0 2>/dev/null)\r\n\
      }\r\n```\r\n\r\nNothing should be returned\r\n\r\n>**Note:** If other locations are listed in an\
      \ `Include` statement, `*.conf` files in these locations should also be checked."
    remediation_guidance: "Run the following script to set ownership and permissions on `/etc/ssh/sshd_config`\
      \ and files ending in `.conf` in the `/etc/ssh/sshd_config.d` directory:\r\n\r\n```\r\n#!/usr/bin/env\
      \ bash\r\n\r\n{\r\n   chmod u-x,og-rwx /etc/ssh/sshd_config\r\n   chown root:root /etc/ssh/sshd_config\r\
      \n   while IFS= read -r -d $'\\0' l_file; do\r\n      if [ -e \"$l_file\" ]; then\r\n         chmod\
      \ u-x,og-rwx \"$l_file\"\r\n         chown root:root \"$l_file\"\r\n      fi\r\n   done < <(find\
      \ /etc/ssh/sshd_config.d -type f -print0 2>/dev/null)\r\n}\r\n```\r\n\r\n>**Note:** If other locations\
      \ are listed in an `Include` statement, `*.conf` files in these locations access should also be\
      \ modified."
    additional_information: ''
    default_value: 'Access: (0600/-rw-------)  Uid: (    0/    root)   Gid: (    0/    root)'
