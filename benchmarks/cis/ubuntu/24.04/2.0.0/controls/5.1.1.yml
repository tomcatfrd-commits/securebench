  title: Ensure access to /etc/ssh/sshd_config is configured
  description: "`/etc/ssh/sshd_config` is the main configuration file for the OpenSSH server daemon (sshd),\
    \ which manages secure remote logins and other SSH services.\r\n\r\n`/etc/ssh/sshd_config` is the\
    \ default location for drop-in configuration files used by sshd.\r\n\r\nMore information about the\
    \ openSSH server configuration is available in the \"Configure SSH Server\" section overview."
  platform: ubuntu-24.04
  severity: unspecified
