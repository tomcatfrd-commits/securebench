control:
  id: CIS-1.5.5
  benchmark_id: cis-ubuntu-24.04
  title: Ensure kernel.dmesg_restrict is configured
  description: "`kernel.dmesg_restrict` can be used to configure the Linux kernel and prevent unprivileged\
    \ users access to information from the kernel's log buffer.\r\n\r\nMore information about the kernel\
    \ parameter configuration files, their location, and load preference is available in the section overview."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.1_5_5.audit
  remediation: cis.ubuntu.24.04.v2_0_0.1_5_5.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.1_5_5.rollback
  verification: cis.ubuntu.24.04.v2_0_0.1_5_5.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 1.5.5
      url: https://workbench.cisecurity.org/sections/4177281/recommendations/7047702
    assessment_status: automated
    profiles:
    - Level 1 - Server
    - Level 1 - Workstation
    mappings:
      nist:
      - SC-2
      - SC-4
      cis_v8:
      - '3.3'
      cis_v7:
      - '14.6'
      mitre_techniques: []
      mitre_tactics: []
      mitre_mitigations: []
    parent: CIS _1_Configure Additional Process Hardening Main | 2.2.5-Ensure kernel.dmesg_restrict is
      configured
    rationale: Restricting access to the kernel message buffer limits access to only root. This prevents
      attackers from gaining additional system information as a non-privileged user.
    impact: Changing dmesg_restrict to one `1`, will restrict access to those users that have the CAP_SYSLOG
      capability.
    audit_guidance: "Verify `kernel.dmesg_restrict` is set to `1`.\r\n\r\n1. Run the following command\
      \ to verify `kernel.dmesg_restrict` is set to `1` in the running configuration:\r\n\r\n```\r\n#\
      \ sysctl kernel.dmesg_restrict\r\n```\r\n\r\nVerify output is:\r\n\r\n```\r\nkernel.dmesg_restrict\
      \ = 1\r\n```\r\n\r\n2. Run the following script to verify `kernel.dmesg_restrict = 1` is set in\
      \ a file being used by systemd-sysctl to configure `kernel.dmesg_restrict`:\r\n\r\n```\r\n#!/usr/bin/env\
      \ bash\r\n\r\n{\r\n   l_parameter_name=\"kernel.dmesg_restrict\"\r\n   l_grep=\"${l_parameter_name//./(\\\
      \\.|\\\\/)}\" a_output=() a_files=()\r\n   l_systemdsysctl=\"$(readlink -e /lib/systemd/systemd-sysctl\
      \ \\\r\n   || readlink -e /usr/lib/systemd/systemd-sysctl)\"\r\n   l_ufw_file=\"$([ -f /etc/default/ufw\
      \ ] && \\\r\n   awk -F= '/^\\s*IPT_SYSCTL=/ {print $2}' /etc/default/ufw)\"\r\n   [ -f \"$(readlink\
      \ -e \"$l_ufw_file\")\" ] && \\\r\n   a_files+=(\"$l_ufw_file\"); a_files+=(\"/etc/sysctl.conf\"\
      )\r\n   while IFS= read -r l_fname; do\r\n      l_file=\"$(readlink -e \"${l_fname//# /}\")\"\r\n\
      \      [ -n \"$l_file\" ] && ! grep -Psiq -- '(^|\\h+)'\"$l_file\"'\\b' \\\r\n      <<< \"${a_files[*]}\"\
      \ && a_files+=(\"$l_file\")\r\n   done < <(\"$l_systemdsysctl\" --cat-config | tac | \\\r\n   grep\
      \ -Psio -- '^\\h*#\\h*\\/[^#\\n\\r\\h]+\\.conf\\b')\r\n   for l_file in \"${a_files[@]}\"; do\r\n\
      \      l_opt=\"$(grep -Psoi '^\\h*'\"$l_grep\"'\\h*=\\h*\\H+\\b' \"$l_file\" | tail -n 1)\"\r\n\
      \      l_option_value=\"$(cut -d= -f2 <<< \"$l_opt\" | xargs)\"\r\n      [ -n \"$l_option_value\"\
      \ ] && \\\r\n      a_output+=(\" - \\\"$l_parameter_name = $l_option_value\\\" is set in:\" \\\r\
      \n      \"    \\\"$l_file\\\"\")\r\n   done\r\n   [ \"${#a_output[@]}\" -gt \"0\" ] && printf '%s\\\
      n' \"\" \"${a_output[@]}\" \"\"\r\n}\r\n```\r\n\r\nVerify output includes `kernel.dmesg_restrict\
      \ = 1`.\r\n\r\n_Example output:_\r\n\r\n```\r\n - \"kernel.dmesg_restrict\" is set to: \"1\" in:\
      \ \"/etc/sysctl.d/60-kernel_sysctl.conf\"\r\n```\r\n\r\n>**Note:** If multiple lines with `kernel.dmesg_restrict\
      \ =` are returned:\r\n>- The first line includes the value being used by `systemd-sysctl`. If this\
      \ is a correct value, this is considered a passing state. If the file listed is not in the `/etc/sysctl.d/`\
      \ directory, it is highly recommended to follow the remediation procedure to create a `.conf` file\
      \ in the `/etc/sysctl.d/` directory with the correct setting to prevent a potential change due to\
      \ an update to the system.\r\n>- Any files in the `/etc/sysctl.d/` directory that include an incorrect\
      \ value should be modified to comment out or change the incorrect value to minimize the potential\
      \ of the incorrect value being used by `systemd-sysctl` due to system configuration changes."
    remediation_guidance: "1. Review all files being used by systemd-sysctl and comment out or remove\
      \ all `kernel.dmesg_restrict` lines that are not `kernel.dmesg_restrict=1`.\r\n\r\n_Example script:_\r\
      \n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n   l_option=\"kernel.dmesg_restrict\" l_value=\"1\"\
      \r\n   l_grep=\"${l_option//./(\\\\.|\\\\/)}\" a_files=()\r\n   l_systemdsysctl=\"$(readlink -e\
      \ /lib/systemd/systemd-sysctl \\\r\n   || readlink -e /usr/lib/systemd/systemd-sysctl)\"\r\n   l_ufw_file=\"\
      $([ -f /etc/default/ufw ] && \\\r\n   awk -F= '/^\\s*IPT_SYSCTL=/ {print $2}' /etc/default/ufw)\"\
      \r\n   [ -f \"$(readlink -e \"$l_ufw_file\")\" ] && \\\r\n   a_files+=(\"$l_ufw_file\"); a_files+=(\"\
      /etc/sysctl.conf\")\r\n   while IFS= read -r l_fname; do\r\n      l_file=\"$(readlink -e \"${l_fname//#\
      \ /}\")\"\r\n      [ -n \"$l_file\" ] && ! grep -Psiq -- '(^|\\h+)'\"$l_file\"'\\b' \\\r\n     \
      \ <<< \"${a_files[*]}\" && a_files+=(\"$l_file\")\r\n   done < <(\"$l_systemdsysctl\" --cat-config\
      \ | tac | \\\r\n   grep -Psio -- '^\\h*#\\h*\\/[^#\\n\\r\\h]+\\.conf\\b')\r\n   for l_file in \"\
      ${a_files[@]}\"; do\r\n      grep -Psio -- '\\h*'\"$l_grep\"'\\h*=\\h*\\H+\\b' \"$l_file\" \\\r\n\
      \      | grep -Psivq -- '^\\h*'\"$l_grep\"'\\h*=\\h*'\"$l_value\"'\\b' && \\\r\n      sed -ri '/^\\\
      s*'\"$l_grep\"'\\s*=\\s*(0|[2-9]|1[0-9]+)/s/^/# /' \"$l_file\"\r\n   done\r\n}\r\n```\r\n\r\n2.\
      \ Create or edit a file in the `/etc/sysctl.d/` directory ending in `.conf` and edit or add the\
      \ following line:\r\n\r\n```\r\nkernel.dmesg_restrict = 1\r\n```\r\n\r\n_Example:_\r\n\r\n```\r\n\
      # [ ! -d \"/etc/sysctl.d/\" ] && mkdir -p /etc/sysctl.d/\r\n# printf '%s\\n' \"\" \"kernel.dmesg_restrict\
      \ = 1\" >> /etc/sysctl.d/60-kernel_sysctl.conf\r\n```\r\n\r\n>**Note:** If the UFW file was the\
      \ first file listed in the audit, the entry will be commented out as part of the first step, however\
      \ updating Uncomplicated Firewall (UFW) may update this change. In this case the updated entry will\
      \ supersede the entry being created as part of this step.\r\n\r\n3. Run the following command to\
      \ load all system configuration files:\r\n\r\n```\r\n# sysctl --system\r\n```"
    additional_information: ''
    default_value: kernel.dmesg_restrict = 0
    artifacts_count: 1
    requirements: {}
