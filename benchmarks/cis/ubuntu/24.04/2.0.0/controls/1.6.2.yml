control:
  id: CIS-1.6.2
  benchmark_id: cis-ubuntu-24.04
  title: Ensure /etc/issue is configured
  description: "The file `/etc/issue` is read from agetty(8) and similar tools and shown above the login\
    \ prompt. While some of the information can be adjusted with variables, the file itself is static.\
    \ To display dynamic content, issue-generator(1) generates a /run/issue file from different files.\r\
    \n\r\nFiles in `/etc/issue.d` override files with the same name in `/usr/lib/issue.d` and `/run/issue.d`.\
    \ Files in `/run/issue.d` override files with the same name in /usr/lib/issue.d. Packages should install\
    \ their configuration files in `/usr/lib/issue.d`. Files in `/etc/issue.d` are reserved for the local\
    \ administrator, who may use this logic to override the files installed by vendor packages. All configuration\
    \ files are sorted by their filename in lexicographic order, regardless of which of the directories\
    \ they reside in."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.1_6_2.audit
  remediation: cis.ubuntu.24.04.v2_0_0.1_6_2.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.1_6_2.rollback
  verification: cis.ubuntu.24.04.v2_0_0.1_6_2.verify
  rollback_capability: unsupported
