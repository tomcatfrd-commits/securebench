    parent: CIS _1_Configure Command Line Warning Banners Main | 1.2.2-Ensure /etc/issue is configured
    rationale: Warning messages inform users who are attempting to login to the system of their legal
      status regarding the system and must include the name of the organization that owns the system and
      any monitoring policies that are in place. Displaying OS and patch level information in login banners
      also has the side effect of providing detailed system information to attackers attempting to target
      specific exploits of a system. Authorized users can easily get this information by running the "
      `uname -a` " command once they have logged in.
    impact: ''
    audit_guidance: "Run the following command and verify no results are returned:\r\n\r\n```\r\n# grep\
      \ -Psi \"(\\\\\\v|\\\\\\r|\\\\\\m|\\\\\\s|\\b$(grep '^ID=' /etc/os-release | cut -d= -f2 | sed -e\
      \ 's/\"//g')\\b)\" /etc/issue /usr/lib/issue.d/* /etc/issue.d/* /run/issue.d/*\r\n```\r\nNothing\
      \ should be returned"
    remediation_guidance: "Edit the `issue` file with the appropriate contents according to your site\
      \ policy, remove any instances of `\\m` , `\\r` , `\\s` , `\\v` or references to the `OS platform`\r\
      \n\r\n_Example:_\r\n\r\n```\r\n# echo \"Authorized users only. All activity may be monitored and\
      \ reported.\" > /etc/issue\r\n```\r\n\r\n**Note:** \r\n- The issue file `/usr/lib/issue.d/10-SUSE`\
      \ may be removed or overridden with the appropriate contents according to your site policy.\r\n\
      - Files in `/etc/issue.d` override files with the same name in `/usr/lib/issue.d` and `/run/issue.d`.\
      \ Files in `/run/issue.d` override files with the same name in `/usr/lib/issue.d`. \r\n  - Files\
      \ in `/etc/issue.d` are reserved for the local administrator, who may use this logic to override\
      \ the files installed by vendor packages. \r\n  - All configuration files are sorted by their filename\
      \ in lexicographic order, regardless of which of the directories they reside in."
