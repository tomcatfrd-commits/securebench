control:
  id: CIS-2.1.5
  benchmark_id: cis-ubuntu-24.04
  title: Ensure dhcp server services are not in use
  description: The Dynamic Host Configuration Protocol (DHCP) is a service that allows machines to be
    dynamically assigned IP addresses. On Debian 12, the `kea` package provides DHCPv4 and DHCPv6 server
    services via `kea-dhcp4-server.service`, `kea-dhcp6-server.service`, and `kea-dhcp-ddns-server.service`.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.2_1_5.audit
  remediation: cis.ubuntu.24.04.v2_0_0.2_1_5.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.2_1_5.rollback
  verification: cis.ubuntu.24.04.v2_0_0.2_1_5.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 2.1.5
      url: https://workbench.cisecurity.org/sections/4177245/recommendations/7047506
    assessment_status: automated
    profiles:
    - Level 1 - Server
    - Level 1 - Workstation
    mappings:
      nist:
      - CM-7
      cis_v8:
      - '4.8'
      cis_v7:
      - '9.2'
      mitre_techniques:
      - T1203
      - T1203.000
      - T1210
      - T1210.000
      - T1543
      - T1543.002
      mitre_tactics:
      - TA0008
      mitre_mitigations:
      - M1042
    parent: CIS _2_Configure Server Services Main | 2.1.5-Ensure dhcp server services are not in use
    rationale: Unless a system is specifically designated as a DHCP server, the `kea` package should be
      removed to reduce the potential attack surface. A rogue or misconfigured DHCP server can cause network
      disruption by assigning incorrect IP addresses, DNS servers, or default gateways to clients. If
      removal is not possible due to a package dependency, all associated services must be stopped and
      masked to prevent them from running.
    impact: There may be packages that depend on the `kea` package. Removing it will remove those dependent
      packages as well. Review any dependent packages before removal to confirm they are not required.
      **- IF -** a dependent package is required, stop and mask all three `kea` services rather than removing
      the package.
    audit_guidance: "Run the following command to verify `kea` is not installed:\r\n\r\n```\r\n# dpkg-query\
      \ -l | awk '{print $2}' | grep -Pio -- 'kea' &>/dev/null && echo \"kea is installed\"\r\n```\r\n\
      Nothing should be returned.\r\n\r\n**- OR -** \r\n\r\n**- IF -** the package is required for dependencies:\r\
      \n\r\nRun the following command to verify `kea-dhcp-ddns-server.service` `kea-dhcp4-server.service`\
      \ `kea-dhcp6-server.service` UnitFileState is not enabled and ActiveState is not active:\r\n\r\n\
      ```\r\n# systemctl show kea-dhcp-ddns-server.service kea-dhcp4-server.service kea-dhcp6-server.service\
      \ -p UnitFileState,ActiveState | grep -Pi '=(enabled|active)'\r\n```\r\nNothing should be returned.\r\
      \n\r\n\r\n**Note:** If the package is required for a dependency\r\n - Ensure the dependent package\
      \ is approved by local site policy\r\n - Ensure stopping and masking the service and/or socket meets\
      \ local site policy"
    remediation_guidance: "Run the following commands to stop `kea-dhcp-ddns-server.service` `kea-dhcp4-server.service`\
      \ `kea-dhcp6-server.service` and remove `kea` package:\r\n\r\n```\r\n# systemctl stop kea-dhcp-ddns-server.service\
      \ kea-dhcp4-server.service kea-dhcp6-server.service\r\n# apt remove kea\r\n```\r\n\r\n**- OR -**\r\
      \n\r\n**- IF -** the `kea` package is required as a dependency:\r\n\r\nRun the following commands\
      \ to stop and mask `dhcpd.service` and `dhcpd6.service`:\r\n\r\n```\r\n# systemctl stop kea-dhcp-ddns-server.service\
      \ kea-dhcp4-server.service kea-dhcp6-server.service\r\n# systemctl mask kea-dhcp-ddns-server.service\
      \ kea-dhcp4-server.service kea-dhcp6-server.service\r\n```"
    additional_information: ''
    default_value: ''
