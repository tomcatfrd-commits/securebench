  title: Ensure events that modify /etc/netplan are collected
  description: "Record changes to network environment files or system calls. The files being monitored\
    \ are:\r\n- `/etc/netplan/` - central location for YAML networking configurations files"
  platform: ubuntu-24.04
  severity: unspecified
