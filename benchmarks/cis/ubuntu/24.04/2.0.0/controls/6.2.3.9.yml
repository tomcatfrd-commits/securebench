    parent: CIS _6_System Auditing Main | 2.2.3.9-Ensure events that modify /etc/netplan are collected
    rationale: Monitoring system events that change network environments, such as tracking changes in
      the `/etc/netplan/` directory ensures swift detection of unauthorized adjustments to network configurations.
      All audit records should be appropriately tagged for relevance
    impact: ''
    audit_guidance: "Run the following command to verify a rule exists in the running configuration:\r\
      \n\r\n```\r\n# auditctl -l | grep -Ps -- '\\/etc/netplan'\r\n```\r\n\r\nVerify the output matches:\r\
      \n\r\n```\r\n-w /etc/netplan -p wa -k system-locale\r\n```\r\n\r\n2. Run the following command to\
      \ verify a rule exists in a rules file:\r\n\r\n```\r\n# grep -Ps -- '\\/etc/netplan' /etc/audit/rules.d/*.rules\r\
      \n```\r\n\r\nVerify the output includes:\r\n\r\n```\r\n/etc/audit/rules.d/50-system_locale.rules:-w\
      \ /etc/netplan -p wa -k system-locale\r\n```\r\n\r\n**Note:** **- IF -** The directory `/etc/netplan`\
      \ does not exist, this is considered a passing state."
    remediation_guidance: "Edit or create a file in the `/etc/audit/rules.d/` directory, ending in `.rules`\
      \ extension, with the relevant rules to monitor events that modify the system's network environment.\r\
      \n\r\n_Example:_\r\n\r\n```\r\n# printf \"\r\n-w /etc/netplan -p wa -k system-locale\r\n\" >> /etc/audit/rules.d/50-system_locale.rules\r\
      \n```\r\n\r\n**Load audit rules**\r\n\r\nMerge and load the rules into active configuration:\r\n\
      \r\n```\r\n# augenrules --load\r\n```\r\n\r\nCheck if reboot is required.\r\n\r\n```\r\n# if [[\
      \ $(auditctl -s | grep \"enabled\") =~ \"2\" ]]; then printf \"Reboot required to load rules\\n\"\
      ; fi\r\n```\r\n\r\n**Note:** **- IF -** The directory `/etc/netplan` does not exist, this is considered\
      \ a passing state. Creating a file system rule will result in an error if `/etc/netplan` does not\
      \ exist."
    additional_information: ''
