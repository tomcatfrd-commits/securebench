    parent: CIS _1_Configure Filesystem Partitions Main | 1.1.5.2-Ensure nodev option set on /var/tmp
      partition
    rationale: Since the `/var/tmp` filesystem is not intended to support devices, set this option to
      ensure that users cannot create a block or character special devices in `/var/tmp`.
    impact: ''
    audit_guidance: "**- IF -** a separate partition exists for `/var/tmp`, verify that the `nodev` option\
      \ is set.\r\n\r\nRun the following command to verify that the `nodev` mount option is set.\r\n\r\
      \n_Example:_\r\n\r\n```\r\n# findmnt -kn /var/tmp | grep -v nodev\r\n\r\nNothing should be returned\r\
      \n```"
    remediation_guidance: "**- IF -** a separate partition exists for `/var/tmp`.\r\n\r\nEdit the `/etc/fstab`\
      \ file and add `nodev` to the fourth field (mounting options) for the `/var/tmp` partition.\r\n\r\
      \n_Example:_\r\n\r\n``` /var/tmp defaults,rw,nosuid,nodev,noexec,relatime  0 0\r\n```\r\n\r\nRun\
      \ the following command to remount `/var/tmp` with the configured options:\r\n\r\n```\r\n# mount\
      \ -o remount /var/tmp\r\n```"
    additional_information: ''
    default_value: ''
    artifacts_count: 1
    requirements: {}
    safety:
      default: investigate
