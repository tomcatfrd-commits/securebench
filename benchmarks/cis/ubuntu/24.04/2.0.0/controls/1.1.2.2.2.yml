    parent: CIS _1_Configure Filesystem Partitions Main | 1.1.2.2-Ensure nodev option set on /dev/shm
      partition
    rationale: Since the `/dev/shm` filesystem is not intended to support devices, set this option to
      ensure that users cannot attempt to create special devices in `/dev/shm` partitions.
    impact: ''
    audit_guidance: "**- IF -** a separate partition exists for `/dev/shm`, verify that the `nodev` option\
      \ is set.\r\n\r\n```\r\n# findmnt -kn /dev/shm | grep -v 'nodev'\r\n\r\nNothing should be returned\r\
      \n```"
    remediation_guidance: "**- IF -** a separate partition exists for `/dev/shm`.\r\n\r\nEdit the `/etc/fstab`\
      \ file and add `nodev` to the fourth field (mounting options) for the `/dev/shm`  partition. See\
      \ the `fstab(5)` manual page for more information.\r\n\r\n_Example:_\r\n\r\n```\r\ntmpfs /dev/shm\
      \    tmpfs     defaults,rw,nosuid,nodev,noexec,relatime  0 0\r\n```\r\n\r\nRun the following command\
      \ to remount `/dev/shm` with the configured options:\r\n\r\n```\r\n# mount -o remount /dev/shm\r\
      \n```\r\n\r\n**Note:** It is recommended to use `tmpfs` as the device/filesystem type as `/dev/shm`\
      \ is used as shared memory space by applications."
    additional_information: Some distributions mount `/dev/shm` through other means and require `/dev/shm`
      to be added to `/etc/fstab` even though it is already being mounted on boot. Others may configure
      `/dev/shm` in other locations and may override `/etc/fstab` configuration. Consult the documentation
      appropriate for your distribution.
    default_value: ''
