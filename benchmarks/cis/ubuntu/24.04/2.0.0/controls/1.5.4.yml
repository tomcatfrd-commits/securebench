control:
  id: CIS-1.5.4
  benchmark_id: cis-ubuntu-24.04
  title: Ensure fs.suid_dumpable is configured
  description: "`fs.suid_dumpable` governs whether a privileged process (with the setuid bit) can generate\
    \ a core dump, regardless of other configurations.\r\n\r\n`fs.suid_dumpable` values:\r\n- `0` (default)\
    \ - Any process that has changed privilege levels (like SUID programs) or is execute-only will not\
    \ dump core.\r\n- `1` (debug) - All processes dump core if possible. The core dump is owned by the\
    \ current user and security is not applied. This is primarily intended for system debugging.\r\n-\
    \ `2` (suidsafe) - Any binary that normally wouldn't be dumped is dumped, but only if the core_pattern\
    \ is set to a pipe handler or a fully qualified path. This mode is suitable for administrators debugging\
    \ in a production environment.\r\n\r\nMore information about the kernel parameter configuration files,\
    \ their location, and load preference is available in the section overview."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.1_5_4.audit
  remediation: cis.ubuntu.24.04.v2_0_0.1_5_4.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.1_5_4.rollback
  verification: cis.ubuntu.24.04.v2_0_0.1_5_4.verify
  rollback_capability: unsupported
