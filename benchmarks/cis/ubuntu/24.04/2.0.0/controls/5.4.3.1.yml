control:
  id: CIS-5.4.3.1
  benchmark_id: cis-ubuntu-24.04
  title: Ensure nologin is not listed in /etc/shells
  description: "`/etc/shells` is a text file which contains the full pathnames of valid login shells.\
    \ This file is consulted by `chsh` and available to be queried by other programs.\r\n\r\nBe aware\
    \ that there are programs which consult this file to find out if a user is a normal user; for example,\
    \ FTP daemons traditionally disallow access to users with shells not included in this file."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_4_3_1.audit
  remediation: cis.ubuntu.24.04.v2_0_0.5_4_3_1.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.5_4_3_1.rollback
  verification: cis.ubuntu.24.04.v2_0_0.5_4_3_1.verify
  rollback_capability: unsupported
  metadata:
