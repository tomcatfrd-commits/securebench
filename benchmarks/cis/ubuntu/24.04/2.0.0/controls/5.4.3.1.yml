    parent: CIS _5_ User Accounts and Environment Main | 1.1.1.1-Ensure nologin is not listed in /etc/shells
    rationale: "A user can use `chsh` to change their configured shell.\r\n\r\nIf a user has a shell configured\
      \ that isn't in in `/etc/shells`, then the system assumes that they're somehow restricted. In the\
      \ case of `chsh` it means that the user cannot change that value.\r\n\r\nOther programs might query\
      \ that list and apply similar restrictions.\r\n\r\nBy putting `nologin` in `/etc/shells`, any user\
      \ that has `nologin` as its shell is considered a full, unrestricted user. This is not the expected\
      \ behavior for `nologin`."
    impact: ''
    audit_guidance: "Run the following command to verify that `nologin` is not listed in the `/etc/shells`\
      \ file:\r\n\r\n```\r\n# grep -Ps '^\\h*([^#\\n\\r]+)?\\/nologin\\b' /etc/shells\r\n```\r\n\r\nNothing\
      \ should be returned"
    remediation_guidance: Edit `/etc/shells` and remove any lines that include `nologin`
    additional_information: ''
