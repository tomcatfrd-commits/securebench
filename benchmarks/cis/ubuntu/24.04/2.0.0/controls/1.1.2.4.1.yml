control:
  id: CIS-1.1.2.4.1
  benchmark_id: cis-ubuntu-24.04
  title: Ensure separate partition exists for /var
  description: The `/var` directory is used by daemons and other system services to temporarily store
    dynamic data. Some directories created by these processes may be world-writable.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.1_1_2_4_1.audit
  remediation: cis.ubuntu.24.04.v2_0_0.1_1_2_4_1.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.1_1_2_4_1.rollback
  verification: cis.ubuntu.24.04.v2_0_0.1_1_2_4_1.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 1.1.2.4.1
      url: https://workbench.cisecurity.org/sections/4177256/recommendations/7047557
    assessment_status: automated
    profiles:
    - Level 2 - Server
    - Level 2 - Workstation
    mappings:
      nist:
      - CM-7
      cis_v8:
      - '3.3'
      cis_v7:
      - '14.6'
      mitre_techniques:
      - T1499
      - T1499.001
      mitre_tactics:
