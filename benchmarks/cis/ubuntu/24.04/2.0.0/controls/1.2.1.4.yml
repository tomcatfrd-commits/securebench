control:
  id: CIS-1.2.1.4
  benchmark_id: cis-ubuntu-24.04
  title: Ensure access to /etc/apt/trusted.gpg.d  directory is configured
  description: The `/etc/apt/trusted.gpg.d` directory stores individual GPG key files that APT uses to
    verify the authenticity of packages and repositories.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.1_2_1_4.audit
  remediation: cis.ubuntu.24.04.v2_0_0.1_2_1_4.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.1_2_1_4.rollback
  verification: cis.ubuntu.24.04.v2_0_0.1_2_1_4.verify
  rollback_capability: unsupported
  metadata:
