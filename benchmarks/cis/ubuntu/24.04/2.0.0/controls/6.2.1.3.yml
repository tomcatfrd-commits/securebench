control:
  id: CIS-6.2.1.3
  benchmark_id: cis-ubuntu-24.04
  title: Ensure auditing for processes that start prior to auditd is enabled
  description: Configure `grub2` so that processes that are capable of being audited can be audited even
    if they start up prior to `auditd` startup.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.6_2_1_3.audit
  remediation: cis.ubuntu.24.04.v2_0_0.6_2_1_3.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.6_2_1_3.rollback
  verification: cis.ubuntu.24.04.v2_0_0.6_2_1_3.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 6.2.1.3
      url: https://workbench.cisecurity.org/sections/4177262/recommendations/7047610
    assessment_status: automated
    profiles:
    - Level 2 - Server
    - Level 2 - Workstation
    mappings:
      nist:
      - AU-12
