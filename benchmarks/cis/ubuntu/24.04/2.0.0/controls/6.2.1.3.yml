    parent: CIS _6_System Auditing Main | 2.2.1.3-Ensure auditing for processes that start prior to auditd
      is enabled
    rationale: Audit events need to be captured on processes that start up prior to `auditd` , so that
      potential malicious activity cannot go undetected.
    impact: ''
    audit_guidance: "Run the following command:\r\n\r\n```\r\n# find /boot -type f -name 'grub.cfg' -exec\
      \ grep -Ph -- '^\\h*linux' {} + | grep -v 'audit=1'\r\n```\r\n\r\nNothing should be returned."
    remediation_guidance: "Edit `/etc/default/grub` or a file in `/etc/default/grub.d/` ending in `.cfg`\
      \ adding `audit=1` to `GRUB_CMDLINE_LINUX`:\r\n\r\n_Example_:\r\n```\r\n# printf \"\\n%s\\n\" 'GRUB_CMDLINE_LINUX=\"\
      audit=1\"' >> /etc/default/grub.d/40-custom.cfg\r\n```\r\nRun the following command to update the\
      \ `grub2` configuration:\r\n\r\n```\r\n# update-grub\r\n```"
    additional_information: This recommendation is designed around the grub2 bootloader, if another bootloader
      is in use in your environment enact equivalent settings.
    default_value: ''
    artifacts_count: 1
    requirements: {}
    safety:
