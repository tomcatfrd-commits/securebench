control:
  id: CIS-5.3.1.3
  benchmark_id: cis-ubuntu-24.04
  title: Ensure latest version of libpam-pwquality is installed
  description: "`libpwquality` provides common functions for password quality checking and scoring them\
    \ based on their apparent randomness. The library also provides a function for generating random passwords\
    \ with good pronounceability.\r\n\r\nThis module can be plugged into the password stack of a given\
    \ service to provide some plug-in strength-checking for passwords. The code was originally based on\
    \ `pam_cracklib` module and the module is backwards compatible with its options."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_3_1_3.audit
