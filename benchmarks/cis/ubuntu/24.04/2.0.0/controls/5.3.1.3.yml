    rationale: "Strong passwords reduce the risk of systems being hacked through brute force methods.\r\
      \n\r\nOlder versions of the `libpam-pwquality` package may not include the latest security and feature\
      \ patches and updates."
    impact: ''
    audit_guidance: "Run the following command to verify `libpam-pwquality` is installed:\r\n\r\n```\r\
      \n# dpkg-query -s libpam-pwquality &>/dev/null && echo \"libpam-pwquality is installed\"\r\n\r\n\
      libpam-pwquality is installed\r\n```\r\n\r\nRun the following command to verify `libpam-pwquality`\
      \ is the latest version:\r\n\r\n```\r\n# apt list --upgradable 2>&1 | grep -P '^libpam-pwquality\\\
      b'\r\n```\r\n\r\nNothing should be returned"
    remediation_guidance: "Run the following command to install the latest version of `libpam-pwquality`:\r\
      \n\r\n```\r\n# apt install libpam-pwquality\r\n```"
