control:
  id: CIS-1.7.4
  benchmark_id: cis-ubuntu-24.04
  title: Ensure GDM automount is configured
  description: "By default GNOME automatically mounts removable media when inserted as a convenience to\
    \ the user.\r\n\r\nBy using the lockdown mode in dconf, you can prevent users from changing specific\
    \ settings."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.1_7_4.audit
  remediation: cis.ubuntu.24.04.v2_0_0.1_7_4.remediate
