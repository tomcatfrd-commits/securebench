control:
  id: CIS-5.3.3.2.2
  benchmark_id: cis-ubuntu-24.04
  title: Ensure password length is configured
  description: "The minimum password length setting determines the lowers number of characters that make\
    \ up a password for a user account. There are many different theories about how to determine the best\
    \ password length for an organization, but perhaps \"passphrase\" is a better term than \"password\"\
    .\r\n\r\nThe `minlen` option sets the minimum acceptable size for the new password (plus one if credits\
    \ are not disabled which is the default). Cannot be set to lower value than 6."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_3_3_2_2.audit
  remediation: cis.ubuntu.24.04.v2_0_0.5_3_3_2_2.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.5_3_3_2_2.rollback
