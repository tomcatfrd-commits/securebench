    parent: CIS _5_Pluggable Authentication Modules Main | 2.1.4.2.2-Ensure password length is configured
    rationale: Strong passwords help protect systems from password attacks. Types of password attacks
      include dictionary attacks, which attempt to use common words and phrases, and brute force attacks,
      which try every possible combination of characters. Also attackers may try to obtain the account
      database so they can use tools to discover the accounts and passwords.
    impact: "In general, it is true that longer passwords are better (harder to crack), but it is also\
      \ true that forced password length requirements can cause user behavior that is predictable and\
      \ undesirable. For example, requiring users to have a minimum 16-character password may cause them\
      \ to choose repeating patterns like fourfourfourfour or passwordpassword that meet the requirement\
      \ but aren’t hard to guess. Additionally, length requirements increase the chances that users will\
      \ adopt other insecure practices, like writing them down, re-using them or storing them unencrypted\
      \ in their documents.\r\n\r\nHaving a reasonable minimum length with no maximum character limit\
      \ increases the resulting\r\naverage password length used (and therefore the strength).6"
    audit_guidance: "Run the following command to verify that password length is `14` or more characters,\
      \ and conforms to local site policy:\r\n\r\n```\r\n# grep -Psi -- '^\\h*minlen\\h*=\\h*(1[4-9]|[2-9][0-9]|[1-9][0-9]{2,})\\\
      b' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf\r\n```\r\n\r\n_Example output:_\r\
      \n\r\n```\r\n/etc/security/pwquality.conf.d/50-pwlength.conf:minlen = 14\r\n```\r\n\r\nVerify returned\
      \ value(s) are no less than `14` characters and meet local site policy\r\n\r\nRun the following\
      \ command to verify that `minlen` is not set, or is `14` or more characters, and conforms to local\
      \ site policy:\r\n\r\n```\r\n# grep -Psi -- '^\\h*password\\h+(requisite|required|sufficient)\\\
      h+pam_pwquality\\.so\\h+([^#\\n\\r]+\\h+)?minlen\\h*=\\h*([0-9]|1[0-3])\\b' /etc/pam.d/common-password\r\
      \n```\r\n\r\nNothing should be returned\r\n\r\n**Note:** \r\n- settings should be configured in\
      \ only **one** location for clarity\r\n- Settings observe an order of precedence:\r\n  - module\
      \ arguments override the settings in the `/etc/security/pwquality.conf` configuration file\r\n \
      \ - settings in the `/etc/security/pwquality.conf` configuration file override settings in a `.conf`\
      \ file in the `/etc/security/pwquality.conf.d/` directory\r\n  - settings in a `.conf` file in the\
      \ `/etc/security/pwquality.conf.d/` directory are read in canonical order, with last read file containing\
      \ the setting taking precedence\r\n- It is recommended that settings be configured in a `.conf`\
      \ file in the `/etc/security/pwquality.conf.d/` directory for clarity, convenience, and durability."
    remediation_guidance: "Create or modify a file ending in `.conf` in the `/etc/security/pwquality.conf.d/`\
      \ directory or the file `/etc/security/pwquality.conf` and add or modify the following line to set\
      \ password length of `14` or more characters. Ensure that password length conforms to local site\
      \ policy: \r\n\r\n_Example:_\r\n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n   sed -ri 's/^\\s*minlen\\\
      s*=/# &/' /etc/security/pwquality.conf\r\n   [ ! -d /etc/security/pwquality.conf.d/ ] && mkdir /etc/security/pwquality.conf.d/\r\
      \n   printf '\\n%s' \"minlen = 14\" > /etc/security/pwquality.conf.d/50-pwlength.conf\r\n}\r\n```\r\
      \n\r\nRun the following command:\r\n\r\n```\r\n# grep -Pl -- '\\bpam_pwquality\\.so\\h+([^#\\n\\\
      r]+\\h+)?minlen\\b' /usr/share/pam-configs/*\r\n```\r\n\r\nEdit any returned files and remove the\
      \ `minlen` argument from the `pam_pwquality.so` line(s):"
    additional_information: ''
    default_value: minlen = 8
