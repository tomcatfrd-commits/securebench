    rationale: This access must be limited to only the default `root` account and only from the system
      console. Administrative access must be through an unprivileged account using an approved mechanism
      as noted in the Recommendation "Ensure access to the su command is restricted".
    impact: ''
    audit_guidance: "Run the following command and verify that only \"root\" is returned:\r\n\r\n\r\n\
      ```\r\n# awk -F: '($3 == 0) { print $1 }' /etc/passwd\r\n\r\nroot\r\n```"
    remediation_guidance: "Run the following command to change the `root` account UID to `0`:\r\n\r\n\
      ```\r\n# usermod -u 0 root\r\n```\r\n\r\nModify any users other than `root` with UID `0` and assign\
      \ them a new UID."
