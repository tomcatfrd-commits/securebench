control:
  id: CIS-6.3.3
  benchmark_id: cis-ubuntu-24.04
  title: Ensure cryptographic mechanisms are used to protect the integrity of audit tools
  description: "Audit tools include, but are not limited to, vendor-provided and open source audit tools\
    \ needed to successfully view and manipulate audit information system activity and records. Audit\
    \ tools include custom queries and report generators.\r\n\r\n`aide.conf` is case-sensitive. Leading\
    \ and trailing white spaces are ignored. Each config lines must end with new line.\r\n\r\n`AIDE` uses\
    \ the backslash character `\\` as escape character for '` `' (space), '@' and '\\' (backslash) (e.g.\
    \ '\\ ' or '\\@'). To literally match a '\\' in  a  file path with a regular expression you have to\
    \ escape the backslash twice (i.e. '\\\\\\\\').\r\n\r\nThere  are  three  types  of lines in `aide.conf`:\r\
    \n- The configuration options which are used to set configuration parameters and define groups.\r\n\
    - (restricted) rules that are used to indicate which files are added to the database.\r\n- Macro lines\
    \ define or undefine variables within the config file.\r\n\r\n**Note:** Lines beginning with `#` are\
    \ ignored as comments.\r\n\r\n`@@include` _ _ - Include _ _.\r\n- The content of the file is used\
    \ as if it were inserted in this part of the config file.\r\n- The maximum depth of nested includes\
    \ is 16.\r\n\r\n`@@include _ _ _ _ - [RULE_PREFIX] (added in AIDE v0.17)\r\n- Include all (regular)\
    \ files found in matching regular expression (sub-directories are ignored).\r\n- The file are included\
    \ in lexical sort order.\r\n- If `RULE_PREFIX` is set, all rules included by the statement are prefixed\
    \ with given (added in AIDE v0.18). Prefixes  from  nested  include statements are concatenated.\r\
    \n- The content of the files is used as if it were inserted in this part of the config file.\r\n\r\
    \n`@x_include`:\r\n- is identical to `@@include`, except that if a config file is executable is is\
    \ run and the output is used as config.\r\n- If the executable file exits with status greater than\
    \ zero or writes to stderr aide stops with an error.\r\n- For security reasons _ _ and each executable\
    \ config file must be owned by the current user or root. They must not be group- or world-writable.\r\
    \n- `@@x_include _ _` (added in AIDE v0.17):\r\n- `@@x_include _ _ _ _ [RULE_PREFIX]  (added in AIDE\
    \ v0.17)\r\n\r\n`@@x_include_setenv` _ _ _ _ (added in AIDE v0.17)\r\n- Adds the variable _ _ with\
    \ the value _ _ to the environment used for config file execution.\r\n- Environment variable names\
    \ are limited to alphanumeric characters (A-Za-z0-9) and the underscore '_' and must not begin with\
    \ a digit."
  platform: ubuntu-24.04
  severity: unspecified
