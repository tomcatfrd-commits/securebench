    parent: CIS _7_System File Permissions Main | 2.1.1-Ensure access to /etc/passwd is configured
    rationale: It is critical to ensure that the `/etc/passwd` file is protected from unauthorized write
      access. Although it is protected by default, the file permissions could be changed either inadvertently
      or through malicious actions.
    impact: ''
    audit_guidance: "Run the following command to verify `/etc/passwd` is mode 644 or more restrictive,\
      \ `Uid` is `0/root` and `Gid` is `0/root`:\r\n\r\n```\r\n# stat -Lc 'Access: (%#a/%A)  Uid: ( %u/\
      \ %U) Gid: ( %g/ %G)'  /etc/passwd\r\n\r\nAccess: (0644/-rw-r--r--)  Uid: ( 0/ root) Gid: ( 0/ root)\r\
      \n```"
    remediation_guidance: "Run the following commands to remove excess permissions, set owner, and set\
      \ group on `/etc/passwd`:\r\n\r\n```\r\n# chmod u-x,go-wx /etc/passwd\r\n# chown root:root /etc/passwd\r\
      \n```"
    additional_information: ''
    default_value: 'Access: (0644/-rw-r--r--)  Uid: ( 0/ root) Gid: ( 0/ root)'
