  title: Ensure access to /etc/passwd is configured
  description: The `/etc/passwd` file contains user account information that is used by many system utilities
    and therefore must be readable for these utilities to operate.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.7_1_1.audit
