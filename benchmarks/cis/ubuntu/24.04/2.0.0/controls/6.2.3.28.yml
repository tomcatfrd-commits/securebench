control:
  id: CIS-6.2.3.28
  benchmark_id: cis-ubuntu-24.04
  title: Ensure kernel module loading unloading and modification is collected
  description: "Monitor the loading and unloading of kernel modules. All the loading / listing / dependency\
    \ checking of modules is done by `kmod` via symbolic links.\r\n\r\nThe following system calls control\
    \ loading and unloading of modules:\r\n- `init_module` - load a module\r\n- `finit_module` - load\
    \ a module (used when the overhead of using cryptographically signed modules to determine the authenticity\
    \ of a module can be avoided)\r\n- `delete_module` - delete a module\r\n- `create_module` - create\
    \ a loadable module entry\r\n- `query_module` - query the kernel for various bits pertaining to modules\r\
    \n\r\nAny execution of the loading and unloading module programs and system calls will trigger an\
    \ audit record with an identifier of `modules`."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.6_2_3_28.audit
  remediation: cis.ubuntu.24.04.v2_0_0.6_2_3_28.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.6_2_3_28.rollback
  verification: cis.ubuntu.24.04.v2_0_0.6_2_3_28.verify
  rollback_capability: unsupported
