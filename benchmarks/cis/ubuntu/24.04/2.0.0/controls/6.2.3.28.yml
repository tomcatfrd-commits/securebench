    parent: CIS _6_System Auditing Main | 2.2.3.28-Ensure kernel module loading unloading and modification
      is collected
    rationale: Monitoring the use of all the various ways to manipulate kernel modules could provide system
      administrators with evidence that an unauthorized change was made to a kernel module, possibly compromising
      the security of the system.
    impact: ''
    audit_guidance: "**On disk configuration**\r\n\r\nRun the following script to check the on disk rules:\r\
      \n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n  awk '/^ *-a *always,exit/ \\\r\n  &&/ -F *arch=b(32|64)/\
      \ \\\r\n  &&(/ -F auid!=unset/||/ -F auid!=-1/||/ -F auid!=4294967295/) \\\r\n  &&/ -S/ \\\r\n \
      \ &&(/init_module/ \\\r\n    ||/finit_module/ \\\r\n    ||/delete_module/ \\\r\n    ||/create_module/\
      \ \\\r\n    ||/query_module/) \\\r\n  &&(/ key= *[!-~]* *$/||/ -k *[!-~]* *$/)' /etc/audit/rules.d/*.rules\r\
      \n\r\n  UID_MIN=$(awk '/^\\s*UID_MIN/{print $2}' /etc/login.defs)\r\n  [ -n \"${UID_MIN}\" ] &&\
      \ awk \"/^ *-a *always,exit/ \\\r\n  &&(/ -F *auid!=unset/||/ -F *auid!=-1/||/ -F *auid!=4294967295/)\
      \ \\\r\n  &&/ -F *auid>=${UID_MIN}/ \\\r\n  &&/ -F *perm=x/ \\\r\n  &&/ -F *path=\\/usr\\/bin\\\
      /kmod/ \\\r\n  &&(/ key= *[!-~]* *$/||/ -k *[!-~]* *$/)\" /etc/audit/rules.d/*.rules \\\r\n  ||\
      \ printf \"ERROR: Variable 'UID_MIN' is unset.\\n\"\r\n}\r\n```\r\n\r\nVerify the output matches:\r\
      \n\r\n```\r\n-a always,exit -F arch=b32 -S init_module,finit_module,delete_module,create_module,query_module\
      \ -F auid>=1000 -F auid!=unset -k kernel_modules\r\n-a always,exit -F arch=b64 -S init_module,finit_module,delete_module,create_module,query_module\
      \ -F auid>=1000 -F auid!=unset -k kernel_modules\r\n-a always,exit -F path=/usr/bin/kmod -F perm=x\
      \ -F auid>=1000 -F auid!=unset -k kernel_modules\r\n```\r\n\r\n**Running configuration**\r\n\r\n\
      Run the following script to check loaded rules:\r\n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n \
      \ auditctl -l | awk '/^ *-a *always,exit/ \\\r\n  &&/ -F *arch=b(32|64)/ \\\r\n  &&(/ -F auid!=unset/||/\
      \ -F auid!=-1/||/ -F auid!=4294967295/) \\\r\n  &&/ -S/ \\\r\n  &&(/init_module/ \\\r\n    ||/finit_module/\
      \ \\\r\n    ||/delete_module/ \\\r\n    ||/create_module/ \\\r\n    ||/query_module/) \\\r\n  &&(/\
      \ key= *[!-~]* *$/||/ -k *[!-~]* *$/)'\r\n\r\n  UID_MIN=$(awk '/^\\s*UID_MIN/{print $2}' /etc/login.defs)\r\
      \n  [ -n \"${UID_MIN}\" ] && auditctl -l | awk \"/^ *-a *always,exit/ \\\r\n  &&(/ -F *auid!=unset/||/\
      \ -F *auid!=-1/||/ -F *auid!=4294967295/) \\\r\n  &&/ -F *auid>=${UID_MIN}/ \\\r\n  &&/ -F *perm=x/\
      \ \\\r\n  &&/ -F *path=\\/usr\\/bin\\/kmod/ \\\r\n  &&(/ key= *[!-~]* *$/||/ -k *[!-~]* *$/)\" \\\
      \r\n  || printf \"ERROR: Variable 'UID_MIN' is unset.\\n\"\r\n}\r\n```\r\n\r\nVerify the output\
      \ includes:\r\n\r\n```\r\n-a always,exit -F arch=b64 -S create_module,init_module,delete_module,query_module,finit_module\
      \ -F auid>=1000 -F auid!=-1 -F key=kernel_modules\r\n-a always,exit -S all -F path=/usr/bin/kmod\
      \ -F perm=x -F auid>=1000 -F auid!=-1 -F key=kernel_modules\r\n```\r\n\r\n**Symlink audit**\r\n\r\
      \nRun the following script to audit if the symlinks `kmod` accepts are indeed pointing at it:\r\n\
      \r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n   a_files=(\"/usr/sbin/lsmod\" \"/usr/sbin/rmmod\" \"\
      /usr/sbin/insmod\" \"/usr/sbin/modinfo\" \"/usr/sbin/modprobe\" \"/usr/sbin/depmod\")\r\n   for\
      \ l_file in \"${a_files[@]}\"; do\r\n      if [ \"$(readlink -f \"$l_file\")\" = \"$(readlink -f\
      \ /bin/kmod)\" ]; then\r\n         printf \"OK: \\\"$l_file\\\"\\n\"\r\n      else\r\n         printf\
      \ \"Issue with symlink for file: \\\"$l_file\\\"\\n\"\r\n      fi\r\n   done\r\n}\r\n```\r\n\r\n\
      Verify the output states `OK`. If there is a symlink pointing to a different location it should\
      \ be investigated"
    remediation_guidance: "**Create audit rules**\r\n\r\nEdit or create a file in the `/etc/audit/rules.d/`\
      \ directory, ending in `.rules` extension, with the relevant rules to monitor kernel module modification.\r\
      \n\r\n_Example:_\r\n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n  UID_MIN=$(awk '/^\\s*UID_MIN/{print\
      \ $2}' /etc/login.defs)\r\n  [ -n \"${UID_MIN}\" ] && printf \"\r\n  -a always,exit -F arch=b32\
      \ -S init_module,finit_module,delete_module,create_module,query_module -F auid>=${UID_MIN} -F auid!=unset\
      \ -k kernel_modules\r\n  -a always,exit -F arch=b64 -S init_module,finit_module,delete_module,create_module,query_module\
      \ -F auid>=${UID_MIN} -F auid!=unset -k kernel_modules\r\n  -a always,exit -F path=/usr/bin/kmod\
      \ -F perm=x -F auid>=${UID_MIN} -F auid!=unset -k kernel_modules\r\n  \" >> /etc/audit/rules.d/50-kernel_modules.rules\
      \ || printf \"ERROR: Variable 'UID_MIN' is unset.\\n\"\r\n}\r\n```\r\n\r\n**Load audit rules**\r\
      \n\r\nMerge and load the rules into active configuration:\r\n\r\n```\r\n# augenrules --load\r\n\
      ```\r\n\r\nCheck if reboot is required.\r\n\r\n```\r\n# if [[ $(auditctl -s | grep \"enabled\")\
      \ =~ \"2\" ]]; then printf \"Reboot required to load rules\\n\"; fi\r\n```"
