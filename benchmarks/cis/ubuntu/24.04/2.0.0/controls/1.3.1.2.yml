control:
  id: CIS-1.3.1.2
  benchmark_id: cis-ubuntu-24.04
  title: Ensure AppArmor is enabled
  description: "`AppArmor` is a kernel enhancement to confine programs to a limited set of resources.\
    \ `AppArmor` is enabled by default.\r\n\r\n**Note:** This recommendation is designed around the grub\
    \ bootloader, if LILO or another bootloader is in use in your environment enact equivalent settings."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.1_3_1_2.audit
