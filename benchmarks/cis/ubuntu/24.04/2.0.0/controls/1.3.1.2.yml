    parent: CIS _1_Mandatory Access Control Main | 2.1.1.2-Ensure AppArmor is enabled
    rationale: '`AppArmor` is a security mechanism and disabling it is not recommended.'
    impact: ''
    audit_guidance: "Run the following command to verify that `AppArmor` has not been disabled:\r\n```\r\
      \n# grep \"^\\s*linux\" /boot/grub/grub.cfg | grep \"apparmor=0\"\r\n```\r\nNothing should be returned."
    remediation_guidance: "Edit `/etc/default/grub` of file in `/etc/default/grub.d` and remove the `apparmor=0`\
      \ parameters to the `GRUB_CMDLINE_LINUX=` line\r\n\r\nRun the following commands to update the `grub2`\
      \ configuration and reboot the system:\r\n\r\n```\r\n# update-grub\r\n# reboot\r\n```"
