    parent: CIS _2_Configure Server Services Main | 2.1.14-Ensure print server services are not in use
    rationale: If the system does not need to print jobs or accept print jobs from other systems, it is
      recommended that CUPS be removed to reduce the potential attack surface.
    impact: "Removing the cups package, or disabling `cups.socket` and/or `cups.service` will prevent\
      \ printing from the system, a common task for workstation systems.\r\n\r\nThere may be packages\
      \ that are dependent on the `cups` package. If the `cups` package is removed, these dependent packages\
      \ will be removed as well. Before removing the `cups` package, review any dependent packages to\
      \ determine if they are required on the system.\r\n\r\n**- IF -** a dependent package is required:\
      \ stop and mask `cups.socket` and `cups.service` leaving the `cups` package installed."
    audit_guidance: "Run the following command to verify `cups` is not Installed:\r\n\r\n```\r\n# dpkg-query\
      \ -s cups &>/dev/null && echo \"cups is installed\"\r\n```\r\n\r\nNothing should be returned.\r\n\
      \r\n**- OR -**\r\n\r\n**- IF -** the `cups` package is required as a dependency:\r\n\r\nRun the\
      \ following command to verify the `cups.socket` and `cups.service` are not enabled:\r\n\r\n```\r\
      \n# systemctl is-enabled cups.socket cups.service 2>/dev/null | grep 'enabled'\r\n\r\nNothing should\
      \ be returned\r\n```\r\n\r\nRun the following command to verify the `cups.socket` and `cups.service`\
      \ are not active:\r\n\r\n```\r\n# systemctl is-active cups.socket cups.service 2>/dev/null | grep\
      \ '^active'\r\n\r\nNothing should be returned\r\n```\r\n\r\n**Note:** If the package is required\
      \ for a dependency\r\n - Ensure the dependent package is approved by local site policy\r\n - Ensure\
      \ stopping and masking the service and/or socket meets local site policy"
    remediation_guidance: "Run the following commands to stop `cups.socket` and `cups.service`, and remove\
      \ the `cups` package:\r\n\r\n```\r\n# systemctl stop cups.socket cups.service\r\n# apt purge cups\r\
      \n```\r\n\r\n**- OR -** \r\n\r\n**- IF -** the `cups` package is required as a dependency:\r\n\r\
      \nRun the following commands to stop and mask the `cups.socket` and `cups.service`:\r\n\r\n```\r\
      \n# systemctl stop cups.socket cups.service\r\n# systemctl mask cups.socket cups.service\r\n```"
