control:
  id: CIS-2.1.14
  benchmark_id: cis-ubuntu-24.04
  title: Ensure print server services are not in use
  description: The Common Unix Print System (CUPS) provides the ability to print to both local and network
    printers. A system running CUPS can also accept print jobs from remote systems and print them to local
    printers. It also provides a web based remote administration capability.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.2_1_14.audit
  remediation: cis.ubuntu.24.04.v2_0_0.2_1_14.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.2_1_14.rollback
  verification: cis.ubuntu.24.04.v2_0_0.2_1_14.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 2.1.14
      url: https://workbench.cisecurity.org/sections/4177245/recommendations/7047611
    assessment_status: automated
    profiles:
    - Level 1 - Server
    - Level 2 - Workstation
    mappings:
      nist:
      - CM-7
      cis_v8:
      - '4.8'
      cis_v7:
