    parent: CIS _1_Package Management Main | 2.2.5-Ensure access to /etc/apt/auth.conf.d directory  is
      configured
    rationale: The `/etc/apt/auth.conf.d` directory contains APT `.conf` files which should have restricted
      access because they control how the package manager runs as root and may contain sensitive information.
      If writable or readable by non-root users, they could be altered to run malicious commands or expose
      credentials.
    impact: ''
    audit_guidance: "Run the following command and verify `/etc/apt/auth.conf.d` `Uid` and `Gid` are both\
      \ `0/root` and access is `0755` or more restrictive:\r\n```\r\n# stat -Lc 'Access: (%a/%A) Uid:\
      \ ( %u/ %U) Gid: ( %g/ %G)' /etc/apt/auth.conf.d\r\n\r\nAccess: (755/drwxr-xr-x) Uid: ( 0/ root)\
      \ Gid: ( 0/ root)\r\n```"
    remediation_guidance: "Run the following commands to set permissions on `/etc/apt/auth.conf.d/` `Uid`\
      \ and `Gid` are both `0/root` and access is `0755` or more restrictive:\r\n```\r\n# chown root:root\
      \ /etc/apt/auth.conf.d\r\n# chmod u=rwx,g=rx,o=rx /etc/apt/auth.conf.d\r\n```"
    additional_information: ''
    default_value: 'Access: (755/drwxr-xr-x) Uid: ( 0/ root) Gid: ( 0/ root)'
    artifacts_count: 3
    requirements: {}
    safety:
      default: investigate
