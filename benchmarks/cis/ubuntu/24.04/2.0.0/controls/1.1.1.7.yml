    parent: CIS _1_Configure Filesystem Kernel Modules Main | 1.1.7-Ensure squashfs kernel module is not
      available
    rationale: Removing support for unneeded filesystem types reduces the local attack surface of the
      system. If this filesystem type is not needed, disable it.
    impact: "As Snap packages utilize `squashfs` as a compressed filesystem, disabling `squashfs` will\
      \ cause Snap packages to fail.\r\n\r\n`Snap` application packages of software are self-contained\
      \ and work across a range of Linux distributions. This is unlike traditional Linux package management\
      \ approaches, like APT or RPM, which require specifically adapted packages per Linux distribution\
      \ on an application update and delay therefore application deployment from developers to their software's\
      \ end-user. Snaps themselves have no dependency on any external store (\"App store\"), can be obtained\
      \ from any source and can be therefore used for upstream software deployment."
    audit_guidance: "Verify the `squashfs` kernel module is not available on the system or has been disabled.\r\
      \n\r\n1. Run the following script to determine if the `squashfs` kernel module is available on the\
      \ system:\r\n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n   l_mod_name=\"squashfs\" l_mod_type=\"\
      fs\"\r\n   while IFS= read -r l_mod_path; do\r\n      if [ -d \"$l_mod_path/${l_mod_name//-/\\/}\"\
      \ ] &&  \\\r\n      [ -n \"$(ls -A \"$l_mod_path/${l_mod_name//-/\\/}\")\" ]; then\r\n         printf\
      \ '%s\\n' \"$l_mod_name exists in $l_mod_path\"\r\n      fi\r\n   done < <(readlink -e /usr/lib/modules/**/kernel/$l_mod_type\
      \ \\\r\n   || readlink -e /lib/modules/**/kernel/$l_mod_type)\r\n}\r\n```\r\n\r\nIf nothing is returned,\
      \ the `squashfs` kernel module is not available on the system and no further audit steps are required.\r\
      \n\r\n**Note:** Some systems may include the `squashfs` filesystem as part of the kernel opposed\
      \ to being available as a kernel module. In this case, the above audit will not return anything.\
      \ This is also considered a passing state.\r\n\r\n**If anything is returned by the above script:**\r\
      \n\r\n2. Verify the `squashfs` kernel module is not loaded and not loadable by performing the following:\r\
      \n\r\nRun the following command to verify the `squashfs` kernel module is not loaded:\r\n\r\n```\r\
      \n# lsmod | grep 'squashfs'\r\n```\r\n\r\nNothing should be returned.\r\n\r\nRun the following command\
      \ to verify the `squashfs` kernel module is not loadable:\r\n\r\n```\r\n# modprobe --showconfig\
      \ | grep -P -- '\\b(install|blacklist)\\h+squashfs\\b'\r\n```\r\n\r\nVerify the output includes:\r\
      \n\r\n```\r\nblacklist squashfs\r\n -AND-\r\ninstall squashfs /bin/false\r\n -OR-\r\ninstall squashfs\
      \ /bin/true\r\n```\r\n\r\n_Example output:_\r\n\r\n```\r\nblacklist squashfs\r\ninstall squashfs\
      \ /bin/false\r\n```"
    remediation_guidance: "Unload and disable the `squashfs` kernel module.\r\n\r\n1. Run the following\
      \ commands to unload the `squashfs` kernel module:\r\n\r\n```\r\n# modprobe -r squashfs 2>/dev/null\r\
      \n# rmmod squashfs 2>/dev/null\r\n```\r\n\r\n2. Perform the following to disable the `squashfs`\
      \ kernel module:\r\n\r\nCreate a file ending in `.conf` with `install squashfs /bin/false` in the\
      \ `/etc/modprobe.d/` directory.\r\n\r\n_Example:_\r\n\r\n```\r\n# printf '%s\\n' \"\" \"install\
      \ squashfs /bin/false\" >> /etc/modprobe.d/60-squashfs.conf\r\n```\r\n\r\nCreate a file ending in\
      \ `.conf` with `blacklist squashfs` in the `/etc/modprobe.d/` directory.\r\n\r\n_Example:_\r\n\r\
      \n```\r\n# printf '%s\\n' \"\" \"blacklist squashfs\" >> /etc/modprobe.d/60-squashfs.conf\r\n```"
