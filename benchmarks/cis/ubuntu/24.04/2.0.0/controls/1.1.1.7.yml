control:
  id: CIS-1.1.1.7
  benchmark_id: cis-ubuntu-24.04
  title: Ensure squashfs kernel module is not available
  description: The `squashfs` filesystem type is a compressed read-only Linux filesystem embedded in small
    footprint systems. A `squashfs` image can be used without having to first decompress the image.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.1_1_1_7.audit
  remediation: cis.ubuntu.24.04.v2_0_0.1_1_1_7.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.1_1_1_7.rollback
