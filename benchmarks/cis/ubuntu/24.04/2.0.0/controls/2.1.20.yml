control:
  id: CIS-2.1.20
  benchmark_id: cis-ubuntu-24.04
  title: Ensure tftp server services are not in use
  description: Trivial File Transfer Protocol (TFTP) is a simple protocol for exchanging files between
    two TCP/IP machines. TFTP servers allow connections from a TFTP Client for sending and receiving files.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.2_1_20.audit
  remediation: cis.ubuntu.24.04.v2_0_0.2_1_20.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.2_1_20.rollback
  verification: cis.ubuntu.24.04.v2_0_0.2_1_20.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 2.1.20
      url: https://workbench.cisecurity.org/sections/4177245/recommendations/7047653
    assessment_status: automated
    profiles:
    - Level 1 - Server
    - Level 1 - Workstation
    mappings:
      nist:
      - CM-7
      cis_v8:
      - '4.8'
      cis_v7:
      - '9.2'
      mitre_techniques:
      - T1203
      - T1203.000
      - T1210
      - T1210.000
      - T1543
      - T1543.002
      mitre_tactics:
      - TA0008
      mitre_mitigations:
      - M1042
    parent: CIS _2_Configure Server Services Main | 2.1.20-Ensure tftp server services are not in use
    rationale: "Unless there is a need to run the system as a TFTP server, it is recommended that the\
      \ package be removed to reduce the potential attack surface.\r\n\r\nTFTP does not have built-in\
      \ encryption, access control or authentication. This makes it very easy for an attacker to exploit\
      \ TFTP to gain access to files"
    impact: "TFTP is often used to provide files for network booting such as for PXE based installation\
      \ of servers.\r\n\r\nThere may be packages that are dependent on the `tftpd-hpa` package.  If the\
      \ `tftpd-hpa` package is removed, these dependent packages will be removed as well. Before removing\
      \ the `tftpd-hpa` package, review any dependent packages to determine if they are required on the\
      \ system.\r\n\r\n**- IF -** a dependent package is required: stop and mask `tftpd-hpa.service` leaving\
      \ the `tftpd-hpa` package installed."
    audit_guidance: "Run the following command to verify `tftpd-hpa` is not installed:\r\n\r\n```\r\n\
      # dpkg-query -s tftpd-hpa &>/dev/null && echo \"tftpd-hpa is installed\"\r\n```\r\n\r\nNothing should\
      \ be returned.\r\n\r\n**- OR -** \r\n\r\n**- IF -** the package is required for dependencies:\r\n\
      \r\nRun the following command to verify `tftpd-hpa.service` is not enabled:\r\n\r\n```\r\n# systemctl\
      \ is-enabled tftpd-hpa.service 2>/dev/null | grep 'enabled'\r\n\r\nNothing should be returned\r\n\
      ```\r\n\r\nRun the following command to verify the `tftpd-hpa.service` is not active:\r\n\r\n```\r\
      \n# systemctl is-active tftpd-hpa.service 2>/dev/null | grep '^active'\r\n\r\nNothing should be\
      \ returned\r\n```\r\n\r\n**Note:** If the package is required for a dependency\r\n - Ensure the\
      \ dependent package is approved by local site policy\r\n - Ensure stopping and masking the service\
      \ and/or socket meets local site policy"
    remediation_guidance: "Run the following commands to stop `tftpd-hpa.service`, and remove the `tftpd-hpa`\
      \ package:\r\n\r\n```\r\n# systemctl stop tftpd-hpa.service\r\n# apt purge tftpd-hpa\r\n```\r\n\r\
      \n**- OR -**\r\n\r\n**- IF -** the `tftpd-hpa` package is required as a dependency:\r\n\r\nRun the\
      \ following commands to stop and mask `tftpd-hpa.service`:\r\n\r\n```\r\n# systemctl stop tftpd-hpa.service\r\
      \n# systemctl mask tftpd-hpa.service\r\n```"
    additional_information: ''
    default_value: ''
