    parent: CIS _7_System File Permissions Main | 2.1.13-Ensure SUID and SGID files are reviewed
    rationale: There are valid reasons for SUID and SGID programs, but it is important to identify and
      review such programs to ensure they are legitimate. Review the files returned by the action in the
      audit section and check to see if system binaries have a different checksum than what from the package.
      This is an indication that the binary may have been replaced.
    impact: ''
    audit_guidance: "Run the following script to generate a list of SUID and SGID files:\r\n\r\n```\r\n\
      #!/usr/bin/env bash\r\n\r\n{\r\n   l_output=\"\" l_output2=\"\"\r\n   a_suid=(); a_sgid=() # initialize\
      \ arrays\r\n   while IFS= read -r l_mount; do\r\n      while  IFS= read -r -d $'\\0' l_file; do\r\
      \n         if [ -e \"$l_file\" ]; then\r\n            l_mode=\"$(stat -Lc '%#a' \"$l_file\")\"\r\
      \n            [ $(( $l_mode & 04000 )) -gt 0 ] && a_suid+=(\"$l_file\")\r\n            [ $(( $l_mode\
      \ & 02000 )) -gt 0 ] && a_sgid+=(\"$l_file\")\r\n         fi\r\n      done < <(find \"$l_mount\"\
      \ -xdev -type f \\( -perm -2000 -o -perm -4000 \\) -print0 2>/dev/null)\r\n   done < <(findmnt -Dkerno\
      \ fstype,target,options | awk '($1 !~ /^\\s*(nfs|proc|smb|vfat|iso9660|efivarfs|selinuxfs)/ && $2\
      \ !~ /^\\/run\\/user\\// && $3 !~/noexec/ && $3 !~/nosuid/) {print $2}')\r\n   if ! (( ${#a_suid[@]}\
      \ > 0 )); then\r\n      l_output=\"$l_output\\n - No executable SUID files exist on the system\"\
      \r\n   else\r\n      l_output2=\"$l_output2\\n - List of \\\"$(printf '%s' \"${#a_suid[@]}\")\\\"\
      \ SUID executable files:\\n$(printf '%s\\n' \"${a_suid[@]}\")\\n - end of list -\\n\"\r\n   fi\r\
      \n   if ! (( ${#a_sgid[@]} > 0 )); then\r\n      l_output=\"$l_output\\n - No SGID files exist on\
      \ the system\"\r\n   else\r\n      l_output2=\"$l_output2\\n - List of \\\"$(printf '%s' \"${#a_sgid[@]}\"\
      )\\\" SGID executable files:\\n$(printf '%s\\n' \"${a_sgid[@]}\")\\n - end of list -\\n\"\r\n  \
      \ fi\r\n   [ -n \"$l_output2\" ] && l_output2=\"$l_output2\\n- Review the preceding list(s) of SUID\
      \ and/or SGID files to\\n- ensure that no rogue programs have been introduced onto the system.\\\
      n\" \r\n   unset a_arr; unset a_suid; unset a_sgid # Remove arrays\r\n   # If l_output2 is empty,\
      \ Nothing to report\r\n   if [ -z \"$l_output2\" ]; then\r\n      echo -e \"\\n- Audit Result:\\\
      n$l_output\\n\"\r\n   else\r\n      echo -e \"\\n- Audit Result:\\n$l_output2\\n\"\r\n      [ -n\
      \ \"$l_output\" ] && echo -e \"$l_output\\n\"\r\n   fi\r\n}\r\n```\r\n\r\n**Note:** on systems with\
      \ a large number of files, this may be a long running process"
    remediation_guidance: Ensure that no rogue SUID or SGID programs have been introduced into the system.
      Review the files returned by the action in the Audit section and confirm the integrity of these
      binaries.
