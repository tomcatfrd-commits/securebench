control:
  id: CIS-7.1.13
  benchmark_id: cis-ubuntu-24.04
  title: Ensure SUID and SGID files are reviewed
  description: The owner of a file can set the file's permissions to run with the owner's or group's permissions,
    even if the user running the program is not the owner or a member of the group. The most common reason
    for a SUID or SGID program is to enable users to perform functions (such as changing their password)
    that require root privileges.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.7_1_13.audit
  remediation: cis.ubuntu.24.04.v2_0_0.7_1_13.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.7_1_13.rollback
  verification: cis.ubuntu.24.04.v2_0_0.7_1_13.verify
  rollback_capability: unsupported
