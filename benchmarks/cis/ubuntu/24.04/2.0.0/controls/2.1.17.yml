    parent: CIS _2_Configure Server Services Main | 2.1.17-Ensure samba file server services are not in
      use
    rationale: If there is no need to mount directories and file systems to Windows systems, then this
      service should be deleted to reduce the potential attack surface.
    impact: "There may be packages that are dependent on the `samba` package.  If the `samba` package\
      \ is removed, these dependent packages will be removed as well. Before removing the `samba` package,\
      \ review any dependent packages to determine if they are required on the system.\r\n\r\n**- IF -**\
      \ a dependent package is required: stop and mask the `smbd.service`  leaving the `samba` package\
      \ installed."
    audit_guidance: "Run the following command to verify `samba` is not installed:\r\n\r\n```\r\n# dpkg-query\
      \ -s samba &>/dev/null && echo \"samba is installed\"\r\n```\r\n\r\nNothing should be returned.\r\
      \n\r\n**- OR -** \r\n\r\n**- IF -** the package is required for dependencies:\r\n\r\nRun the following\
      \ command to verify `smbd.service` is not enabled:\r\n\r\n```\r\n# systemctl is-enabled smbd.service\
      \ 2>/dev/null | grep 'enabled'\r\n\r\nNothing should be returned\r\n```\r\n\r\nRun the following\
      \ command to verify the `smbd.service` is not active:\r\n\r\n```\r\n# systemctl is-active smbd.service\
      \ 2>/dev/null | grep '^active'\r\n\r\nNothing should be returned\r\n```"
    remediation_guidance: "Run the following commands to stop `smbd.service` and remove `samba` package:\r\
      \n\r\n```\r\n# systemctl stop smbd.service\r\n# apt purge samba\r\n```\r\n\r\n**- OR -**\r\n\r\n\
      **- IF -** the `samba` package is required as a dependency:\r\n\r\nRun the following commands to\
      \ stop and mask the `smbd.service`:\r\n\r\n```\r\n# systemctl stop smbd.service\r\n# systemctl mask\
      \ smbd.service\r\n```"
