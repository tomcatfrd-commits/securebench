control:
  id: CIS-2.1.17
  benchmark_id: cis-ubuntu-24.04
  title: Ensure samba file server services are not in use
  description: The Samba daemon allows system administrators to configure their Linux systems to share
    file systems and directories with Windows desktops. Samba will advertise the file systems and directories
    via the Server Message Block (SMB) protocol. Windows desktop users will be able to mount these directories
    and file systems as letter drives on their systems.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.2_1_17.audit
  remediation: cis.ubuntu.24.04.v2_0_0.2_1_17.remediate
