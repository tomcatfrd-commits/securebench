control:
  id: CIS-2.2.3
  benchmark_id: cis-ubuntu-24.04
  title: Ensure talk client is not installed
  description: The `talk` software makes it possible for users to send and receive messages across systems
    through a terminal session. The `talk` client, which allows initialization of talk sessions, is installed
    by default.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.2_2_3.audit
