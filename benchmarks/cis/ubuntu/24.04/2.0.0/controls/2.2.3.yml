    parent: CIS _2_Configure Client Services Main | 2.1.4-Ensure talk client is not installed
    rationale: The software presents a security risk as it uses unencrypted protocols for communication.
    impact: Many insecure service clients are used as troubleshooting tools and in testing environments.
      Uninstalling them can inhibit capability to test and troubleshoot. If they are required it is advisable
      to remove the clients after use to prevent accidental or intentional misuse.
    audit_guidance: "Verify `talk`  is not installed. The following command may provide the needed information:\r\
      \n\r\n```\r\n# dpkg-query -s talk &>/dev/null && echo \"talk is installed\"\r\n```\r\n\r\nNothing\
      \ should be returned."
    remediation_guidance: "Uninstall `talk`:\r\n\r\n```\r\n# apt purge talk\r\n```"
