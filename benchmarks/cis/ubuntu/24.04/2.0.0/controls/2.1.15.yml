    parent: CIS _2_Configure Server Services Main | 2.1.15-Ensure rpcbind services are not in use
    rationale: A small request (~82 bytes via UDP) sent to the Portmapper generates a large response (7x
      to 28x amplification), which makes it a suitable tool for DDoS attacks. If `rpcbind` is not required,
      it is recommended to remove `rpcbind` package to reduce the potential attack surface.
    impact: "Many of the libvirt packages used by Enterprise Linux virtualization, and the `nfs-utils`\
      \ package used for The Network File System (NFS), are dependent on the `rpcbind` package. If the\
      \ `rpcbind` package is removed, these dependent packages will be removed as well. Before removing\
      \ the `rpcbind` package, review any dependent packages to determine if they are required on the\
      \ system.\r\n\r\n**- IF -** a dependent package is required: stop and mask the `rpcbind.socket`\
      \ and `rpcbind.service` leaving the `rpcbind` package installed."
    audit_guidance: "Run the following command to verify `rpcbind` package is not installed:\r\n\r\n```\r\
      \n# dpkg-query -s rpcbind &>/dev/null && echo \"rpcbind is installed\"\r\n```\r\n\r\nNothing should\
      \ be returned.\r\n\r\n**- OR -** \r\n\r\n**- IF -** the `rpcbind` package is required as a dependency:\r\
      \n\r\nRun the following command to verify `rpcbind.socket` and `rpcbind.service` are not enabled:\r\
      \n\r\n```\r\n# systemctl is-enabled rpcbind.socket rpcbind.service 2>/dev/null | grep 'enabled'\r\
      \n\r\nNothing should be returned\r\n```\r\n\r\nRun the following command to verify `rpcbind.socket`\
      \ and `rpcbind.service` are not active:\r\n\r\n```\r\n# systemctl is-active rpcbind.socket rpcbind.service\
      \ 2>/dev/null | grep '^active'\r\n\r\nNothing should be returned\r\n```\r\n\r\n**Note:** If the\
      \ package is required for a dependency\r\n - Ensure the dependent package is approved by local site\
      \ policy\r\n - Ensure stopping and masking the service and/or socket meets local site policy"
    remediation_guidance: "Run the following commands to stop `rpcbind.socket` and `rpcbind.service`,\
      \ and remove the `rpcbind` package:\r\n\r\n```\r\n# systemctl stop rpcbind.socket rpcbind.service\r\
      \n# apt purge rpcbind\r\n```\r\n\r\n**- OR -**\r\n\r\n**- IF -** the `rpcbind` package is required\
      \ as a dependency:\r\n\r\nRun the following commands to stop and mask the `rpcbind.socket` and `rpcbind.service`:\r\
      \n\r\n```\r\n# systemctl stop rpcbind.socket rpcbind.service\r\n# systemctl mask rpcbind.socket\
      \ rpcbind.service\r\n```"
