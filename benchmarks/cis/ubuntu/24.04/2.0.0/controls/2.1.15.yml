control:
  id: CIS-2.1.15
  benchmark_id: cis-ubuntu-24.04
  title: Ensure rpcbind services are not in use
  description: "The `rpcbind` utility maps RPC services to the ports on which they listen. RPC processes\
    \ notify `rpcbind` when they start, registering the ports they are listening on and the RPC program\
    \ numbers they expect to serve. The client system then contacts `rpcbind` on the server with a particular\
    \ RPC program number. The `rpcbind.service` redirects the client to the proper port number so it can\
    \ communicate with the requested service.\r\n\r\nPortmapper is an RPC service, which always listens\
    \ on tcp and udp 111, and is used to map other RPC services (such as nfs, nlockmgr, quotad, mountd,\
    \ etc.) to their corresponding port number on the server. When a remote host makes an RPC call to\
    \ that server, it first consults with portmap to determine where the RPC server is listening."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.2_1_15.audit
  remediation: cis.ubuntu.24.04.v2_0_0.2_1_15.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.2_1_15.rollback
  verification: cis.ubuntu.24.04.v2_0_0.2_1_15.verify
  rollback_capability: unsupported
