control:
  id: CIS-5.4.1.5
  benchmark_id: cis-ubuntu-24.04
  title: Ensure inactive password lock is configured
  description: "User accounts that have been inactive for over a given period of time can be automatically\
    \ disabled.\r\n\r\n`INACTIVE` - Defines the number of days after the password exceeded its maximum\
    \ age where the user is expected to replace this password.\r\n\r\nThe value is stored in the shadow\
    \ password file. An input of `0` will disable an expired password with no delay. An input of `-1`\
    \ will blank the respective field in the shadow password file."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_4_1_5.audit
  remediation: cis.ubuntu.24.04.v2_0_0.5_4_1_5.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.5_4_1_5.rollback
  verification: cis.ubuntu.24.04.v2_0_0.5_4_1_5.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 5.4.1.5
      url: https://workbench.cisecurity.org/sections/4177295/recommendations/7047789
    assessment_status: automated
    profiles:
    - Level 1 - Server
    - Level 1 - Workstation
    mappings:
      nist: []
      cis_v8:
      - '5.2'
      cis_v7:
      - '4.4'
      mitre_techniques:
      - T1078
      - T1078.002
      - T1078.003
      mitre_tactics:
      - TA0001
      mitre_mitigations:
      - M1027
    parent: CIS _5_Configure shadow password suite parameters Main | 1.1.1.5-Ensure inactive password
      lock is configured
    rationale: Inactive accounts pose a threat to system security since the users are not logging in to
      notice failed login attempts or other anomalies.
    impact: ''
    audit_guidance: "Run the following command and verify `INACTIVE` conforms to site policy (no more\
      \ than 45 days):\r\n\r\n```\r\n# useradd -D | grep INACTIVE\r\n\r\nINACTIVE=45\r\n```\r\n\r\nVerify\
      \ all users with a password have Password inactive no more than 45 days after password expires\r\
      \n\r\nVerify all users with a password have Password inactive no more than 45 days after password\
      \ expires: Run the following command and Review list of users and `INACTIVE` to verify that all\
      \ users `INACTIVE` conforms to site policy (no more than 45 days):\r\n\r\n```\r\n# awk -F: '($2~/^\\\
      $.+\\$/) {if($7 > 45 || $7 < 0)print \"User: \" $1 \" INACTIVE: \" $7 \"Days\"}' /etc/shadow\r\n\
      ```\r\n\r\nNothing should be returned"
    remediation_guidance: "Run the following command to set the default password inactivity period to\
      \ 45 days or less that meets local site policy:\r\n\r\n```\r\n# useradd -D -f ```\r\n\r\n_Example:_\r\
      \n\r\n```\r\n# useradd -D -f 45\r\n```\r\n\r\nRun the following command to modify user parameters\
      \ for all users with a password set to a inactive age of `45` days or less that follows local site\
      \ policy:\r\n\r\n```\r\n# chage --inactive ```\r\n\r\n_Example:_\r\n\r\n```\r\n# awk -F: '($2~/^\\\
      $.+\\$/) {if($7 > 45 || $7 < 0)system (\"chage --inactive 45 \" $1)}' /etc/shadow\r\n```"
    additional_information: A value of -1 would disable this setting.
    default_value: INACTIVE=-1
    artifacts_count: 3
    requirements: {}
    safety:
      default: investigate
      implementation_status: guidance_only
      reason: Imported CIS guidance has not yet been promoted to a reviewed SecureBench implementation.
