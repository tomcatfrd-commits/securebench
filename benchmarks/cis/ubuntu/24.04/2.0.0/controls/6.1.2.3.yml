control:
  id: CIS-6.1.2.3
  benchmark_id: cis-ubuntu-24.04
  title: Ensure rsyslog log file creation mode is configured
  description: "`rsyslog` will create logfiles that do not already exist on the system.\r\n\r\nThe `global()`\
    \ configuration object `umask`, available in rsyslog 8.26.0+, sets the rsyslogd process’ umask. If\
    \ not specified, the system-provided default is used. The value given must always be a 4-digit octal\
    \ number, with the initial digit being zero.\r\n\r\nThe legacy `$umask` parameter sets the `rsyslogd`\
    \ process' umask. If not specified, the system-provided default is used. The value given must always\
    \ be a 4-digit octal number, with the initial digit being zero.\r\n\r\nThe legacy `$FileCreateMode`\
    \ parameter allows the setting of the mode with which `rsyslogd` creates new files. If not specified,\
    \ the value `0644` is used. The value given must always be a 4-digit octal number, with the initial\
    \ digit being zero. Please note that the actual permission depend on `rsyslogd` process `umask`. If\
    \ in doubt, use `$umask 0000` right at the beginning of the configuration file to remove any restrictions.\r\
    \n\r\nThe legacy `$FileCreateMode` may be specified multiple times. If so, it specifies the creation\
    \ mode for all selector lines that follow until the next `$FileCreateMode` parameter. Order of lines\
    \ is vitally important."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.6_1_2_3.audit
