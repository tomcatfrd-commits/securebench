    parent: CIS _6_System Logging Main | 2.2.2.3-Ensure rsyslog log file creation mode is configured
    rationale: It is important to ensure that log files have the correct permissions to ensure that sensitive
      data is archived and protected.
    impact: ''
    audit_guidance: "Run the following command \r\n\r\nRun the following command to verify `$FileCreateMode`:\
      \ \r\n\r\n```\r\n# grep -Ps '^\\h*\\$FileCreateMode\\h+0[0,2,4,6][0,2,4]0\\b' /etc/rsyslog.conf\
      \ /etc/rsyslog.d/*.conf\r\n```\r\n\r\nVerify the output is includes `0640` or more restrictive:\r\
      \n\r\n```\r\n$FileCreateMode 0640\r\n```\r\n\r\nShould a site policy dictate less restrictive permissions,\
      \ ensure to follow said policy.\r\n\r\n>**Note:** More restrictive permissions such as `0600` is\
      \ implicitly sufficient."
    remediation_guidance: "Edit either `/etc/rsyslog.conf` or a dedicated `.conf` file in `/etc/rsyslog.d/`\
      \ and set `$FileCreateMode` to `0640` or more restrictive:\r\n\r\n```\r\n$FileCreateMode 0640\r\n\
      ```\r\n\r\nRestart the service:\r\n\r\n```\r\n# systemctl restart rsyslog\r\n```"
