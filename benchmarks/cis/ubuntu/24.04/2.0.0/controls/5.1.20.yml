control:
  id: CIS-5.1.20
  benchmark_id: cis-ubuntu-24.04
  title: Ensure sshd PermitRootLogin is disabled
  description: "The `PermitRootLogin` parameter specifies if the root user can log in using SSH. The default\
    \ is `prohibit-password`.\r\n\r\nMore information about the openSSH server configuration is available\
    \ in the \"Configure SSH Server\" section overview."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_1_20.audit
  remediation: cis.ubuntu.24.04.v2_0_0.5_1_20.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.5_1_20.rollback
  verification: cis.ubuntu.24.04.v2_0_0.5_1_20.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 5.1.20
      url: https://workbench.cisecurity.org/sections/4177236/recommendations/7047619
    assessment_status: automated
    profiles:
    - Level 1 - Server
    - Level 1 - Workstation
    mappings:
      nist:
      - AC-6
      cis_v8:
      - '5.4'
      cis_v7:
      - '4.3'
      mitre_techniques:
      - T1021
      mitre_tactics:
      - TA0008
      mitre_mitigations:
      - M1042
    parent: CIS _5_Configure SSH Server Main | 2.2.21-Ensure sshd PermitRootLogin is disabled
    rationale: Disallowing `root` logins over SSH requires system admins to authenticate using their own
      individual account, then escalating to `root`. This limits opportunity for non-repudiation and provides
      a clear audit trail in the event of a security incident.
    impact: ''
    audit_guidance: "Run the following command to verify `PermitRootLogin` is set to `no`:\r\n\r\n```\r\
      \n# sshd -T | grep permitrootlogin\r\n\r\npermitrootlogin no\r\n```\r\n\r\n**- IF -** `Match` set\
      \ statements are used in your environment, specify the connection parameters to use for the `-T`\
      \ extended test mode and run the audit to verify the setting is not incorrectly configured in a\
      \ match block\r\n\r\n_Example additional audit needed for a match block for the user `sshuser`:_\r\
      \n\r\n```\r\n# sshd -T -C user=sshuser | grep permitrootlogin\r\n```"
    remediation_guidance: "Create or edit a `*.conf` file in the `/etc/ssh/sshd_config.d/` and set the\
      \ `PermitRootLogin` parameter to `no` above any `Include` and `Match` entries as follows:\r\n\r\n\
      ```\r\nPermitRootLogin no\r\n```"
    additional_information: ''
    default_value: PermitRootLogin without-password
    artifacts_count: 3
    requirements: {}
    safety:
      default: investigate
      implementation_status: guidance_only
      reason: Imported CIS guidance has not yet been promoted to a reviewed SecureBench implementation.
  dependencies: []
  conflicts: []
