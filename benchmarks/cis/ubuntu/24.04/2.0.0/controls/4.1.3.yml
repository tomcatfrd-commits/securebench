    parent: CIS _4_Host Based Firewall Main | 2.1.1.3-Ensure ufw incoming default is configured
    rationale: With a default accept policy the firewall will accept any packet that is not configured
      to be denied. It is easier to allow list acceptable usage than to deny list unacceptable usage.
    impact: "Any port or protocol without a explicit allow before the default deny will be blocked. A\
      \ deny policy silently drops packs causing an eventual time out with no response while a 'reject'\
      \ policy sends an immediate and explicit \"connection refused\" or \"destination unreachable\" message\
      \ in response.\r\n\r\nThe following is and example of a command to create a rule to allow connection\
      \ to the ssh server on the host. This rule should be considered before applying the default deny.\r\
      \n\r\n_Example:_\r\n\r\n```\r\n# ufw allow ssh\r\n```"
    audit_guidance: "Run the following command to verify that the default policy for `incoming` is `deny`\
      \ or `reject`:\r\n\r\n```\r\n# ufw status verbose | awk -F',' '$1~/Default/ {print $1}'\r\n```\r\
      \n\r\n_Example output:_\r\n\r\n```\r\nDefault: deny (incoming)\r\n```"
    remediation_guidance: "Run the following command to set the default for `incoming` to `deny`:\r\n\r\
      \n```\r\n# ufw default deny incoming\r\n```\r\n\r\n**Warning:** Any port or protocol without a explicit\
      \ allow before the default deny will be blocked."
    additional_information: ''
    default_value: ''
