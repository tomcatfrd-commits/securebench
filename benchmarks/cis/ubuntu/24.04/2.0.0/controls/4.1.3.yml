control:
  id: CIS-4.1.3
  benchmark_id: cis-ubuntu-24.04
  title: Ensure ufw incoming default is configured
  description: The default policy for incoming traffic determines if connections attempting to reach your
    server from external sources will be allowed without requiring specific `UFW` rules.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.4_1_3.audit
