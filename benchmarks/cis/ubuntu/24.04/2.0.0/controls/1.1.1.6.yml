    parent: CIS _1_Configure Filesystem Kernel Modules Main | 1.1.6-Ensure overlay kernel module is not
      available
    rationale: 'The `overlay` kernel module has known CVE''s: CVE-2023-32629, CVE-2023-2640, and CVE-2023-0386.
      Disabling the `overlay` kernel module reduces the local attack surface by removing support for unnecessary
      filesystem types and mitigates potential risks associated with unauthorized execution of setuid
      files, enhancing the overall system security.'
    impact: '**WARNING:** **If Container applications such as Docker, Kubernetes, Podman, Linux Containers
      (LXC), etc. are in use proceed with caution and consider the impact on containerized workloads,
      as disabling the `overlay` may severely disrupt containerization.**'
    audit_guidance: "Verify the `overlay` kernel module is not available on the system or has been disabled.\r\
      \n\r\n1. Run the following script to determine if the `overlay` kernel module is available on the\
      \ system:\r\n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n   l_mod_name=\"overlayfs\" l_mod_type=\"\
      fs\"\r\n   while IFS= read -r l_mod_path; do\r\n      if [ -d \"$l_mod_path/${l_mod_name//-/\\/}\"\
      \ ] &&  \\\r\n      [ -n \"$(ls -A \"$l_mod_path/${l_mod_name//-/\\/}\")\" ]; then\r\n         printf\
      \ '%s\\n' \"$l_mod_name exists in $l_mod_path\"\r\n      fi\r\n   done < <(readlink -e /usr/lib/modules/**/kernel/$l_mod_type\
      \ \\\r\n   || readlink -e /lib/modules/**/kernel/$l_mod_type)\r\n}\r\n```\r\n\r\nIf nothing is returned,\
      \ the `overlay` kernel module is not available on the system and no further audit steps are required.\r\
      \n\r\n**Note:** Some systems may include the `overlay` kernel module as part of the kernel opposed\
      \ to being available as a kernel module. In this case, the above audit will not return anything.\
      \ This is also considered a passing state.\r\n\r\n**If anything is returned by the above script:**\r\
      \n\r\n2. Verify the `overlay` kernel module is not loaded and not loadable by performing the following:\r\
      \n\r\nRun the following command to verify the `overlay` kernel module is not loaded:\r\n\r\n```\r\
      \n# lsmod | grep 'overlay'\r\n```\r\n\r\nNothing should be returned\r\n\r\nRun the following command\
      \ to verify the `overlay` kernel module is not loadable:\r\n\r\n```\r\n# modprobe --showconfig |\
      \ grep -P -- '\\b(install|blacklist)\\h+overlay\\b'\r\n```\r\n\r\nVerify the output includes:\r\n\
      \r\n```\r\nblacklist overlay\r\n -AND-\r\ninstall overlay /bin/false\r\n -OR-\r\ninstall overlay\
      \ /bin/true\r\n```\r\n\r\n_Example output:_\r\n\r\n```\r\nblacklist overlay\r\ninstall overlay /bin/false\r\
      \n```"
    remediation_guidance: "Unload and disable the `overlay` kernel module.\r\n\r\n1. Run the following\
      \ commands to unload the `overlay` kernel module:\r\n\r\n```\r\n# modprobe -r overlay 2>/dev/null\r\
      \n# rmmod overlay 2>/dev/null\r\n```\r\n\r\n2. Perform the following to disable the `overlay` kernel\
      \ module:\r\n\r\nCreate a file ending in `.conf` with `install overlay /bin/false` in the `/etc/modprobe.d/`\
      \ directory\r\n\r\n_Example:_\r\n\r\n```\r\n# printf '%s\\n' \"\" \"install overlay /bin/false\"\
      \ >> /etc/modprobe.d/60-overlay.conf\r\n```\r\n\r\nCreate a file ending in `.conf` with `blacklist\
      \ overlay` in the `/etc/modprobe.d/` directory\r\n\r\n_Example:_\r\n\r\n```\r\n# printf '%s\\n'\
      \ \"\" \"blacklist overlay\" >> /etc/modprobe.d/60-overlay.conf\r\n```"
