control:
  id: CIS-1.1.1.6
  benchmark_id: cis-ubuntu-24.04
  title: Ensure overlay kernel module is not available
  description: The Linux `overlay` kernel module, commonly referred to as Overlayfs, is a union mount
    filesystem. It allows the user to overlay one file system on top of another, and creates a single,
    unified view.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.1_1_1_6.audit
  remediation: cis.ubuntu.24.04.v2_0_0.1_1_1_6.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.1_1_1_6.rollback
  verification: cis.ubuntu.24.04.v2_0_0.1_1_1_6.verify
  rollback_capability: unsupported
  metadata:
