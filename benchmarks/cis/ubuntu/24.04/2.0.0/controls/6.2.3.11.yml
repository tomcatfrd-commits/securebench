    parent: CIS _6_System Auditing Main | 2.2.3.11-Ensure events that modify /etc/group information are
      collected
    rationale: "Unexpected changes to these files could be an indication that the system has been compromised\
      \ and that an unauthorized user is attempting to hide their activities or compromise additional\
      \ accounts.\r\n\r\nSatisfies: SRG-OS-000062-GPOS-00031, SRG-OS-000004-GPOS-00004, SRG-OS-000037-GPOS-00015,\
      \ SRG-OS-000042-GPOS-00020, SRG-OS-000062-GPOS-00031, SRG-OS-000304-GPOS-00121, SRG-OS-000392-GPOS-00172,\
      \ SRG-OS-000462-GPOS-00206, SRG-OS-000470-GPOS-00214, SRG-OS-000471-GPOS-00215, SRG-OS-000239-GPOS-00089,\
      \ SRG-OS-000240-GPOS-00090, SRG-OS-000241-GPOS-00091, SRG-OS-000303-GPOS-00120, SRG-OS-000304-GPOS-00121,\
      \ SRG-OS-000476-GPOS-00221"
    impact: ''
    audit_guidance: "1. Run the following command to verify a rule exists in the running configuration:\r\
      \n```\r\n# auditctl -l | grep -Ps -- '^\\h*[^#\\n\\r]+\\h*\\/etc\\/group' \r\n```\r\n\r\nVerify\
      \ the output includes:\r\n\r\n```\r\n-w /etc/group -p wa -k identity\r\n```\r\n\r\n\r\n2. Run the\
      \ following command to verify a rule exists in a rules file:\r\n\r\n```\r\n# grep -Ps -- '^\\h*[^#\\\
      n\\r]+\\h*\\/etc\\/group' /etc/audit/rules.d/*.rules\r\n```\r\n\r\n_Example output_:\r\n```\r\n\
      /etc/audit/rules.d/50-identity.rules:-w /etc/group -p wa -k identity\r\n```"
    remediation_guidance: "1. Edit or create a file in the `/etc/audit/rules.d/` directory, ending in\
      \ `.rules` extension, with the relevant rules to monitor events that modify user/group information.\r\
      \n\r\n_Example:_\r\n\r\n```\r\n# printf \"\r\n-w /etc/group -p wa -k identity\r\n\" >> /etc/audit/rules.d/50-identity.rules\r\
      \n```\r\n\r\n2. Merge and load the rules into active configuration:\r\n\r\n```\r\n# augenrules --load\r\
      \n```\r\n\r\n3. Check if reboot is required:\r\n\r\n```\r\n# if [[ $(auditctl -s | grep \"enabled\"\
      ) =~ \"2\" ]]; then printf \"Reboot required to load rules\\n\"; fi\r\n```"
