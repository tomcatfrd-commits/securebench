control:
  id: CIS-6.2.3.11
  benchmark_id: cis-ubuntu-24.04
  title: Ensure events that modify /etc/group information are collected
  description: "Record events affecting the modification of user or group information, including that\
    \ of passwords and old passwords if in use.\r\n- `/etc/group` - system groups"
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.6_2_3_11.audit
  remediation: cis.ubuntu.24.04.v2_0_0.6_2_3_11.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.6_2_3_11.rollback
  verification: cis.ubuntu.24.04.v2_0_0.6_2_3_11.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 6.2.3.11
      url: https://workbench.cisecurity.org/sections/4203192/recommendations/7091558
