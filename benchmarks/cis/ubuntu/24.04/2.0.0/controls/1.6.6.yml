    parent: CIS _1_Configure Command Line Warning Banners Main | 1.2.6-Ensure access to /etc/motd is configured
    rationale: '**- IF -** the `MOTD`  file does not have the correct access configured, it could be modified
      by unauthorized users with incorrect or misleading information.'
    impact: ''
    audit_guidance: "Run the following command and verify that if `MOTD` file exists, `Access` is `644`\
      \ or more restrictive, `Uid` and `Gid` are both `0/root`:\r\n\r\n```\r\n# stat -Lc 'File: %n  Access:\
      \ (%a/%A)  Uid: ( %u/ %U)  Gid: ( %g/ %G)' \\\r\n   /etc/motd /run/motd /usr/lib/motd \\\r\n   /etc/motd.d/*\
      \ /run/motd.d/* /usr/lib/motd.d/* \\\r\n   /etc/update-motd.d/* 2>/dev/null\r\n```\r\nVerify output\
      \ includes:\r\n```\r\nAccess: (0644/-rw-r--r--)  Uid: ( 0/ root) Gid: ( 0/ root)\r\n  -- OR --\r\
      \nNothing is returned\r\n```"
    remediation_guidance: "Run the following commands to set mode, owner, and group on the appropriate\
      \ `MOTD` file:\r\n\r\n```\r\n# chown root:root # chmod u-x,go-wx ```\r\n\r\n_Example_\r\n```\r\n\
      # chown root:root $(readlink -e /etc/motd)\r\n# chmod u-x,go-wx $(readlink -e /etc/motd)\r\n```\r\
      \n\r\n **- OR -**\r\n\r\nRun the following command to remove the `/etc/motd` file:\r\n\r\n```\r\n\
      # rm /etc/motd\r\n```"
    additional_information: ''
    default_value: ''
