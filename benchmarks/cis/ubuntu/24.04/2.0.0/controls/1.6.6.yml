  title: Ensure access to /etc/motd is configured
  description: The contents of the `MOTD` file are displayed to users after login and function as a message
    of the day for authenticated users.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.1_6_6.audit
