    parent: CIS _1_Package Management Main | 2.2.9-Ensure access to files in /etc/apt/sources.list.d are
      configured
    rationale: Files in the `/etc/apt/sources.list.d` directory contain information about repositories
      to be used by APT. A non-root user should not be able to add or remove files from this directory.
      Misconfiguring could allow a non-root user to add repositories containing malicious packages.
    impact: ''
    audit_guidance: "Run the following command and verify all files in the `/etc/apt/sources.list.d` directory\
      \ `Uid` and `Gid` are both `0/root` and access is set to `0644` or more restrictive:\r\n```\r\n\
      # stat -Lc 'Access: (%a/%A) Uid: ( %u/ %U) Gid: ( %g/ %G)' /etc/apt/sources.list.d/* 2>/dev/null\r\
      \n```\r\n_Example Output_\r\n```\r\nAccess: (644/-rw-r--r--) Uid: ( 0/ root) Gid: ( 0/ root)\r\n\
      ```"
    remediation_guidance: "Run the following command to set permissions to `/etc/apt/sources.list.d` directory\
      \ `Uid` and `Gid` to `0/root` and access to `0644` or more restrictive:\r\n```\r\n# chown root:root\
      \ /etc/apt/sources.list.d/*\r\n# chmod u-x,go-wx /etc/apt/sources.list.d/*\r\n```"
    additional_information: ''
    default_value: No files under /etc/apt/sources.list.d
    artifacts_count: 6
    requirements: {}
    safety:
      default: investigate
      implementation_status: guidance_only
      reason: Imported CIS guidance has not yet been promoted to a reviewed SecureBench implementation.
