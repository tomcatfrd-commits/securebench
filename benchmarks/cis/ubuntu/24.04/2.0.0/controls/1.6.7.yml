      - M1022
    parent: CIS _1_Configure Command Line Warning Banners Main | 1.2.7-Ensure access to /etc/issue is
      configured
    rationale: '**- IF -** the `/etc/issue`  file does not have the correct access configured, it could
      be modified by unauthorized users with incorrect or misleading information.'
    impact: ''
    audit_guidance: "Run the following command and verify  `Access` is `644` or more restrictive and `Uid`\
      \ and `Gid` are both `0/root`:\r\n\r\n```\r\n# stat -Lc 'Access: (%#a/%A)  Uid: ( %u/ %U) Gid: {\
      \ %g/ %G)' /etc/issue /usr/lib/issue.d/* /etc/issue.d/* /run/issue.d/* 2>/dev/null\r\n```\r\nVerify\
      \ output includes:\r\n```\r\nAccess: (0644/-rw-r--r--)  Uid: ( 0/ root) Gid: { 0/ root)\r\n```"
    remediation_guidance: "Run the following commands to set mode, owner, and group on the appropriate\
      \ `issue` file:\r\n\r\n```\r\n# chown root:root # chmod u-x,go-wx ```\r\n\r\n_Example_\r\n```\r\n\
      # chown root:root $(readlink -e /etc/issue)\r\n# chmod u-x,go-wx $(readlink -e /etc/issue)\r\n```"
    additional_information: ''
    default_value: 'Access: (0644/-rw-r--r--)  Uid: (    0/    root)   Gid: (    0/    root)'
    artifacts_count: 3
    requirements: {}
    safety:
      default: investigate
      implementation_status: guidance_only
      reason: Imported CIS guidance has not yet been promoted to a reviewed SecureBench implementation.
