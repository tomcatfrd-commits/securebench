  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 1.6.7
      url: https://workbench.cisecurity.org/sections/4177288/recommendations/7047740
    assessment_status: automated
