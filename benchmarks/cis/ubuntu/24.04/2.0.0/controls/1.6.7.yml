  title: Ensure access to /etc/issue is configured
  description: The contents of the `/etc/issue`  file are displayed to users prior to login for local
    terminals.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.1_6_7.audit
  remediation: cis.ubuntu.24.04.v2_0_0.1_6_7.remediate
