    parent: CIS _1_Configure Filesystem Partitions Main | 1.1.1.4-Ensure noexec option set on /tmp partition
    rationale: Since the `/tmp` filesystem is only intended for temporary file storage, set this option
      to ensure that users cannot run executable binaries from `/tmp`.
    impact: Setting the `noexec` option on `/tmp` may prevent installation and/or updating of some 3rd
      party software.
    audit_guidance: "**- IF -** a separate partition exists for `/tmp`, verify that the `noexec` option\
      \ is set.\r\n\r\nRun the following command to verify that the `noexec` mount option is set.\r\n\r\
      \n_Example:_\r\n\r\n```\r\n# findmnt -kn /tmp | grep -v noexec\r\n\r\nNothing should be returned\r\
      \n```"
    remediation_guidance: "**- IF -** a separate partition exists for `/tmp`.\r\n\r\nEdit the `/etc/fstab`\
      \ file and add `noexec` to the fourth field (mounting options) for the `/tmp` partition.\r\n\r\n\
      _Example:_\r\n\r\n``` /tmp defaults,rw,nosuid,nodev,noexec,relatime  0 0\r\n```\r\n\r\nRun the following\
      \ command to remount `/tmp` with the configured options:\r\n\r\n```\r\n# mount -o remount /tmp\r\
      \n```"
    additional_information: See the fstab(5) manual page for more information.
    default_value: ''
    artifacts_count: 1
    requirements: {}
    safety:
      default: investigate
