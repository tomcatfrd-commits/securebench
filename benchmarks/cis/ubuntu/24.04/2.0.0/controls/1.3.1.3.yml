    parent: CIS _1_Mandatory Access Control Main | 2.1.1.3-Ensure all AppArmor Profiles are enforcing
    rationale: Security configuration requirements vary from site to site. Some sites may mandate a policy
      that is stricter than the default policy, which is perfectly acceptable. This item is intended to
      ensure that any policies that exist on the system are activated.
    impact: Setting AppArmor profiles to `enforce` mode removes the `unconfined` status, which can disrupt
      application operation.  If these applications are required, the profile tuning may need to be tuned
      to allow necessary functionality.
    audit_guidance: "Run the following commands and verify that profiles are loaded and are not in complain\
      \ mode:\r\n```\r\n# apparmor_status | grep profiles\r\n```\r\n\r\nReview output and ensure that\
      \ profiles are loaded, and in enforce mode:\r\n\r\n```\r\n34 profiles are loaded.\r\n34 profiles\
      \ are in enforce mode.\r\n0 profiles are in complain mode.\r\n2 processes have profiles defined.\r\
      \n```\r\n\r\nRun the following command and verify that no processes are unconfined:\r\n```\r\napparmor_status\
      \ | grep processes\r\n```\r\n\r\nReview the output and ensure no processes are unconfined:\r\n\r\
      \n```\r\n2 processes have profiles defined.\r\n2 processes are in enforce mode.\r\n0 processes are\
      \ in complain mode.\r\n0 processes are unconfined but have a profile defined.\r\n```"
    remediation_guidance: "Run the following command to set all profiles to enforce mode:\r\n```\r\n#\
      \ aa-enforce /etc/apparmor.d/*\r\n```\r\n**Note:** Any unconfined processes may need to have a profile\
      \ created or activated for them and then be restarted"
    additional_information: ''
