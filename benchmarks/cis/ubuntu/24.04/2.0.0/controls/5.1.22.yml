    parent: CIS _5_Configure SSH Server Main | 2.2.23-Ensure sshd UsePAM is enabled
    rationale: When `usePAM` is set to `yes`, PAM runs through account and session types properly. This
      is important if you want to restrict access to services based off of IP, time or other factors of
      the account. Additionally, you can make sure users inherit certain environment variables on login
      or disallow access to the server
    impact: ''
    audit_guidance: "Run the following command to verify `UsePAM` is set to `yes`:\r\n\r\n```\r\n# sshd\
      \ -T | grep usepam\r\n\r\nusepam yes\r\n```"
    remediation_guidance: "Create or edit a `*.conf` file in the `/etc/ssh/sshd_config.d/` and set the\
      \ `UsePAM` parameter to `yes` above any `Include` entries as follows:\r\n\r\n```\r\nUsePAM yes\r\
      \n```"
    additional_information: ''
    default_value: UsePAM yes
