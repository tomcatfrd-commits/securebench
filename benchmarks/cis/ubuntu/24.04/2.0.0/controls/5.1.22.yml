control:
  id: CIS-5.1.22
  benchmark_id: cis-ubuntu-24.04
  title: Ensure sshd UsePAM is enabled
  description: "The `UsePAM` directive enables the Pluggable Authentication Module (PAM) interface. If\
    \ set to `yes` this will enable PAM authentication using `ChallengeResponseAuthentication` and `PasswordAuthentication`\
    \ directives in addition to PAM account and session module processing for all authentication types.\r\
    \n\r\nMore information about the openSSH server configuration is available in the \"Configure SSH\
    \ Server\" section overview."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_1_22.audit
  remediation: cis.ubuntu.24.04.v2_0_0.5_1_22.remediate
