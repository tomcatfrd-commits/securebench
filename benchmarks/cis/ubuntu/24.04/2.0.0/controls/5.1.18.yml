    parent: CIS _5_Configure SSH Server Main | 2.2.19-Ensure sshd MaxSessions is configured
    rationale: To protect a system from denial of service due to a large number of concurrent sessions,
      use the rate limiting function of MaxSessions to protect availability of sshd logins and prevent
      overwhelming the daemon.
    impact: ''
    audit_guidance: "Run the following command and verify that `MaxSessions` is `10` or less:\r\n\r\n\
      ```\r\n# sshd -T | grep maxsessions\r\n\r\nmaxsessions 10\r\n```\r\n\r\nRun the following command\
      \ and verify the output:\r\n\r\n```\r\ngrep -Psi -- '^\\h*MaxSessions\\h+\\\"?(1[1-9]|[2-9][0-9]|[1-9][0-9][0-9]+)\\\
      b' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf\r\n\r\nNothing should be returned\r\n```\r\
      \n\r\n**- IF -** `Match` set statements are used in your environment, specify the connection parameters\
      \ to use for the `-T` extended test mode and run the audit to verify the setting is not incorrectly\
      \ configured in a match block\r\n\r\n_Example additional audit needed for a match block for the\
      \ user `sshuser`:_\r\n\r\n```\r\n# sshd -T -C user=sshuser | grep maxsessions\r\n```"
    remediation_guidance: "Create or edit a `*.conf` file in the `/etc/ssh/sshd_config.d/` and set the\
      \ `MaxSessions` parameter to `10` or less above any `Include` and `Match` entries as follows:\r\n\
      \r\n```\r\nMaxSessions 10\r\n```"
    additional_information: ''
    default_value: MaxSessions 10
    artifacts_count: 3
    requirements: {}
    safety:
      default: investigate
      implementation_status: guidance_only
