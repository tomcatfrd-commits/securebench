control:
  id: CIS-5.1.18
  benchmark_id: cis-ubuntu-24.04
  title: Ensure sshd MaxSessions is configured
  description: "The `MaxSessions` parameter specifies the maximum number of open sessions permitted from\
    \ a given connection.\r\n\r\nMore information about the openSSH server configuration is available\
    \ in the \"Configure SSH Server\" section overview."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_1_18.audit
