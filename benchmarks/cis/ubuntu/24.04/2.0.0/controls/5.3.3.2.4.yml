    rationale: "Use of a complex password helps to increase the time and resources required to compromise\
      \ the password. Password complexity, or strength, is a measure of the effectiveness of a password\
      \ in resisting attempts at guessing and brute-force attacks.\r\n\r\nPassword complexity is one factor\
      \ of several that determines how long it takes to crack a password. The more complex the password,\
      \ the greater the number of possible combinations that need to be tested before the password is\
      \ compromised."
    impact: ''
    audit_guidance: "Run the following command to verify that the `maxrepeat` option is set to `3` or\
      \ less, not `0`, and follows local site policy:\r\n\r\n```\r\n# grep -Psi -- '^\\h*maxrepeat\\h*=\\\
      h*[1-3]\\b' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf\r\n```\r\n\r\n_Example\
      \ output:_\r\n\r\n```\r\n/etc/security/pwquality.conf.d/50-pwrepeat.conf:maxrepeat = 3\r\n```\r\n\
      \r\nVerify returned value(s) are `3` or less, not `0`, and meet local site policy\r\n\r\nRun the\
      \ following command to verify that `maxrepeat` is not set, is `3` or less, not `0`, and conforms\
      \ to local site policy:\r\n\r\n```\r\n# grep -Psi -- '^\\h*password\\h+(requisite|required|sufficient)\\\
      h+pam_pwquality\\.so\\h+([^#\\n\\r]+\\h+)?maxrepeat\\h*=\\h*(0|[4-9]|[1-9][0-9]+)\\b' /etc/pam.d/common-password\r\
      \n```\r\n\r\nNothing should be returned\r\n\r\n**Note:** \r\n- settings should be configured in\
      \ only **one** location for clarity\r\n- Settings observe an order of precedence:\r\n  - module\
      \ arguments override the settings in the `/etc/security/pwquality.conf` configuration file\r\n \
      \ - settings in the `/etc/security/pwquality.conf` configuration file override settings in a `.conf`\
      \ file in the `/etc/security/pwquality.conf.d/` directory\r\n  - settings in a `.conf` file in the\
      \ `/etc/security/pwquality.conf.d/` directory are read in canonical order, with last read file containing\
      \ the setting taking precedence\r\n- It is recommended that settings be configured in a `.conf`\
      \ file in the `/etc/security/pwquality.conf.d/` directory for clarity, convenience, and durability."
    remediation_guidance: "Create or modify a file ending in `.conf` in the `/etc/security/pwquality.conf.d/`\
      \ directory or the file `/etc/security/pwquality.conf` and add or modify the following line to set\
      \ `maxrepeat` to `3` or less and not `0`. Ensure setting conforms to local site policy:\r\n\r\n\
      _Example:_\r\n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n   sed -ri 's/^\\s*maxrepeat\\s*=/# &/'\
      \ /etc/security/pwquality.conf\r\n   [ ! -d /etc/security/pwquality.conf.d/ ] && mkdir /etc/security/pwquality.conf.d/\r\
      \n   printf '\\n%s' \"maxrepeat = 3\" > /etc/security/pwquality.conf.d/50-pwrepeat.conf\r\n}\r\n\
      ```\r\n\r\n\r\n\r\nEdit and remove the `maxrepeat` argument in `/etc/pam.d/common-password` ensuring\
      \ it does not conflict with the `pwquality.conf` entry."
    additional_information: ''
    default_value: maxrepeat = 0
    artifacts_count: 5
