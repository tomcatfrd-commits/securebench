control:
  id: CIS-5.3.3.2.4
  benchmark_id: cis-ubuntu-24.04
  title: Ensure password same consecutive characters is configured
  description: The `pwquality` `maxrepeat` option sets the maximum number of allowed same consecutive
    characters in a new password.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_3_3_2_4.audit
  remediation: cis.ubuntu.24.04.v2_0_0.5_3_3_2_4.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.5_3_3_2_4.rollback
