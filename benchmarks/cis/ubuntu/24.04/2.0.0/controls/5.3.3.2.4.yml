  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 5.3.3.2.4
      url: https://workbench.cisecurity.org/sections/4177285/recommendations/7047734
    assessment_status: automated
