      mitre_mitigations:
      - M1029
    parent: CIS _6_System Logging Main | 2.2.1.1.2-Ensure systemd-journal-remote service is not in use
    rationale: "If a client is configured to also receive data, thus turning it into a server, the client\
      \ system is acting outside it's operational boundary.\r\n\r\n**Note:** This recommendation **only\
      \ applies if `journald` is the chosen method for client side logging**. Do not apply this recommendation\
      \ if `rsyslog` is used."
    impact: ''
    audit_guidance: "Run the following command to verify `systemd-journal-remote.socket` and `systemd-journal-remote.service`\
      \ are not enabled:\r\n\r\n```\r\n# systemctl is-enabled systemd-journal-remote.socket systemd-journal-remote.service\
      \ | grep -P -- '^enabled'\r\n```\r\nNothing should be returned\r\n\r\n\r\nRun the following command\
      \ to verify `systemd-journal-remote.socket` and `systemd-journal-remote.service` are not active:\r\
      \n\r\n```\r\n# systemctl is-active systemd-journal-remote.socket systemd-journal-remote.service\
      \ | grep -P -- '^active'\r\n```\r\nNothing should be returned"
    remediation_guidance: "Run the following commands to stop and mask `systemd-journal-remote.socket`\
      \ and systemd-journal-remote.service:\r\n\r\n```\r\n# systemctl stop systemd-journal-remote.socket\
      \ systemd-journal-remote.service\r\n# systemctl mask systemd-journal-remote.socket systemd-journal-remote.service\r\
      \n```"
    additional_information: ''
    default_value: ''
    artifacts_count: 6
    requirements: {}
    safety:
