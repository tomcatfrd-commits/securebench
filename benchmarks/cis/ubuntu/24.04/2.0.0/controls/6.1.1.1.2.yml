control:
  id: CIS-6.1.1.1.2
  benchmark_id: cis-ubuntu-24.04
  title: Ensure systemd-journal-remote service is not in use
  description: "Journald `systemd-journal-remote` supports the ability to receive messages from remote\
    \ hosts, thus acting as a log server. Clients should not receive data from other hosts.\r\n\r\n**Note:**\
    \ \r\n- The same package, `systemd-journal-remote`, is used for both sending logs to remote hosts\
    \ and receiving incoming logs.\r\n- With regards to receiving logs, there are two services; `systemd-journal-remote.socket`\
    \ and `systemd-journal-remote.service`."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.6_1_1_1_2.audit
  remediation: cis.ubuntu.24.04.v2_0_0.6_1_1_1_2.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.6_1_1_1_2.rollback
  verification: cis.ubuntu.24.04.v2_0_0.6_1_1_1_2.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 6.1.1.1.2
      url: https://workbench.cisecurity.org/sections/4177234/recommendations/7047471
    assessment_status: automated
    profiles:
    - Level 1 - Server
    - Level 1 - Workstation
    mappings:
      nist:
      - AU-2
      - AU-7
      cis_v8:
      - '4.8'
      cis_v7:
      - '9.2'
      mitre_techniques:
