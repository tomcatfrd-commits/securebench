control:
  id: CIS-5.3.2.1
  benchmark_id: cis-ubuntu-24.04
  title: Ensure pam_unix module is enabled
  description: "`pam_unix` is the standard Unix authentication module. It uses standard calls from the\
    \ system's libraries to retrieve and set account information as well as authentication. Usually this\
    \ is obtained from the `/etc/passwd` and if shadow is enabled, the `/etc/shadow` file as well.\r\n\
    \r\nThe account component performs the task of establishing the status of the user's account and password\
    \ based on the following shadow elements: `expire`, `last_change`, `max_change`, `min_change`, `warn_change`.\
    \ In the case of the latter, it may offer advice to the user on changing their password or, through\
    \ the `PAM_AUTHTOKEN_REQD` return, delay giving service to the user until they have established a\
    \ new password. The entries listed above are documented in the shadow(5) manual page. Should the user's\
    \ record not contain one or more of these entries, the corresponding shadow check is not performed.\r\
    \n\r\nThe authentication component performs the task of checking the users credentials (password).\
    \ The default action of this module is to not permit the user access to a service if their official\
    \ password is blank."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_3_2_1.audit
  remediation: cis.ubuntu.24.04.v2_0_0.5_3_2_1.remediate
