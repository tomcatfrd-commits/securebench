    rationale: The system should only provide access after performing authentication of a user.
    impact: ''
    audit_guidance: "Run the following command to verify that `pam_unix` is enabled:\r\n\r\n```\r\n# grep\
      \ -PH -- '\\bpam_unix\\.so\\b' /etc/pam.d/common-{account,auth,password,session,session-noninteractive}\r\
      \n```\r\n\r\nOutput should be simular to:\r\n\r\n```\r\n/etc/pam.d/common-account:account   [success=1\
      \ new_authtok_reqd=done default=ignore]   pam_unix.so\r\n/etc/pam.d/common-auth:auth   [success=2\
      \ default=ignore]   pam_unix.so try_first_pass\r\n/etc/pam.d/common-password:password   [success=1\
      \ default=ignore]   pam_unix.so obscure use_authtok try_first_pass yescrypt\r\n/etc/pam.d/common-session:session\
      \   required   pam_unix.so\r\n/etc/pam.d/common-session-noninteractive:session   required   pam_unix.so\r\
      \n```"
    remediation_guidance: "Run the following command to enable the `pam_unix` module:\r\n\r\n```\r\n#\
      \ pam-auth-update --enable unix\r\n```\r\n\r\n**Note:** If a site specific custom profile is being\
      \ used in your environment to configure PAM that includes the configuration for the `pam_unix` module,\
      \ enable that module instead"
