control:
  id: CIS-6.1.2.4
  benchmark_id: cis-ubuntu-24.04
  title: Ensure rsyslog logging is configured
  description: The `/etc/rsyslog.conf` and `/etc/rsyslog.d/*.conf` files specifies rules for logging and
    which files are to be used to log certain classes of messages.
  platform: ubuntu-24.04
  severity: unspecified
