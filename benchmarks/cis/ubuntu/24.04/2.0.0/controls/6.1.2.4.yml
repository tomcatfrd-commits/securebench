    parent: CIS _6_System Logging Main | 2.2.2.4-Ensure rsyslog logging is configured
    rationale: A great deal of important security-related information is sent via `rsyslog` (e.g., successful
      and failed su attempts, failed login attempts, root login attempts, etc.).
    impact: ''
    audit_guidance: "Review the contents of `/etc/rsyslog.conf` and `/etc/rsyslog.d/*.conf` files to ensure\
      \ appropriate logging is set. In addition, run the following command and verify that the log files\
      \ are logging information as expected:\r\n\r\n```\r\n# ls -l /var/log/\r\n```"
    remediation_guidance: "Edit the following lines in the `/etc/rsyslog.conf` and `/etc/rsyslog.d/*.conf`\
      \ files as appropriate for your environment.\r\n\r\n>**Note:** The below configuration is shown\
      \ for example purposes only. Due care should be given to how the organization wishes to store log\
      \ data.\r\n\r\n```\r\n*.emerg                                  :omusrmsg:*\r\nauth,authpriv.*  \
      \                        /var/log/secure\r\nmail.*                                  -/var/log/mail\r\
      \nmail.info                               -/var/log/mail.info\r\nmail.warning                  \
      \          -/var/log/mail.warn\r\nmail.err                                 /var/log/mail.err\r\n\
      cron.*                                   /var/log/cron\r\n*.=warning;*.=err                    \
      \   -/var/log/warn\r\n*.crit                                   /var/log/warn\r\n*.*;mail.none;news.none\
      \                 -/var/log/messages\r\nlocal0,local1.*                         -/var/log/localmessages\r\
      \nlocal2,local3.*                         -/var/log/localmessages\r\nlocal4,local5.*           \
      \              -/var/log/localmessages\r\nlocal6,local7.*                         -/var/log/localmessages\r\
      \n```\r\n\r\nRun the following command to reload the `rsyslogd` configuration:\r\n\r\n```\r\n# systemctl\
      \ restart rsyslog\r\n```"
    additional_information: ''
    default_value: ''
