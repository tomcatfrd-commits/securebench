control:
  id: CIS-6.2.3.22
  benchmark_id: cis-ubuntu-24.04
  title: Ensure file deletion events by users are collected
  description: "Monitor the use of system calls associated with the deletion or renaming of files and\
    \ file attributes. This configuration statement sets up monitoring for:\r\n- `unlink` - removes a\
    \ file\r\n- `unlinkat` - removes a file or empty directory at a path relative to a directory file\
    \ descriptor\r\n- `rename` - renames a file\r\n- `renameat` - renames a file or directory at a path\
    \ relative to a directory file descriptor and tags them with the identifier \"delete\".\r\n- `renameat2`\
    \ - system call operates in exactly the same way as `renameat` with some minor differences"
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.6_2_3_22.audit
  remediation: cis.ubuntu.24.04.v2_0_0.6_2_3_22.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.6_2_3_22.rollback
  verification: cis.ubuntu.24.04.v2_0_0.6_2_3_22.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 6.2.3.22
      url: https://workbench.cisecurity.org/sections/4203192/recommendations/7091569
    assessment_status: automated
    profiles:
    - Level 2 - Server
    - Level 2 - Workstation
    mappings:
      nist:
      - AU-12
      - SC-7
      cis_v8:
      - '8.5'
      cis_v7:
      - '6.2'
      mitre_techniques:
      - T1562
      - T1562.006
      mitre_tactics:
      - TA0005
      mitre_mitigations:
      - M1047
    parent: CIS _6_System Auditing Main | 2.2.3.22-Ensure file deletion events by users are collected
    rationale: Monitoring these calls from non-privileged users could provide a system administrator with
      evidence that inappropriate removal of files and file attributes associated with protected files
      is occurring. While this audit option will look at all events, system administrators will want to
      look for specific privileged files that are being deleted or altered.
    impact: ''
    audit_guidance: "**On disk configuration**\r\n\r\nRun the following command to check the on disk rules:\r\
      \n\r\n```\r\n# {\r\n UID_MIN=$(awk '/^\\s*UID_MIN/{print $2}' /etc/login.defs)\r\n [ -n \"${UID_MIN}\"\
      \ ] && awk \"/^ *-a *always,exit/ \\\r\n &&/ -F *arch=b(32|64)/ \\\r\n &&(/ -F *auid!=unset/||/\
      \ -F *auid!=-1/||/ -F *auid!=4294967295/) \\\r\n &&/ -F *auid>=${UID_MIN}/ \\\r\n &&/ -S/ \\\r\n\
      \ &&(/unlink/||/rename/||/unlinkat/||/renameat/||/renameat2/) \\\r\n &&(/ key= *[!-~]* *$/||/ -k\
      \ *[!-~]* *$/)\" /etc/audit/rules.d/*.rules \\\r\n || printf \"ERROR: Variable 'UID_MIN' is unset.\\\
      n\"\r\n}\r\n```\r\n\r\nVerify the output matches:\r\n\r\n```\r\n-a always,exit -F arch=b64 -S unlink,unlinkat,rename,renameat,renameat2\
      \ -F auid>=1000 -F auid!=unset -k delete\r\n-a always,exit -F arch=b32 -S unlink,unlinkat,rename,renameat,renameat2\
      \ -F auid>=1000 -F auid!=unset -k delete\r\n```\r\n\r\n**Running configuration**\r\n\r\nRun the\
      \ following command to check loaded rules:\r\n\r\n```\r\n# {\r\n UID_MIN=$(awk '/^\\s*UID_MIN/{print\
      \ $2}' /etc/login.defs)\r\n [ -n \"${UID_MIN}\" ] && auditctl -l | awk \"/^ *-a *always,exit/ \\\
      \r\n &&/ -F *arch=b(32|64)/ \\\r\n &&(/ -F *auid!=unset/||/ -F *auid!=-1/||/ -F *auid!=4294967295/)\
      \ \\\r\n &&/ -F *auid>=${UID_MIN}/ \\\r\n &&/ -S/ \\\r\n &&(/unlink/||/rename/||/unlinkat/||/renameat/||/renameat2/)\
      \ \\\r\n &&(/ key= *[!-~]* *$/||/ -k *[!-~]* *$/)\" \\\r\n || printf \"ERROR: Variable 'UID_MIN'\
      \ is unset.\\n\"\r\n}\r\n```\r\n\r\nVerify the output matches:\r\n\r\n```\r\n-a always,exit -F arch=b64\
      \ -S rename,unlink,unlinkat,renameat,renameat2 -F auid>=1000 -F auid!=-1 -F key=delete\r\n-a always,exit\
      \ -F arch=b32 -S unlink,rename,unlinkat,renameat,renameat2 -F auid>=1000 -F auid!=-1 -F key=delete\r\
      \n```"
    remediation_guidance: "**Create audit rules**\r\n\r\nEdit or create a file in the `/etc/audit/rules.d/`\
      \ directory, ending in `.rules` extension, with the relevant rules to monitor file deletion events\
      \ by users.\r\n\r\n_Example:_\r\n\r\n```\r\n# {\r\nUID_MIN=$(awk '/^\\s*UID_MIN/{print $2}' /etc/login.defs)\r\
      \n[ -n \"${UID_MIN}\" ] && printf \"\r\n-a always,exit -F arch=b64 -S rename,unlink,unlinkat,renameat,renameat2\
      \ -F auid>=${UID_MIN} -F auid!=unset -F key=delete\r\n-a always,exit -F arch=b32 -S rename,unlink,unlinkat,renameat,renameat2\
      \ -F auid>=${UID_MIN} -F auid!=unset -F key=delete\r\n\" >> /etc/audit/rules.d/50-delete.rules ||\
      \ printf \"ERROR: Variable 'UID_MIN' is unset.\\n\"\r\n}\r\n```\r\n\r\n**Load audit rules**\r\n\r\
      \nMerge and load the rules into active configuration:\r\n\r\n```\r\n# augenrules --load\r\n```\r\
      \n\r\nCheck if reboot is required.\r\n\r\n```\r\n# if [[ $(auditctl -s | grep \"enabled\") =~ \"\
      2\" ]]; then printf \"Reboot required to load rules\\n\"; fi\r\n```"
    additional_information: ''
    default_value: ''
    artifacts_count: 2
    requirements: {}
    safety:
      default: investigate
