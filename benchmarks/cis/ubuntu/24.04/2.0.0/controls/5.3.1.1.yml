    parent: CIS _5_Pluggable Authentication Modules Main | 2.1.1.1-Ensure latest version of pam is installed
    rationale: "Older versions of the `libpam-runtime` package may not include the latest security and\
      \ feature patches and updates.\r\n\r\n**Note:** This Benchmark includes Recommendations that depend\
      \ on newer `libpam-runtime` features."
    impact: ''
    audit_guidance: "Run the following command to verify `libpam-runtime` is installed:\r\n\r\n```\r\n\
      # dpkg-query -s libpam-runtime &>/dev/null && echo \"libpam-runtime is installed\"\r\n\r\nlibpam-runtime\
      \ is installed\r\n```\r\n\r\nRun the following command to verify `libpam-runtime` is the latest\
      \ version:\r\n\r\n```\r\n# apt list --upgradable 2>&1 | grep -P '^libpam-runtime\\b'\r\n```\r\n\r\
      \nNothing should be returned"
    remediation_guidance: "Run the following command to install the latest version of `libpam-runtime`:\r\
      \n\r\n```\r\n# apt install libpam-runtime\r\n```"
