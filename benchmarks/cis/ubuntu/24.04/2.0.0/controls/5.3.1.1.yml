control:
  id: CIS-5.3.1.1
  benchmark_id: cis-ubuntu-24.04
  title: Ensure latest version of pam is installed
  description: "Linux Pluggable Authentication Modules (PAM) is a suite of libraries that allow a Linux\
    \ system administrator to configure methods to authenticate users. It provides a flexible and centralized\
    \ way to switch authentication methods for secured applications by using configuration files instead\
    \ of changing application code\r\n\r\nThe `libpam-runtime` provides the runtime support for the PAM\
    \ library"
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_3_1_1.audit
  remediation: cis.ubuntu.24.04.v2_0_0.5_3_1_1.remediate
