    parent: CIS _6_System Auditing Main | 2.2.3.3-Ensure events that modify the sudo log file are collected
    rationale: Changes in `/var/log/sudo.log` indicate that an administrator has executed a command or
      the log file itself has been tampered with. Administrators will want to correlate the events written
      to the audit trail with the records written to `/var/log/sudo.log` to verify if unauthorized commands
      have been executed.
    impact: ''
    audit_guidance: "**Note:** This recommendation requires that the sudo logfile is configured.  See\
      \ guidance provided in the recommendation \"Ensure sudo log file exists\"\r\n\r\n1. Run the following\
      \ command to verify that sudo has a custom log file configured:\r\n```\r\n# grep -rPsi \"^\\h*Defaults\\\
      h+([^#]+,\\h*)?logfile\\h*=\\h*(\\\"|\\')?\\H+(\\\"|\\')?(,\\h*\\H+\\h*)*\\h*(#.*)?$\" /etc/sudoers*\r\
      \n```\r\n\r\n_Example output:_\r\n```\r\nDefaults logfile=\"/var/log/sudo.log\"\r\n```\r\n\r\n2.\
      \ Run the following command to verify a rule exists in the running configuration:\r\n\r\n```\r\n\
      # auditctl -l | grep -Ps -- 'sudo.log'\r\n```\r\n\r\nVerify the output includes:\r\n\r\n```\r\n\
      -w /var/log/sudo.log -p wa -k sudo_log_file\r\n```\r\n\r\n3. Run the following command to verify\
      \ a rule exists in a rules file:\r\n\r\n```\r\n# grep -Ps -- 'sudo.log' /etc/audit/rules.d/*.rules\r\
      \n```\r\n\r\n_Example Output_\r\n```\r\n/etc/audit/rules.d/50-sudo.rules:-w /var/log/sudo.log -p\
      \ wa -k sudo_log_file\r\n```"
    remediation_guidance: "**Note:** This recommendation requires that the sudo logfile is configured.\
      \  See guidance provided in the recommendation \"Ensure sudo log file exists\"\r\n\r\n1. Edit the\
      \ file `/etc/sudoers` or a file in `/etc/sudoers.d/` with `visudo -f ` and add the following line:\r\
      \n```\r\nDefaults logfile=\" \"\r\n```\r\n\r\n_Example:_\r\n```\r\nDefaults logfile=\"/var/log/sudo.log\"\
      \r\n```\r\n\r\n2. Edit or create a file in the `/etc/audit/rules.d/` directory, ending in `.rules`\
      \ extension, with the relevant rules to monitor events that modify the sudo log file.\r\n\r\n_Example:_\r\
      \n\r\n```\r\n# printf \"\r\n-w /var/log/sudo.log -p wa -k sudo_log_file\r\n\" >> /etc/audit/rules.d/50-sudo.rules\r\
      \n```\r\n\r\n\r\n3. Merge and load the rules into active configuration:\r\n\r\n```\r\n# augenrules\
      \ --load\r\n```\r\n\r\nCheck if reboot is required.\r\n\r\n```\r\n# if [[ $(auditctl -s | grep \"\
      enabled\") =~ \"2\" ]]; then printf \"Reboot required to load rules\\n\"; fi\r\n```"
    additional_information: ''
    default_value: ''
