control:
  id: CIS-6.2.3.3
  benchmark_id: cis-ubuntu-24.04
  title: Ensure events that modify the sudo log file are collected
  description: Monitor the `sudo` log file. If the system has been properly configured to disable the
    use of the `su` command and force all administrators to have to log in first and then use `sudo` to
    execute privileged commands, then all administrator commands will be logged to `/var/log/sudo.log`
    . Any time a command is executed, an audit event will be triggered as the `/var/log/sudo.log` file
    will be opened for write and the executed administration command will be written to the log.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.6_2_3_3.audit
  remediation: cis.ubuntu.24.04.v2_0_0.6_2_3_3.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.6_2_3_3.rollback
  verification: cis.ubuntu.24.04.v2_0_0.6_2_3_3.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 6.2.3.3
      url: https://workbench.cisecurity.org/sections/4203192/recommendations/7091550
    assessment_status: automated
    profiles:
    - Level 2 - Server
    - Level 2 - Workstation
    mappings:
      nist: []
      cis_v8:
      - '8.5'
