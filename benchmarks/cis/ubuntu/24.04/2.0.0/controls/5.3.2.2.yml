    parent: CIS _5_Pluggable Authentication Modules Main | 2.1.2.2-Ensure pam_faillock module is enabled
    rationale: Locking out user IDs after n unsuccessful consecutive login attempts mitigates brute force
      password attacks against your systems.
    impact: ''
    audit_guidance: "Run the following commands to verify that `pam_faillock` is enabled:\r\n\r\n```\r\
      \n# grep -P -- '\\bpam_faillock\\.so\\b' /etc/pam.d/common-{auth,account}\r\n```\r\n\r\nOutput should\
      \ be similar to:\r\n\r\n```\r\n/etc/pam.d/common-auth:auth     requisite                       pam_faillock.so\
      \ preauth\r\n/etc/pam.d/common-auth:auth     [default=die]                   pam_faillock.so authfail\r\
      \n/etc/pam.d/common-account:account       required                        pam_faillock.so\r\n```"
    remediation_guidance: "Create two pam-auth-update profiles in `/usr/share/pam-configs/`:\r\n\r\n1.\
      \ Create the `faillock` profile in `/usr/share/pam-configs/` with the following lines:\r\n\r\n```\r\
      \nName: Enable pam_faillock to deny access\r\nDefault: yes\r\nPriority: 0\r\nAuth-Type: Primary\r\
      \nAuth:\r\n        [default=die]                   pam_faillock.so authfail\r\n```\r\n\r\n_Example\
      \ Script:_\r\n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n   arr=('Name: Enable pam_faillock to deny\
      \ access' 'Default: yes' 'Priority: 0' 'Auth-Type: Primary' 'Auth:' '        [default=die]     \
      \              pam_faillock.so authfail') \r\n   printf '%s\\n' \"${arr[@]}\" > /usr/share/pam-configs/faillock\r\
      \n}\r\n```\r\n\r\n2. Create the `faillock_notify` profile in `/usr/share/pam-configs/` with the\
      \ following lines:\r\n\r\n```\r\nName: Notify of failed login attempts and reset count upon success\r\
      \nDefault: yes\r\nPriority: 1024\r\nAuth-Type: Primary\r\nAuth:\r\n        requisite           \
      \            pam_faillock.so preauth\r\nAccount-Type: Primary\r\nAccount:\r\n        required  \
      \                      pam_faillock.so\r\n```\r\n\r\n_Example Script:_\r\n\r\n```\r\n#!/usr/bin/env\
      \ bash\r\n\r\n{\r\n   arr=('Name: Notify of failed login attempts and reset count upon success'\
      \ 'Default: yes' 'Priority: 1024' 'Auth-Type: Primary' 'Auth:' '        requisite              \
      \         pam_faillock.so preauth' 'Account-Type: Primary' 'Account:' '        required        \
      \                pam_faillock.so') \r\n   printf '%s\\n' \"${arr[@]}\" > /usr/share/pam-configs/faillock_notify\r\
      \n}\r\n```\r\n\r\nRun the following command to update the `common-auth` and `common-account` PAM\
      \ files with the new profiles:\r\n\r\n```\r\n# pam-auth-update --enable ```\r\n\r\n_Example:_\r\n\
      \r\n```\r\n# pam-auth-update --enable faillock\r\n# pam-auth-update --enable faillock_notify\r\n\
      ```\r\n\r\n**Note:**\r\n- The name used for the file must be used in the `pam-auth-update --enable`\
      \ command\r\n- The `Name:` line should be easily recognizable and understood\r\n- The `Priority:`\
      \ Line is important as it effects the order of the lines in the `/etc/pam.d/` files\r\n- If a site\
      \ specific custom profile is being used in your environment to configure PAM that includes the configuration\
      \ for the `pam_faillock` module, enable that module instead"
