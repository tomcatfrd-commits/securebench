control:
  id: CIS-5.3.2.2
  benchmark_id: cis-ubuntu-24.04
  title: Ensure pam_faillock module is enabled
  description: The `pam_faillock.so` module maintains a list of failed authentication attempts per user
    during a specified interval and locks the account in case there were more than the configured number
    of consecutive failed authentications (this is defined by the `deny` parameter in the faillock configuration).
    It stores the failure records into per-user files in the tally directory.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_3_2_2.audit
  remediation: cis.ubuntu.24.04.v2_0_0.5_3_2_2.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.5_3_2_2.rollback
  verification: cis.ubuntu.24.04.v2_0_0.5_3_2_2.verify
  rollback_capability: unsupported
