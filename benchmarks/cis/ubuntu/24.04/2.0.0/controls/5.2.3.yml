    parent: CIS _5_Configure privilege escalation Main | 2.1.3-Ensure sudo log file exists
    rationale: A sudo log file simplifies auditing of sudo commands
    impact: '**WARNING:** Editing the `sudo` configuration incorrectly can cause `sudo` to stop functioning.
      Always use `visudo` to modify `sudo` configuration files.'
    audit_guidance: "Run the following command to verify that sudo has a custom log file configured:\r\
      \n\r\n```\r\n# grep -rPsi \"^\\h*Defaults\\h+([^#]+,\\h*)?logfile\\h*=\\h*(\\\"|\\')?\\H+(\\\"|\\\
      ')?(,\\h*\\H+\\h*)*\\h*(#.*)?$\" /etc/sudoers*\r\n```\r\n\r\nVerify the output matches:\r\n\r\n\
      ```\r\nDefaults logfile=\"/var/log/sudo.log\"\r\n```"
    remediation_guidance: "Edit the file `/etc/sudoers` or a file in `/etc/sudoers.d/` with `visudo -f\
      \ ` and add the following line:\r\n\r\n```\r\nDefaults  logfile=\" \"\r\n```\r\n\r\n_Example:_\r\
      \n```\r\nDefaults logfile=\"/var/log/sudo.log\"\r\n```\r\n\r\n**Notes:** \r\n- sudo will read each\
      \ file in `/etc/sudoers.d`, skipping file names that end in `~` or contain a `.` character to avoid\
      \ causing problems with package manager or editor temporary/backup files. \r\n- Files are parsed\
      \ in sorted lexical order. That is, `/etc/sudoers.d/01_first` will be parsed before `/etc/sudoers.d/10_second`.\
      \ \r\n- Be aware that because the sorting is lexical, not numeric, `/etc/sudoers.d/1_whoops` would\
      \ be loaded after `/etc/sudoers.d/10_second`. \r\n- Using a consistent number of leading zeroes\
      \ in the file names can be used to avoid such problems."
    additional_information: visudo edits the sudoers file in a safe fashion, analogous to vipw(8). visudo
      locks the sudoers file against multiple simultaneous edits, provides basic sanity checks, and checks
      for parse errors. If the sudoers file is currently being edited you will receive a message to try
      again later.
