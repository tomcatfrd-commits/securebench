    parent: CIS _6_System Auditing Main | 2.2.4.3-Ensure audit log files owner is configured
    rationale: Access to audit records can reveal system and configuration data to attackers, potentially
      compromising its confidentiality.
    impact: ''
    audit_guidance: "Run the following script to verify audit log files are owned by the `root` user:\
      \ \r\n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n   l_output=\"\" l_output2=\"\"\r\n   if [ -e \"\
      /etc/audit/auditd.conf\" ]; then\r\n      l_audit_log_directory=\"$(dirname \"$(awk -F= '/^\\s*log_file\\\
      s*/{print $2}' /etc/audit/auditd.conf | xargs)\")\"\r\n      if [ -d \"$l_audit_log_directory\"\
      \ ]; then\r\n         while IFS= read -r -d $'\\0' l_file; do\r\n            l_output2=\"$l_output2\\\
      n  - File: \\\"$l_file\\\" is owned by user: \\\"$(stat -Lc '%U' \"$l_file\")\\\"\\n     (should\
      \ be owned by user: \\\"root\\\")\\n\"\r\n         done < <(find \"$l_audit_log_directory\" -maxdepth\
      \ 1 -type f ! -user root -print0)\r\n      else\r\n         l_output2=\"$l_output2\\n  - Log file\
      \ directory not set in \\\"/etc/audit/auditd.conf\\\" please set log file directory\"\r\n      fi\r\
      \n   else\r\n      l_output2=\"$l_output2\\n  - File: \\\"/etc/audit/auditd.conf\\\" not found.\\\
      n  - ** Verify auditd is installed **\"\r\n   fi\r\n   if [ -z \"$l_output2\" ]; then\r\n      l_output=\"\
      $l_output\\n  - All files in \\\"$l_audit_log_directory\\\" are owned by user: \\\"root\\\"\\n\"\
      \r\n      echo -e \"\\n- Audit Result:\\n  ** PASS **\\n - * Correctly configured * :$l_output\"\
      \r\n   else\r\n      echo -e \"\\n- Audit Result:\\n  ** FAIL **\\n - * Reasons for audit failure\
      \ * :$l_output2\\n\"\r\n   fi\r\n}\r\n```"
    remediation_guidance: "Run the following command to configure the audit log files to be owned by the\
      \ `root` user: \r\n\r\n```\r\n# [ -f /etc/audit/auditd.conf ] && find \"$(dirname $(awk -F \"=\"\
      \ '/^\\s*log_file/ {print $2}' /etc/audit/auditd.conf | xargs))\" -type f ! -user root -exec chown\
      \ root {} +\r\n```"
