control:
  id: CIS-5.3.3.4.3
  benchmark_id: cis-ubuntu-24.04
  title: Ensure pam_unix includes a strong password hashing algorithm
  description: "A cryptographic hash function converts an arbitrary-length input into a fixed length output.\
    \ Password hashing performs a one-way transformation of a password, turning the password into another\
    \ string, called the hashed password.\r\n\r\nThe `pam_unix` module can be configured to use one of\
    \ the following hashing algorithms for user's passwords:\r\n- `md5` - When a user changes their password\
    \ next, encrypt it with the `MD5` algorithm.\r\n- `bigcrypt` - When a user changes their password\
    \ next, encrypt it with the `DEC C2` algorithm.\r\n- `sha256` - When a user changes their password\
    \ next, encrypt it with the `SHA256` algorithm. The `SHA256` algorithm must be supported by the crypt(3)\
    \ function.\r\n- `sha512` - When a user changes their password next, encrypt it with the `SHA512`\
    \ algorithm. The `SHA512` algorithm must be supported by the crypt(3) function.\r\n- `blowfish` -\
    \ When a user changes their password next, encrypt it with the `blowfish` algorithm. The `blowfish`\
    \ algorithm must be supported by the crypt(3) function.\r\n- `gost_yescrypt` - When a user changes\
    \ their password next, encrypt it with the `gost-yescrypt` algorithm. The `gost-yescrypt` algorithm\
    \ must be supported by the crypt(3) function.\r\n- `yescrypt` - When a user changes their password\
    \ next, encrypt it with the `yescrypt` algorithm. The `yescrypt` algorithm must be supported by the\
    \ crypt(3) function."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_3_3_4_3.audit
  remediation: cis.ubuntu.24.04.v2_0_0.5_3_3_4_3.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.5_3_3_4_3.rollback
