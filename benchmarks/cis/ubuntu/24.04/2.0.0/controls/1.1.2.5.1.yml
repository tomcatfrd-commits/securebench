control:
  id: CIS-1.1.2.5.1
  benchmark_id: cis-ubuntu-24.04
  title: Ensure separate partition exists for /var/tmp
  description: The `/var/tmp` directory is a world-writable directory used for temporary storage by all
    users and some applications. Temporary files residing in `/var/tmp` are to be preserved between reboots.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.1_1_2_5_1.audit
  remediation: cis.ubuntu.24.04.v2_0_0.1_1_2_5_1.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.1_1_2_5_1.rollback
  verification: cis.ubuntu.24.04.v2_0_0.1_1_2_5_1.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 1.1.2.5.1
      url: https://workbench.cisecurity.org/sections/4177257/recommendations/7047569
    assessment_status: automated
    profiles:
    - Level 2 - Server
    - Level 2 - Workstation
    mappings:
      nist:
      - CM-6
      - CM-7
      cis_v8:
      - '3.3'
      cis_v7:
      - '14.6'
      mitre_techniques:
      - T1499
