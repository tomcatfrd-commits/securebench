    parent: CIS _1_Configure Filesystem Partitions Main | 1.1.5.1-Ensure separate partition exists for
      /var/tmp
    rationale: "The default installation only creates a single `/` partition. Since the `/var/tmp` directory\
      \ is world-writable, there is a risk of resource exhaustion. In addition, other operations on the\
      \ system could fill up the disk unrelated to `/var/tmp` and cause potential disruption to daemons\
      \ as the disk is full.\r\n\r\nConfiguring `/var/tmp` as its own file system allows an administrator\
      \ to set additional mount options such as `noexec/nosuid/nodev`. These options limit an attacker's\
      \ ability to create exploits on the system."
    impact: Resizing filesystems is a common activity in cloud-hosted servers. Separate filesystem partitions
      may prevent successful resizing or may require the installation of additional tools solely for the
      purpose of resizing operations. The use of these additional tools may introduce their own security
      considerations.
    audit_guidance: "Run the following command and verify output shows `/var/tmp` is mounted.\r\n\r\n\
      _Example:_\r\n\r\n```\r\n# findmnt -kn /var/tmp\r\n```\r\n_Example Output_\r\n```\r\n/var/tmp  \
      \ /dev/sdb ext4   rw,nosuid,nodev,noexec,relatime,seclabel\r\n```"
    remediation_guidance: "For new installations, during installation create a custom partition setup\
      \ and specify a separate partition for `/var/tmp`.\r\n\r\nFor systems that were previously installed,\
      \ create a new partition and configure `/etc/fstab` as appropriate.\r\n\r\n**Note:** Using Btrfs\
      \ subvolumes instead of traditional disk partitions changes how disk space is allocated and enforced,\
      \ quotas may need to be configured to enforce storage limits and prevent resource exhaustion."
    additional_information: When modifying `/var/tmp` it is advisable to bring the system to emergency
      mode (so auditd is not running), rename the existing directory, mount the new file system, and migrate
      the data over before returning to multi-user mode.
