    parent: CIS _6_System Auditing Main | 2.2.4.10-Ensure audit tools group owner is configured
    rationale: Protecting audit information includes identifying and protecting the tools used to view
      and manipulate log data. Protecting audit tools is necessary to prevent unauthorized operation on
      audit information.
    impact: ''
    audit_guidance: "Run the following command to verify the audit tools are owned by the group `root`\r\
      \n\r\n```\r\n# stat -Lc \"%n %G\" /sbin/auditctl /sbin/aureport /sbin/ausearch /sbin/autrace /sbin/auditd\
      \ /sbin/augenrules | awk '$2 != \"root\" {print}'\r\n```\r\n\r\nNothing should be returned"
    remediation_guidance: "Run the following command to change group ownership to the group `root`:\r\n\
      \r\n```\r\n# chgrp root /sbin/auditctl /sbin/aureport /sbin/ausearch /sbin/autrace /sbin/auditd\
      \ /sbin/augenrules\r\n```"
