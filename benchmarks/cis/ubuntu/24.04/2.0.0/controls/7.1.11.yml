    parent: CIS _7_System File Permissions Main | 2.1.11-Ensure world writable files and directories are
      secured
    rationale: "Data in world-writable files can be modified and compromised by any user on the system.\
      \ World writable files may also indicate an incorrectly written script or program that could potentially\
      \ be the cause of a larger compromise to the system's integrity.\r\n\r\nThis feature prevents the\
      \ ability to delete or rename files in world writable directories (such as `/tmp` ) that are owned\
      \ by another user."
    impact: ''
    audit_guidance: "Run the following script to verify:\r\n- No world writable files exist\r\n- No world\
      \ writable directories without the sticky bit exist\r\n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\
      \n   a_output=() a_output2=() a_file=() a_dir=() l_smask='01000'\r\n   l_exclude=\"nfs|proc|cifs|smb|vfat|iso9660|efivarfs|selinuxfs|ncpfs\"\
      \r\n   l_exclude2=\"\\/run|\\/tmp|\\/var\\/tmp\"\r\n   a_path=(-path \"*/containers/storage/*\"\
      \ -o -path \"*/containerd/*\" -o -path \"*/kubelet/*\" -o -path \"/sys/*\" -o -path \"/snap/*\"\
      \ -o -path \"/boot/efi/*\")\r\n   while IFS= read -r l_mount; do\r\n      while IFS= read -r -d\
      \ $'\\0' l_file; do\r\n         if [ -e \"$l_file\" ]; then\r\n            [ -f \"$l_file\" ] &&\
      \ a_file+=(\"$l_file\")\r\n            if [ -d \"$l_file\" ]; then\r\n               l_mode=\"$(stat\
      \ -Lc '%#a' \"$l_file\")\"\r\n               [ ! $(( $l_mode & $l_smask )) -gt 0 ] && a_dir+=(\"\
      $l_file\")\r\n            fi\r\n         fi\r\n      done < <(find \"$l_mount\" -mount -xdev \\\
      ( \"${a_path[@]}\" \\) \\\r\n      -prune -o \\( -type f -o -type d \\) -perm -0002 -print0 2> /dev/null)\r\
      \n   done < <(findmnt -Dkerno fstype,target | \\\r\n   awk '($1 !~ /^\\s*('\"$l_exclude\"')/ &&\
      \ $2 !~ /^('\"$l_exclude2\"')(\\/|$)/){print $2}')\r\n   if [ \"${#a_file[@]}\" -le 0 ]; then\r\n\
      \      printf '%s\\n' \"\" \"  - No world writable files exist on the local filesystem.\"\r\n  \
      \ else\r\n      printf '%s\\n' \"\" \" - There are \\\"${#a_file[@]}\\\" World writable files on\
      \ the system.\" \\\r\n      \"   - The following is a list of World writable files:\" \\\r\n   \
      \   \"${a_file[@]}\" \"   - end of list\"\r\n   fi\r\n   if [ \"${#a_dir[@]}\" -le 0 ]; then\r\n\
      \      printf '%s\\n' \"\" \\\r\n      \"  - Sticky bit is set on world writable directories on\
      \ the local filesystem.\"\r\n   else\r\n      printf '%s\\n' \"\" \" - There are \\\"${#a_dir[@]}\\\
      \" World writable directories\" \\\r\n      \"    without the sticky bit on the system.\" \\\r\n\
      \      \"   - The following is a list of World writable directories without the sticky bit:\" \\\
      \r\n      \"${a_dir[@]}\" \"   - end of list\"\r\n   fi\r\n}\r\n```\r\n\r\n**Note:** On systems\
      \ with a large number of files and/or directories, this audit may be a long running process"
    remediation_guidance: "- World Writable Files:\r\n  - It is recommended that write access is removed\
      \ from `other` with the command ( `chmod o-w ` ), but always consult relevant vendor documentation\
      \ to avoid breaking any application dependencies on a given file.\r\n- World Writable Directories:\r\
      \n  - Set the sticky bit on all world writable directories with the command ( `chmod a+t ` )\r\n\
      \r\nRun the following script to:\r\n- Remove other write permission from any world writable files\r\
      \n- Add the sticky bit to all world writable directories\r\n\r\n```\r\n#!/usr/bin/env bash\r\n\r\
      \n{\r\n   l_smask='01000' a_file=() a_dir=()\r\n   a_path=(-path \"*/containers/storage/*\" -o -path\
      \ \"*/containerd/*\" -o -path \"*/kubelet/*\" -o -path \"/sys/*\" -o -path \"/snap/*\" -o -path\
      \ \"/boot/efi/*\")\r\n   l_exclude=\"nfs|proc|cifs|smb|vfat|iso9660|efivarfs|selinuxfs|ncpfs\"\r\
      \n   l_exclude2=\"\\/run|\\/tmp|\\/var\\/tmp\"\r\n   while IFS= read -r l_mount; do\r\n      while\
      \ IFS= read -r -d $'\\0' l_file; do\r\n         l_mode=\"$(stat -Lc '%#a' \"$l_file\" 2>/dev/null)\"\
      \r\n         if [ -f \"$l_file\" ]; then # Remove excess permissions from WW files\r\n         \
      \   printf '%s\\n' \"\" \" - File: \\\"$l_file\\\" is mode: \\\"$l_mode\\\"\" \\\r\n           \
      \ \"  - removing write permission on \\\"$l_file\\\" from \\\"other\\\"\"\r\n            chmod o-w\
      \ \"$l_file\"\r\n         fi\r\n         if [ -d \"$l_file\" ]; then # Add sticky bit\r\n      \
      \      if [ ! $(( $l_mode & $l_smask )) -gt 0 ]; then\r\n               printf '%s\\n' \"\" \" -\
      \ Directory: \\\"$l_file\\\" is mode: \\\"$l_mode\\\"\" \\\r\n               \"    and doesn't have\
      \ the sticky bit set\" \\\r\n               \"  - Adding the sticky bit\"\r\n               chmod\
      \ a+t \"$l_file\"\r\n            fi\r\n         fi\r\n      done < <(find \"$l_mount\" -mount -xdev\
      \ \\( \"${a_path[@]}\" \\) \\\r\n      -prune -o \\( -type f -o -type d \\) -perm -0002 -print0\
      \ 2> /dev/null)\r\n   done < <(findmnt -Dkerno fstype,target | \\\r\n   awk '($1 !~ /^\\s*('\"$l_exclude\"\
      ')/ && $2 !~ /^('\"$l_exclude2\"')(\\/|$)/){print $2}') \r\n}\r\n```"
