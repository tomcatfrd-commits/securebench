control:
  id: CIS-7.1.11
  benchmark_id: cis-ubuntu-24.04
  title: Ensure world writable files and directories are secured
  description: "World writable files are the least secure. Data in world-writable files can be modified\
    \ and compromised by any user on the system. World writable files may also indicate an incorrectly\
    \ written script or program that could potentially be the cause of a larger compromise to the system's\
    \ integrity. See the `chmod(2)` man page for more information.\r\n\r\nSetting the sticky bit on world\
    \ writable directories prevents users from deleting or renaming files in that directory that are not\
    \ owned by them."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.7_1_11.audit
  remediation: cis.ubuntu.24.04.v2_0_0.7_1_11.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.7_1_11.rollback
  verification: cis.ubuntu.24.04.v2_0_0.7_1_11.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 7.1.11
      url: https://workbench.cisecurity.org/sections/4177241/recommendations/7047575
    assessment_status: automated
