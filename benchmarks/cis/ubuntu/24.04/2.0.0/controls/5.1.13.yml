    parent: CIS _5_Configure SSH Server Main | 2.2.14-Ensure sshd LoginGraceTime is configured
    rationale: Setting the `LoginGraceTime` parameter to a low number will minimize the risk of successful
      brute force attacks to the SSH server. It will also limit the number of concurrent unauthenticated
      connections While the recommended setting is 60 seconds (1 Minute), set the number based on site
      policy.
    impact: ''
    audit_guidance: "Run the following command and verify that output `LoginGraceTime` is between `1`\
      \ and `60` seconds:\r\n\r\n```\r\n# sshd -T | grep logingracetime\r\n\r\nlogingracetime 60\r\n```"
    remediation_guidance: "Create or edit a `*.conf` file in the `/etc/ssh/sshd_config.d/` and set the\
      \ `LoginGraceTime` parameter to `60` seconds or less above any `Include` entry as follows:\r\n\r\
      \n```\r\nLoginGraceTime 60\r\n```"
    additional_information: ''
    default_value: LoginGraceTime 120
