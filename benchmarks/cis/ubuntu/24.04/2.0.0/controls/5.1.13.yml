control:
  id: CIS-5.1.13
  benchmark_id: cis-ubuntu-24.04
  title: Ensure sshd LoginGraceTime is configured
  description: "The `LoginGraceTime` parameter specifies the time allowed for successful authentication\
    \ to the SSH server. The longer the Grace period is the more open unauthenticated connections can\
    \ exist. Like other session controls in this session the Grace Period should be limited to appropriate\
    \ organizational limits to ensure the service is available for needed access.\r\n\r\nMore information\
    \ about the openSSH server configuration is available in the \"Configure SSH Server\" section overview."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_1_13.audit
  remediation: cis.ubuntu.24.04.v2_0_0.5_1_13.remediate
