    impact: ''
    audit_guidance: "Run the following command to verify `libpam-modules` is installed:\r\n\r\n```\r\n\
      # dpkg-query -s libpam-modules &>/dev/null && echo \"libpam-modules is installed\"\r\n\r\nlibpam-modules\
      \ is installed\r\n```\r\n\r\nRun the following command to verify `libpam-modules` is the latest\
      \ version:\r\n\r\n```\r\n# apt list --upgradable 2>&1 | grep -P '^libpam-modules\\b'\r\n```\r\n\r\
      \nNothing should be returned"
    remediation_guidance: "Run the following command to install the latest version of `libpam-modules`:\r\
      \n\r\n```\r\n# apt install libpam-modules\r\n```"
