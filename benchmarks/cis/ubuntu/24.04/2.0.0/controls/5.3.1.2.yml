  title: Ensure latest version of libpam-modules is installed
  description: '`libpam-modules` is a package containing a set of Pluggable Authentication Modules (PAM)
    which allows system administrators to configure different authentication methods for user logins,
    providing flexibility in how users can access applications by using various authentication modules
    to include password checks and other security mechanisms.'
