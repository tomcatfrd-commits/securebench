control:
  id: CIS-1.5.8
  benchmark_id: cis-ubuntu-24.04
  title: Ensure kernel.kptr_restrict is configured
  description: "`kernel.kptr_restrict` sets whether restrictions are placed on exposing kernel addresses\
    \ via /proc and other interfaces.\r\n- `kptr_restrict = 0` - The address is hashed before printing.\
    \ (equivalent to %p.)\r\n- `kptr_restrict = 1` - kernel pointers printed using the %pK format specifier\
    \ will be replaced with `0`'s.\r\n- `kptr_restrict = 2` - kernel pointers printed using %pK will be\
    \ replaced with `0`'s regardless of privileges.\r\n\r\nMore information about the kernel parameter\
    \ configuration files, their location, and load preference is available in the section overview."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.1_5_8.audit
  remediation: cis.ubuntu.24.04.v2_0_0.1_5_8.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.1_5_8.rollback
  verification: cis.ubuntu.24.04.v2_0_0.1_5_8.verify
  rollback_capability: unsupported
