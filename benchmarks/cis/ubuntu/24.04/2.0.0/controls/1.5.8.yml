    parent: CIS _1_Configure Additional Process Hardening Main | 2.2.8-Ensure kernel.kptr_restrict is
      configured
    rationale: Masking the kernel symbols in `/proc/kallsyms` reduces the ability of an attacker using
      them to learn more about what to attack on your system.
    impact: ''
    audit_guidance: "Verify `kernel.kptr_restrict` is set to a value of: `1` or `2`.\r\n\r\n1. Run the\
      \ following command to verify `kernel.kptr_restrict` is set to a value of: `1` or `2` in the running\
      \ configuration:\r\n\r\n```\r\n# sysctl kernel.kptr_restrict\r\n```\r\n\r\n_Example output:_\r\n\
      \r\n```\r\nkernel.kptr_restrict = 2\r\n```\r\n\r\n2. Run the following script to verify `kernel.kptr_restrict`\
      \ is set to a value of: `1` or `2` in a sysctl conf file being used by systemd-sysctl:\r\n\r\n```\r\
      \n#!/usr/bin/env bash\r\n\r\n{\r\n   l_parameter_name=\"kernel.kptr_restrict\"\r\n   l_grep=\"${l_parameter_name//./(\\\
      \\.|\\\\/)}\" a_output=() a_files=()\r\n   l_systemdsysctl=\"$(readlink -e /lib/systemd/systemd-sysctl\
      \ \\\r\n   || readlink -e /usr/lib/systemd/systemd-sysctl)\"\r\n   l_ufw_file=\"$([ -f /etc/default/ufw\
      \ ] && \\\r\n   awk -F= '/^\\s*IPT_SYSCTL=/ {print $2}' /etc/default/ufw)\"\r\n   [ -f \"$(readlink\
      \ -e \"$l_ufw_file\")\" ] && \\\r\n   a_files+=(\"$l_ufw_file\"); a_files+=(\"/etc/sysctl.conf\"\
      )\r\n   while IFS= read -r l_fname; do\r\n      l_file=\"$(readlink -e \"${l_fname//# /}\")\"\r\n\
      \      [ -n \"$l_file\" ] && ! grep -Psiq -- '(^|\\h+)'\"$l_file\"'\\b' \\\r\n      <<< \"${a_files[*]}\"\
      \ && a_files+=(\"$l_file\")\r\n   done < <(\"$l_systemdsysctl\" --cat-config | tac | \\\r\n   grep\
      \ -Psio -- '^\\h*#\\h*\\/[^#\\n\\r\\h]+\\.conf\\b')\r\n   for l_file in \"${a_files[@]}\"; do\r\n\
      \      l_opt=\"$(grep -Psoi '^\\h*'\"$l_grep\"'\\h*=\\h*\\H+\\b' \"$l_file\" | tail -n 1)\"\r\n\
      \      l_option_value=\"$(cut -d= -f2 <<< \"$l_opt\" | xargs)\"\r\n      [ -n \"$l_option_value\"\
      \ ] && \\\r\n      a_output+=(\" - \\\"$l_parameter_name = $l_option_value\\\" is set in:\" \\\r\
      \n      \"    \\\"$l_file\\\"\")\r\n   done\r\n   [ \"${#a_output[@]}\" -gt \"0\" ] && printf '%s\\\
      n' \"\" \"${a_output[@]}\" \"\"\r\n}\r\n```\r\n\r\nVerify output includes one of the following:\r\
      \n- `kernel.kptr_restrict = 1`\r\n- `kernel.kptr_restrict = 2`\r\n\r\n_Example output:_\r\n\r\n\
      ```\r\n- \"kernel.kptr_restrict\" is set to: \"1\" in: \"/etc/sysctl.d/60-kernel_sysctl.conf\"\r\
      \n```\r\n\r\n>**Note:** If multiple lines with `kernel.kptr_restrict =` are returned:\r\n>- The\
      \ first line includes the value being used by `systemd-sysctl`. If this is a correct value, this\
      \ is considered a passing state. If the file listed is not in the `/etc/sysctl.d/` directory, it\
      \ is highly recommended to follow the remediation procedure to create a `.conf` file in the `/etc/sysctl.d/`\
      \ directory with the correct setting to prevent a potential change due to an update to the system.\r\
      \n>- Any files in the `/etc/sysctl.d/` directory that include an incorrect value should be modified\
      \ to comment out or change the incorrect value to minimize the potential of the incorrect value\
      \ being used by `systemd-sysctl` due to system configuration changes."
    remediation_guidance: "1. Review all files being used by systemd-sysctl and comment out or remove\
      \ all `kernel.kptr_restrict` lines that are not `kernel.kptr_restrict=1` or `kernel.kptr_restrict=2`.\r\
      \n\r\n_Example script:_\r\n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n   l_option=\"kernel.kptr_restrict\"\
      \ l_value=\"(1|2)\"\r\n   l_grep=\"${l_option//./(\\\\.|\\\\/)}\" a_files=()\r\n   l_systemdsysctl=\"\
      $(readlink -e /lib/systemd/systemd-sysctl \\\r\n   || readlink -e /usr/lib/systemd/systemd-sysctl)\"\
      \r\n   l_ufw_file=\"$([ -f /etc/default/ufw ] && \\\r\n   awk -F= '/^\\s*IPT_SYSCTL=/ {print $2}'\
      \ /etc/default/ufw)\"\r\n   [ -f \"$(readlink -e \"$l_ufw_file\")\" ] && \\\r\n   a_files+=(\"$l_ufw_file\"\
      ); a_files+=(\"/etc/sysctl.conf\")\r\n   while IFS= read -r l_fname; do\r\n      l_file=\"$(readlink\
      \ -e \"${l_fname//# /}\")\"\r\n      [ -n \"$l_file\" ] && ! grep -Psiq -- '(^|\\h+)'\"$l_file\"\
      '\\b' \\\r\n      <<< \"${a_files[*]}\" && a_files+=(\"$l_file\")\r\n   done < <(\"$l_systemdsysctl\"\
      \ --cat-config | tac | \\\r\n   grep -Pios '^\\h*#\\h*\\/[^#\\n\\r\\h]+\\.conf\\b')\r\n   for l_file\
      \ in \"${a_files[@]}\"; do\r\n      grep -Pios '\\h*'\"$l_grep\"'\\h*=\\h*\\H+\\b' \"$l_file\" \\\
      \r\n      | grep -Pivq '^\\h*'\"$l_grep\"'\\h*=\\h*'\"$l_value\"'\\b' && \\\r\n      sed -ri '/^\\\
      s*'\"$l_grep\"'\\s*=\\s*(0|[3-9]|[1-9][0-9]+)/s/^/# /' \"$l_file\"\r\n   done\r\n}\r\n```\r\n\r\n\
      2. Create or edit a file in the `/etc/sysctl.d/` directory ending in `.conf` and edit or add the\
      \ following line:\r\n\r\n```\r\nkernel.kptr_restrict = {N}\r\n```\r\n\r\n_Example:_\r\n\r\n```\r\
      \n# [ ! -d \"/etc/sysctl.d/\" ] && mkdir -p /etc/sysctl.d/\r\n# printf '%s\\n' \"\" \"kernel.kptr_restrict\
      \ = 2\" >> /etc/sysctl.d/60-kernel_sysctl.conf\r\n```\r\n\r\n>**Note:** The example uses `kernel.kptr_restrict\
      \ = 2` but value may be set to `1` or `2`\r\n\r\n3. Run the following command to load all system\
      \ configuration files:\r\n\r\n```\r\n# sysctl --system\r\n```"
    additional_information: ''
    default_value: kernel.kptr_restrict = 1
    artifacts_count: 1
