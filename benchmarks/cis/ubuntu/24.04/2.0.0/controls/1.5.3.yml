control:
  id: CIS-1.5.3
  benchmark_id: cis-ubuntu-24.04
  title: Ensure kernel.yama.ptrace_scope is configured
  description: "The `ptrace()` system call provides a means by which one process (the \"tracer\") may\
    \ observe and control the execution of another process (the \"tracee\"), and examine and change the\
    \ tracee's memory and registers.\r\n\r\nThe sysctl settings (writable only with CAP_SYS_PTRACE) are:\r\
    \n- `0` - classic ptrace permissions: a process can PTRACE_ATTACH to any other process running under\
    \ the same uid, as long as it is dumpable (i.e. did not transition uids, start privileged, or have\
    \ called prctl(PR_SET_DUMPABLE...) already). Similarly, PTRACE_TRACEME is unchanged.\r\n- `1` - restricted\
    \ ptrace: a process must have a predefined relationship with the inferior it wants to call PTRACE_ATTACH\
    \ on. By default, this relationship is that of only its descendants when the above classic criteria\
    \ is also met. To change the relationship, an inferior can call prctl(PR_SET_PTRACER, debugger, ...)\
    \ to declare an allowed debugger PID to call PTRACE_ATTACH on the inferior. Using PTRACE_TRACEME is\
    \ unchanged.\r\n- `2` - admin-only attach: only processes with CAP_SYS_PTRACE may use ptrace with\
    \ PTRACE_ATTACH, or through children calling PTRACE_TRACEME.\r\n- `3` - no attach: no processes may\
    \ use ptrace with PTRACE_ATTACH nor via PTRACE_TRACEME. Once set, this sysctl value cannot be changed.\r\
    \n\r\n**Note:**\r\nA logic bug in the Linux kernel's `__ptrace_may_access()` function (CVE-2026-46333)\
    \ allows an unprivileged local user to gain ptrace access to processes they should not be able to\
    \ reach. Setting `kernel.yama.ptrace_scope = 2` restricts ptrace to processes holding `CAP_SYS_PTRACE`\
    \ only, cutting off the exploit path on unpatched systems."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.1_5_3.audit
  remediation: cis.ubuntu.24.04.v2_0_0.1_5_3.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.1_5_3.rollback
  verification: cis.ubuntu.24.04.v2_0_0.1_5_3.verify
  rollback_capability: unsupported
