    parent: CIS _1_Configure Additional Process Hardening Main | 2.2.3-Ensure kernel.yama.ptrace_scope
      is configured
    rationale: "If one application is compromised, it would be possible for an attacker to attach to other\
      \ running processes (e.g. Bash, Firefox, SSH sessions, GPG agent, etc) to extract additional credentials\
      \ and continue to expand the scope of their attack.\r\n\r\nEnabling restricted mode will limit the\
      \ ability of a compromised process to PTRACE_ATTACH on other processes running under the same user.\
      \ With restricted mode, ptrace will continue to work with root user."
    impact: ''
    audit_guidance: "Verify `kernel.yama.ptrace_scope` is set to a value of: `1`, `2`, or `3`.\r\n\r\n\
      1. Run the following command to verify `kernel.yama.ptrace_scope` is set to a value of: `1`, `2`,\
      \ or `3` in the running configuration:\r\n\r\n```\r\n# sysctl kernel.yama.ptrace_scope\r\n```\r\n\
      \r\n_Example output:_\r\n\r\n```\r\nkernel.yama.ptrace_scope = 1\r\n```\r\n\r\n2. Run the following\
      \ script to verify `kernel.yama.ptrace_scope` is set to a value of: `1`, `2`, or `3` in a sysctl\
      \ conf file being used by systemd-sysctl:\r\n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n   l_parameter_name=\"\
      kernel.yama.ptrace_scope\" l_grep=\"${l_parameter_name//./\\\\.}\" a_output=()\r\n   l_systemdsysctl=\"\
      $(readlink -e /lib/systemd/systemd-sysctl || readlink -e /usr/lib/systemd/systemd-sysctl)\"\r\n\
      \   l_ufwscf=\"$([ -f /etc/default/ufw ] && awk -F= '/^\\s*IPT_SYSCTL=/ {print $2}' /etc/default/ufw)\"\
      \r\n   l_opt=\"$(grep -Psoi '^\\h*'\"$l_grep\"'\\h*=\\h*\\H+\\b' \"$l_ufwscf\" | tail -n 1)\"\r\n\
      \   l_option_value=\"$(cut -d= -f2 <<< \"$l_opt\" | xargs)\"\r\n   [ -n \"$l_option_value\" ] &&\
      \ a_output+=(\" - UFW set: \\\"$l_parameter_name\\\" to: \\\"$l_option_value\\\" in: \\\"$l_file\\\
      \"\")\r\n   while IFS= read -r l_file; do\r\n      l_file=\"${l_file//# /}\"\r\n      l_opt=\"$(grep\
      \ -Pois '^\\h*'\"$l_grep\"'\\h*=\\h*\\H+\\b' \"$l_file\" | tail -n 1)\"\r\n      l_option_value=\"\
      $(cut -d= -f2 <<< \"$l_opt\" | xargs)\"\r\n      [ -n \"$l_option_value\" ] && a_output+=(\" - \\\
      \"$l_parameter_name\\\" is set to: \\\"$l_option_value\\\" in: \\\"$l_file\\\"\")\r\n   done < <(\"\
      $l_systemdsysctl\" --cat-config | tac | grep -Pios '^\\h*#\\h*\\/[^#\\n\\r\\h]+\\.conf\\b')\r\n\
      \   [ \"${#a_output[@]}\" -gt \"0\" ] && printf '%s\\n' \"\" \"${a_output[@]}\" \"\"\r\n}\r\n```\r\
      \n\r\n_Example output:_\r\n\r\n```\r\n- \"kernel.yama.ptrace_scope\" is set to: \"1\" in: \"/etc/sysctl.d/60-kernel_sysctl.conf\"\
      \r\n```\r\n\r\n**Note:**\r\n- If the `UFW set` value is displayed, and is the correct value, this\
      \ is considered a passing state. If this value is incorrect, it must be updated in the file shown\
      \ in the audit script output.\r\n- If multiple lines are returned: \r\n  - The first line includes\
      \ the value being used by `systemd-sysctl`. If this is a correct value, this is considered a passing\
      \ state. If the file listed is not in the `/etc/sysctl.d/` directory, it is highly recommended to\
      \ follow the remediation procedure to create a `.conf` file in the `/etc/sysctl.d/` directory with\
      \ the correct setting to prevent a potential change due to an update to the system.\r\n  - Any files\
      \ in the `/etc/sysctl.d/` directory that include an incorrect value should be modified to correct\
      \ or comment out the incorrect value to minimize the potential of the incorrect value being used\
      \ by `systemd-sysctl` do to system configuration changes."
    remediation_guidance: "1. Review all files ending in `.conf` in the `/etc/sysctl.d` directory and\
      \ comment out or remove all `kernel.yama.ptrace_scope` lines that are not `kernel.yama.ptrace_scope=1`,\
      \ `kernel.yama.ptrace_scope=2`, or `kernel.yama.ptrace_scope=3`.\r\n\r\n_Example script:_\r\n\r\n\
      ```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n   l_option=\"kernel.yama.ptrace_scope\" l_grep=\"${l_option//./\\\
      \\.}\" l_value=\"(1|2|3)\"\r\n   while IFS= read -r -d $'\\0' l_file; do\r\n      grep -Pois '\\\
      h*'\"$l_option\"'\\h*=\\h*\\H+\\b' \"$l_file\" \\\r\n      | grep -Pivq '^\\h*'\"$l_grep\"'\\h*=\\\
      h*'\"$l_value\"'\\b' && \\\r\n      sed -ri '/^\\s*kernel.yama.ptrace_scope\\s*=/s/^/# /' \"$l_file\"\
      \r\n   done < <(find /etc/sysctl.d/ -type f -name '*.conf' -print0)\r\n}\r\n```\r\n\r\n2. Create\
      \ or edit a file in the `/etc/sysctl.d/` directory ending in `.conf`and edit or add the following\
      \ line:\r\n\r\n```\r\nkernel.yama.ptrace_scope = 1\r\n```\r\n\r\n_Example:_\r\n\r\n```\r\n# [ !\
      \ -d \"/etc/sysctl.d/\" ] && mkdir -p /etc/sysctl.d/\r\n# printf '%s\\n' \"\" \"kernel.yama.ptrace_scope\
      \ = 1\" >> /etc/sysctl.d/60-kernel_sysctl.conf\r\n```\r\n\r\n**Note:** \r\n- The example uses `kernel.yama.ptrace_scope\
      \ = 1` but value may be set to `1`, `2`, or `3`\r\n- A logic bug in the Linux kernel's `__ptrace_may_access()`\
      \ function (CVE-2026-46333) allows an unprivileged local user to gain ptrace access to processes\
      \ they should not be able to reach. Setting `kernel.yama.ptrace_scope = 2` restricts ptrace to processes\
      \ holding `CAP_SYS_PTRACE` only, cutting off the exploit path on unpatched systems.\r\n\r\n3. Run\
      \ the following command to load all system configuration files:\r\n\r\n```\r\n# sysctl --system\r\
      \n```"
    additional_information: Ptrace is very rarely used by regular applications and is mostly used by debuggers
      such as `gdb` and `strace`.
    default_value: kernel.yama.ptrace_scope = 0
    artifacts_count: 1
    requirements: {}
    safety:
      default: investigate
      implementation_status: guidance_only
