control:
  id: CIS-5.3.3.2.7
  benchmark_id: cis-ubuntu-24.04
  title: Ensure password quality checking is enforced
  description: "The `pam_pwquality` module can be configured to either reject a password if it fails the\
    \ checks, or only print a warning.\r\n\r\nThis is configured by setting the `enforcing= ` argument.\
    \ If nonzero, a password will be rejected if it fails the checks, otherwise only a warning message\
    \ will be provided.\r\n\r\nThis setting applies only to the pam_pwquality module and possibly other\
    \ applications that explicitly change their behavior based on it. It does not affect pwmake(1) and\
    \ pwscore(1)."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_3_3_2_7.audit
  remediation: cis.ubuntu.24.04.v2_0_0.5_3_3_2_7.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.5_3_3_2_7.rollback
  verification: cis.ubuntu.24.04.v2_0_0.5_3_3_2_7.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 5.3.3.2.7
      url: https://workbench.cisecurity.org/sections/4177285/recommendations/7047758
    assessment_status: automated
    profiles:
    - Level 1 - Server
    - Level 1 - Workstation
    mappings:
      nist:
      - IA-5
      cis_v8:
      - '5.2'
      cis_v7:
