    parent: CIS _6_System Auditing Main | 2.2.4.4-Ensure audit log files group owner is configured
    rationale: Access to audit records can reveal system and configuration data to attackers, potentially
      compromising its confidentiality.
    impact: ''
    audit_guidance: "Run the following command to verify `log_group` parameter is set to either `adm`\
      \ or `root` in `/etc/audit/auditd.conf`: \r\n\r\n```\r\n#  grep -Piws -- '^\\h*log_group\\h*=\\\
      h*\\H+\\b' /etc/audit/auditd.conf | grep -Pvi -- '(adm)'\r\n```\r\n\r\nNothing should be returned\r\
      \n\r\nUsing the path of the directory containing the audit logs, verify audit log files are owned\
      \ by the \"root\" or \"adm\" group by running the following script: \r\n\r\n```\r\n#!/usr/bin/env\
      \ bash\r\n\r\n{\r\n  if [ -e /etc/audit/auditd.conf ]; then\r\n      l_fpath=\"$(dirname \"$(awk\
      \ -F \"=\" '/^\\s*log_file/ {print $2}' /etc/audit/auditd.conf | xargs)\")\"\r\n      find -L \"\
      $l_fpath\" -maxdepth 1 -not -path \"$l_fpath\"/lost+found -type f \\( ! -group root -a ! -group\
      \ adm \\) -exec ls -l {} +\r\n   fi\r\n}\r\n```\r\n\r\nNothing should be returned"
    remediation_guidance: "Run the following command to configure the audit log files to be group owned\
      \ by `adm`: \r\n\r\n```\r\n# find $(dirname $(awk -F\"=\" '/^\\s*log_file/ {print $2}' /etc/audit/auditd.conf\
      \ | xargs)) -type f \\( ! -group adm -a ! -group root \\) -exec chgrp adm {} +\r\n```\r\n\r\nRun\
      \ the following command to set the `log_group` parameter in the audit configuration file to `log_group\
      \ = adm`:\r\n\r\n```\r\n# sed -ri 's/^\\s*#?\\s*log_group\\s*=\\s*\\S+(\\s*#.*)?.*$/log_group =\
      \ adm\\1/' /etc/audit/auditd.conf\r\n```\r\n\r\nRun the following command to restart the audit daemon\
      \ to reload the configuration file: \r\n\r\n```\r\n# systemctl restart auditd\r\n```"
