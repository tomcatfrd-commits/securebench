control:
  id: CIS-1.3.1.4
  benchmark_id: cis-ubuntu-24.04
  title: Ensure apparmor_restrict_unprivileged_unconfined is enabled
  description: By making sure the `kernel.apparmor_restrict_unprivileged_unconfined` sysctl setting is
    enabled, a process that is unprivileged and unconfined cannot leverage `aa-exec` to change to a more
    favourable profile
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.1_3_1_4.audit
  remediation: cis.ubuntu.24.04.v2_0_0.1_3_1_4.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.1_3_1_4.rollback
  verification: cis.ubuntu.24.04.v2_0_0.1_3_1_4.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 1.3.1.4
      url: https://workbench.cisecurity.org/sections/4177272/recommendations/7047680
    assessment_status: automated
    profiles:
    - Level 1 - Server
    - Level 1 - Workstation
    mappings:
      nist: []
      cis_v8:
      - '10.5'
      cis_v7:
      - '8.3'
      mitre_techniques:
      - T1068
      - T1068.000
      mitre_tactics:
      - TA0002
      mitre_mitigations:
      - M1050
    parent: CIS _1_Mandatory Access Control Main | 2.1.1.4-Ensure apparmor_restrict_unprivileged_unconfined
      is enabled
    rationale: "Unprivileged user namespaces are a feature in the Linux kernel that was introduced in\
      \ order to provide additional sandboxing functionality for programs such as container runtimes;\
      \ it enables unprivileged users to gain administrator (root) permissions within a confined environment,\
      \ without giving them elevated permissions on the host system.\r\nHowever, unconfined profiles that\
      \ allow the use of user namespaces provide a trivial bypass of the unprivileged user namespace restriction\
      \ from unconfined processes. All the unconfined application or user has to do is enter the unconfined\
      \ profile. The unconfined user or application can execute the application associated with the unconfined\
      \ profile. If the application provides the ability to run arbitrary code or shell access, that is\
      \ all that needs to be done to bypass the restriction"
    impact: ''
    audit_guidance: "1. Run the following script to verify `kernel.apparmor_restrict_unprivileged_unconfined`\
      \ is set to 1 in the running configuration:\r\n```\r\n#  sysctl kernel.apparmor_restrict_unprivileged_unconfined\
      \ \r\n```\r\nVerify output is:\r\n\r\n```\r\nkernel.apparmor_restrict_unprivileged_unconfined =\
      \ 1\r\n```\r\n\r\n2.  Run the following script to verify `kernel.apparmor_restrict_unprivileged_unconfined`\
      \ is set to `1`in a sysctl conf file being used by systemd sysctl:\r\n\r\n```\r\n#!/usr/bin/env\
      \ bash\r\n\r\n{\r\n   l_parameter_name=\"kernel.apparmor_restrict_unprivileged_unconfined\" l_grep=\"\
      ${l_parameter_name//./\\\\.}\" a_output=()\r\n   l_systemdsysctl=\"$(readlink -e /lib/systemd/systemd-sysctl\
      \ || readlink -e /usr/lib/systemd/systemd-sysctl)\"\r\n   l_ufwscf=\"$([ -f /etc/default/ufw ] &&\
      \ awk -F= '/^\\s*IPT_SYSCTL=/ {print $2}' /etc/default/ufw)\"\r\n   l_opt=\"$(grep -Psoi '^\\h*'\"\
      $l_grep\"'\\h*=\\h*\\H+\\b' \"$l_ufwscf\" | tail -n 1)\"\r\n   l_option_value=\"$(cut -d= -f2 <<<\
      \ \"$l_opt\" | xargs)\"\r\n   [ -n \"$l_option_value\" ] && a_output+=(\" - UFW set: \\\"$l_parameter_name\\\
      \" to: \\\"$l_option_value\\\" in: \\\"$l_file\\\"\")\r\n   while IFS= read -r l_file; do\r\n  \
      \    l_file=\"${l_file//# /}\"\r\n      l_opt=\"$(grep -Psoi '^\\h*'\"$l_grep\"'\\h*=\\h*\\H+\\\
      b' \"$l_file\" | tail -n 1)\"\r\n      l_option_value=\"$(cut -d= -f2 <<< \"$l_opt\" | xargs)\"\r\
      \n      [ -n \"$l_option_value\" ] && a_output+=(\" - \\\"$l_parameter_name\\\" is set to: \\\"\
      $l_option_value\\\" in: \\\"$l_file\\\"\")\r\n   done < <(\"$l_systemdsysctl\" --cat-config | tac\
      \ | grep -Psoi '^\\h*#\\h*\\/[^#\\n\\r\\h]+\\.conf\\b')\r\n   [ \"${#a_output[@]}\" -gt \"0\" ]\
      \ && printf '%s\\n' \"\" \"${a_output[@]}\" \"\"\r\n}\r\n```\r\n\r\n_Example Output_\r\n```\r\n\"\
      kernel.apparmor_restrict_unprivileged_unconfined\" is set to: \"1\" in: \"/etc/sysctl.d/60-kernel_sysctl.conf\"\
      \r\n```\r\n\r\n**Note**:\r\n- If the UFW set value is displayed, and is the correct value, this\
      \ is considered a passing state. If this value is incorrect, it must be updated in the file shown\
      \ in the audit script output.\r\n- If multiple lines are returned:\r\n   - The first line includes\
      \ the value being used by systemd `sysctl`. If this is a correct value, this is considered a passing\
      \ state. If the file listed is not in the `/etc/sysctl.d/` directory, it is highly recommended to\
      \ follow the remediation procedure to create a .conf file in the `/etc/sysctl.d/` directory with\
      \ the correct setting to prevent a potential change due to an update to the system.\r\n   - Any\
      \ files in the `/etc/sysctl.d/` directory that include an incorrect value should be modified to\
      \ correct or comment out the incorrect value to minimize the potential of the incorrect value being\
      \ used by systemd `sysctl` do to system configuration changes."
    remediation_guidance: "1. Set the `kernel.apparmor_restrict_unprivileged_unconfined =` kernel parameter\
      \ to `1` in `/etc/sysctl.conf` or a file in `/etc/sysctl.d/` ending in `.conf`:\r\n\r\n_Example:_\r\
      \n```\r\n# printf \"\\n%s\\n\" \"kernel.apparmor_restrict_unprivileged_unconfined = 1\" >> /etc/sysctl.d/60-kernel_sysctl.conf\r\
      \n```\r\n\r\n2. Run the following command to set the active kernel parameter:\r\n\r\n```\r\n# sysctl\
      \ -w kernel.apparmor_restrict_unprivileged_unconfined=1\r\n```\r\n\r\n3. Run the following command\
      \ to load all system configuration filles:\r\n```\r\n# sysctl --system\r\n```\r\n\r\n**Note:** If\
      \ these settings appear in a canonically later file, or later in the same file, these settings will\
      \ be overwritten"
    additional_information: ''
