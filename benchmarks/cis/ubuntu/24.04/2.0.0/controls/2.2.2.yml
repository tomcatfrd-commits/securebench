    parent: CIS _2_Configure Client Services Main | 2.1.3-Ensure rsh client is not installed
    rationale: These legacy clients contain numerous security exposures and have been replaced with the
      more secure SSH package. Even if the server is removed, it is best to ensure the clients are also
      removed to prevent users from inadvertently attempting to use these commands and therefore exposing
      their credentials. Note that removing the `rsh-client` package removes the clients for `rsh` , `rcp`
      and `rlogin` .
    impact: Many insecure service clients are used as troubleshooting tools and in testing environments.
      Uninstalling them can inhibit capability to test and troubleshoot. If they are required it is advisable
      to remove the clients after use to prevent accidental or intentional misuse.
    audit_guidance: "Verify `rsh-client`  is not installed. Use the following command to provide the needed\
      \ information:\r\n```\r\n# dpkg-query -s rsh-client &>/dev/null && echo \"rsh-client is installed\"\
      \r\n```\r\n\r\nNothing should be returned."
    remediation_guidance: "Uninstall `rsh`:\r\n```\r\n# apt purge rsh-client\r\n```"
