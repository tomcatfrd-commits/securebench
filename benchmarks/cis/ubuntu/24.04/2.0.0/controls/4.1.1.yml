  title: Ensure ufw is installed
  description: The Uncomplicated Firewall (ufw) is a frontend for iptables and is particularly well-suited
    for host-based firewalls. ufw provides a framework for managing netfilter, as well as a command-line
    interface for manipulating the firewall
