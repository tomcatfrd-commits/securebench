    parent: CIS _4_Host Based Firewall Main | 2.1.1.1-Ensure ufw is installed
    rationale: "UFW acts as a frontend for both iptables and nftables and can use either as its backend,\
      \ though the specific backend depends on the Linux distribution and system configuration.\r\n\r\n\
      You can enable the firewall, view its status, and manage rules using simple command-line tools to\
      \ secure your system."
    impact: Changing firewall settings while connected over the network can result in being locked out
      of the system.
    audit_guidance: "Run the following command to verify that Uncomplicated Firewall (UFW) is installed:\r\
      \n\r\n```\r\n# dpkg-query -s ufw &>/dev/null && echo \"ufw is installed\"\r\n\r\nufw is installed\r\
      \n```"
    remediation_guidance: "Run the following command to install Uncomplicated Firewall (UFW):\r\n\r\n\
      ```\r\n# apt install ufw\r\n```"
