control:
  id: CIS-5.3.3.2.5
  benchmark_id: cis-ubuntu-24.04
  title: Ensure password maximum sequential characters is configured
  description: "The `pwquality` `maxsequence` option sets the maximum length of monotonic character sequences\
    \ in the new password. Examples of such sequence are `12345` or `fedcb`. The check is disabled if\
    \ the value is `0`.\r\n\r\n**Note:** Most such passwords will not pass the simplicity check unless\
    \ the sequence is only a minor part of the password."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_3_3_2_5.audit
  remediation: cis.ubuntu.24.04.v2_0_0.5_3_3_2_5.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.5_3_3_2_5.rollback
  verification: cis.ubuntu.24.04.v2_0_0.5_3_3_2_5.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 5.3.3.2.5
      url: https://workbench.cisecurity.org/sections/4177285/recommendations/7047743
    assessment_status: automated
