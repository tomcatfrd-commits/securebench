control:
  id: CIS-6.2.3.6
  benchmark_id: cis-ubuntu-24.04
  title: Ensure events that modify /etc/issue and /etc/issue.net are collected
  description: "Record changes to network environment files or system calls. The files being monitored\
    \ are:\r\n- `/etc/issue` and `/etc/issue.net` - messages displayed pre-login"
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.6_2_3_6.audit
  remediation: cis.ubuntu.24.04.v2_0_0.6_2_3_6.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.6_2_3_6.rollback
  verification: cis.ubuntu.24.04.v2_0_0.6_2_3_6.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 6.2.3.6
      url: https://workbench.cisecurity.org/sections/4203192/recommendations/7091553
    assessment_status: automated
    profiles:
    - Level 2 - Server
    - Level 2 - Workstation
    mappings:
      nist:
      - AU-3
      - CM-6
      cis_v8:
      - '8.5'
      cis_v7:
      - '5.5'
      mitre_techniques:
      - T1562
