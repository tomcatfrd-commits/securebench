      - M1047
    parent: CIS _6_System Auditing Main | 2.2.3.6-Ensure events that modify /etc/issue and /etc/issue.net
      are collected
    rationale: Monitoring `/etc/issue` and `/etc/issue.net` is important, as intruders could put disinformation
      into those files and trick users into providing information to the intruder.
    impact: ''
    audit_guidance: "1. Run the following command to verify a rule exists in the running configuration:\r\
      \n\r\n```\r\n# auditctl -l | grep -Ps -- '^\\h*[^#\\n\\r]+\\h*\\/etc\\/issue'\r\n```\r\n\r\nVerify\
      \ the output includes:\r\n```\r\n-w /etc/issue -p wa -k system-locale\r\n-w /etc/issue.net -p wa\
      \ -k system-locale\r\n```\r\n\r\n2. Run the following command to verify a rule exists in a rules\
      \ file:\r\n```\r\n# grep -Ps -- '^\\h*[^#\\n\\r]+\\h*\\/etc\\/issue' /etc/audit/rules.d/*.rules\r\
      \n```\r\n\r\n_Example output_:\r\n```\r\n/etc/audit/rules.d/50-etc_issue_system_locale.rules:-w\
      \ /etc/issue -p wa -k system-locale\r\n/etc/audit/rules.d/50-etc_issue_system_locale.rules:-w /etc/issue.net\
      \ -p wa -k system-locale\r\n```"
    remediation_guidance: "1. Edit or create a file in the `/etc/audit/rules.d/` directory, ending in\
      \ `.rules` extension, with the relevant rules to monitor events that modify the system's network\
      \ environment.\r\n\r\n_Example_:\r\n```\r\n# printf \"\r\n-w /etc/issue -p wa -k system-locale\r\
      \n-w /etc/issue.net -p wa -k system-locale\r\n\" >> /etc/audit/rules.d/50-etc_issue_system_locale.rules\r\
      \n```\r\n\r\n2. Merge and load the rules into active configuration:\r\n\r\n```\r\n# augenrules --load\r\
      \n```\r\n\r\n3. Check if reboot is required:\r\n```\r\n# if [[ $(auditctl -s | grep \"enabled\"\
      ) =~ \"2\" ]]; then printf \"Reboot required to load rules\\n\"; fi\r\n```"
    additional_information: ''
    default_value: ''
    artifacts_count: 4
    requirements: {}
    safety:
