control:
  id: CIS-5.3.3.1.1
  benchmark_id: cis-ubuntu-24.04
  title: Ensure password failed attempts lockout is configured
  description: The `deny= ` option will deny access if the number of consecutive authentication failures
    for this user during the recent interval exceeds _ _.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_3_3_1_1.audit
  remediation: cis.ubuntu.24.04.v2_0_0.5_3_3_1_1.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.5_3_3_1_1.rollback
  verification: cis.ubuntu.24.04.v2_0_0.5_3_3_1_1.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 5.3.3.1.1
      url: https://workbench.cisecurity.org/sections/4177284/recommendations/7047706
    assessment_status: automated
    profiles:
    - Level 1 - Server
    - Level 1 - Workstation
    mappings:
      nist: []
      cis_v8:
      - '6.2'
      cis_v7:
      - '16.7'
      mitre_techniques:
      - T1110
      - T1110.001
      - T1110.003
      mitre_tactics:
      - TA0006
      mitre_mitigations:
      - M1027
    parent: CIS _5_Pluggable Authentication Modules Main | 2.1.4.1.1-Ensure password failed attempts lockout
      is configured
    rationale: Locking out user IDs after _n_ unsuccessful consecutive login attempts mitigates brute
      force password attacks against your systems.
    impact: ''
    audit_guidance: "Run the following command to verify that Number of failed logon attempts before the\
      \ account is locked is no greater than `5` and meets local site policy:\r\n\r\n```\r\n# grep -Pi\
      \ -- '^\\h*deny\\h*=\\h*[1-5]\\b' /etc/security/faillock.conf\r\n\r\ndeny = 5\r\n```\r\n\r\nRun\
      \ the following command to verify that the `deny` argument has not been set, or `5` or less and\
      \ meets local site policy:\r\n\r\n```\r\n# grep -Pi -- '^\\h*auth\\h+(requisite|required|sufficient)\\\
      h+pam_faillock\\.so\\h+([^#\\n\\r]+\\h+)?deny\\h*=\\h*(0|[6-9]|[1-9][0-9]+)\\b' /etc/pam.d/common-auth\r\
      \n```\r\n\r\nNothing should be returned"
    remediation_guidance: "Create or edit the following line in `/etc/security/faillock.conf` setting\
      \ the `deny` option to `5` or less:\r\n\r\n```\r\ndeny = 5\r\n```\r\n\r\nRun the following command:\r\
      \n\r\n```\r\n# grep -Pl -- '\\bpam_faillock\\.so\\h+([^#\\n\\r]+\\h+)?deny\\b' /usr/share/pam-configs/*\r\
      \n```\r\n\r\nEdit any returned files and remove the `deny= ` arguments from the `pam_faillock.so`\
      \ line(s):"
    additional_information: If a user has been locked out because they have reached the maximum consecutive
      failure count defined by `deny=` in the `pam_faillock.so` module, the user can be unlocked by issuing
      the command `faillock --user --reset`. This command sets the failed count to 0, effectively unlocking
      the user.
    default_value: deny = 3
    artifacts_count: 2
    requirements: {}
    safety:
      default: investigate
      implementation_status: guidance_only
      reason: Imported CIS guidance has not yet been promoted to a reviewed SecureBench implementation.
  dependencies: []
  conflicts: []
