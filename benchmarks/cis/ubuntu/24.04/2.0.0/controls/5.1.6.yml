control:
  id: CIS-5.1.6
  benchmark_id: cis-ubuntu-24.04
  title: Ensure sshd Ciphers are configured
  description: "Secure Shell (SSH) ciphers are encryption algorithms used by the SSH protocol to secure\
    \ data transmitted between a client and a server. They protect the privacy and integrity of the connection,\
    \ using symmetric encryption to encrypt data after a secure session is established. During connection\
    \ setup, the client and server negotiate to select the strongest available cipher that both support,\
    \ ensuring the connection is as secure as possible\r\n\r\nMore information about the openSSH server\
    \ configuration is available in the \"Configure SSH Server\" section overview."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_1_6.audit
  remediation: cis.ubuntu.24.04.v2_0_0.5_1_6.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.5_1_6.rollback
  verification: cis.ubuntu.24.04.v2_0_0.5_1_6.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 5.1.6
      url: https://workbench.cisecurity.org/sections/4177236/recommendations/7047511
    assessment_status: automated
    profiles:
    - Level 1 - Server
    - Level 1 - Workstation
    mappings:
      nist:
      - SC-8
