control:
  id: CIS-6.1.1.1.3
  benchmark_id: cis-ubuntu-24.04
  title: Ensure journald is configured to send logs to rsyslog
  description: Data from `systemd-journald` may be stored in volatile memory or persisted locally on the
    server.  Utilities exist to accept remote export of `systemd-journald` logs, however, use of the `rsyslog`
    service provides a consistent means of log collection and export.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.6_1_1_1_3.audit
