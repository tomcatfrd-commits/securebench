control:
  id: CIS-1.7.7
  benchmark_id: cis-ubuntu-24.04
  title: Ensure Xwayland is configured
  description: Xwayland is a compatibility layer that allows legacy X11 applications to run within a Wayland
    environment. It's effectively an X server that runs as a Wayland client, enabling existing X11 software
    to be displayed on a Wayland compositor.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.1_7_7.audit
  remediation: cis.ubuntu.24.04.v2_0_0.1_7_7.remediate
