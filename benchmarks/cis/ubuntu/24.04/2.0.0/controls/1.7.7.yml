    parent: CIS _1_Configure GNOME Display Manager Main | 1.1.7-Ensure Xwayland is configured
    rationale: "Wayland's security benefits from not relying on X11's network listener. Without X11, there's\
      \ no network listener, making it harder for malicious actors to exploit vulnerabilities in X11.\
      \ However, enabling Xwayland (running X11 applications on Wayland) introduces X11's security concerns.\r\
      \n\r\nAll X vulnerabilities apply to Xwayland, including keylogging, but they only affect X windows\
      \ and interactions with them.\r\n\r\nMalware can potentially exploit Xwayland vulnerabilities to\
      \ keylog or intercept other input events"
    impact: Many applications haven't been ported to Wayland yet, and Xwayland makes it possible to run
      these applications without requiring a full switch back to X11. Disabling Xwayland functionality
      may cause these applications to fail.
    audit_guidance: "Run the following command to verify Xwayland is not enabled:\r\n\r\n```\r\n# sed\
      \ -n '/\\[daemon\\]/,/\\[/p' /etc/gdm/custom.conf | grep -Psi '^\\h*waylandenable\\b'\r\n```\r\n\
      \r\nVerify output includes:\r\n\r\n```\r\nWaylandEnable=false\r\n```"
    remediation_guidance: "Edit the file `/etc/gdm/custom.conf` and uncomment or add the following line\
      \ in the `[daemon]` block:\r\n\r\n```\r\nWaylandEnable=false\r\n```\r\n\r\n_Example:_\r\n\r\n```\r\
      \n# GDM configuration storage\r\n\r\n[daemon]\r\nWaylandEnable=false\r\n\r\n[security]\r\n\r\n[xdmcp]\r\
      \n\r\n[chooser]\r\n\r\n[debug]\r\n# Uncomment the line below to turn on debugging\r\n#Enable=true\r\
      \n```"
    additional_information: ''
    default_value: Enabled
