control:
  id: CIS-5.1.16
  benchmark_id: cis-ubuntu-24.04
  title: Ensure sshd MaxAuthTries is configured
  description: "The `MaxAuthTries` parameter specifies the maximum number of authentication attempts permitted\
    \ per connection. When the login failure count reaches half the number, error messages will be written\
    \ to the `syslog` file detailing the login failure.\r\n\r\nMore information about the openSSH server\
    \ configuration is available in the \"Configure SSH Server\" section overview."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_1_16.audit
  remediation: cis.ubuntu.24.04.v2_0_0.5_1_16.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.5_1_16.rollback
  verification: cis.ubuntu.24.04.v2_0_0.5_1_16.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 5.1.16
      url: https://workbench.cisecurity.org/sections/4177236/recommendations/7047582
    assessment_status: automated
