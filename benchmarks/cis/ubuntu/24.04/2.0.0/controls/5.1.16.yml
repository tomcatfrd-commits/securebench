      mitre_mitigations:
      - M1036
    parent: CIS _5_Configure SSH Server Main | 2.2.17-Ensure sshd MaxAuthTries is configured
    rationale: Setting the `MaxAuthTries` parameter to a low number will minimize the risk of successful
      brute force attacks to the SSH server. While the recommended setting is 4, set the number based
      on site policy.
    impact: ''
    audit_guidance: "Run the following command and verify that `MaxAuthTries` is `4` or less:\r\n\r\n\
      ```\r\n# sshd -T | grep maxauthtries\r\n\r\nmaxauthtries 4\r\n```\r\n\r\n**- IF -** `Match` set\
      \ statements are used in your environment, specify the connection parameters to use for the `-T`\
      \ extended test mode and run the audit to verify the setting is not incorrectly configured in a\
      \ match block\r\n\r\n_Example additional audit needed for a match block for the user `sshuser`:_\r\
      \n\r\n```\r\n# sshd -T -C user=sshuser | grep maxauthtries\r\n```"
    remediation_guidance: "Create or edit a `*.conf` file in the `/etc/ssh/sshd_config.d/` and set the\
      \ `MaxAuthTries` parameter to `4` or less above any `Include` and `Match` entries as follows:\r\n\
      \r\n```\r\nMaxAuthTries 4\r\n```"
    additional_information: ''
    default_value: MaxAuthTries 6
    artifacts_count: 3
    requirements: {}
    safety:
      default: investigate
      implementation_status: guidance_only
      reason: Imported CIS guidance has not yet been promoted to a reviewed SecureBench implementation.
