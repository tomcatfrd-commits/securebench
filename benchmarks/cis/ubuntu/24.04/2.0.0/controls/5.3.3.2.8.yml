      mitre_techniques: []
      mitre_tactics: []
      mitre_mitigations: []
    parent: CIS _5_Pluggable Authentication Modules Main | 2.1.4.2.8-Ensure password quality is enforced
      for the root user
    rationale: "Use of a complex password helps to increase the time and resources required to compromise\
      \ the password. Password complexity, or strength, is a measure of the effectiveness of a password\
      \ in resisting attempts at guessing and brute-force attacks.\r\n\r\nPassword complexity is one factor\
      \ of several that determines how long it takes to crack a password. The more complex the password,\
      \ the greater the number of possible combinations that need to be tested before the password is\
      \ compromised."
    impact: ''
    audit_guidance: "Run the following command to verify that the `enforce_for_root` option is enabled\
      \ in a pwquality configuration file:\r\n\r\n```\r\n# grep -Psi -- '^\\h*enforce_for_root\\b' /etc/security/pwquality.conf\
      \ /etc/security/pwquality.conf.d/*.conf\r\n```\r\n\r\n_Example output:_\r\n\r\n```\r\n/etc/security/pwquality.conf.d/50-pwroot.conf:enforce_for_root\r\
      \n```\r\n\r\n**Note:** \r\n- Settings observe an order of precedence:\r\n  - module arguments override\
      \ the settings in the `/etc/security/pwquality.conf` configuration file\r\n  - settings in the `/etc/security/pwquality.conf`\
      \ configuration file override settings in a `.conf` file in the `/etc/security/pwquality.conf.d/`\
      \ directory\r\n  - settings in a `.conf` file in the `/etc/security/pwquality.conf.d/` directory\
      \ are read in canonical order, with last read file containing the setting taking precedence\r\n\
      - It is recommended that settings be configured in a `.conf` file in the `/etc/security/pwquality.conf.d/`\
      \ directory for clarity, convenience, and durability."
    remediation_guidance: "Edit or add the following line in a `*.conf` file in `/etc/security/pwquality.conf.d`\
      \ or in   `/etc/security/pwquality.conf`:\r\n\r\n_Example:_\r\n\r\n```\r\n#!/usr/bin/env bash\r\n\
      \r\n{\r\n   [ ! -d /etc/security/pwquality.conf.d/ ] && mkdir /etc/security/pwquality.conf.d/\r\n\
      \   printf '\\n%s\\n' \"enforce_for_root\" > /etc/security/pwquality.conf.d/50-pwroot.conf\r\n}\r\
      \n```"
    additional_information: ''
    default_value: disabled
