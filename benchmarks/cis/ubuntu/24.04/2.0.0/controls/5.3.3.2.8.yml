control:
  id: CIS-5.3.3.2.8
  benchmark_id: cis-ubuntu-24.04
  title: Ensure password quality is enforced for the root user
  description: "If the `pwquality` `enforce_for_root` option is enabled, the module will return error\
    \ on failed check even if the user changing the password is root. \r\n\r\nThis option is off by default\
    \ which means that just the message about the failed check is printed but root can change the password\
    \ anyway. \r\n\r\n**Note:** The root is not asked for an old password so the checks that compare the\
    \ old and new password are not performed."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_3_3_2_8.audit
  remediation: cis.ubuntu.24.04.v2_0_0.5_3_3_2_8.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.5_3_3_2_8.rollback
  verification: cis.ubuntu.24.04.v2_0_0.5_3_3_2_8.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 5.3.3.2.8
      url: https://workbench.cisecurity.org/sections/4177285/recommendations/7047762
    assessment_status: automated
    profiles:
    - Level 1 - Server
    - Level 1 - Workstation
    mappings:
      nist:
      - IA-5
      cis_v8:
      - '5.2'
      cis_v7:
