    parent: CIS _4_Host Based Firewall Main | 2.1.1.5-Ensure ufw routed default is configured
    rationale: A default `disabled` or `deny` policy ensures that UFW does not forward traffic between
      different network interfaces by default. This reduces the risk from unwanted or malicious routed
      traffic.
    impact: Any port and protocol will be prevented for being routed.
    audit_guidance: "Run the following command and verify that the default policy for `routed` is `disabled`\
      \ or `deny`:\r\n\r\n```\r\n# ufw status verbose | awk -F',' '$1=\"Default\"{print $3}'\r\n```\r\n\
      \r\n_Example output:_\r\n\r\n```\r\n disabled (routed)\r\n```\r\n\r\n**Important:** Any port and\
      \ protocol will be prevented for being routed."
    remediation_guidance: "Run the following command to set the defalut for `routed` to `disabled`:\r\n\
      \r\n```\r\n# ufw default disabled routed\r\n```"
    additional_information: ''
    default_value: disabled
