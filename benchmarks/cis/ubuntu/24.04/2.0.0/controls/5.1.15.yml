control:
  id: CIS-5.1.15
  benchmark_id: cis-ubuntu-24.04
  title: Ensure sshd MACs are configured
  description: "This variable limits the types of MAC algorithms that SSH can use during communication.\r\
    \n\r\nMore information about the openSSH server configuration is available in the \"Configure SSH\
    \ Server\" section overview."
  platform: ubuntu-24.04
