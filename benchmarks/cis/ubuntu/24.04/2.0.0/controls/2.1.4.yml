control:
  id: CIS-2.1.4
  benchmark_id: cis-ubuntu-24.04
  title: Ensure only approved services are listening on a network interface
  description: "A network port is identified by its number, the associated IP address, and the type of\
    \ the communication protocol such as TCP or UDP.\r\n\r\nA listening port is a network port on which\
    \ an application or process listens on, acting as a communication endpoint.\r\n\r\nEach listening\
    \ port can be open or closed (filtered) using a firewall. In general terms, an open port is a network\
    \ port that accepts incoming packets from remote locations."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.2_1_4.audit
  remediation: cis.ubuntu.24.04.v2_0_0.2_1_4.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.2_1_4.rollback
  verification: cis.ubuntu.24.04.v2_0_0.2_1_4.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 2.1.4
      url: https://workbench.cisecurity.org/sections/4177245/recommendations/7047504
    assessment_status: manual
    profiles:
    - Level 1 - Server
    - Level 1 - Workstation
    mappings:
      nist:
      - CM-7
      cis_v8:
      - '4.8'
      cis_v7:
      - '9.2'
      mitre_techniques:
      - T1203
      - T1203.000
