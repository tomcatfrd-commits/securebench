      mitre_mitigations:
      - M1042
    parent: CIS _2_Configure Server Services Main | 2.1.4-Ensure only approved services are listening
      on a network interface
    rationale: Services listening on the system pose a potential risk as an attack vector.  These services
      should be reviewed, and if not required, the service should be stopped, and the package containing
      the service should be removed.  If required packages have a dependency, the service should be stopped
      and masked to reduce the attack surface of the system.
    impact: "There may be packages that are dependent on the service's package.  If the service's package\
      \ is removed, these dependent packages will be removed as well. Before removing the service's package,\
      \ review any dependent packages to determine if they are required on the system.\r\n\r\n**- IF -**\
      \ a dependent package is required: stop and mask the ` .socket` and ` .service`  leaving the service's\
      \ package installed."
    audit_guidance: "Run the following command:\r\n\r\n```\r\n# ss -plntu\r\n```\r\n\r\nReview the output\
      \ to ensure:\r\n- All services listed are required on the system and approved by local site policy.\
      \ \r\n- Both the port and interface the service is listening on are approved by local site policy.\r\
      \n- If a listed service is not required:\r\n  - Remove the package containing the service\r\n  -\
      \ **- IF -** the service's package is required for a dependency, stop and mask the service and/or\
      \ socket"
    remediation_guidance: "Run the following commands to stop the service and remove the package containing\
      \ the service:\r\n\r\n```\r\n# systemctl stop .socket .service\r\n# apt purge ```\r\n\r\n**- OR\
      \ -** If required packages have a dependency:\r\n\r\nRun the following commands to stop and mask\
      \ the service and socket:\r\n\r\n```\r\n# systemctl stop .socket .service\r\n# systemctl mask .socket\
      \ .service\r\n```\r\n\r\n**Note:** replace ` ` with the appropriate service name."
    additional_information: ''
    default_value: ''
    artifacts_count: 0
    requirements: {}
    safety:
      default: investigate
