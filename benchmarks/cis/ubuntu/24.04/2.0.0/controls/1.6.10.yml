    parent: CIS _1_Configure Command Line Warning Banners Main | 1.2.10-Ensure access to sshd warning
      banner is configured
    rationale: If the sshd warning banner file does not have correct access permissions, it could be modified
      by unauthorized users to present incorrect or misleading content. An attacker who can write to the
      banner file could remove legal warning language required for compliance, or inject content designed
      to mislead users. The file should be owned by `root:root` and not writable by group or others.
    impact: No operational impact. Tightening permissions on the banner file to `root:root 644` does not
      affect SSH connectivity or authentication.
    audit_guidance: "Run the following command and verify the sshd warning banner file access is `644`\
      \ or more restrictive, `Uid` and `Gid` are both `0/root`:\r\n```\r\n# banner=$(sshd -T | grep -Pi\
      \ -- '^banner\\h+\\/\\H+') && stat -Lc 'Access: (%#a/%A)  Uid: ( %u/ %U) Gid: { %g/ %G)' $banner\
      \ 2>/dev/null\r\n```\r\n\r\nVerify output includes:\r\n\r\n```\r\nAccess: (0644/-rw-r--r--)  Uid:\
      \ ( 0/ root) Gid: ( 0/ root)\r\n  -- OR --\r\nNothing is returned\r\n```\r\n\r\nIf no output is\
      \ returned, the `Banner` directive is not set — verify rule 1.6.5 (Ensure sshd Banner is configured)\
      \ is also addressed."
    remediation_guidance: "Run the following commands to set the correct owner and permissions on the\
      \ configured banner file. Replace ` ` with the actual path returned by `sshd -T | grep banner`:\r\
      \n\r\n```\r\n# chown root:root # chmod u-x,go-wx ```\r\n\r\nExample using the default banner path:\r\
      \n\r\n```\r\n# chown root:root /etc/issue.net\r\n# chmod 644 /etc/issue.net\r\n```"
    additional_information: ''
    default_value: ''
