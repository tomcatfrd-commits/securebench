    parent: CIS _5_Configure shadow password suite parameters Main | 1.1.1.1-Ensure password expiration
      is configured
    rationale: "The window of opportunity for an attacker to leverage compromised credentials or successfully\
      \ compromise credentials via an online brute force attack is limited by the age of the password.\
      \ Therefore, reducing the maximum age of a password also reduces an attacker's window of opportunity.\r\
      \n\r\nWe recommend a yearly password change. This is primarily because for all their good intentions\
      \ users will share credentials across accounts. Therefore, even if a breach is publicly identified,\
      \ the user may not see this notification, or forget they have an account on that site. This could\
      \ leave a shared credential vulnerable indefinitely. Having an organizational policy of a 1-year\
      \ (annual) password expiration is a reasonable compromise to mitigate this with minimal user burden."
    impact: "The password expiration must be greater than the minimum days between password changes or\
      \ users will be unable to change their password.\r\n\r\nExcessive password expiration requirements\
      \ do more harm than good, because these requirements make users select predictable passwords, composed\
      \ of sequential words and numbers that are closely related to each other. In these cases, the next\
      \ password can be predicted based on the previous one (incrementing a number used in the password\
      \ for\r\nexample). Also, password expiration requirements offer no containment benefits because\
      \ attackers will often use credentials as soon as they compromise them. Instead, immediate password\
      \ changes should be based on key events including, but not limited to:\r\n- Indication of compromise\r\
      \n- Change of user roles\r\n- When a user leaves the organization.\r\n\r\nNot only does changing\
      \ passwords every few weeks or months frustrate the user, but it’s also been suggested that it does\
      \ more harm than good, because it could lead to bad practices by the user such as adding a character\
      \ to the end of their existing password."
    audit_guidance: "Run the following command and verify `PASS_MAX_DAYS` is set to 365 days or less and\
      \ conforms to local site policy:\r\n\r\n```\r\n# grep -Pi -- '^\\h*PASS_MAX_DAYS\\h+\\d+\\b' /etc/login.defs\r\
      \n```\r\n\r\n_Example output:_\r\n\r\n```\r\nPASS_MAX_DAYS 365\r\n```\r\n\r\nRun the following command\
      \ to verify all `/etc/shadow` passwords `PASS_MAX_DAYS`:\r\n- is greater than `0` days\r\n- is less\
      \ than or equal to `365` days\r\n- conforms to local site policy\r\n\r\n```\r\n# awk -F: '($2~/^\\\
      $.+\\$/) {if($5 > 365 || $5 < 1)print \"User: \" $1 \" PASS_MAX_DAYS: \" $5}' /etc/shadow\r\n```\r\
      \n\r\nNothing should be returned"
    remediation_guidance: "Set the `PASS_MAX_DAYS` parameter to conform to site policy in `/etc/login.defs`\
      \ :\r\n\r\n```\r\nPASS_MAX_DAYS 365\r\n```\r\n\r\nModify user parameters for all users with a password\
      \ set to match:\r\n\r\n```\r\n# chage --maxdays 365 ```\r\n\r\nEdit `/etc/login.defs` and set `PASS_MAX_DAYS`\
      \ to a value greater than `0` that follows local site policy:\r\n\r\n_Example:_\r\n\r\n```\r\nPASS_MAX_DAYS\
      \ 365\r\n```\r\n\r\nRun the following command to modify user parameters for all users with a password\
      \ set to a maximum age no greater than `365` or less than `1` that follows local site policy:\r\n\
      \r\n```\r\n# chage --maxdays ```\r\n\r\n_Example:_\r\n\r\n```\r\n# awk -F: '($2~/^\\$.+\\$/) {if($5\
      \ > 365 || $5 < 1)system (\"chage --maxdays 365 \" $1)}' /etc/shadow\r\n```\r\n\r\n**Warning:**\
      \ If a password has been set at system install or kickstart, the `last change date` field is not\
      \ set, In this case, setting `PASS_MAX_DAYS` will immediately expire the password. One possible\
      \ solution is to populate the `last change date` field through a command like: `chage -d \"$(date\
      \ +%Y-%m-%d)\" root`"
    additional_information: A value of -1 will disable password expiration.
    default_value: PASS_MAX_DAYS 99999
    artifacts_count: 3
