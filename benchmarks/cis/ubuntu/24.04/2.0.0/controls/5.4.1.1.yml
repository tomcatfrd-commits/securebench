control:
  id: CIS-5.4.1.1
  benchmark_id: cis-ubuntu-24.04
  title: Ensure password expiration is configured
  description: "The `PASS_MAX_DAYS` parameter in `/etc/login.defs` allows an administrator to force passwords\
    \ to expire once they reach a defined age.\r\n\r\n`PASS_MAX_DAYS` _ _ - The maximum number of days\
    \ a password may be used. If the password is older than this, a password change will be forced. If\
    \ not specified, -1 will be assumed (which disables the restriction)."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_4_1_1.audit
  remediation: cis.ubuntu.24.04.v2_0_0.5_4_1_1.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.5_4_1_1.rollback
  verification: cis.ubuntu.24.04.v2_0_0.5_4_1_1.verify
  rollback_capability: unsupported
