    parent: CIS _5_Configure SSH Server Main | 2.2.8-Ensure sshd ClientAliveInterval and ClientAliveCountMax
      are configured
    rationale: "In order to prevent resource exhaustion, appropriate values should be set for both `ClientAliveInterval`\
      \ and `ClientAliveCountMax`. Specifically, looking at the source code, `ClientAliveCountMax` must\
      \ be greater than zero in order to utilize the ability of SSH to drop idle connections. If connections\
      \ are allowed to stay open indefinitely, this can potentially be used as a DDOS attack or simple\
      \ resource exhaustion could occur over unreliable networks.\r\n\r\nThe example set here is a 45\
      \ second timeout. Consult your site policy for network timeouts and apply as appropriate."
    impact: ''
    audit_guidance: "Run the following command and verify `ClientAliveInterval` and `ClientAliveCountMax`\
      \ are greater than zero:\r\n\r\n```\r\n# sshd -T | grep -Pi -- '(clientaliveinterval|clientalivecountmax)'\r\
      \n```\r\n\r\n_Example Output:_\r\n\r\n```\r\nclientaliveinterval 15\r\nclientalivecountmax 3\r\n\
      ```\r\n\r\n**- IF -** `Match` set statements are used in your environment, specify the connection\
      \ parameters to use for the `-T` extended test mode and run the audit to verify the setting is not\
      \ incorrectly configured in a match block\r\n\r\n_Example additional audit needed for a match block\
      \ for the user `sshuser`:_\r\n\r\n```\r\n# sshd -T -C user=sshuser | grep -Pi -- '(clientaliveinterval|clientalivecountmax)'\r\
      \n```\r\n\r\n**Note:** If provided, any Match directives in the configuration file that would apply\
      \ are applied before the configuration is written to standard output. The connection parameters\
      \ are supplied as keyword=value pairs and may be supplied in any order, either with multiple `-C`\
      \ options or as a comma-separated list. The keywords are `addr` (source address), `user` (user),\
      \ `host` (resolved source host name), `laddr` (local address), `lport` (local port number), and\
      \ `rdomain` (routing domain)."
    remediation_guidance: "Create or edit a `*.conf` file in the `/etc/ssh/sshd_config.d/` and set the\
      \ `ClientAliveInterval` and `ClientAliveCountMax` parameters above any `Include` and `Match` entries\
      \ according to site policy. \r\n\r\n_Example:_\r\n\r\n```\r\nClientAliveInterval 15\r\nClientAliveCountMax\
      \ 3\r\n```"
    additional_information: "https://bugzilla.redhat.com/show_bug.cgi?id=1873547\r\n\r\nhttps://github.com/openssh/openssh-portable/blob/V_8_9/serverloop.c#L137"
    default_value: "ClientAliveInterval 0\r\n\r\nClientAliveCountMax 3"
