control:
  id: CIS-5.1.7
  benchmark_id: cis-ubuntu-24.04
  title: Ensure sshd ClientAliveInterval and ClientAliveCountMax are configured
  description: ">**Note:** To clarify, the two settings described below are only meant for idle connections\
    \ from a protocol perspective and are not meant to check if the user is active or not. An idle user\
    \ does not mean an idle connection. SSH does not and never had, intentionally, the capability to drop\
    \ idle users. In SSH versions before `8.2p1` there was a bug that caused these values to behave in\
    \ such a manner that they were abused to disconnect idle users. This bug has been resolved in `8.2p1`\
    \ and thus it can no longer be abused disconnect idle users.\r\n\r\nThe two options `ClientAliveInterval`\
    \ and `ClientAliveCountMax` control the timeout of SSH sessions. Taken directly from `man 5 sshd_config`:\r\
    \n\r\n- `ClientAliveInterval` Sets a timeout interval in seconds after which if no data has been received\
    \ from the client, sshd(8) will send a message through the encrypted channel to request a response\
    \ from the client. The default is 0, indicating that these messages will not be sent to the client.\r\
    \n\r\n- `ClientAliveCountMax` Sets the number of client alive messages which may be sent without sshd(8)\
    \ receiving any messages back from the client. If this threshold is reached while client alive messages\
    \ are being sent, sshd will disconnect the client, terminating the session.  It is important to note\
    \ that the use of client alive messages is very different from TCPKeepAlive. The client alive messages\
    \ are sent through the encrypted channel and therefore will not be spoofable. The TCP keepalive option\
    \ en‐abled by TCPKeepAlive is spoofable. The client alive mechanism is valuable when the client or\
    \ server depend on knowing when a connection has become unresponsive.\r\nThe default value is 3. If\
    \ ClientAliveInterval is set to 15, and ClientAliveCountMax is left at the default, unresponsive SSH\
    \ clients will be disconnected after approximately 45 seconds. Setting a zero ClientAliveCountMax\
    \ disables connection termination.\r\n\r\nMore information about the openSSH server configuration\
    \ is available in the \"Configure SSH Server\" section overview."
