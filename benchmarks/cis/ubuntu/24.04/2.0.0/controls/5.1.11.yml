    impact: ''
    audit_guidance: "Run the following command to verify `IgnoreRhosts` is set to `yes`:\r\n\r\n```\r\n\
      # sshd -T | grep ignorerhosts\r\n\r\nignorerhosts yes\r\n```"
    remediation_guidance: "Create or edit a `*.conf` file in the `/etc/ssh/sshd_config.d/` and set the\
      \ `IgnoreRhosts` parameter to `yes` above any `Include` entry as follows:\r\n\r\n```\r\nIgnoreRhosts\
      \ yes\r\n```"
