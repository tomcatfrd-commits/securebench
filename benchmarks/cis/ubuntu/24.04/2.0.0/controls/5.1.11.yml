  title: Ensure sshd IgnoreRhosts is enabled
  description: "The `IgnoreRhosts` parameter specifies that `.rhosts` and `.shosts` files will not be\
    \ used in `RhostsRSAAuthentication` or `HostbasedAuthentication`.\r\n\r\nMore information about the\
    \ openSSH server configuration is available in the \"Configure SSH Server\" section overview."
