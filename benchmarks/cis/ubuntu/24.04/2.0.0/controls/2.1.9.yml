  benchmark_id: cis-ubuntu-24.04
  title: Ensure dnsmasq services are not in use
  description: '`dnsmasq` is a lightweight tool that provides DNS caching, DNS forwarding and DHCP (Dynamic
    Host Configuration Protocol) services.'
  platform: ubuntu-24.04
  severity: unspecified
