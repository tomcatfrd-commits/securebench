    parent: CIS _7_System File Permissions Main | 2.1.10-Ensure access to /etc/security/opasswd is configured
    rationale: It is critical to ensure that `/etc/security/opasswd` is protected from unauthorized access.
      Although it is protected by default, the file permissions could be changed either inadvertently
      or through malicious actions.
    impact: ''
    audit_guidance: "Run the following commands to verify `/etc/security/opasswd` and `/etc/security/opasswd.old`\
      \ are mode 600 or more restrictive, `Uid` is `0/root` and `Gid` is `0/root` if they exist:\r\n\r\
      \n```\r\n#  [ -e \"/etc/security/opasswd\" ] && stat -Lc '%n Access: (%#a/%A)  Uid: ( %u/ %U) Gid:\
      \ ( %g/ %G)' /etc/security/opasswd\r\n\r\n/etc/security/opasswd Access: (0600/-rw-------)  Uid:\
      \ ( 0/ root) Gid: ( 0/ root)\r\n -OR-\r\nNothing is returned\r\n```\r\n\r\n```\r\n#  [ -e \"/etc/security/opasswd.old\"\
      \ ] && stat -Lc '%n Access: (%#a/%A)  Uid: ( %u/ %U) Gid: ( %g/ %G)' /etc/security/opasswd.old\r\
      \n\r\n/etc/security/opasswd.old Access: (0600/-rw-------)  Uid: ( 0/ root) Gid: ( 0/ root)\r\n -OR-\r\
      \nNothing is returned\r\n```"
    remediation_guidance: "Run the following commands to remove excess permissions, set owner, and set\
      \ group on `/etc/security/opasswd` and `/etc/security/opasswd.old` is they exist:\r\n\r\n```\r\n\
      # [ -e \"/etc/security/opasswd\" ] && chmod u-x,go-rwx /etc/security/opasswd\r\n# [ -e \"/etc/security/opasswd\"\
      \ ] && chown root:root /etc/security/opasswd\r\n# [ -e \"/etc/security/opasswd.old\" ] && chmod\
      \ u-x,go-rwx /etc/security/opasswd.old\r\n# [ -e \"/etc/security/opasswd.old\" ] && chown root:root\
      \ /etc/security/opasswd.old\r\n```"
    additional_information: ''
    default_value: '/etc/security/opasswd Access: (0600/-rw-------)  Uid: ( 0/ root) Gid: ( 0/ root)'
