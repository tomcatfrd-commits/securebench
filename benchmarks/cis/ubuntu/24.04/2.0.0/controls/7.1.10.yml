  title: Ensure access to /etc/security/opasswd is configured
  description: '`/etc/security/opasswd` and it''s backup `/etc/security/opasswd.old` hold user''s previous
    passwords if `pam_unix` or `pam_pwhistory` is in use on the system'
  platform: ubuntu-24.04
