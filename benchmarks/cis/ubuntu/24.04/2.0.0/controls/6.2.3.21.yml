control:
  id: CIS-6.2.3.21
  benchmark_id: cis-ubuntu-24.04
  title: Ensure login and logout events are collected
  description: "Monitor login and logout events. The parameters below track changes to files associated\
    \ with login/logout events.\r\n- `/var/log/lastlog` - maintain records of the last time a user successfully\
    \ logged in. \r\n- `/var/run/faillock` - directory maintains records of login failures via the `pam_faillock`\
    \ module."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.6_2_3_21.audit
  remediation: cis.ubuntu.24.04.v2_0_0.6_2_3_21.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.6_2_3_21.rollback
  verification: cis.ubuntu.24.04.v2_0_0.6_2_3_21.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 6.2.3.21
      url: https://workbench.cisecurity.org/sections/4203192/recommendations/7091568
    assessment_status: automated
    profiles:
    - Level 2 - Server
    - Level 2 - Workstation
    mappings:
      nist:
      - AU-3
      cis_v8:
      - '8.5'
      cis_v7:
      - '4.9'
      - '16.11'
