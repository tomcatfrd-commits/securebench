    parent: CIS _6_System Auditing Main | 2.2.3.21-Ensure login and logout events are collected
    rationale: Monitoring login/logout events could provide a system administrator with information associated
      with brute force attacks against user logins.
    impact: ''
    audit_guidance: "1. Run the following command to verify a rule exists in the running configuration:\r\
      \n\r\n```\r\n# auditctl -l | grep -Ps -- '(lastlog|faillock)'\r\n```\r\n\r\nVerify the output matches:\r\
      \n\r\n```\r\n-w /var/log/lastlog -p wa -k logins\r\n-w /var/run/faillock -p wa -k logins\r\n```\r\
      \n\r\n2. Run the following command to verify a rule exists in a rules file:\r\n\r\n```\r\n# grep\
      \ -Ps -- '(lastlog|faillock)' /etc/audit/rules.d/*.rules\r\n```\r\n\r\n_Example output_:\r\n\r\n\
      ```\r\n/etc/audit/rules.d/50-login.rules:-w /var/log/lastlog -p wa -k logins\r\n/etc/audit/rules.d/50-login.rules:-w\
      \ /var/run/faillock -p wa -k logins\r\n```"
    remediation_guidance: "1. Edit or create a file in the `/etc/audit/rules.d/` directory, ending in\
      \ `.rules` extension, with the relevant rules to monitor login and logout events.\r\n\r\n_Example:_\r\
      \n\r\n```\r\n# printf \"\r\n-w /var/log/lastlog -p wa -k logins\r\n-w /var/run/faillock -p wa -k\
      \ logins\r\n\" >> /etc/audit/rules.d/50-login.rules\r\n```\r\n\r\n2. Merge and load the rules into\
      \ active configuration:\r\n\r\n```\r\n# augenrules --load\r\n```\r\n\r\n3. Check if reboot is required:\r\
      \n\r\n```\r\n# if [[ $(auditctl -s | grep \"enabled\") =~ \"2\" ]]; then printf \"Reboot required\
      \ to load rules\\n\"; fi\r\n```"
    additional_information: ''
    default_value: ''
    artifacts_count: 4
    requirements: {}
    safety:
