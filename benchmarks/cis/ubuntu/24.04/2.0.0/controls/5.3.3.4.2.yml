control:
  id: CIS-5.3.3.4.2
  benchmark_id: cis-ubuntu-24.04
  title: Ensure pam_unix does not include remember
  description: The `remember=n` argument saves the last n passwords for each user in `/etc/security/opasswd`
    in order to force password change history and keep the user from alternating between the same password
    too frequently. The MD5 password hash algorithm is used for storing the old passwords. Instead of
    this option the `pam_pwhistory` module should be used. The `pam_pwhistory` module saves the last n
    passwords for each user in `/etc/security/opasswd` using the password hash algorithm set on the `pam_unix`
    module. This allows for the `yescrypt` or `sha512` hash algorithm to be used.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_3_3_4_2.audit
  remediation: cis.ubuntu.24.04.v2_0_0.5_3_3_4_2.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.5_3_3_4_2.rollback
  verification: cis.ubuntu.24.04.v2_0_0.5_3_3_4_2.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 5.3.3.4.2
      url: https://workbench.cisecurity.org/sections/4177293/recommendations/7047776
    assessment_status: automated
    profiles:
    - Level 1 - Server
    - Level 1 - Workstation
    mappings:
      nist: []
      cis_v8:
      - '5.2'
      cis_v7:
      - '4.4'
      mitre_techniques:
      - T1003
      - T1003.008
