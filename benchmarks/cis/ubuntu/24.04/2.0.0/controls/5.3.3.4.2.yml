      mitre_mitigations:
      - M1041
    parent: CIS _5_Pluggable Authentication Modules Main | 2.1.4.5.2-Ensure pam_unix does not include
      remember
    rationale: The `remember=n` argument should be removed to ensure a strong password hashing algorithm
      is being used. A stronger hash provides additional protection to the system by increasing the level
      of effort needed for an attacker to successfully determine local user's old passwords stored in
      `/etc/security/opasswd`.
    impact: ''
    audit_guidance: "Run the following command to verify that the `remember` argument is not set on the\
      \ `pam_unix.so` module:\r\n\r\n```\r\n# grep -PHs -- '^\\h*^\\h*[^#\\n\\r]+\\h+pam_unix\\.so\\h+([^#\\\
      n\\r]+\\h+)?remember=\\d+\\b' /etc/pam.d/common-{password,auth,account,session,session-noninteractive}\r\
      \n```\r\n\r\nNothing should be returned"
    remediation_guidance: "Run the following command:\r\n\r\n```\r\n# grep -PH -- '^\\h*([^#\\n\\r]+\\\
      h+)?pam_unix\\.so\\h+([^#\\n\\r]+\\h+)?remember\\b' /usr/share/pam-configs/*\r\n```\r\n\r\nEdit\
      \ any files returned and remove the `remember=_ _` argument for the `pam_unix` lines\r\n\r\n_Example\
      \ output:_\r\n\r\n```\r\n[success=end default=ignore]   pam_unix.so obscure use_authtok try_first_pass\
      \ yescrypt remember=5 # **<- remove remember= **\r\n[success=end default=ignore]   pam_unix.so obscure\
      \ yescrypt remember=5 # **<- remove remember= **\r\n\r\n```\r\n\r\nRun the following command to\
      \ update the files in the `/etc/pam.d/` directory:\r\n\r\n```\r\n# pam-auth-update --enable ```\r\
      \n\r\n_Example:_\r\n\r\n```\r\n# pam-auth-update --enable unix\r\n```\r\n\r\n**Note:** If custom\
      \ files are being used, the corresponding files in `/etc/pam.d/` would need to be edited directly,\
      \ and the `pam-auth-update --enable ` command skipped"
    additional_information: ''
    default_value: ''
    artifacts_count: 1
    requirements: {}
    safety:
