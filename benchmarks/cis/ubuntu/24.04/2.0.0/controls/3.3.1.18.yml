control:
  id: CIS-3.3.1.18
  benchmark_id: cis-ubuntu-24.04
  title: Ensure net.ipv4.tcp_syncookies is configured
  description: "When `tcp_syncookies` is set, the kernel will handle TCP SYN packets normally until the\
    \ half-open connection queue is full, at which time, the SYN cookie functionality kicks in. SYN cookies\
    \ work by not using the SYN queue at all. Instead, the kernel simply replies to the SYN with a SYN/ACK,\
    \ but will include a specially crafted TCP sequence number that encodes the source and destination\
    \ IP address and port number and the time the packet was sent. A legitimate connection would send\
    \ the ACK packet of the three way handshake with the specially crafted sequence number. This allows\
    \ the system to verify that it has received a valid response to a SYN cookie and allow the connection,\
    \ even though there is no corresponding SYN in the queue.\r\n\r\nMore information about the kernel\
    \ parameter configuration files, their location, and load preference is available in the \"Configure\
    \ Network Kernel Parameters\" section overview."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.3_3_1_18.audit
  remediation: cis.ubuntu.24.04.v2_0_0.3_3_1_18.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.3_3_1_18.rollback
  verification: cis.ubuntu.24.04.v2_0_0.3_3_1_18.verify
  rollback_capability: unsupported
