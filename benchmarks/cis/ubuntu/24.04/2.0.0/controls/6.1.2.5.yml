    parent: CIS _6_System Logging Main | 2.2.2.5-Ensure rsyslog is configured to send logs to a remote
      log host
    rationale: Storing log data on a remote host protects log integrity from local attacks. If an attacker
      gains root access on the local system, they could tamper with or remove log data that is stored
      on the local system.
    impact: ''
    audit_guidance: "Review the `/etc/rsyslog.conf` and `/etc/rsyslog.d/*.conf` files and verify that\
      \ logs are sent to a central host:\r\n\r\n**basic format**\r\n\r\n```\r\n# grep \"^*.*[^I][^I]*@\"\
      \ /etc/rsyslog.conf /etc/rsyslog.d/*.conf\r\n```\r\n\r\nOutput should include `@@ `:\r\n\r\n_Example:_\r\
      \n```\r\n*.* @@loghost.example.com\r\n```\r\n\r\n**advanced format**\r\n\r\n```\r\n# grep -Psi --\
      \ '^\\s*([^#]+\\s+)?action\\(([^#]+\\s+)?\\btarget=\\\"?[^#\"]+\\\"?\\b' /etc/rsyslog.conf /etc/rsyslog.d/*.conf\r\
      \n```\r\n\r\nOutput should include `target= `:\r\n\r\n_Example:_\r\n```\r\n*.* action(type=\"omfwd\"\
      \ target=\"loghost.example.com\" port=\"514\" protocol=\"tcp\"\r\n```"
    remediation_guidance: "Edit the `/etc/rsyslog.conf` and `/etc/rsyslog.d/*.conf` files and add the\
      \ following line (where `loghost.example.com` is the name of your central log host). The `target`\
      \ directive may either be a fully qualified domain name or an IP address.\r\n\r\n_Example:_\r\n\
      ```\r\n*.* action(type=\"omfwd\" target=\"loghost.example.com\" port=\"514\" protocol=\"tcp\"\r\n\
      \           action.resumeRetryCount=\"100\"\r\n           queue.type=\"LinkedList\" queue.size=\"\
      1000\")\r\n```\r\n\r\nRun the following command to reload `rsyslog.service`:\r\n\r\n```\r\n# systemctl\
      \ reload-or-restart rsyslog.service\r\n```"
    additional_information: In addition, see the [rsyslog documentation](https://www.rsyslog.com/doc/master/tutorials/tls.html)
      for implementation details of TLS.
