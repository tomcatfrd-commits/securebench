control:
  id: CIS-6.1.2.5
  benchmark_id: cis-ubuntu-24.04
  title: Ensure rsyslog is configured to send logs to a remote log host
  description: '`rsyslog` supports the ability to send log events it gathers to a remote log host or to
    receive messages from remote hosts, thus enabling centralized log management.'
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.6_1_2_5.audit
  remediation: cis.ubuntu.24.04.v2_0_0.6_1_2_5.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.6_1_2_5.rollback
