  verification: cis.ubuntu.24.04.v2_0_0.5_1_9.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 5.1.9
      url: https://workbench.cisecurity.org/sections/4177236/recommendations/7047536
    assessment_status: automated
