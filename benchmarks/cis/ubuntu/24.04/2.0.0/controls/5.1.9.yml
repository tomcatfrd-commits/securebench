control:
  id: CIS-5.1.9
  benchmark_id: cis-ubuntu-24.04
  title: Ensure sshd GSSAPIAuthentication is disabled
  description: "The `GSSAPIAuthentication` parameter specifies whether user authentication based on GSSAPI\
    \ is allowed\r\n\r\nMore information about the openSSH server configuration is available in the \"\
    Configure SSH Server\" section overview."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_1_9.audit
  remediation: cis.ubuntu.24.04.v2_0_0.5_1_9.remediate
