    parent: CIS _5_Configure SSH Server Main | 2.2.10-Ensure sshd GSSAPIAuthentication is disabled
    rationale: Allowing GSSAPI authentication through SSH exposes the system's GSSAPI to remote hosts,
      and should be disabled to reduce the attack surface of the system
    impact: Disabling GSSAPI authentication in environments that rely on centralized authentication could
      disrupt legitimate access.
    audit_guidance: "Run the following command to verify `GSSAPIAuthentication` is set to `no`:\r\n\r\n\
      ```\r\n# sshd -T | grep gssapiauthentication\r\n\r\ngssapiauthentication no\r\n```\r\n\r\n**- IF\
      \ -** `Match` set statements are used in your environment, specify the connection parameters to\
      \ use for the `-T` extended test mode and run the audit to verify the setting is not incorrectly\
      \ configured in a match block\r\n\r\n_Example additional audit needed for a match block for the\
      \ user `sshuser`:_\r\n\r\n```\r\n# sshd -T -C user=sshuser | grep gssapiauthentication\r\n```"
    remediation_guidance: "Create or edit a `*.conf` file in the `/etc/ssh/sshd_config.d/` and set the\
      \ `GSSAPIAuthentication` parameter to `no` above any `Include` and `Match` entries as follows:\r\
      \n\r\n```\r\nGSSAPIAuthentication no\r\n```"
    additional_information: ''
    default_value: GSSAPIAuthentication no
    artifacts_count: 3
    requirements: {}
    safety:
      default: investigate
      implementation_status: guidance_only
      reason: Imported CIS guidance has not yet been promoted to a reviewed SecureBench implementation.
