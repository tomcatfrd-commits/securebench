    rationale: Setting a secure value for `umask` ensures that users make a conscious choice about their
      file permissions. A permissive `umask` value could result in directories or files with excessive
      permissions that can be read and/or written to by unauthorized users.
    impact: ''
    audit_guidance: "Run the following command to verify that the `root` user files, `/root/.profile`\
      \ and `/root/.bashrc`, do not include a `umask` that is less restrictive than `0027`:\r\n\r\n```\r\
      \n# grep -Psi -- '^\\h*umask\\h+((\\d{1,2}(\\d[^7]|[^2-7]\\d)\\b)|(u=[rwx]{1,3},)?(((g=[rx]?[rx]?w[rx]?[rx]?\\\
      b)(,o=[rwx]{1,3})?)|((g=[wrx]{1,3},)?o=[wrx]{1,3}\\b)))' /root/.profile /root/.bashrc\r\n```\r\n\
      \r\nNothing should be returned."
    remediation_guidance: "Edit `/root/.profile` and `/root/.bashrc` and either:\r\n- remove, comment\
      \ out, or update any line with `umask`.\r\n\r\n**- OR -**\r\n- update any line that includes `umask`\
      \ to a value of `0027` or more restrictive.\r\n\r\n_Example:_\r\n\r\n```\r\numask 027\r\n```\r\n\
      \r\n**Note:** the Recommendation \"Ensure default user umask is configured\" includes guidance to\
      \ set the default umask"
