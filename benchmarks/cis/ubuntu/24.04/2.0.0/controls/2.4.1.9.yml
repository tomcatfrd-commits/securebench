    parent: CIS _2_Configure cron Main | 1.1.2.9-Ensure access to crontab is configured
    rationale: On many systems, only the system administrator is authorized to schedule `cron` jobs. Using
      the `cron.allow` file to control who can run `cron` jobs enforces this policy. It is easier to manage
      an allow list than a deny list. In a deny list, you could potentially add a user ID to the system
      and forget to add it to the deny files.
    impact: When the `/etc/cron.allow` file exists, a user must be listed, one user per line, in the `/etc/cron.allow`
      file in order to be allowed to use the `crontab` command.
    audit_guidance: "**- IF -** cron is installed on the system:\r\n\r\nRun the following command to verify\
      \ `/etc/cron.allow`:\r\n- Exists\r\n- Is mode `0640` or more restrictive\r\n- Is owned by the user\
      \ `root`\r\n- Is group owned by the group `root`  **- OR -** the group `crontab`\r\n\r\n```\r\n\
      # stat -Lc 'Access: (%a/%A) Owner: (%U) Group: (%G)' /etc/cron.allow\r\n```\r\n\r\nVerify the returned\
      \ value is:\r\n\r\n```\r\nAccess: (640/-rw-r-----) Owner: (root) Group: (root)\r\n- OR -\r\nAccess:\
      \ (640/-rw-r-----) Owner: (root) Group: (crontab)\r\n```\r\n\r\nRun the following command to verify\
      \ either `cron.deny` doesn't exist or is:\r\n- Mode `0640` or more restrictive\r\n- Owned by the\
      \ user `root`\r\n- Is group owned by the group `root`  **- OR -** the group `crontab`\r\n\r\n```\r\
      \n# [ -e \"/etc/cron.deny\" ] && stat -Lc 'Access: (%a/%A) Owner: (%U) Group: (%G)' /etc/cron.deny\r\
      \n```\r\n\t\r\nVerify either nothing is returned **- OR -** returned value is one of the following:\r\
      \n\r\n```\r\nAccess: (640/-rw-r-----) Owner: (root) Group: (root)\r\n- OR -\r\nAccess: (640/-rw-r-----)\
      \ Owner: (root) Group: (crontab)\r\n```\r\n\r\n**Note:** \r\nOn systems where cron is configured\
      \ to use the group `crontab`, if the group `crontab` is not set as the owner of `cron.allow`, then\
      \ cron will deny access to all users and you will see an error similar to:\r\n```\r\nYou ( ) are\
      \ not allowed to use this program (crontab)\r\nSee crontab(1) for more information\r\n```"
    remediation_guidance: "**- IF -** cron is installed on the system:\r\n\r\nRun the following script\
      \ to:\r\n- Create `/etc/cron.allow` if it doesn't exist\r\n- Change owner to user `root`\r\n- Change\
      \ group owner to group `root` **- OR -** group `crontab` if it exists\r\n- Change mode to `640`\
      \ or more restrictive\r\n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n   [ ! -e \"/etc/cron.allow\"\
      \ ] && touch /etc/cron.allow\r\n   chmod u-x,g-wx,o-rwx /etc/cron.allow\r\n   if grep -Pq -- '^\\\
      h*crontab\\:' /etc/group; then\r\n      chown root:crontab /etc/cron.allow\r\n   else\r\n      chown\
      \ root:root /etc/cron.allow\r\n   fi\r\n}\r\n```\r\n\r\n**- IF -** `/etc/cron.deny` exists, run\
      \ the following script to:\r\n- Change owner to user `root`\r\n- Change group owner to group `root`\
      \ **- OR -** group `crontab` if it exists\r\n- Change mode to `640` or more restrictive\r\n\r\n\
      ```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n   if [ -e \"/etc/cron.deny\" ]; then\r\n      chmod u-x,g-wx,o-rwx\
      \ /etc/cron.deny\r\n      if grep -Pq -- '^\\h*crontab\\:' /etc/group; then\r\n         chown root:crontab\
      \ /etc/cron.deny\r\n      else\r\n         chown root:root /etc/cron.deny\r\n      fi\r\n   fi\r\
      \n}\r\n```\r\n\r\n**Note:**\r\n- When the `/etc/cron.allow` file exists, **a user must be listed,\
      \ one user per line, in the `/etc/cron.allow` file in order to be allowed to use the `crontab` command**.\r\
      \n- If both `/etc/cron.allow` and `/etc/cron.deny` exist, `/etc/cron.allow` takes precedence. Which\
      \ means that `/etc/cron.deny` is not considered and users must be listed in `/etc/cron.allow` in\
      \ order to use the crontab.\r\n- If the `/etc/cron.allow` file does not exist but the `/etc/cron.deny`\
      \ file does exist, then you must not be listed in the `/etc/cron.deny` file in order to use the\
      \ `crontab` command.\r\n- Regardless of the existence of any of these files, the root administrative\
      \ user is always allowed to setup a crontab.\r\n- On systems where cron is configured to use the\
      \ group `crontab`, if the group `crontab` is not set as the owner of `/etc/cron.allow`, then cron\
      \ will deny access to all users but `root`, and you will see an error similar to:\r\n\r\n```\r\n\
      You ( ) are not allowed to use this program (crontab)\r\nSee crontab(1) for more information\r\n\
      ```"
