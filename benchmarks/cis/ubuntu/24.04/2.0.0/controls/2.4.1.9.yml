control:
  id: CIS-2.4.1.9
  benchmark_id: cis-ubuntu-24.04
  title: Ensure access to crontab is configured
  description: "`crontab` is the program used to install, deinstall, or list the tables used to drive\
    \ the cron daemon. Each user can have their own crontab, and though files are created, they are not\
    \ intended to be edited directly.\r\n\r\nIf the `/etc/cron.allow` file exists, then you must be listed\
    \ (one user per line) therein in order to be allowed to use this command. If the `/etc/cron.allow`\
    \ file does not exist but the `/etc/cron.deny` file does exist, then you must not be listed in the\
    \ `/etc/cron.deny` file in order to use this command.\r\n\r\nIf neither of these files exists, then\
    \ depending on site-dependent configuration parameters, only the super user will be allowed to use\
    \ this command, or all users will be able to use this command.\r\n\r\nIf both files exist then `/etc/cron.allow`\
    \ takes precedence. Which means that `/etc/cron.deny` is not considered and your user must be listed\
    \ in `/etc/cron.allow` in order to be able to use the crontab.\r\n\r\nRegardless of the existence\
    \ of any of these files, the root administrative user is always allowed to setup a crontab.\r\n\r\n\
    The files `/etc/cron.allow` and `/etc/cron.deny`, if they exist, must be either world-readable, or\
    \ readable by group `crontab`. If they are not, then cron will deny access to all users until the\
    \ permissions are fixed.\r\n\r\nThere is one file for each user's crontab. Users are not allowed to\
    \ edit the file directly to ensure that only users allowed by the system to run periodic tasks can\
    \ add them, and only syntactically correct crontabs will be written. This is enforced by having the\
    \ directory writable only by the `crontab` group and configuring crontab command with the setgid bid\
    \ set for that specific group.\r\n\r\n**Note:**\r\n- The files `/etc/cron.allow` and `/etc/cron.deny`,\
    \ if they exist, only controls administrative access to the crontab command for scheduling and modifying\
    \ cron jobs\r\n- If you are using SELinux or AppArmor, these security modules may prevent crontab\
    \ access. Check the audit logs for any related `permission denied` entries and adjust your policies\
    \ if necessary."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.2_4_1_9.audit
  remediation: cis.ubuntu.24.04.v2_0_0.2_4_1_9.remediate
