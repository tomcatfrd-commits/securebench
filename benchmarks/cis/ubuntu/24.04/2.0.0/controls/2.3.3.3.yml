    parent: CIS _2_Time Synchronization Main | 2.1.3.3-Ensure chrony is enabled and running
    rationale: "chrony needs to be enabled and running in order to synchronize the system to a timeserver.\r\
      \n\r\nTime synchronization is important to support time sensitive security mechanisms and to ensure\
      \ log files have consistent time records across the enterprise to aid in forensic investigations"
    impact: ''
    audit_guidance: "**- IF -** chrony is in use on the system, run the following commands:\r\n\r\nRun\
      \ the following command to verify that the `chrony` service is enabled:\r\n\r\n```\r\n# systemctl\
      \ is-enabled chrony.service\r\n\r\nenabled\r\n```\r\n\r\nRun the following command to verify that\
      \ the `chrony` service is active:\r\n\r\n```\r\n# systemctl is-active chrony.service\r\n\r\nactive\r\
      \n```"
    remediation_guidance: "**- IF -** `chrony` is in use on the system, run the following commands:\r\n\
      \r\nRun the following command to unmask `chrony.service`:\r\n\r\n```\r\n# systemctl unmask chrony.service\r\
      \n```\r\n\r\nRun the following command to enable and start `chrony.service`:\r\n\r\n```\r\n# systemctl\
      \ --now enable chrony.service\r\n```\r\n\r\n**- OR -** \r\n\r\nIf another time synchronization service\
      \ is in use on the system, run the following command to remove `chrony`:\r\n\r\n```\r\n# apt purge\
      \ chrony\r\n# apt autoremove chrony\r\n```"
    additional_information: ''
    default_value: ''
    artifacts_count: 3
    requirements: {}
    safety:
