    parent: CIS _5_Configure SSH Server Main | 2.2.15-Ensure sshd LogLevel is configured
    rationale: "The `INFO` level is the basic level that only records login activity of SSH users. In\
      \ many situations, such as Incident Response, it is important to determine when a particular user\
      \ was active on a system. The logout record can eliminate those users who disconnected, which helps\
      \ narrow the field.\r\n\r\nThe `VERBOSE` level specifies that login and logout activity as well\
      \ as the key fingerprint for any SSH key used for login will be logged. This information is important\
      \ for SSH key management, especially in legacy environments."
    impact: ''
    audit_guidance: "Run the following command and verify that output matches `loglevel VERBOSE` or `loglevel\
      \ INFO`:\r\n\r\n```\r\n# sshd -T | grep loglevel\r\n\r\nloglevel VERBOSE\r\n   - OR -\r\nloglevel\
      \ INFO\r\n```\r\n\r\n**- IF -** `Match` set statements are used in your environment, specify the\
      \ connection parameters to use for the `-T` extended test mode and run the audit to verify the setting\
      \ is not incorrectly configured in a match block\r\n\r\n_Example additional audit needed for a match\
      \ block for the user `sshuser`:_\r\n\r\n```\r\n# sshd -T -C user=sshuser | grep loglevel\r\n```"
    remediation_guidance: "Create or edit a `*.conf` file in the `/etc/ssh/sshd_config.d/` and set the\
      \ `LogLevel` parameter to `VERBOSE` or `INFO` above any `Include` and `Match` entries as follows:\r\
      \n\r\n```\r\nLogLevel VERBOSE\r\n   - OR -\r\nLogLevel INFO\r\n```"
    additional_information: ''
    default_value: LogLevel INFO
    artifacts_count: 3
    requirements: {}
    safety:
      default: investigate
      implementation_status: guidance_only
      reason: Imported CIS guidance has not yet been promoted to a reviewed SecureBench implementation.
