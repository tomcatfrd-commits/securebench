control:
  id: CIS-5.1.14
  benchmark_id: cis-ubuntu-24.04
  title: Ensure sshd LogLevel is configured
  description: "SSH provides several logging levels with varying amounts of verbosity. The `DEBUG` options\
    \ are specifically not recommended other than strictly for debugging SSH communications. These levels\
    \ provide so much data that it is difficult to identify important security information, and may violate\
    \ the privacy of users.\r\n\r\nMore information about the openSSH server configuration is available\
    \ in the \"Configure SSH Server\" section overview."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_1_14.audit
  remediation: cis.ubuntu.24.04.v2_0_0.5_1_14.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.5_1_14.rollback
