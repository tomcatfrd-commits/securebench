control:
  id: CIS-1.1.1.10
  benchmark_id: cis-ubuntu-24.04
  title: Ensure usb-storage kernel module is not available
  description: USB storage provides a means to transfer and store files ensuring persistence and availability
    of the files independent of network connection status.  Its popularity and utility has led to USB-based
    malware being a simple and common means for network infiltration and a first step to establishing
    a persistent threat within a networked environment.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.1_1_1_10.audit
  remediation: cis.ubuntu.24.04.v2_0_0.1_1_1_10.remediate
