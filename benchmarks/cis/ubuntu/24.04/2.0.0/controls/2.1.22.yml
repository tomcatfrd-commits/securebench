control:
  id: CIS-2.1.22
  benchmark_id: cis-ubuntu-24.04
  title: Ensure xinetd services are not in use
  description: The eXtended InterNET Daemon (`xinetd`) is an open source super daemon that replaced the
    original `inetd` daemon. The `xinetd` daemon listens for well known services and dispatches the appropriate
    daemon to properly respond to service requests.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.2_1_22.audit
  remediation: cis.ubuntu.24.04.v2_0_0.2_1_22.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.2_1_22.rollback
  verification: cis.ubuntu.24.04.v2_0_0.2_1_22.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 2.1.22
      url: https://workbench.cisecurity.org/sections/4177245/recommendations/7047662
    assessment_status: automated
    profiles:
    - Level 1 - Server
    - Level 1 - Workstation
    mappings:
      nist:
      - CM-7
      cis_v8:
      - '4.8'
      cis_v7:
      - '9.2'
      mitre_techniques:
      - T1203
      - T1203.000
      - T1210
