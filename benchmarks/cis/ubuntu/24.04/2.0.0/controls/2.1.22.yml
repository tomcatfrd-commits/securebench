    parent: CIS _2_Configure Server Services Main | 2.1.22-Ensure xinetd services are not in use
    rationale: "If there are no `xinetd` services required, it is recommended that the package be removed\
      \ to reduce the attack surface are of the system.\r\n\r\n**Note:** If an `xinetd` service or services\
      \ are required, ensure that any `xinetd` service not required is stopped and masked"
    impact: "There may be packages that are dependent on the `xinetd` package. If the `xinetd` package\
      \ is removed, these dependent packages will be removed as well. Before removing the `xinetd` package,\
      \ review any dependent packages to determine if they are required on the system.\r\n\r\n**-IF-**\
      \ a dependent package is required: stop and mask xinetd.service leaving the xinetd package installed."
    audit_guidance: "Run the following command to verify the `xinetd` package is not installed:\r\n\r\n\
      ```\r\n# dpkg-query -s xinetd &>/dev/null && echo \"xinetd is installed\"\r\n```\r\n\r\nNothing\
      \ should be returned.\r\n\r\n**-OR-** \r\n\r\n**-IF-** the `xinetd` package is required as a dependency:\r\
      \n\r\nRun the following command to verify `xinetd.service` is not enabled:\r\n\r\n```\r\n# systemctl\
      \ is-enabled xinetd.service 2>/dev/null | grep 'enabled'\r\n\r\nNothing should be returned\r\n```\r\
      \n\r\nRun the following command to verify `xinetd.service` is not active:\r\n\r\n```\r\n# systemctl\
      \ is-active xinetd.service 2>/dev/null | grep '^active'\r\n\r\nNothing should be returned\r\n```\r\
      \n\r\n**Note:** If the package is required for a dependency\r\n- Ensure the dependent package is\
      \ approved by local site policy\r\n- Ensure stopping and masking the service and/or socket meets\
      \ local site policy"
    remediation_guidance: "Run the following commands to stop `xinetd.service`, and remove the `xinetd`\
      \ package:\r\n\r\n```\r\n# systemctl stop xinetd.service\r\n# apt purge xinetd\r\n```\r\n\r\n**-OR-**\r\
      \n\r\n**-IF-** the `xinetd` package is required as a dependency:\r\n\r\nRun the following commands\
      \ to stop and mask the `xinetd.service`:\r\n\r\n```\r\n# systemctl stop xinetd.service\r\n# systemctl\
      \ mask xinetd.service\r\n```"
