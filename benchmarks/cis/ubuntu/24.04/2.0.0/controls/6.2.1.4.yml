    parent: CIS _6_System Auditing Main | 2.2.1.4-Ensure audit_backlog_limit is configured
    rationale: If an audit event is logged which would grow the queue beyond the `audit_backlog_limit`,
      then a failure occurs, auditd records will be lost, and potential malicious activity could go undetected.
    impact: ''
    audit_guidance: "Run the following command and verify the `audit_backlog_limit=` parameter is set:\r\
      \n\r\n```\r\n# find /boot -type f -name 'grub.cfg' -exec grep -Ph -- '^\\h*linux' {} + | grep -Pv\
      \ 'audit_backlog_limit=\\d+\\b'\r\n```\r\n\r\nNothing should be returned."
    remediation_guidance: "Edit `/etc/default/grub` or a file in `/etc/default/grub.d/` ending in `.cfg`\
      \ adding `audit_backlog_limit=N` to `GRUB_CMDLINE_LINUX`. The recommended size for `N` is `8192`\
      \ or larger`:\r\n\r\n_Example_:\r\n\r\n```\r\n# printf \"\\n%s\\n\" 'GRUB_CMDLINE_LINUX=\"audit_backlog_limit=8192\"\
      ' >> /etc/default/grub.d/40-custom.cfg\r\n```\r\n\r\nRun the following command to update the `grub2`\
      \ configuration:\r\n\r\n```\r\n# update-grub\r\n```"
    additional_information: ''
    default_value: if `audit_backlog_limit` is not set, the system defaults to `audit_backlog_limit=64`
    artifacts_count: 1
