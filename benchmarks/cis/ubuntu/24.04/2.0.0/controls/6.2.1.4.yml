control:
  id: CIS-6.2.1.4
  benchmark_id: cis-ubuntu-24.04
  title: Ensure audit_backlog_limit is configured
  description: "In the kernel-level audit subsystem, a socket buffer queue is used to hold audit events.\
    \ Whenever a new audit event is received, it is logged and prepared to be added to this queue. \r\n\
    \r\nThe kernel boot parameter `audit_backlog_limit=N`, with `N` representing the amount of messages,\
    \ will ensure that a queue cannot grow beyond a certain size. If an audit event is logged which would\
    \ grow the queue beyond this limit, then a failure occurs and is handled according to the system configuration"
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.6_2_1_4.audit
  remediation: cis.ubuntu.24.04.v2_0_0.6_2_1_4.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.6_2_1_4.rollback
