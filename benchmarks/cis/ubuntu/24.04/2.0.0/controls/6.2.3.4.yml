control:
  id: CIS-6.2.3.4
  benchmark_id: cis-ubuntu-24.04
  title: Ensure events that modify date and time information are collected
  description: "Capture events where the system date and/or time has been modified. The parameters in\
    \ this section are set to determine if the;\r\n- `adjtimex` - tune kernel clock\r\n- `settimeofday`\
    \ - set time using `timeval` and `timezone` structures\r\n- `clock_settime` - allows for the setting\
    \ of several internal clocks and timers\r\n\r\nsystem calls have been executed. Further, ensure to\
    \ write an audit record to the configured audit log file upon exit, tagging the records with a unique\
    \ identifier such as \"time-change\"."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.6_2_3_4.audit
  remediation: cis.ubuntu.24.04.v2_0_0.6_2_3_4.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.6_2_3_4.rollback
  verification: cis.ubuntu.24.04.v2_0_0.6_2_3_4.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 6.2.3.4
      url: https://workbench.cisecurity.org/sections/4203192/recommendations/7091551
    assessment_status: automated
    profiles:
    - Level 2 - Server
    - Level 2 - Workstation
    mappings:
      nist:
      - AU-3
      - CM-6
      cis_v8:
      - '8.5'
      cis_v7:
