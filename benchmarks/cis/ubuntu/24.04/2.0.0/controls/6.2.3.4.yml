    parent: CIS _6_System Auditing Main | 2.2.3.4-Ensure events that modify date and time information
      are collected
    rationale: Unexpected changes in system date and/or time could be a sign of malicious activity on
      the system.
    impact: ''
    audit_guidance: "1a. Verify a rule exists for `adjtimex`, `settimeofday`, `clock_settime` in the running\
      \ configuration:\r\n\r\n```\r\n# auditctl -l | grep -Ps -- '(adjtimex|settimeofday|clock_settime)'\r\
      \n```\r\n\r\nVerify output of matches:\r\n\r\n```\r\n-a always,exit -F arch=b64 -S adjtimex,settimeofday\
      \ -k time-change\r\n-a always,exit -F arch=b32 -S adjtimex,settimeofday -k time-change\r\n-a always,exit\
      \ -F arch=b64 -S clock_settime -F a0=0x0 -k time-change\r\n-a always,exit -F arch=b32 -S clock_settime\
      \ -F a0=0x0 -k time-change\r\n```\r\n\r\n1b. verify a rule for `time-change` exists in the running\
      \ configuration:\r\n```\r\n# auditctl -l | grep -Ps -- '^\\h*[^#\\n\\r]+\\h*\\/etc\\/localtime'\r\
      \n```\r\n\r\nVerify the output matches:\r\n```\r\n-w /etc/localtime -p wa -k time-change\r\n```\r\
      \n\r\n2a. Run the following command to verify a rule exists for `adjtimex`, `settimeofday`, `clock_settime`\
      \ in a rules file:\r\n\r\n```\r\n# grep -Ps -- '(adjtimex|settimeofday|clock_settime)' /etc/audit/rules.d/*.rules\r\
      \n```\r\n_Example output:_\r\n\r\n```\r\n/etc/audit/rules.d/50-time-change.rules:-a always,exit\
      \ -F arch=b64 -S adjtimex,settimeofday -F key=time-change\r\n/etc/audit/rules.d/50-time-change.rules:-a\
      \ always,exit -F arch=b32 -S settimeofday,adjtimex -F key=time-change\r\n/etc/audit/rules.d/50-time-change.rules:-a\
      \ always,exit -F arch=b64 -S clock_settime -F a0=0x0 -F key=time-change\r\n/etc/audit/rules.d/50-time-change.rules:-a\
      \ always,exit -F arch=b32 -S clock_settime -F a0=0x0 -F key=time-change\r\n```\r\n\r\n2b. Run the\
      \ following command to verify a rule exists for `/etc/localtime` in a rules file:\r\n```\r\n# grep\
      \ -Ps -- '^\\h*[^#\\n\\r]+\\h*\\/etc\\/localtime' /etc/audit/rules.d/*.rules\r\n```\r\n_Example\
      \ output:_\r\n```\r\n/etc/audit/rules.d/50-time-change.rules:-w /etc/localtime -p wa -k time-change\r\
      \n```"
    remediation_guidance: "1. Edit or create a file in the `/etc/audit/rules.d/` directory, ending in\
      \ `.rules` extension, with the relevant rules to monitor events that modify date and time information.\r\
      \n\r\nExample:\r\n\r\n```\r\n# printf \"\r\n-a always,exit -F arch=b64 -S adjtimex,settimeofday\
      \ -k time-change\r\n-a always,exit -F arch=b32 -S adjtimex,settimeofday -k time-change\r\n-a always,exit\
      \ -F arch=b64 -S clock_settime -F a0=0x0 -k time-change\r\n-a always,exit -F arch=b32 -S clock_settime\
      \ -F a0=0x0 -k time-change\r\n-w /etc/localtime -p wa -k time-change\r\n\" >> /etc/audit/rules.d/50-time-change.rules\r\
      \n```\r\n\r\n2. Merge and load the rules into active configuration:\r\n\r\n```\r\n# augenrules --load\r\
      \n```\r\n\r\n3. Check if reboot is required:\r\n\r\n```\r\n# if [[ $(auditctl -s | grep \"enabled\"\
      ) =~ \"2\" ]]; then printf \"Reboot required to load rules\\n\"; fi\r\n```"
