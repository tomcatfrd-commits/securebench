control:
  id: CIS-6.2.3.19
  benchmark_id: cis-ubuntu-24.04
  title: Ensure successful file system mounts are collected
  description: Monitor the use of the `mount` system call. The `mount` (and `umount` ) system call controls
    the mounting and unmounting of file systems. The parameters below configure the system to create an
    audit record when the mount system call is used by a non-privileged user
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.6_2_3_19.audit
  remediation: cis.ubuntu.24.04.v2_0_0.6_2_3_19.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.6_2_3_19.rollback
  verification: cis.ubuntu.24.04.v2_0_0.6_2_3_19.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 6.2.3.19
      url: https://workbench.cisecurity.org/sections/4203192/recommendations/7091566
    assessment_status: automated
    profiles:
    - Level 2 - Server
    - Level 2 - Workstation
    mappings:
      nist:
      - CM-6
      cis_v8:
      - '8.5'
      cis_v7:
