    parent: CIS _6_System Auditing Main | 2.2.3.19-Ensure successful file system mounts are collected
    rationale: It is highly unusual for a non privileged user to `mount` file systems to the system. While
      tracking `mount` commands gives the system administrator evidence that external media may have been
      mounted (based on a review of the source of the mount and confirming it's an external media type),
      it does not conclusively indicate that data was exported to the media. System administrators who
      wish to determine if data were exported, would also have to track successful `open`, `creat` and
      `truncate` system calls requiring write access to a file under the mount point of the external media
      file system. This could give a fair indication that a write occurred. The only way to truly prove
      it, would be to track successful writes to the external media. Tracking write system calls could
      quickly fill up the audit log and is not recommended. Recommendations on configuration options to
      track data export to media is beyond the scope of this document.
    impact: ''
    audit_guidance: "**On disk configuration**\r\n\r\nRun the following command to check the on disk rules:\r\
      \n\r\n```\r\n# {\r\n UID_MIN=$(awk '/^\\s*UID_MIN/{print $2}' /etc/login.defs)\r\n [ -n \"${UID_MIN}\"\
      \ ] && awk \"/^ *-a *always,exit/ \\\r\n &&/ -F *arch=b(32|64)/ \\\r\n &&(/ -F *auid!=unset/||/\
      \ -F *auid!=-1/||/ -F *auid!=4294967295/) \\\r\n &&/ -F *auid>=${UID_MIN}/ \\\r\n &&/ -S/ \\\r\n\
      \ &&/mount/ \\\r\n &&(/ key= *[!-~]* *$/||/ -k *[!-~]* *$/)\" /etc/audit/rules.d/*.rules \\\r\n\
      \ || printf \"ERROR: Variable 'UID_MIN' is unset.\\n\"\r\n}\r\n```\r\n\r\nVerify the output matches:\r\
      \n\r\n```\r\n-a always,exit -F arch=b64 -S mount -F auid>=1000 -F auid!=unset -k mounts\r\n-a always,exit\
      \ -F arch=b32 -S mount -F auid>=1000 -F auid!=unset -k mounts\r\n```\r\n\r\n**Running configuration**\r\
      \n\r\nRun the following command to check loaded rules:\r\n\r\n```\r\n# {\r\n UID_MIN=$(awk '/^\\\
      s*UID_MIN/{print $2}' /etc/login.defs)\r\n [ -n \"${UID_MIN}\" ] && auditctl -l | awk \"/^ *-a *always,exit/\
      \ \\\r\n &&/ -F *arch=b(32|64)/ \\\r\n &&(/ -F *auid!=unset/||/ -F *auid!=-1/||/ -F *auid!=4294967295/)\
      \ \\\r\n &&/ -F *auid>=${UID_MIN}/ \\\r\n &&/ -S/ \\\r\n &&/mount/ \\\r\n &&(/ key= *[!-~]* *$/||/\
      \ -k *[!-~]* *$/)\" \\\r\n || printf \"ERROR: Variable 'UID_MIN' is unset.\\n\"\r\n}\r\n```\r\n\r\
      \nVerify the output matches:\r\n\r\n```\r\n-a always,exit -F arch=b64 -S mount -F auid>=1000 -F\
      \ auid!=-1 -F key=mounts\r\n-a always,exit -F arch=b32 -S mount -F auid>=1000 -F auid!=-1 -F key=mounts\r\
      \n```"
    remediation_guidance: "**Create audit rules**\r\n\r\nEdit or create a file in the `/etc/audit/rules.d/`\
      \ directory, ending in `.rules` extension, with the relevant rules to monitor successful file system\
      \ mounts.\r\n\r\n_Example:_\r\n\r\n```\r\n# {\r\nUID_MIN=$(awk '/^\\s*UID_MIN/{print $2}' /etc/login.defs)\r\
      \n[ -n \"${UID_MIN}\" ] && printf \"\r\n-a always,exit -F arch=b32 -S mount -F auid>=$UID_MIN -F\
      \ auid!=unset -k mounts\r\n-a always,exit -F arch=b64 -S mount -F auid>=$UID_MIN -F auid!=unset\
      \ -k mounts\r\n\" >> /etc/audit/rules.d/50-mounts.rules || printf \"ERROR: Variable 'UID_MIN' is\
      \ unset.\\n\"\r\n}\r\n```\r\n\r\n**Load audit rules**\r\n\r\nMerge and load the rules into active\
      \ configuration:\r\n\r\n```\r\n# augenrules --load\r\n```\r\n\r\nCheck if reboot is required.\r\n\
      \r\n```\r\n# if [[ $(auditctl -s | grep \"enabled\") =~ \"2\" ]]; then printf \"Reboot required\
      \ to load rules\\n\"; fi\r\n```"
    additional_information: ''
    default_value: ''
