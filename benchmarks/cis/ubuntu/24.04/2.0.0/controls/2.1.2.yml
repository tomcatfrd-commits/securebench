control:
  id: CIS-2.1.2
  benchmark_id: cis-ubuntu-24.04
  title: Ensure mail transfer agents are configured for local-only mode
  description: Mail Transfer Agents (MTA), such as sendmail and Postfix, are used to listen for incoming
    mail and transfer the messages to the appropriate user or mail server. If the system is not intended
    to be a mail server, it is recommended that the MTA be configured to only process local mail.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.2_1_2.audit
  remediation: cis.ubuntu.24.04.v2_0_0.2_1_2.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.2_1_2.rollback
  verification: cis.ubuntu.24.04.v2_0_0.2_1_2.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 2.1.2
      url: https://workbench.cisecurity.org/sections/4177245/recommendations/7047487
    assessment_status: automated
    profiles:
    - Level 1 - Server
    - Level 1 - Workstation
    mappings:
      nist:
      - CM-7
      cis_v8:
      - '4.8'
      cis_v7:
      - '9.2'
      mitre_techniques:
      - T1018
      - T1018.000
      - T1210
      - T1210.000
