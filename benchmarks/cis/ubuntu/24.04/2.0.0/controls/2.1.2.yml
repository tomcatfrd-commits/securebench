      mitre_mitigations:
      - M1042
    parent: CIS _2_Configure Server Services Main | 2.1.2-Ensure mail transfer agents are configured for
      local-only mode
    rationale: The software for all Mail Transfer Agents is complex and most have a long history of security
      issues. While it is important to ensure that the system can process local mail messages, it is not
      necessary to have the MTA's daemon listening on a port unless the server is intended to be a mail
      server that receives and processes mail from other systems.
    impact: This recommendation is designed around the postfix mail server. Depending on your environment
      you may have an alternative MTA installed such as exim4 or sendmail. If this is the case consult
      the documentation for your installed MTA to configure the recommended state.
    audit_guidance: "Run the following script to verify that the MTA is not listening on any non-loopback\
      \ address ( `127.0.0.1`  or `::1` ) \r\n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n   a_output=();\
      \ a_output2=(); a_port_list=(\"25\" \"465\" \"587\")\r\n   for l_port_number in \"${a_port_list[@]}\"\
      ; do\r\n      if ss -plntu | grep -P -- ':'\"$l_port_number\"'\\b' | grep -Pvq -- '\\h+(127\\.0\\\
      .0\\.1|\\[?::1\\]?):'\"$l_port_number\"'\\b'; then\r\n         a_output2+=(\" - Port \\\"$l_port_number\\\
      \" is listening on a non-loopback network interface\")\r\n      else\r\n         a_output+=(\" -\
      \ Port \\\"$l_port_number\\\" is not listening on a non-loopback network interface\")\r\n      fi\r\
      \n   done\r\n   if command -v postconf &> /dev/null; then\r\n      l_interfaces=\"$(postconf -n\
      \ inet_interfaces)\"\r\n   elif command -v exim &> /dev/null; then\r\n      l_interfaces=\"$(exim\
      \ -bP local_interfaces)\"\r\n   elif command -v sendmail &> /dev/null; then\r\n      l_interfaces=\"\
      $(grep -i \"O DaemonPortOptions=\" /etc/mail/sendmail.cf | grep -oP '(?<=Addr=)[^,+]+' | grep -v\
      \ '^127\\.0\\.0\\.1$')\"\r\n   fi\r\n   if [ -n \"$l_interfaces\" ]; then\r\n      if grep -Pqi\
      \ '\\ball\\b' <<< \"$l_interfaces\"; then\r\n         a_output2+=(\" - MTA is bound to all network\
      \ interfaces\")\r\n      elif ! grep -Pqi '(inet_interfaces\\h*=\\h*)?(0\\.0\\.0\\.0|::1|loopback-only)'\
      \ <<< \"$l_interfaces\"; then\r\n         a_output2+=(\" - MTA is bound to a network interface\"\
      \ \"   \\\"$l_interfaces\\\"\")\r\n      else\r\n         a_output+=(\" - MTA is not bound to a\
      \ non loopback network interface\" \"   \\\"$l_interfaces\\\"\")\r\n      fi\r\n   else\r\n    \
      \  a_output+=(\" - MTA not detected or in use\")\r\n   fi\r\n   if [ \"${#a_output2[@]}\" -le 0\
      \ ]; then\r\n      printf '%s\\n' \"\" \"- Audit Result:\" \"  ** PASS **\" \"${a_output[@]}\"\r\
      \n   else\r\n      printf '%s\\n' \"\" \"- Audit Result:\" \"  ** FAIL **\" \"  * Reasons for audit\
      \ failure *\" \"${a_output2[@]}\" \"\"\r\n      [ \"${#a_output[@]}\" -gt 0 ] && printf '%s\\n'\
      \ \"- Correctly set:\" \"${a_output[@]}\"\r\n   fi\r\n}\r\n```"
    remediation_guidance: "Edit `/etc/postfix/main.cf` and add the following line to the RECEIVING MAIL\
      \ section. If the line already exists, change it to look like the line below:\r\n\r\n```\r\ninet_interfaces\
      \ = loopback-only\r\n```\r\n\r\nRun the following command to restart `postfix`:\r\n\r\n```\r\n#\
      \ systemctl restart postfix\r\n```\r\n\r\n**Note:**\r\n- This recommendation is designed around\
      \ the postfix mail server.\r\n- Depending on your environment you may have an alternative MTA installed\
      \ such as exim4 or sendmail. If this is the case consult the documentation for your installed MTA\
      \ to configure the recommended state."
