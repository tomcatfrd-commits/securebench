    parent: CIS _6_System Auditing Main | 2.2.3.30-Ensure the running and on disk configuration is the
      same
    rationale: Configuration differences between what is currently running and what is on disk could cause
      unexpected problems or may give a false impression of compliance requirements.
    impact: ''
    audit_guidance: "**Merged rule sets**\r\n\r\nEnsure that all rules in `/etc/audit/rules.d` have been\
      \ merged into `/etc/audit/audit.rules`:\r\n\r\n```\r\n# augenrules --check\r\n\r\n/usr/sbin/augenrules:\
      \ No change\r\n```\r\n\r\nShould there be any drift, run `augenrules --load` to merge and load all\
      \ rules."
    remediation_guidance: "If the rules are not aligned across all three () areas, run the following command\
      \ to merge and load all rules:\r\n\r\n```\r\n# augenrules --load\r\n```\r\n\r\nCheck if reboot is\
      \ required.\r\n\r\n```\r\nif [[ $(auditctl -s | grep \"enabled\") =~ \"2\" ]]; then echo \"Reboot\
      \ required to load rules\"; fi\r\n```"
    additional_information: ''
    default_value: ''
    artifacts_count: 0
    requirements: {}
    safety:
