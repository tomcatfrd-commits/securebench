control:
  id: CIS-6.2.3.30
  benchmark_id: cis-ubuntu-24.04
  title: Ensure the running and on disk configuration is the same
  description: "The Audit system have both on disk and running configuration. It is possible for these\
    \ configuration settings to differ.\r\n\r\n**Note:** Due to the limitations of `augenrules` and `auditctl`,\
    \ it is not absolutely guaranteed that loading the rule sets via `augenrules --load` will result in\
    \ all rules being loaded or even that the user will be informed if there was a problem loading the\
    \ rules."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.6_2_3_30.audit
  remediation: cis.ubuntu.24.04.v2_0_0.6_2_3_30.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.6_2_3_30.rollback
  verification: cis.ubuntu.24.04.v2_0_0.6_2_3_30.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 6.2.3.30
      url: https://workbench.cisecurity.org/sections/4203192/recommendations/7091577
    assessment_status: manual
    profiles:
    - Level 2 - Server
    - Level 2 - Workstation
    mappings:
      nist:
      - AU-3
