    parent: CIS _1_Configure Command Line Warning Banners Main | 1.2.3-Ensure /etc/issue.net is configured
    rationale: Warning messages inform users who are attempting to login to the system of their legal
      status regarding the system and must include the name of the organization that owns the system and
      any monitoring policies that are in place. Displaying OS and patch level information in login banners
      also has the side effect of providing detailed system information to attackers attempting to target
      specific exploits of a system. Authorized users can easily get this information by running the "
      `uname -a` " command once they have logged in.
    impact: ''
    audit_guidance: "Run the following command and verify that the contents match site policy:\r\n\r\n\
      ```\r\n# cat /etc/issue.net\r\n```\r\n\r\nRun the following command and verify no results are returned:\r\
      \n\r\n```\r\n# grep -Psi \"(\\\\\\v|\\\\\\r|\\\\\\m|\\\\\\s|\\b$(grep '^ID=' /etc/os-release | cut\
      \ -d= -f2 | sed -e 's/\"//g')\\b)\" /etc/issue.net\r\n```\r\n\r\n**Note:** `/etc/issue.net` may\
      \ not exist by default, best practice is to create an `/etc/issue.net` file with the appropriate\
      \ contents according to your site policy and remove any instances of `\\m` , `\\r` , `\\s` , `\\\
      v` or references to the `OS platform`"
    remediation_guidance: "Edit the `/etc/issue.net` file with the appropriate contents according to your\
      \ site policy, remove any instances of `\\m` , `\\r` , `\\s` , `\\v` or references to the `OS platform`\r\
      \n\r\n_Example:_\r\n\r\n```\r\n# echo \"Authorized users only. All activity may be monitored and\
      \ reported.\" > /etc/issue.net\r\n```"
    additional_information: ''
