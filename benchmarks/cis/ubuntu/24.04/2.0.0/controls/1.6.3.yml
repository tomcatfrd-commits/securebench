control:
  id: CIS-1.6.3
  benchmark_id: cis-ubuntu-24.04
  title: Ensure /etc/issue.net is configured
  description: "The contents of the `/etc/issue.net`  file are displayed to users prior to login for remote\
    \ connections from configured services.\r\n\r\nUnix-based systems have typically displayed information\
    \ about the OS release and patch level upon logging in to the system. This information can be useful\
    \ to developers who are developing software for a particular OS platform. If `mingetty(8)` supports\
    \ the following options, they display operating system information:  `\\m`  - machine architecture\
    \ `\\r`  - operating system release `\\s`  - operating system name `\\v`  - operating system version"
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.1_6_3.audit
  remediation: cis.ubuntu.24.04.v2_0_0.1_6_3.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.1_6_3.rollback
  verification: cis.ubuntu.24.04.v2_0_0.1_6_3.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
