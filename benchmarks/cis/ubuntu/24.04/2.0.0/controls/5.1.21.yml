    parent: CIS _5_Configure SSH Server Main | 2.2.22-Ensure sshd PermitUserEnvironment is disabled
    rationale: Permitting users the ability to set environment variables through the SSH daemon could
      potentially allow users to bypass security controls (e.g. setting an execution path that has SSH
      executing trojan'd programs)
    impact: ''
    audit_guidance: "Run the following command to verify `PermitUserEnvironment` is set to `no`:\r\n\r\
      \n```\r\n# sshd -T | grep permituserenvironment\r\n\r\npermituserenvironment no\r\n```"
    remediation_guidance: "Create or edit a `*.conf` file in the `/etc/ssh/sshd_config.d/` and set the\
      \ `PermitUserEnvironment` parameter to `no` above any `Include` entries as follows:\r\n\r\n```\r\
      \nPermitUserEnvironment no\r\n```"
    additional_information: ''
    default_value: PermitUserEnvironment no
