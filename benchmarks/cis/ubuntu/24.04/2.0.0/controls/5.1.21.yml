control:
  id: CIS-5.1.21
  benchmark_id: cis-ubuntu-24.04
  title: Ensure sshd PermitUserEnvironment is disabled
  description: "The `PermitUserEnvironment` option allows users to present environment options to the\
    \ SSH daemon.\r\n\r\nMore information about the openSSH server configuration is available in the \"\
    Configure SSH Server\" section overview."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_1_21.audit
