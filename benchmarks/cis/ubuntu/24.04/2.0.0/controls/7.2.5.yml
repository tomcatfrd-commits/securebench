    parent: CIS _7_Local User and Group Settings Main | 2.1.4-Ensure no duplicate UIDs exist
    rationale: "Users must be assigned unique UIDs for accountability and to ensure appropriate access\
      \ protections.\r\n\r\nSatisfies: SRG-OS-000104-GPOS-00051, SRG-OS-000121-GPOS-00062, SRG-OS-000042-GPOS-00020"
    impact: ''
    audit_guidance: "Run the following script and verify no results are returned:\r\n\r\n```\r\n#!/usr/bin/env\
      \ bash\r\n\r\n{\r\n  while read -r l_count l_uid; do\r\n    if [ \"$l_count\" -gt 1 ]; then\r\n\
      \      echo -e \"Duplicate UID: \\\"$l_uid\\\" Users: \\\"$(awk -F: '($3 == n) { print $1 }' n=$l_uid\
      \ /etc/passwd | xargs)\\\"\"\r\n    fi\r\n  done < <(cut -f3 -d\":\" /etc/passwd | sort -n | uniq\
      \ -c)\r\n}\r\n```"
    remediation_guidance: Based on the results of the audit script, establish unique UIDs and review all
      files owned by the shared UIDs to determine which UID they are supposed to belong to.
    additional_information: "```\r\nRed Hat Enterprise Linux 8 Security Technical Implementation Guide\r\
