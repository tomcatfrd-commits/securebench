control:
  id: CIS-7.2.5
  benchmark_id: cis-ubuntu-24.04
  title: Ensure no duplicate UIDs exist
  description: Although the `useradd` program will not let you create a duplicate User ID (UID), it is
    possible for an administrator to manually edit the `/etc/passwd` file and change the UID field.
  platform: ubuntu-24.04
  severity: unspecified
