      - M1042
    parent: CIS _2_Configure Server Services Main | 2.1.18-Ensure snmp services are not in use
    rationale: "The SNMP server can communicate using `SNMPv1`, which transmits data in the clear and\
      \ does not require authentication to execute commands. `SNMPv3` replaces the simple/clear text password\
      \ sharing used in `SNMPv2` with more securely encoded parameters. If the the SNMP service is not\
      \ required, the `snmpd` package should be removed to reduce the attack surface of the system.\r\n\
      \r\n**Note:** If SNMP is required:\r\n- The server should be configured for `SNMP v3` only. `User\
      \ Authentication` and `Message Encryption` should be configured.\r\n- If `SNMP v2` is **absolutely**\
      \ necessary, modify the community strings' values."
    impact: "There may be packages that are dependent on the `snmpd` package. If the `snmpd` package is\
      \ removed, these packages will be removed as well.\r\n\r\nBefore removing the `snmpd` package, review\
      \ any dependent packages to determine if they are required on the system. If a dependent package\
      \ is required, stop and mask the `snmpd.service` leaving the `snmpd` package installed."
    audit_guidance: "Run the following command to verify `snmpd` is not installed:\r\n\r\n```\r\n# dpkg-query\
      \ -s snmpd &>/dev/null && echo \"snmpd is installed\"\r\n```\r\n\r\nNothing should be returned.\r\
      \n\r\n**- OR -** \r\n\r\n**- IF -** the package is required for dependencies:\r\n\r\nRun the following\
      \ command to verify the `snmpd.service` is not enabled:\r\n\r\n```\r\n# systemctl is-enabled snmpd.service\
      \ 2>/dev/null | grep 'enabled'\r\n\r\nNothing should be returned\r\n```\r\n\r\nRun the following\
      \ command to verify the `snmpd.service` is not active:\r\n\r\n```\r\n# systemctl is-active snmpd.service\
      \ 2>/dev/null | grep '^active'\r\n\r\nNothing should be returned\r\n```\r\n\r\n**Note:** If the\
      \ package is required for a dependency\r\n - Ensure the dependent package is approved by local site\
      \ policy\r\n - Ensure stopping and masking the service and/or socket meets local site policy"
    remediation_guidance: "Run the following commands to stop `snmpd.service` and remove the `snmpd` package:\r\
      \n\r\n```\r\n# systemctl stop snmpd.service\r\n# apt purge snmpd\r\n```\r\n\r\n**- OR -** If the\
      \ package is required for dependencies:\r\n\r\nRun the following commands to stop and mask the `snmpd.service`:\r\
      \n\r\n```\r\n# systemctl stop snmpd.service\r\n# systemctl mask snmpd.service\r\n```"
