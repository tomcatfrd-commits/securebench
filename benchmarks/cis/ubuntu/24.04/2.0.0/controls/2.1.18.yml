control:
  id: CIS-2.1.18
  benchmark_id: cis-ubuntu-24.04
  title: Ensure snmp services are not in use
  description: "Simple Network Management Protocol (SNMP) is a widely used protocol for monitoring the\
    \ health and welfare of network equipment, computer equipment and devices like UPSs. \r\n\r\nNet-SNMP\
    \ is a suite of applications used to implement SNMPv1 (RFC 1157), SNMPv2 (RFCs 1901-1908), and SNMPv3\
    \ (RFCs 3411-3418) using both IPv4 and IPv6.  \r\n\r\nSupport for SNMPv2 classic (a.k.a. \"SNMPv2\
    \ historic\" - RFCs 1441-1452) was dropped with the 4.0 release of the UCD-snmp package.\r\n\r\nThe\
    \ Simple Network Management Protocol (SNMP) server is used to listen for SNMP commands from an SNMP\
    \ management system, execute the commands or collect the information and then send results back to\
    \ the requesting system."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.2_1_18.audit
  remediation: cis.ubuntu.24.04.v2_0_0.2_1_18.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.2_1_18.rollback
  verification: cis.ubuntu.24.04.v2_0_0.2_1_18.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 2.1.18
      url: https://workbench.cisecurity.org/sections/4177245/recommendations/7047646
    assessment_status: automated
