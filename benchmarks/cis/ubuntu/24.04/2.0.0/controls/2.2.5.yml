    impact: Removing the LDAP client will prevent or inhibit using LDAP for authentication in your environment.
    audit_guidance: "Verify that `ldap-utils` is not installed. Use the following command to provide the\
      \ needed information:\r\n```\r\n# dpkg-query -s ldap-utils &>/dev/null && echo \"ldap-utils is installed\"\
      \r\n```\r\n\r\nNothing should be returned."
    remediation_guidance: "Uninstall `ldap-utils`:\r\n\r\n```\r\n# apt purge ldap-utils\r\n```"
