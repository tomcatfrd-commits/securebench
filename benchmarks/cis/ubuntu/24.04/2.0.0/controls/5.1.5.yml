    parent: CIS _5_Configure SSH Server Main | 2.2.6-Ensure sshd Banner is configured
    rationale: "Banners are used to warn connecting users of the particular site's policy regarding connection.\
      \ Presenting a warning message prior to the normal user login may assist the prosecution of trespassers\
      \ on the computer system.\r\n\r\nNot having a properly configured SSH banner, or leaving it at the\
      \ default value, can expose an organization to legal and compliance risks by failing to provide\
      \ users with necessary access policies or warnings about unauthorized access. It may violate regulations\
      \ requiring user acknowledgment of system usage rules, reduce security awareness, and leave systems\
      \ vulnerable to malicious or unintended access."
    impact: ''
    audit_guidance: "1. Ensure the the `Banner` option is set.\r\n\r\nRun the following command to verify\
      \ `Banner` is set:\r\n\r\n```\r\n# sshd -T | grep -Pi -- '^banner\\h+\\/\\H+'\r\n```\r\n\r\n_Example:_\r\
      \n\r\n```\r\nbanner /etc/issue.net\r\n```\r\n\r\n**- IF -** `Match` set statements are used in your\
      \ environment, specify the connection parameters to use for the `-T` extended test mode and run\
      \ the audit to verify the setting is not incorrectly configured in a match block\r\n\r\n_Example\
      \ additional audit needed for a match block for the user `sshuser`:_\r\n\r\n```\r\n# sshd -T -C\
      \ user=sshuser | grep -Pi -- '^banner\\h+\\/\\H+'\r\n```\r\n\r\n2. Ensure the banner matches local\
      \ site policy.\r\n\r\nRun the following command and verify that the contents or the file being called\
      \ by the `Banner` argument match site policy:\r\n\r\n```\r\n# [ -e \"$(sshd -T | awk '$1 == \"banner\"\
      \ {print $2}')\" ] && cat \"$(sshd -T | awk '$1 == \"banner\" {print $2}')\"\r\n``` \r\n\r\nRun\
      \ the following command and verify no results are returned:\r\n\r\n```\r\n# grep -Psi -- \"(\\\\\
      \\v|\\\\\\r|\\\\\\m|\\\\\\s|\\b$(grep '^ID=' /etc/os-release | cut -d= -f2 | sed -e 's/\"//g')\\\
      b)\" \"$(sshd -T | awk '$1 == \"banner\" {print $2}')\"\r\n```"
    remediation_guidance: "Create or edit a `*.conf` file in the `/etc/ssh/sshd_config.d/` and set the\
      \ `Banner` parameter above any `Include` and `Match` entries as follows:\r\n\r\n```\r\nBanner /etc/issue.net\r\
      \n```\r\n\r\nEdit the file being called by the `Banner` argument with the appropriate contents according\
      \ to your site policy, remove any instances of `\\m` , `\\r` , `\\s` , `\\v` or references to the\
      \ `OS platform`\r\n\r\n_Example:_\r\n\r\n```\r\n# printf '%s\\n' \"Authorized users only. All activity\
      \ may be monitored and reported.\" > \"$(sshd -T | awk '$1 == \"banner\" {print $2}')\"\r\n```"
