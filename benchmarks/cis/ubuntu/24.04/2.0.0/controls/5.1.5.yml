control:
  id: CIS-5.1.5
  benchmark_id: cis-ubuntu-24.04
  title: Ensure sshd Banner is configured
  description: "The `Banner` parameter specifies a file whose contents must be sent to the remote user\
    \ before authentication is permitted. By default, no banner is displayed.\r\n\r\nMore information\
    \ about the openSSH server configuration is available in the \"Configure SSH Server\" section overview."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_1_5.audit
