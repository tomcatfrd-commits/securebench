control:
  id: CIS-1.2.1.3
  benchmark_id: cis-ubuntu-24.04
  title: Ensure access to gpg key files are configured
  description: GPG key files are cryptographic keys used by APT to verify the authenticity and integrity
    of software packages. Each key ensures that packages come from a trusted source and have not been
    tampered with. These keys are typically stored in keyring directories `/etc/apt/trusted.gpg.d` or
    `/usr/share/keyrings` and referenced in repository configuration files using the `signed-by` option
    for secure package verification.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.1_2_1_3.audit
  remediation: cis.ubuntu.24.04.v2_0_0.1_2_1_3.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.1_2_1_3.rollback
  verification: cis.ubuntu.24.04.v2_0_0.1_2_1_3.verify
  rollback_capability: unsupported
