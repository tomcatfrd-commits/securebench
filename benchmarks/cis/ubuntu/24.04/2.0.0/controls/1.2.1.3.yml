    parent: CIS _1_Package Management Main | 2.2.3-Ensure access to gpg key files are configured
    rationale: ''
    impact: The `apt-key` command is deprecated, and you should manage keyring files individually in the
      `trusted.gpg.d` directory instead. This change is due to security concerns with the way `apt-key`
      works, as it adds keys to the `/etc/apt/trusted.gpg` file, which can lead to potential security
      issues.
    audit_guidance: "1. Run the following script to verify all `.gpg` key files in `/usr/share/keyrings/`\
      \ and `/etc/apt/trusted.gpg.d` are mode `0644` or more restrictive, are owned by the user `root`,\
      \ and group owned by the group `root`:\r\n\r\n```\r\n#! /usr/bin/env bash\r\n\r\n{\r\n   while IFS=\
      \ read -r -d $'\\0' l_file; do\r\n      stat -Lc 'File: %n Mode: (%#a) User: (%U) Group: (%G)' \"\
      $l_file\"\r\n   done < <(find -L /usr/share/keyrings/ /etc/apt/trusted.gpg.d/ \\\r\n   -mount -xdev\
      \ -type f \\( ! -user root -o ! -group root -o -perm /133 \\) \\\r\n   -name '*gpg' -print0)\r\n\
      }\r\n```\r\n\r\nNothing should be returned.\r\n\r\n2. Run the following script to verify key files\
      \ ending in `.list` or `.sources`, that include the `signed-by` option, are mode `0644` or more\
      \ restrictive, are owned by the user `root`, and group owned by the group `root`:\r\n\r\n```\r\n\
      #!/usr/bin/env bash\r\n\r\n{\r\n   while IFS= read -r -d $'\\0' l_file; do\r\n      grep -PRiLs\
      \ -- '^([^#\\n\\r]+)?\\bSigned-By\\b' \"$l_file\" && \\\r\n      stat -Lc 'File: %n Mode: (%#a)\
      \ User: (%U) Group: (%G)' \"$l_file\"\r\n   done < <(find -L /etc/apt/sources.list.d/ -mount -xdev\
      \ -type f \\\r\n   \\( ! -user root -o ! -group root -o -perm /133 \\) \\\r\n   \\( -name '*.list'\
      \ -o -name '*.sources' \\) -print0)\r\n}\r\n```\r\n\r\nNothing should be returned."
    remediation_guidance: "Run the following commands to update the access to any file(s) returned in\
      \ the audit steps above:\r\n\r\n```\r\n# chown root:root \"/absolute/path/to/file\"\r\n# chmod \
      \ u-x,go-wx \"/absolute/path/to/file\"\r\n```\r\n\r\n_Example_\r\n```\r\n# chown root:root /usr/share/keyrings/debian-archive-trixie-security-automatic.gpg\r\
      \n# chmod  u-x,go-wx /usr/share/keyrings/debian-archive-trixie-security-automatic.gpg\r\n```\r\n\
      \r\n**Note**: APT first checks keys specified with the `signed-by` option in a repository's `.sources`\
      \ or `.list` files. If no key is specified there, it falls back to administrator-managed keyrings\
      \ in `/etc/apt/trusted.gpg.d`, then system-wide keyrings in `/usr/share/keyrings`."
    additional_information: ''
    default_value: "```\r\nAccess: (644/-rw-r--r--) Uid: ( 0/ root) Gid: ( 0/ root)\r\n```"
