control:
  id: CIS-3.1.3
  benchmark_id: cis-ubuntu-24.04
  title: Ensure bluetooth services are not in use
  description: Bluetooth is a short-range wireless technology standard that is used for exchanging data
    between devices over short distances. It employs UHF radio waves in the ISM bands, from 2.402 GHz
    to 2.48 GHz. It is mainly used as an alternative to wire connections.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.3_1_3.audit
  remediation: cis.ubuntu.24.04.v2_0_0.3_1_3.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.3_1_3.rollback
