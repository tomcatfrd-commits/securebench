    parent: CIS _7_System File Permissions Main | 2.1.8-Ensure access to /etc/gshadow- is configured
    rationale: It is critical to ensure that the `/etc/gshadow-` file is protected from unauthorized access.
      Although it is protected by default, the file permissions could be changed either inadvertently
      or through malicious actions.
    impact: ''
    audit_guidance: "Run the following command to verify `/etc/gshadow-` is mode 640 or more restrictive,\
      \ `Uid` is `0/root` and `Gid` is `0/root` or `{GID}/shadow`:\r\n\r\n```\r\n# stat -Lc 'Access: (%#a/%A)\
      \  Uid: ( %u/ %U) Gid: ( %g/ %G)'  /etc/gshadow-\r\n```\r\n\r\n_Example:_\r\n```\r\nAccess: (0640/-rw-r-----)\
      \  Uid: ( 0/ root) Gid: ( 42/ shadow)\r\n```\r\n\r\n**Note:** If `/etc/gshadow-` does not exist\
      \ this is considered a passing state"
    remediation_guidance: "Run **one** of the following commands to set ownership of `/etc/gshadow-` to\
      \ `root` and group to either `root` or `shadow`:\r\n```\r\n# chown root:shadow /etc/gshadow-\r\n\
      \  -OR-\r\n# chown root:root /etc/gshadow-\r\n```\r\n\r\nRun the following command to remove excess\
      \ permissions form `/etc/gshadow-`:\r\n```\r\n# chmod u-x,g-wx,o-rwx /etc/gshadow-\r\n```"
    additional_information: ''
    default_value: 'Access: (0640/-rw-r-----)  Uid: ( 0/ root) Gid: ( 42/ shadow)'
