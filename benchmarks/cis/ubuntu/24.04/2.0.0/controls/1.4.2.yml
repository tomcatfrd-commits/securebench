control:
  id: CIS-1.4.2
  benchmark_id: cis-ubuntu-24.04
  title: Ensure access to bootloader config is configured
  description: The grub configuration file contains information on boot settings and passwords for unlocking
    boot options.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.1_4_2.audit
  remediation: cis.ubuntu.24.04.v2_0_0.1_4_2.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.1_4_2.rollback
  verification: cis.ubuntu.24.04.v2_0_0.1_4_2.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 1.4.2
      url: https://workbench.cisecurity.org/sections/4177276/recommendations/7047689
    assessment_status: automated
    profiles:
    - Level 1 - Server
    - Level 1 - Workstation
    mappings:
      nist:
      - AC-3
      cis_v8:
      - '3.3'
      cis_v7:
      - '14.6'
      mitre_techniques:
      - T1542
      - T1542.000
      mitre_tactics:
      - TA0005
      - TA0007
      mitre_mitigations:
      - M1022
    parent: CIS _1_ Configure Bootloader Main | 2.1.2-Ensure access to bootloader config is configured
    rationale: Setting the permissions to read and write for root only prevents non-root users from seeing
      the boot parameters or changing them. Non-root users who read the boot parameters may be able to
      identify weaknesses in security upon boot and be able to exploit them.
    impact: ''
    audit_guidance: "Run the following command and verify `Uid` and `Gid` are both `0/root` and `Access`\
      \ is `0600` or more restrictive.\r\n\r\n```\r\n# stat -Lc 'Access: (%#a/%A)  Uid: ( %u/ %U) Gid:\
      \ ( %g/ %G)' /boot/grub/grub.cfg\r\n\r\nAccess: (0600/-rw-------)  Uid: ( 0/ root) Gid: ( 0/ root)\r\
      \n```"
    remediation_guidance: "Run the following commands to set permissions on your grub configuration:\r\
      \n\r\n```\r\n# chown root:root /boot/grub/grub.cfg\r\n# chmod u-x,go-rwx /boot/grub/grub.cfg\r\n\
      ```"
    additional_information: "This recommendation is designed around the grub bootloader, if LILO or another\
      \ bootloader is in use in your environment enact equivalent settings.\r\n\r\nReplace `/boot/grub/grub.cfg`\
      \ with the appropriate grub configuration file for your environment"
    default_value: 'Access: (0644/-rw-r--r--)  Uid: ( 0/ root) Gid: ( 0/ root)'
    artifacts_count: 3
    requirements: {}
    safety:
      default: investigate
      implementation_status: guidance_only
      reason: Imported CIS guidance has not yet been promoted to a reviewed SecureBench implementation.
  dependencies: []
  conflicts: []
