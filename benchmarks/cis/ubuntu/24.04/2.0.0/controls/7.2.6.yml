control:
  id: CIS-7.2.6
  benchmark_id: cis-ubuntu-24.04
  title: Ensure no duplicate GIDs exist
  description: Although the `groupadd` program will not let you create a duplicate Group ID (GID), it
    is possible for an administrator to manually edit the `/etc/group` file and change the GID field.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.7_2_6.audit
  remediation: cis.ubuntu.24.04.v2_0_0.7_2_6.remediate
