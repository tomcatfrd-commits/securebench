    parent: CIS _7_Local User and Group Settings Main | 2.1.5-Ensure no duplicate GIDs exist
    rationale: User groups must be assigned unique GIDs for accountability and to ensure appropriate access
      protections.
    impact: ''
    audit_guidance: "Run the following script and verify no results are returned:\r\n\r\n```\r\n#!/usr/bin/env\
      \ bash\r\n\r\n{\r\n   while read -r l_count l_gid; do\r\n      if [ \"$l_count\" -gt 1 ]; then\r\
      \n      echo -e \"Duplicate GID: \\\"$l_gid\\\" Groups: \\\"$(awk -F: '($3 == n) { print $1 }' n=$l_gid\
      \ /etc/group | xargs)\\\"\"\r\n    fi\r\n  done < <(cut -f3 -d\":\" /etc/group | sort -n | uniq\
      \ -c)\r\n} \r\n```"
    remediation_guidance: Based on the results of the audit script, establish unique GIDs and review all
      files owned by the shared GID to determine which group they are supposed to belong to.
    additional_information: You can also use the `grpck` command to check for other inconsistencies in
      the `/etc/group` file.
    default_value: ''
