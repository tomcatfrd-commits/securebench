    parent: CIS _6_Configure Integrity Checking Main | 2.2.2-Ensure filesystem integrity is regularly
      checked
    rationale: Periodic file checking allows the system administrator to determine on a regular basis
      if critical files have been changed in an unauthorized fashion.
    impact: ''
    audit_guidance: "Run the following command:\r\n\r\n```\r\n# systemctl list-unit-files | awk '$1~/^dailyaidecheck\\\
      .(timer|service)$/{print $1 \"\\t\" $2}'\r\n```\r\n\r\n_Example output:_\r\n```\r\ndailyaidecheck.service\
      \  static\r\ndailyaidecheck.timer    enabled\r\n```\r\n\r\nVerify `dailyaidecheck.timer` is `enabled`\
      \ and `dailyaidecheck.service` is either `static` or `enabled`.\r\n\r\nRun the following command\
      \ to verify `dailyaidecheck.timer` is `active`:\r\n\r\n```\r\n# systemctl is-active dailyaidecheck.timer\r\
      \n\r\nactive\r\n```"
    remediation_guidance: "Run the following command to unmask `dailyaidecheck.timer` and `dailyaidecheck.service`:\r\
      \n\r\n```\r\n# systemctl unmask dailyaidecheck.timer dailyaidecheck.service\r\n```\r\n\r\nRun the\
      \ following command to enable and start `dailyaidecheck.timer`:\r\n\r\n```\r\n# systemctl --now\
      \ enable dailyaidecheck.timer\r\n```"
    additional_information: "The checking in this recommendation occurs every day at 5am. Alter the frequency\
      \ and time of the checks in compliance with site policy\r\n\r\nsystemd timers, timer file `aidecheck.timer`\
      \ and service file `aidecheck.service`, have been included as an optional alternative to using `cron`\r\
      \n\r\nUbuntu advises using `/usr/bin/aide.wrapper` rather than calling `/usr/bin/aide` directly\
      \ in order to protect the database and prevent conflicts"
    default_value: ''
