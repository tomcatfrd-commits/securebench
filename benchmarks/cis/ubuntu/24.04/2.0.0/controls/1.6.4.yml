control:
  id: CIS-1.6.4
  benchmark_id: cis-ubuntu-24.04
  title: Ensure pam_motd is configured
  description: "`pam_motd` is a PAM module that can be used to display arbitrary `MOTD` (message of the\
    \ day) files after a successful login. By default, `pam_motd` shows files in the following locations:\r\
    \n\r\n- `/etc/motd`\r\n- `/run/motd`\r\n- `/usr/lib/motd`\r\n- `/etc/motd.d/`\r\n- `/run/motd.d/`\r\
    \n- `/usr/lib/motd.d/`\r\n\r\nIf `/etc/motd` does not exist, then `/run/motd` is shown. If `/run/motd`\
    \ does not exist, then `/usr/lib/motd` is shown.\r\n\r\nSimilar overriding behavior applies to the\
    \ directories. Files in `/etc/motd.d/` override files with the same name in `/run/motd.d/` and `/usr/lib/motd.d/`.\
    \ Files in `/run/motd.d/` override files with the same name\r\nin `/usr/lib/motd.d/`.\r\n\r\nFiles\
    \ in the directories listed above are displayed in lexicographic order by name. Moreover, the files\
    \ are filtered by reading them with the credentials of the target user authenticating on the system."
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.1_6_4.audit
  remediation: cis.ubuntu.24.04.v2_0_0.1_6_4.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.1_6_4.rollback
