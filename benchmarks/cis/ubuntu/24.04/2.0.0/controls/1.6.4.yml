    parent: CIS _1_Configure Command Line Warning Banners Main | 1.2.4-Ensure pam_motd is configured
    rationale: Warning messages inform users who are attempting to login to the system of their legal
      status regarding the system and must include the name of the organization that owns the system and
      any monitoring policies that are in place. Displaying OS and patch level information in login banners
      also has the side effect of providing detailed system information to attackers attempting to target
      specific exploits of a system. Authorized users can easily get this information by running the "
      `uname -a` " command once they have logged in.
    impact: ''
    audit_guidance: "Run the following script to verify that `motd=` is explicitly set for `pam_motd`:\r\
      \n```\r\n#!/usr/bin/env bash\r\n\r\nfor svc in sshd login su gdm-password; do\r\n   if [[ -f \"\
      /etc/pam.d/$svc\" ]]; then\r\n      file=\"/etc/pam.d/$svc\"\r\n  elif [[ -f \"/usr/lib/pam.d/$svc\"\
      \ ]]; then\r\n      file=\"/usr/lib/pam.d/$svc\"\r\n  else\r\n      continue\r\n   fi\r\n    \r\n\
      \    while IFS= read -r line; do\r\n       while IFS= read -r motd_path; do\r\n       motd_path=\"\
      ${motd_path%\\\"}\"; motd_path=\"${motd_path#\\\"}\"\r\n       motd_path=\"${motd_path%\\'}\"; motd_path=\"\
      ${motd_path#\\'}\"\r\n      \r\n        [[ -r \"$motd_path\" ]] || continue\r\n        \r\n    \
      \    if grep -Pi -- \"(\\\\\\v|\\\\\\r|\\\\\\m|\\\\\\s|\\b$(grep ^ID= /etc/os-release | cut -d=\
      \ -f2 | sed -e 's/\"//g')\\b)\" \"$motd_path\"; then\r\n           printf '%s\\n%s\\nmotd=%s\\n\\\
      n' \"$file\" \"$line\" \"$motd_path\"\r\n        fi\r\n      done < <(printf '%s\\n' \"$line\" |\
      \ grep -oP '\\bmotd=\\K\"[^\"]+\"|\\bmotd=\\K'\\''[^'\\'']+'\\''|\\bmotd=\\K\\S+')\r\n   done <\
      \ <(grep -Pi '^\\h*session\\h+(required|optional)\\h+pam_motd\\.so\\b.*\\bmotd=' \"$file\" 2>/dev/null)\r\
      \ndone  \r\n```\r\nNothing should be returned\r\n\r\n**Note:** Entries in `/etc/pam.d/` overrides\
      \ vendor defaults in `/usr/lib/pam.d` directories"
    remediation_guidance: Edit the `MOTD` file with the appropriate contents according to your site policy,
      remove any instances of `\m , \r , \s , \v` or references to the `OS platform`
