control:
  id: CIS-6.2.3.5
  benchmark_id: cis-ubuntu-24.04
  title: Ensure events that modify sethostname and setdomainname are collected
  description: "Record changes to network environment files or system calls. The below parameters monitors\
    \ the following system calls, and write an audit event on system call exit:\r\n- `sethostname` - set\
    \ the systems host name\r\n- `setdomainname` - set the systems domain name"
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.6_2_3_5.audit
  remediation: cis.ubuntu.24.04.v2_0_0.6_2_3_5.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.6_2_3_5.rollback
  verification: cis.ubuntu.24.04.v2_0_0.6_2_3_5.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 6.2.3.5
      url: https://workbench.cisecurity.org/sections/4203192/recommendations/7091552
    assessment_status: automated
    profiles:
    - Level 2 - Server
    - Level 2 - Workstation
    mappings:
      nist:
      - AU-3
      - CM-6
      cis_v8:
      - '8.5'
      cis_v7:
      - '5.5'
      mitre_techniques:
      - T1562
      - T1562.006
      mitre_tactics:
      - TA0003
      mitre_mitigations:
      - M1047
    parent: CIS _6_System Auditing Main | 2.2.3.5-Ensure events that modify sethostname and setdomainname
      are collected
    rationale: Monitoring `sethostname` and `setdomainname` will identify potential unauthorized changes
      to host and domain name of a system. The changing of these names could potentially break security
      parameters that are set based on those names.
    impact: ''
    audit_guidance: "1. Run the following command to verify a rule exists in the running configuration:\r\
      \n\r\n```\r\n# auditctl -l | grep -Ps -- 'sethostname|setdomainname'\r\n```\r\n\r\nVerify the output\
      \ matches:\r\n\r\n```\r\n-a always,exit -F arch=b32 -S sethostname,setdomainname -k system-locale\r\
      \n-a always,exit -F arch=b64 -S sethostname,setdomainname -k system-locale\r\n```\r\n\r\n2. Run\
      \ the following command to verify a rule exists in a rules file:\r\n\r\n```\r\n# grep -Ps -- 'sethostname|setdomainname'\
      \ /etc/audit/rules.d/*.rules\r\n```\r\n\r\n_Example output_:\r\n```\r\n/etc/audit/rules.d/50-system_locale.rules:-a\
      \ always,exit -F arch=b32 -S sethostname,setdomainname -k system-locale\r\n/etc/audit/rules.d/50-system_locale.rules:-a\
      \ always,exit -F arch=b64 -S sethostname,setdomainname -k system-locale\r\n```"
    remediation_guidance: "1. Edit or create a file in the `/etc/audit/rules.d/` directory, ending in\
      \ `.rules` extension, with the relevant rules to monitor events that modify the system's network\
      \ environment.\r\n\r\nExample:\r\n```\r\n# printf \"\r\n-a always,exit -F arch=b64 -S sethostname,setdomainname\
      \ -k system-locale\r\n-a always,exit -F arch=b32 -S sethostname,setdomainname -k system-locale\r\
      \n\" >> /etc/audit/rules.d/50-system_locale.rules\r\n```\r\n\r\n2. Merge and load the rules into\
      \ active configuration:\r\n```\r\n# augenrules --load\r\n```\r\n\r\n3. Check if reboot is required:\r\
      \n```\r\n# if [[ $(auditctl -s | grep \"enabled\") =~ \"2\" ]]; then printf \"Reboot required to\
      \ load rules\\n\"; fi\r\n```"
    additional_information: ''
    default_value: ''
    artifacts_count: 2
    requirements: {}
    safety:
      default: investigate
      implementation_status: guidance_only
      reason: Imported CIS guidance has not yet been promoted to a reviewed SecureBench implementation.
