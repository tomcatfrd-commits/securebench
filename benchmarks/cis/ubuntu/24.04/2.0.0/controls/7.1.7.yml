  id: CIS-7.1.7
  benchmark_id: cis-ubuntu-24.04
  title: Ensure access to /etc/gshadow is configured
  description: The `/etc/gshadow` file is used to store the information about groups that is critical
    to the security of those accounts, such as the hashed password and other security information.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.7_1_7.audit
