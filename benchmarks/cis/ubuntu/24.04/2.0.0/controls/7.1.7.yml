    parent: CIS _7_System File Permissions Main | 2.1.7-Ensure access to /etc/gshadow is configured
    rationale: If attackers can gain read access to the `/etc/gshadow` file, they can easily run a password
      cracking program against the hashed password to break it. Other security information that is stored
      in the `/etc/gshadow` file (such as group administrators) could also be useful to subvert the group.
    impact: ''
    audit_guidance: "Run the following command to verify `/etc/gshadow` is mode 640 or more restrictive,\
      \ `Uid` is `0/root` and `Gid` is `0/root` or `{GID}/shadow`:\r\n\r\n```\r\n# stat -Lc 'Access: (%#a/%A)\
      \  Uid: ( %u/ %U) Gid: ( %g/ %G)'  /etc/gshadow\r\n```\r\n\r\n_Example:_\r\n```\r\nAccess: (0640/-rw-r-----)\
      \  Uid: ( 0/ root) Gid: ( 42/ shadow)\r\n```\r\n\r\n**Note:** `/etc/gshadow` may not exist by default.\
      \ Security best practice recommends creating `/etc/gshadow` to ensure hashed group passwords are\
      \ not stored in `/etc/group`"
    remediation_guidance: "**- IF -** `/etc/gshadow` does not exist run the following command to convert\
      \ group entries and create `/etc/gshadow` if needed:\r\n```\r\n# grpconv\r\n```\r\n\r\nRun **one**\
      \ of the following commands to set ownership of `/etc/gshadow` to `root` and group to either `root`\
      \ or `shadow`:\r\n```\r\n# chown root:shadow /etc/gshadow\r\n  -OR-\r\n# chown root:root /etc/gshadow\r\
      \n```\r\n\r\nRun the following command to remove excess permissions form `/etc/gshadow`:\r\n```\r\
      \n# chmod u-x,g-wx,o-rwx /etc/gshadow\r\n```"
    additional_information: ''
    default_value: 'Access: (0640/-rw-r-----)  Uid: ( 0/ root) Gid: ( 42/ shadow)'
