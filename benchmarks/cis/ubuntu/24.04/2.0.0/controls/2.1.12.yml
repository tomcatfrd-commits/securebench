control:
  id: CIS-2.1.12
  benchmark_id: cis-ubuntu-24.04
  title: Ensure network file system services are not in use
  description: The Network File System (NFS) is one of the first and most widely distributed file systems
    in the UNIX environment. It provides the ability for systems to mount file systems of other servers
    through the network.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.2_1_12.audit
