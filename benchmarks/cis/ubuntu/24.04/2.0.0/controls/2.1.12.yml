    parent: CIS _2_Configure Server Services Main | 2.1.12-Ensure network file system services are not
      in use
    rationale: If the system does not export NFS shares, it is recommended that the `nfs-kernel-server`
      package be removed to reduce the remote attack surface.
    impact: "There may be packages that are dependent on the `nfs-kernel-server` package. If the `nfs-kernel-server`\
      \ package is removed, these dependent packages will be removed as well. Before removing the `nfs-kernel-server`\
      \ package, review any dependent packages to determine if they are required on the system.\r\n\r\n\
      **- IF -** a dependent package is required: stop and mask the `nfs-server.service`  leaving the\
      \ `nfs-kernel-server` package installed."
    audit_guidance: "Run the following command to verify `nfs-kernel-server` is not installed:\r\n\r\n\
      ```\r\n# dpkg-query -s nfs-kernel-server &>/dev/null && echo \"nfs-kernel-server is installed\"\r\
      \n```\r\n\r\nNothing should be returned.\r\n\r\n**- OR -** \r\n\r\n**- IF -** package is required\
      \ for dependencies: \r\n\r\nRun the following command to verify that the `nfs-server.service` is\
      \ not enabled:\r\n\r\n```\r\n# systemctl is-enabled nfs-server.service 2>/dev/null | grep 'enabled'\r\
      \n\r\nNothing should be returned\r\n```\r\n\r\nRun the following command to verify the `nfs-server.service`\
      \ is not active:\r\n\r\n```\r\n# systemctl is-active nfs-server.service 2>/dev/null | grep '^active'\r\
      \n\r\nNothing should be returned\r\n```\r\n\r\n**Note:** If the package is required for a dependency\r\
      \n - Ensure the dependent package is approved by local site policy\r\n - Ensure stopping and masking\
      \ the service and/or socket meets local site policy"
    remediation_guidance: "Run the following command to stop `nfs-server.service` and remove `nfs-kernel-server`\
      \ package:\r\n\r\n```\r\n# systemctl stop nfs-server.service\r\n# apt purge nfs-kernel-server\r\n\
      ```\r\n\r\n**- OR -**\r\n\r\n**- IF -** the `nfs-kernel-server` package is required as a dependency:\r\
      \n\r\nRun the following commands to stop and mask the `nfs-server.service`:\r\n\r\n```\r\n# systemctl\
      \ stop nfs-server.service\r\n# systemctl mask nfs-server.service\r\n```"
