control:
  id: CIS-5.4.2.8
  benchmark_id: cis-ubuntu-24.04
  title: Ensure accounts without a valid login shell are locked
  description: There are a number of accounts provided with most distributions that are used to manage
    applications and are not intended to provide an interactive shell. Furthermore, a user may add special
    accounts that are not intended to provide an interactive shell.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_4_2_8.audit
  remediation: cis.ubuntu.24.04.v2_0_0.5_4_2_8.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.5_4_2_8.rollback
  verification: cis.ubuntu.24.04.v2_0_0.5_4_2_8.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 5.4.2.8
      url: https://workbench.cisecurity.org/sections/4177297/recommendations/7047799
    assessment_status: automated
    profiles:
    - Level 1 - Server
    - Level 1 - Workstation
    mappings:
      nist:
      - AC-11
      - AC-2(5)
      - AC-3
      - MP-2
