    parent: CIS _5_Configure root and system accounts and environment Main | 1.1.2.8-Ensure accounts without
      a valid login shell are locked
    rationale: It is important to make sure that accounts that are not being used by regular users are
      prevented from being used to provide an interactive shell. By default, most distributions set the
      password field for these accounts to an invalid string, but it is also recommended that the shell
      field in the password file be set to the `nologin` shell. This prevents the account from potentially
      being used to run any commands.
    impact: ''
    audit_guidance: "Run the following script to verify all non-root accounts without a valid login shell\
      \ are locked.\r\n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n   l_valid_shells=\"^($(awk -F\\/ '$NF\
      \ != \"nologin\" {print}' /etc/shells | sed -rn '/^\\//{s,/,\\\\\\\\/,g;p}' | paste -s -d '|' -\
      \ ))$\"\r\n   while IFS= read -r l_user; do\r\n      passwd -S \"$l_user\" | awk '$2 !~ /^L/ {print\
      \ \"Account: \\\"\" $1 \"\\\" does not have a valid login shell and is not locked\"}'\r\n   done\
      \ < <(awk -v pat=\"$l_valid_shells\" -F: '($1 != \"root\" && $(NF) !~ pat) {print $1}' /etc/passwd)\r\
      \n}\r\n```\r\n\r\nNothing should be returned"
    remediation_guidance: "Run the following command to lock any non-root accounts without a valid login\
      \ shell returned by the audit:\r\n\r\n```\r\n# usermod -L ```\r\n\r\n_Example script:_:\r\n\r\n\
      ```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n   l_valid_shells=\"^($(awk -F\\/ '$NF != \"nologin\" {print}'\
      \ /etc/shells | sed -rn '/^\\//{s,/,\\\\\\\\/,g;p}' | paste -s -d '|' - ))$\"\r\n   while IFS= read\
      \ -r l_user; do\r\n      passwd -S \"$l_user\" | awk '$2 !~ /^L/ {system (\"usermod -L \" $1)}'\r\
      \n   done < <(awk -v pat=\"$l_valid_shells\" -F: '($1 != \"root\" && $(NF) !~ pat) {print $1}' /etc/passwd)\r\
      \n}\r\n```"
    additional_information: ''
