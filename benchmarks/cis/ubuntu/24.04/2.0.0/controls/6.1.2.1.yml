    parent: CIS _6_System Logging Main | 2.2.2.1-Ensure rsyslog is installed
    rationale: The security enhancements of `rsyslog` such as connection-oriented (i.e. TCP) transmission
      of logs, the option to log to database formats, and the encryption of log data en route to a central
      logging server) justify installing and configuring the package.
    impact: ''
    audit_guidance: "**- IF -** `rsyslog` is being used for logging on the system:\r\n\r\nRun the following\
      \ command to verify `rsyslog` is installed:\r\n\r\n```\r\n# dpkg-query -s rsyslog &>/dev/null &&\
      \ echo \"rsyslog is installed\"\r\n```\r\n\r\nVerify the output matches:\r\n\r\n```\r\nrsyslog is\
      \ installed\r\n```"
    remediation_guidance: "Run the following command to install `rsyslog`:\r\n\r\n```\r\n# apt install\
      \ rsyslog\r\n```"
