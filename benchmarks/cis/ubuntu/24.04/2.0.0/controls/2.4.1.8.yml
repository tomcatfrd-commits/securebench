control:
  id: CIS-2.4.1.8
  benchmark_id: cis-ubuntu-24.04
  title: Ensure access to /etc/cron.d is configured
  description: The `/etc/cron.d` directory contains system `cron` jobs that need to run in a similar manner
    to the hourly, daily weekly and monthly jobs from `/etc/crontab`, but require more granular control
    as to when they run. The files in this directory cannot be manipulated by the `crontab` command but
    are instead edited by system administrators using a text editor. The commands below restrict read/write
    and search access to user and group root, preventing regular users from accessing this directory.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.2_4_1_8.audit
  remediation: cis.ubuntu.24.04.v2_0_0.2_4_1_8.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.2_4_1_8.rollback
  verification: cis.ubuntu.24.04.v2_0_0.2_4_1_8.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 2.4.1.8
      url: https://workbench.cisecurity.org/sections/4177287/recommendations/7047764
    assessment_status: automated
    profiles:
    - Level 1 - Server
    - Level 1 - Workstation
    mappings:
      nist:
      - AC-3
      cis_v8:
      - '3.3'
      cis_v7:
      - '14.6'
      mitre_techniques:
      - T1053
      - T1053.003
      mitre_tactics:
      - TA0002
      - TA0007
      mitre_mitigations:
      - M1018
    parent: CIS _2_Configure cron Main | 1.1.2.8-Ensure access to /etc/cron.d is configured
    rationale: Granting write access to this directory for non-privileged users could provide them the
      means for gaining unauthorized elevated privileges. Granting read access to this directory could
      give an unprivileged user insight in how to gain elevated privileges or circumvent auditing controls.
    impact: ''
    audit_guidance: "**- IF -** cron is installed on the system:\r\n\r\nRun the following command and\
      \ verify `Uid`  and `Gid`  are both `0/root` and `Access` does not grant permissions to `group`\
      \ or `other`:\r\n\r\n```\r\n# stat -Lc 'Access: (%a/%A) Uid: ( %u/ %U) Gid: ( %g/ %G)' /etc/cron.d/\r\
      \n\r\nAccess: (700/drwx------) Uid: ( 0/ root) Gid: ( 0/ root)\r\n```"
    remediation_guidance: "**- IF -** cron is installed on the system:\r\n\r\nRun the following commands\
      \ to set ownership and permissions on the `/etc/cron.d` directory:\r\n\r\n```\r\n# chown root:root\
      \ /etc/cron.d/\r\n# chmod og-rwx /etc/cron.d/\r\n```"
    additional_information: ''
    default_value: 'Access: (755/drwxr-xr-x) Uid: ( 0/ root) Gid: ( 0/ root)'
    artifacts_count: 5
    requirements: {}
    safety:
      default: investigate
      implementation_status: guidance_only
      reason: Imported CIS guidance has not yet been promoted to a reviewed SecureBench implementation.
  dependencies: []
  conflicts: []
