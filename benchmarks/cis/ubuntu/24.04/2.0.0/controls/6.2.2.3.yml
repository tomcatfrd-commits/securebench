    parent: CIS _6_System Auditing Main | 2.2.2.3-Ensure system is disabled when audit logs are full
    rationale: In high security contexts, the risk of detecting unauthorized access or nonrepudiation
      exceeds the benefit of the system's availability.
    impact: "`disk_full_action` parameter:\r\n- Set to `halt` - the `auditd` daemon will shutdown the\
      \ system when the disk partition containing the audit logs becomes full.\r\n- Set to `single` -\
      \ the `auditd` daemon will put the computer system in single user mode when the disk partition containing\
      \ the audit logs becomes full.\r\n\r\n`disk_error_action` parameter:\r\n- Set to `halt` - the `auditd`\
      \ daemon will shutdown the system when an error is detected on the partition that holds the audit\
      \ log files.\r\n- Set to `single` - the `auditd` daemon will put the computer system in single user\
      \ mode when an error is detected on the partition that holds the audit log files.\r\n- Set to `syslog`\
      \ - the `auditd` daemon will issue no more than 5 consecutive warnings to syslog when an error is\
      \ detected on the partition that holds the audit log files."
    audit_guidance: "Run the following command and verify the `disk_full_action` is set to either `halt`\
      \ or `single`:\r\n\r\n```\r\n# grep -Pi -- '^\\h*disk_full_action\\h*=\\h*(halt|single)\\b' /etc/audit/auditd.conf\r\
      \n\r\ndisk_full_action = ```\r\n\r\nRun the following command and verify the `disk_error_action`\
      \ is set to `syslog`, `single`, or `halt`:\r\n\r\n```\r\n# grep -Pi -- '^\\h*disk_error_action\\\
      h*=\\h*(syslog|single|halt)\\b' /etc/audit/auditd.conf\r\n\r\ndisk_error_action = ```"
    remediation_guidance: "Set one of the following parameters in `/etc/audit/auditd.conf` depending on\
      \ your local security policies. \r\n\r\n```\r\ndisk_full_action = disk_error_action = ```\r\n\r\n\
      _Example:_\r\n\r\n```\r\ndisk_full_action = halt\r\ndisk_error_action = halt\r\n```"
