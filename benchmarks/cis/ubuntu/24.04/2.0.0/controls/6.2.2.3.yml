control:
  id: CIS-6.2.2.3
  benchmark_id: cis-ubuntu-24.04
  title: Ensure system is disabled when audit logs are full
  description: "The `auditd` daemon can be configured to halt the system or put the system in single user\
    \ mode, if no free space is available or an error is detected on the partition that holds the audit\
    \ log files.\r\n\r\nThe `disk_full_action` parameter tells the system what action to take when no\
    \ free space is available on the partition that holds the audit log files. Valid values are `ignore`,\
    \ `syslog`, `rotate`, `exec`, `suspend`, `single`, and `halt`.\r\n- `ignore`, the audit daemon will\
    \ issue a syslog message but no other action is taken\r\n- `syslog`, the audit daemon will issue a\
    \ warning to syslog\r\n- `rotate`, the audit daemon will rotate logs, losing the oldest to free up\
    \ space\r\n- `exec`,   /path-to-script will execute the script. You cannot pass parameters to the\
    \ script. The script is also responsible for telling the auditd daemon to resume logging once its\
    \ completed its action\r\n- `suspend`, the audit daemon will stop writing records to the disk\r\n\
    - `single`, the audit daemon will put the computer system in single user mode\r\n- `halt`, the audit\
    \ daemon will shut down the system\r\n\r\nThe `disk_error_action` parameter tells the system what\
    \ action to take when an error is detected on the partition that holds the audit log files. Valid\
    \ values are `ignore`, `syslog`, `exec`, `suspend`, `single`, and `halt`.\r\n- `ignore`, the audit\
    \ daemon will not take any action\r\n- `syslog`, the audit daemon will issue no more than 5 consecutive\
    \ warnings to syslog\r\n- `exec`,   /path-to-script will execute the script. You cannot pass parameters\
    \ to the script\r\n- `suspend`, the audit daemon will stop writing records to the disk\r\n- `single`,\
    \ the audit daemon will put the computer system in single user mode\r\n- `halt`, the audit daemon\
    \ will shut down the system"
  platform: ubuntu-24.04
  severity: unspecified
