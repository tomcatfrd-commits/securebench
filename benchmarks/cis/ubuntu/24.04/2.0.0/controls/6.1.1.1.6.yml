control:
  id: CIS-6.1.1.1.6
  benchmark_id: cis-ubuntu-24.04
  title: Ensure journald Storage is configured
  description: Data from journald may be stored in volatile memory or persisted locally on the server.  Logs
    in memory will be lost upon a system reboot.  By persisting logs to local disk on the server they
    are protected from loss due to a reboot.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.6_1_1_1_6.audit
  remediation: cis.ubuntu.24.04.v2_0_0.6_1_1_1_6.remediate
