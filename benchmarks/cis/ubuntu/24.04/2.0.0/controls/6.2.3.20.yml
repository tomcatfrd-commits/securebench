control:
  id: CIS-6.2.3.20
  benchmark_id: cis-ubuntu-24.04
  title: Ensure session initiation information is collected
  description: "Monitor session initiation events. The parameters in this section track changes to the\
    \ files associated with session events.\r\n- `/var/run/utmp` - tracks all currently logged in users.\r\
    \n- `/var/log/wtmp` - file tracks logins, logouts, shutdown, and reboot events.\r\n- `/var/log/btmp`\
    \ - keeps track of failed login attempts and can be read by entering the command `/usr/bin/last -f\
    \ /var/log/btmp`.\r\n\r\nAll audit records will be tagged with the identifier \"session.\""
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.6_2_3_20.audit
  remediation: cis.ubuntu.24.04.v2_0_0.6_2_3_20.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.6_2_3_20.rollback
  verification: cis.ubuntu.24.04.v2_0_0.6_2_3_20.verify
  rollback_capability: unsupported
  metadata:
    source:
      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 6.2.3.20
      url: https://workbench.cisecurity.org/sections/4203192/recommendations/7091567
    assessment_status: automated
    profiles:
    - Level 2 - Server
    - Level 2 - Workstation
    mappings:
      nist:
      - AU-3
      cis_v8:
      - '8.5'
      cis_v7:
      - '4.9'
      - '16.13'
      mitre_techniques:
      - T1562
      - T1562.006
      mitre_tactics:
      - TA0001
      mitre_mitigations:
      - M1047
    parent: CIS _6_System Auditing Main | 2.2.3.20-Ensure session initiation information is collected
    rationale: Monitoring these files for changes could alert a system administrator to logins occurring
      at unusual hours, which could indicate intruder activity (i.e. a user logging in at a time when
      they do not normally log in).
    impact: ''
    audit_guidance: "1. Run the following command to verify a rule exists in the running configuration:\r\
      \n```\r\n# auditctl -l | grep -Ps -- '(\\/var\\/run\\/utmp|\\/var\\/log\\/wtmp|\\/var\\/log\\/btmp)'\r\
      \n```\r\n\r\nVerify the output matches:\r\n\r\n```\r\n-w /var/run/utmp -p wa -k session\r\n-w /var/log/wtmp\
      \ -p wa -k session\r\n-w /var/log/btmp -p wa -k session\r\n```\r\n2. Run the following command to\
      \ verify a rule exists in a rules file:\r\n\r\n```\r\n# grep -Ps -- '(\\/var\\/run\\/utmp|\\/var\\\
      /log\\/wtmp|\\/var\\/log\\/btmp)' /etc/audit/rules.d/*.rules\r\n```\r\n\r\n_Example Output:_\r\n\
      \r\n```\r\n/etc/audit/rules.d/50-session.rules:-w /var/run/utmp -p wa -k session\r\n/etc/audit/rules.d/50-session.rules:-w\
      \ /var/log/wtmp -p wa -k session\r\n/etc/audit/rules.d/50-session.rules:-w /var/log/btmp -p wa -k\
      \ session\r\n```"
    remediation_guidance: "1. Edit or create a file in the `/etc/audit/rules.d/` directory, ending in\
      \ `.rules` extension, with the relevant rules to monitor session initiation information.\r\n\r\n\
      _Example:_\r\n\r\n```\r\n# printf \"\r\n-w /var/run/utmp -p wa -k session\r\n-w /var/log/wtmp -p\
      \ wa -k session\r\n-w /var/log/btmp -p wa -k session\r\n\" >> /etc/audit/rules.d/50-session.rules\r\
      \n```\r\n\r\n2. Merge and load the rules into active configuration:\r\n\r\n```\r\n# augenrules --load\r\
      \n```\r\n\r\n3. Check if reboot is required.\r\n\r\n```\r\n# if [[ $(auditctl -s | grep \"enabled\"\
      ) =~ \"2\" ]]; then printf \"Reboot required to load rules\\n\"; fi\r\n```"
    additional_information: ''
    default_value: ''
    artifacts_count: 3
    requirements: {}
    safety:
