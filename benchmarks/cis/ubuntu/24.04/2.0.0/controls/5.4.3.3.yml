control:
  id: CIS-5.4.3.3
  benchmark_id: cis-ubuntu-24.04
  title: Ensure default user umask is configured
  description: "The user file-creation mode mask (`umask`) is used to determine the file permission for\
    \ newly created directories and files. In Linux, the default permissions for any newly created directory\
    \ is 0777 (`rwxrwxrwx`), and for any newly created file it is 0666 (`rw-rw-rw-`). The `umask` modifies\
    \ the default Linux permissions by restricting (masking) these permissions. The `umask` is not simply\
    \ subtracted, but is processed bitwise. Bits set in the `umask` are cleared in the resulting file\
    \ mode.\r\n\r\n`umask` can be set with either `Octal` or `Symbolic` values:\r\n- `Octal` (Numeric)\
    \ Value - Represented by either three or four digits. ie `umask 0027` or `umask 027`.  If a four digit\
    \ umask is used, the first digit is ignored. The remaining three digits effect the resulting permissions\
    \ for user, group, and world/other respectively.\r\n- `Symbolic` Value - Represented by a comma separated\
    \ list for User `u`, group `g`, and world/other `o`.  The permissions listed are not masked by `umask`.\
    \ ie a `umask` set by `umask u=rwx,g=rx,o=` is the `Symbolic` equivalent of the `Octal` `umask 027`.\
    \  This `umask` would set a newly created directory with file mode `drwxr-x---` and a newly created\
    \ file with file mode `rw-r-----`.\r\n\r\nThe default `umask` can be set to use the `pam_umask` module\
    \ or in a `System Wide Shell Configuration File`. The user creating the directories or files has the\
    \ discretion of changing the permissions via the chmod command, or choosing a different default `umask`\
    \ by adding the `umask` command into a `User Shell Configuration File`, ( `.bash_profile` or `.bashrc`),\
    \ in their home directory.\r\n\r\n**Setting the default umask:**\r\n- pam_umask module:\r\n  - will\
    \ set the umask according to the system default in `/etc/login.defs` and user settings, solving the\
    \ problem of different `umask` settings with different shells, display managers, remote sessions etc.\r\
    \n  - `umask= ` value in the `/etc/login.defs` file is interpreted as Octal\r\n  - Setting `USERGROUPS_ENAB`\
    \ to yes in `/etc/login.defs` (default):\r\n    - will enable setting of the `umask` group bits to\
    \ be the same as owner bits. (examples: 022 -> 002, 077 -> 007) for non-root users, if the `uid` is\
    \ the same as `gid`, and `username` is the same as the ` `\r\n    - userdel will remove the user's\
    \ group if it contains no more members, and useradd will create by default a group with the name of\
    \ the user\r\n- `System Wide Shell Configuration File`:\r\n  - `/etc/profile` - used to set system\
    \ wide environmental variables on users shells. The variables are sometimes the same ones that are\
    \ in the `.bash_profile`, however this file is used to set an initial PATH or PS1 for all shell users\
    \ of the system. **is only executed for interactive *login* shells, or shells executed with the --login\
    \ parameter.** \r\n  - `/etc/profile.d` - `/etc/profile` will execute the scripts within `/etc/profile.d/*.sh`.\
    \ It is recommended to place your configuration in a shell script within `/etc/profile.d` to set your\
    \ own system wide environmental variables.\r\n  - `/etc/bashrc` - System wide version of `.bashrc`.\
    \  In Fedora derived distributions, `etc/bashrc` also invokes /etc/profile.d/*.sh if *non-login* shell,\
    \ but redirects output to `/dev/null` if *non-interactive.* **Is only executed for *interactive* shells\
    \ or if `BASH_ENV` is set to `/etc/bashrc`.**\r\n\r\n**User Shell Configuration Files:**\r\n- `~/.bash_profile`\
    \ - Is executed to configure your shell before the initial command prompt. **Is only read by login\
    \ shells.**\r\n- `~/.bashrc` - Is executed for interactive shells. **only read by a shell that's both\
    \ interactive and non-login**\r\n\r\n`umask` is set by order of precedence. If `umask` is set in multiple\
    \ locations, this order of precedence will determine the system's default `umask`.\r\n \r\n**Order\
    \ of precedence:**\r\n1. A file in `/etc/profile.d/` ending in `.sh` - This will override any other\
    \ system-wide `umask` setting\r\n2. In the file `/etc/profile`\r\n3. On the `pam_umask.so` module\
    \ in `/etc/pam.d/postlogin`\r\n4. In the file `/etc/login.defs`\r\n5. In the file `/etc/default/login`"
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_4_3_3.audit
  remediation: cis.ubuntu.24.04.v2_0_0.5_4_3_3.remediate
