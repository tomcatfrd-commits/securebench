    parent: CIS _5_ User Accounts and Environment Main | 1.1.1.3-Ensure default user umask is configured
    rationale: "Setting a secure default value for `umask` ensures that users make a conscious choice\
      \ about their file permissions. A permissive `umask` value could result in directories or files\
      \ with excessive permissions that can be read and/or written to by unauthorized users.\r\n\r\nSatisfies:\
      \ SRG-OS-000480-GPOS-00228, SRG-OS-000480-GPOS-00227"
    impact: ''
    audit_guidance: "Run the following commands to verify the systemwide `umask` is `0027 (u=rwx,g=rx,o=)`\
      \ or more restrictive:\r\n\r\n1. Run the following command to verify `umask` is set to `027` or\
      \ more restrictive in a file ending in `.sh` in `/etc/profile.d/`\r\n\r\n```\r\n# grep -Psi -- '^\\\
      h*umask\\b' /etc/profile.d/*.sh\r\n```\r\n\r\n_Example output:_\r\n\r\n```\r\numask 027\r\n```\r\
      \n\r\n2. Run the following command to verify `UMASK` is `027` or more restrictive in `/etc/login.defs`:\r\
      \n\r\n```\r\n# grep -Psi -- '^\\h*UMASK\\b' /etc/login.defs\r\n```\r\n\r\n_Example output:_\r\n\r\
      \n```\r\nUMASK           027\r\n```"
    remediation_guidance: "1. Run the following script to comment out all occurrences of `umask` that\
      \ are less restrictive than `027` in files ending in `*.sh` in the `/etc/profile.d/` directory:\r\
      \n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n   while IFS= read -r -d $'\\0' l_file; do\r\n    \
      \  sed -ri '/^\\s*umask\\s+0?(0[01][0-7]|0[0-7][^7]|[^0][0-7][0-7])(\\s*|\\s+.*)$/s/^/# /' \"$l_file\"\
      \r\n   done < <(find /etc/profile.d/ -type f -name '*.sh' -print0)\r\n}\r\n```\r\n\r\n2. Create\
      \ or edit a file in `/etc/profile.d/` ending in `*.sh` and add or modify the following line:\r\n\
      \r\n```\r\numask 0027\r\n```\r\n\r\n_Example:_\r\n\r\n```\r\n# printf '%s\\n' \"\" \"umask 027\"\
      \ >> /etc/profile.d/60-default_umask.sh\r\n```\r\n\r\n3. Edit `/etc/login.defs` and add or update\
      \ the following line:\r\n\r\n```\r\nUMASK 027\r\n```\r\n\r\n**Notes:**\r\n- This method only applies\
      \ to bash and shell. If other shells are supported on the system, it is recommended that their configuration\
      \ files also are checked\r\n- If the `pam_umask.so` module is going to be used to set `umask`, ensure\
      \ that it's not being overridden by another setting. Refer to the PAM_UMASK(8) man page for more\
      \ information"
    additional_information: "- Other methods of setting a default user umask exist\r\n- If other methods\
      \ are in use in your environment they should be audited\r\n- The default user umask can be overridden\
      \ with a user specific umask\r\n- The user creating the directories or files has the discretion\
      \ of changing the permissions:\r\n  - Using the chmod command\r\n  - Setting a different default\
      \ umask by adding the umask command into a User Shell Configuration File, (.bashrc), in their home\
      \ directory\r\n  - Manually changing the umask for the duration of a login session by running the\
      \ umask command"
    default_value: UMASK 022
