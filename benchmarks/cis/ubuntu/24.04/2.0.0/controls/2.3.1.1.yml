control:
  id: CIS-2.3.1.1
  benchmark_id: cis-ubuntu-24.04
  title: Ensure a single time synchronization daemon is in use
  description: "System time should be synchronized between all systems in an environment. This is typically\
    \ done by establishing an authoritative time server or set of servers and having all systems synchronize\
    \ their clocks to them.\r\n\r\n**Note:**\r\n- **On virtual systems where host based time synchronization\
    \ is available consult your virtualization software documentation and verify that host based synchronization\
    \ is in use and follows local site policy. In this scenario, this section should be skipped**\r\n\
    - Only **one** time synchronization method should be in use on the system. Configuring multiple time\
    \ synchronization methods could lead to unexpected or unreliable results"
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.2_3_1_1.audit
  remediation: cis.ubuntu.24.04.v2_0_0.2_3_1_1.remediate
