    parent: CIS _2_Time Synchronization Main | 2.1.1.1-Ensure a single time synchronization daemon is
      in use
    rationale: Time synchronization is important to support time sensitive security mechanisms and ensures
      log files have consistent time records across the enterprise, which aids in forensic investigations.
    impact: ''
    audit_guidance: "On physical systems, and virtual systems where host based time synchronization is\
      \ not available.\r\n\r\n**One** of the two time synchronization daemons should be available; **`chrony`**\
      \ or **`systemd-timesyncd`**\r\n\r\nRun the following script to verify that a single time synchronization\
      \ daemon is available on the system:\r\n\r\n```\r\n#!/usr/bin/env bash\r\n\r\n{\r\n    l_output=\"\
      \" l_output2=\"\"\r\n    service_not_enabled_chk()\r\n    {\r\n        l_out2=\"\"\r\n        if\
      \ systemctl is-enabled \"$l_service_name\" 2>/dev/null | grep -q 'enabled'; then\r\n           \
      \ l_out2=\"$l_out2\\n  - Daemon: \\\"$l_service_name\\\" is enabled on the system\"\r\n        fi\r\
      \n        if systemctl is-active \"$l_service_name\" 2>/dev/null | grep -q '^active'; then\r\n \
      \           l_out2=\"$l_out2\\n  - Daemon: \\\"$l_service_name\\\" is active on the system\"\r\n\
      \        fi\r\n    }   \r\n    l_service_name=\"systemd-timesyncd.service\" # Check systemd-timesyncd\
      \ daemon\r\n    service_not_enabled_chk\r\n    if [ -n \"$l_out2\" ]; then\r\n        l_timesyncd=\"\
      y\"\r\n        l_out_tsd=\"$l_out2\"\r\n    else\r\n        l_timesyncd=\"n\"\r\n        l_out_tsd=\"\
      \\n  - Daemon: \\\"$l_service_name\\\" is not enabled and not active on the system\"\r\n    fi\r\
      \n    l_service_name=\"chrony.service\" # Check chrony\r\n    service_not_enabled_chk\r\n    if\
      \ [ -n \"$l_out2\" ]; then\r\n        l_chrony=\"y\"\r\n        l_out_chrony=\"$l_out2\"\r\n   \
      \ else\r\n        l_chrony=\"n\"\r\n        l_out_chrony=\"\\n  - Daemon: \\\"$l_service_name\\\"\
      \ is not enabled and not active on the system\"\r\n    fi\r\n    l_status=\"$l_timesyncd$l_chrony\"\
      \r\n    case \"$l_status\" in\r\n        yy)\r\n            l_output2=\" - More than one time sync\
      \ daemon is in use on the system$l_out_tsd$l_out_chrony\"\r\n            ;;\r\n        nn)\r\n \
      \           l_output2=\" - No time sync daemon is in use on the system$l_out_tsd$l_out_chrony\"\r\
      \n            ;;\r\n        yn|ny)\r\n            l_output=\" - Only one time sync daemon is in\
      \ use on the system$l_out_tsd$l_out_chrony\"\r\n            ;;\r\n        *)\r\n            l_output2=\"\
      \ - Unable to determine time sync daemon(s) status\"\r\n            ;;\r\n    esac\r\n\r\n    if\
      \ [ -z \"$l_output2\" ]; then\r\n        echo -e \"\\n- Audit Result:\\n  ** PASS **\\n$l_output\\\
      n\"\r\n    else\r\n        echo -e \"\\n- Audit Result:\\n  ** FAIL **\\n - * Reasons for audit\
      \ failure * :\\n$l_output2\\n\"\r\n    fi\r\n}\r\n```\r\n\r\n**Note:** Follow the guidance in the\
      \ subsection for the time synchronization daemon available on the system and skip the other time\
      \ synchronization daemon subsection."
    remediation_guidance: "On physical systems, and virtual systems where host based time synchronization\
      \ is not available.\r\n\r\nSelect **one** of the two time synchronization daemons; **`chrony (1)`**\
      \ or **`systemd-timesyncd (2)`** and following the remediation procedure for the selected daemon.\r\
      \n\r\n**Note:** enabling more than one synchronization daemon could lead to unexpected or unreliable\
      \ results:\r\n\r\n1. **`chrony`**\r\n\r\nRun the following command to install `chrony`:\r\n\r\n\
      ```\r\n# apt install chrony \r\n```\r\n\r\nRun the following commands to stop and mask the `systemd-timesyncd`\
      \ daemon:\r\n\r\n```\r\n# systemctl stop systemd-timesyncd.service\r\n\r\n# systemctl mask systemd-timesyncd.service\r\
      \n```\r\n\r\n**Note:** \r\n- Subsection: **_Configure chrony_** should be followed\r\n- Subsection:\
      \ **_Configure systemd-timesyncd_** should be skipped\r\n\r\n2. **`systemd-timesyncd`**\r\n\r\n\
      Run the following command to remove the chrony package:\r\n\r\n```\r\n# apt purge chrony\r\n# apt\
      \ autoremove chrony\r\n```\r\n\r\n**Note:** \r\n- Subsection: **_Configure systemd-timesyncd_**\
      \ should be followed\r\n- Subsection: **_Configure chrony_** should be skipped"
