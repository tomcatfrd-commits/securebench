control:
  id: CIS-5.2.6
  benchmark_id: cis-ubuntu-24.04
  title: Ensure sudo timestamp_timeout is configured
  description: sudo `timestamp_timeout` controls how long a user's sudo privileges remain active after
    the initial password entry.
  platform: ubuntu-24.04
  severity: unspecified
  audit: cis.ubuntu.24.04.v2_0_0.5_2_6.audit
  remediation: cis.ubuntu.24.04.v2_0_0.5_2_6.remediate
  rollback: cis.ubuntu.24.04.v2_0_0.5_2_6.rollback
  verification: cis.ubuntu.24.04.v2_0_0.5_2_6.verify
  rollback_capability: unsupported
  metadata:
