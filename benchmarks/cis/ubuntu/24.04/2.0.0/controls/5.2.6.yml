      benchmark_id: '26891'
      benchmark_version: v2.0.0
      reference: 5.2.6
      url: https://workbench.cisecurity.org/sections/4177269/recommendations/7047663
    assessment_status: automated
    profiles:
    - Level 1 - Server
    - Level 1 - Workstation
    mappings:
      nist:
      - AC-6
      cis_v8:
      - '5.4'
